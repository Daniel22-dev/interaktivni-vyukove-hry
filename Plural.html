<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Multilingual CEFR conversation lab – Plural">
<title>Plural · Conversation Lab</title>
<style>
:root{
  color-scheme:dark;--bg:#07111f;--panel:#0d1b2e;--panel2:#11253d;
  --text:#f7fbff;--muted:#acbfd2;--accent:#6ee7ff;--accent2:#9b8cff;
  --good:#58e6a9;--warn:#ffd166;--danger:#ff7b8a;--border:rgba(255,255,255,.13);
  --shadow:0 22px 64px rgba(0,0,0,.34);--timer-edge:#354c65;
  --timer-bg:#0c1f33;--timer-button:#1b324c;--timer-editor-bg:#10233a;--timer-field-bg:#0b1c2f;
}
:root[data-theme="light"]{
  color-scheme:light;--bg:#eef4fa;--panel:#fff;--panel2:#eaf2f9;
  --text:#17283b;--muted:#425c73;--accent:#076a90;--accent2:#6550a9;
  --good:#10704f;--warn:#92600c;--danger:#a52f50;--border:rgba(40,77,115,.2);
  --shadow:0 15px 42px rgba(46,91,130,.13);--timer-edge:#afc0cd;
  --timer-bg:#edf6fb;--timer-button:#eaf1f6;--timer-editor-bg:#fff;--timer-field-bg:#eff5f9;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 12% 4%,rgba(110,231,255,.11),transparent 30%),radial-gradient(circle at 88% 9%,rgba(155,140,255,.11),transparent 27%),var(--bg);font:400 16px/1.49 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:root[data-theme="light"] body{background:radial-gradient(circle at 8% 3%,rgba(83,178,219,.14),transparent 32%),radial-gradient(circle at 90% 5%,rgba(172,151,222,.15),transparent 34%),var(--bg)}
button,select,input{font:inherit}
button,select{cursor:pointer}
button:disabled{opacity:.38;cursor:not-allowed}
:where(button,select,input,summary):focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{width:min(1280px,100%);margin:0 auto;padding:15px 20px 70px}
.topbar{position:sticky;top:0;z-index:45;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 13px;margin:0 0 15px;border:1px solid var(--border);border-radius:18px;background:rgba(7,17,31,.94);backdrop-filter:blur(18px);box-shadow:0 8px 25px rgba(0,0,0,.13)}
:root[data-theme="light"] .topbar{background:rgba(255,255,255,.96)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 310px}
.logo{flex:0 0 42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#6ee7ff,#9b8cff);color:#06111d;font-weight:950;letter-spacing:-.06em}
.brand-copy{min-width:0}.brand-copy strong{display:block;font-size:.91rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-copy span{display:block;color:var(--muted);font-size:.72rem}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 680px}
.control-group{display:flex;gap:6px;align-items:center;min-width:0}
.control-label{color:var(--muted);font-size:.7rem;letter-spacing:.05em;font-weight:850;white-space:nowrap}
.lang-select{max-width:135px;min-height:36px;background:var(--timer-button);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:6px 6px;font-weight:800;font-size:.82rem}
.level-switch{display:flex;gap:3px;padding:3px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.045)}
.level-switch button{min-width:34px;padding:5px 6px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:.77rem;font-weight:900}
.level-switch button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05121f;box-shadow:0 2px 10px rgba(0,0,0,.16)}
:root[data-theme="light"] .level-switch button.active{color:#fff}
.btn{min-height:36px;padding:7px 11px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.055);color:var(--text);font-size:.82rem;font-weight:780;transition:background .14s}
.btn:hover{background:rgba(110,231,255,.09)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#07111f}
:root[data-theme="light"] .btn.primary{color:white}
.btn.ghost{background:transparent}
.hero{padding:33px 34px 29px;border:1px solid var(--border);border-radius:27px;background:linear-gradient(125deg,rgba(255,255,255,.065),rgba(255,255,255,.018));box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-110px;top:-155px;width:355px;height:355px;border-radius:100%;pointer-events:none;background:radial-gradient(circle,rgba(110,231,255,.15),transparent 68%)}
.kicker{color:var(--accent);font-size:.69rem;font-weight:930;letter-spacing:.18em}
h1{font-size:clamp(2.1rem,5vw,4.3rem);line-height:1.03;letter-spacing:-.057em;margin:8px 0 8px;max-width:960px}
.strap{font-size:clamp(1.05rem,2.5vw,1.45rem);font-weight:850;letter-spacing:-.015em;margin:0 0 10px;color:var(--accent)}
.hero-intro{max-width:850px;color:var(--muted);font-size:.98rem;margin:0 0 16px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--border);background:rgba(255,255,255,.05);padding:6px 10px;border-radius:100px;font-weight:750;font-size:.76rem}
.goal-strip{margin:16px 0 0;max-width:850px;background:rgba(110,231,255,.065);border:1px solid rgba(110,231,255,.19);padding:10px 13px;border-radius:12px;display:flex;gap:10px;align-items:flex-start}
.goal-strip span{color:var(--accent);font-size:.72rem;font-weight:950;text-transform:uppercase;white-space:nowrap}
.goal-strip strong{font-size:.89rem;font-weight:650}
.privacy-notice{font-size:.75rem;color:var(--muted);margin:10px 0 0;max-width:980px}.begin-row{margin-top:14px;display:flex;justify-content:flex-end}.begin-row .btn{font-size:.88rem;padding:10px 16px}
.quickstart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:14px}
.quickstep{border:1px solid var(--border);border-radius:13px;padding:12px 13px;background:rgba(255,255,255,.032);font-size:.83rem;color:var(--muted)}
.quickstep b{display:block;color:var(--accent);font-size:.71rem;letter-spacing:.07em;margin-bottom:3px}
.warmup{margin-top:13px;border:1px solid var(--border);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.04)}
.warmup summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:13px;font-weight:850}
.warmup summary::-webkit-details-marker{display:none}
.warm-bubble{width:34px;height:34px;border-radius:11px;background:rgba(110,231,255,.14);color:var(--accent);display:grid;place-items:center;flex:none}
.warm-summary-text{flex:1;min-width:0}.warm-summary-text small{display:block;color:var(--muted);font-size:.76rem;font-weight:500}
.warm-chevron{color:var(--accent);font-size:1.2rem;transition:transform .2s}
.warmup[open] .warm-chevron{transform:rotate(180deg)}
.warm-content{padding:0 18px 19px 65px;color:var(--text)}.warm-content p{margin:0 0 6px}.warm-content small{color:var(--muted)}
.nav-heading{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:18px 3px 6px}
.nav-heading span{font-size:.7rem;letter-spacing:.15em;color:var(--accent);font-weight:900}
.section-nav{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;padding:6px 3px 10px}
.section-nav button{flex:0 0 auto;max-width:255px;border:1px solid var(--border);border-radius:50px;padding:9px 12px;background:rgba(255,255,255,.04);color:var(--muted);font-size:.78rem;font-weight:790;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-nav button.active{background:var(--accent);color:#06111d;border-color:transparent}
:root[data-theme="light"] .section-nav button.active{color:#fff}
.station{scroll-margin-top:calc(var(--topbar-h,90px) + 12px);border:1px solid var(--border);border-radius:25px;background:linear-gradient(145deg,rgba(17,37,61,.94),rgba(10,25,42,.96));overflow:visible;box-shadow:var(--shadow)}
:root[data-theme="light"] .station{background:linear-gradient(145deg,#fff,#f4f8fc)}
.station-head{display:flex;align-items:center;gap:15px;justify-content:space-between;min-height:164px;padding:20px 24px;border-bottom:1px solid var(--border)}
.station-ident{display:flex;align-items:center;gap:15px;min-width:0;flex:1}
.station-num{flex:0 0 51px;width:51px;height:51px;display:grid;place-items:center;background:linear-gradient(135deg,#6ee7ff,#9b8cff);border-radius:16px;color:#06111d;font-size:1.28rem;font-weight:950}
.station-copy{min-width:0}
.station-eyebrow{color:var(--accent);font-size:.74rem;letter-spacing:.15em;font-weight:900;text-transform:uppercase}
.station-title{font-size:clamp(1.55rem,2.8vw,2.7rem);letter-spacing:-.038em;line-height:1.08;margin:6px 0}
.station-subtitle{font-size:.88rem;color:var(--muted);margin:0}
.timer-dock{flex:0 0 245px;min-width:0;display:flex;justify-content:end}
.station-body{padding:21px 24px 23px}
.station-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(315px,.8fr);gap:15px}
.card{border:1px solid var(--border);background:rgba(255,255,255,.048);border-radius:17px;padding:20px;min-width:0}
.mini-label{font-size:.69rem;color:var(--accent);font-weight:900;letter-spacing:.12em}
.main-question{font-size:clamp(1.42rem,2.35vw,2.1rem);line-height:1.18;letter-spacing:-.023em;font-weight:880;margin:9px 0 18px;overflow-wrap:break-word;text-wrap:pretty}
.questions-label{font-size:.75rem;color:var(--muted);font-weight:850;margin-bottom:8px}
.questions{display:grid;gap:9px}
.question{display:flex;gap:12px;align-items:flex-start;background:rgba(0,0,0,.13);border:1px solid var(--border);padding:11px 12px;border-radius:12px;font-size:.94rem}
:root[data-theme="light"] .question{background:rgba(35,91,145,.045)}
.question .qnum{flex:0 0 18px;color:var(--accent);font-weight:950}
.tools{display:grid;gap:11px;align-content:start}
.toolbox{border:1px solid var(--border);border-radius:16px;padding:15px;background:rgba(0,0,0,.14)}
:root[data-theme="light"] .toolbox{background:rgba(35,91,145,.045)}
.toolbox-title{font-size:.99rem;font-weight:850;line-height:1.2;margin:0 0 5px}
.toolbox-desc{font-size:.81rem;color:var(--muted);margin:0 0 9px}
.toolbox .btn{min-height:32px;padding:6px 10px;font-size:.77rem}
.reveal{padding:11px 12px;margin-top:9px;border:1px solid rgba(110,231,255,.24);border-radius:12px;background:rgba(110,231,255,.065);font-size:.87rem;line-height:1.45}
.reveal.support{border-color:rgba(88,230,169,.29);background:rgba(88,230,169,.07)}
.reveal.stretch{border-color:rgba(155,140,255,.32);background:rgba(155,140,255,.09)}
.reveal.challenge{border-color:rgba(255,209,102,.3);background:rgba(255,209,102,.07)}
.reveal ul{padding-left:18px;margin:0}.reveal li+li{margin-top:6px}
.station-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px;flex-wrap:wrap}
.progress{font-size:.79rem;color:var(--muted)}
.nav-buttons{display:flex;gap:8px}
.nav-buttons .btn{min-width:103px}
.resource-card{margin-top:15px;border:1px solid var(--border);border-radius:20px;padding:20px;background:rgba(255,255,255,.042)}
.resource-card h2{font-size:1.05rem;line-height:1.3;margin:5px 0 5px}
.resource-desc{color:var(--muted);font-size:.84rem;margin:0 0 12px}
.vocab-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.vocab-item{padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,.09);min-width:0;overflow-wrap:anywhere}
:root[data-theme="light"] .vocab-item{background:rgba(35,91,145,.04)}
.vocab-item b{display:block;color:var(--accent);font-size:.89rem;margin-bottom:3px}
.vocab-item span{display:block;color:var(--muted);font-size:.8rem}
.toolkit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.lesson-tip{margin:20px 4px 0;text-align:center;color:var(--muted);font-size:.83rem}
.lesson-tip b{color:var(--accent)}
.footer-credit{margin:9px 0 0;text-align:center;font-size:.72rem;color:var(--muted);opacity:.8}
.timer-panel{position:relative;width:245px;min-width:0;border:1px solid var(--timer-edge);border-radius:18px;background:var(--timer-bg);padding:12px 13px;text-align:center}
.timer-label{display:block;color:var(--accent);font-size:.66rem;font-weight:950;letter-spacing:.12em;text-transform:uppercase}
.clock{display:block;width:100%;padding:0;border:1px dashed transparent;border-radius:10px;background:transparent;color:var(--text);font-variant-numeric:tabular-nums;font-feature-settings:'tnum';font-weight:950;font-size:3.45rem;letter-spacing:-.08em;line-height:1.09;white-space:nowrap}
.clock:hover{background:var(--timer-button);border-color:var(--accent)}
.clock.almost{color:var(--warn)}.clock.finished{color:var(--danger)}
.timer-hint{display:block;font-size:.72rem;color:var(--muted);margin:3px 0 9px;min-height:1.2em}
.timer-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.timer-buttons button{min-width:0;padding:8px 6px;border:1px solid var(--timer-edge);border-radius:9px;background:var(--timer-button);color:var(--text);font-size:.81rem;font-weight:900}
.timer-buttons .start{background:var(--accent);border-color:transparent;color:#05121d}
:root[data-theme="light"] .timer-buttons .start{color:#fff}
.timer-editor{position:absolute;right:-1px;top:38px;width:min(320px,85vw);z-index:70;text-align:left;padding:15px;background:var(--timer-editor-bg);border:2px solid var(--accent);border-radius:16px;box-shadow:0 18px 44px rgba(0,0,0,.3)}
.timer-editor-title{font-weight:850;font-size:.85rem;margin-bottom:9px}
.timer-time-fields{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:9px}
.timer-time-field{min-width:0}
.timer-time-field label{display:block;text-align:center;color:var(--muted);font-size:.74rem;font-weight:850;margin-bottom:4px}
.timer-editor input{display:block;width:100%;min-width:0;background:var(--timer-field-bg);border:1px solid var(--timer-edge);border-radius:10px;padding:8px 4px;text-align:center;font-weight:900;font-size:1.9rem;color:var(--text);font-variant-numeric:tabular-nums}
.timer-separator{font-size:2rem;font-weight:900;line-height:1.65;color:var(--accent)}
.timer-help{font-size:.74rem;color:var(--muted);margin:9px 0 4px}
.timer-error{font-size:.73rem;color:var(--danger);font-weight:800;min-height:1em}
.timer-editor-buttons{display:flex;gap:7px;margin-top:8px}
.timer-editor-buttons button{flex:1;padding:8px 5px;border-radius:9px;border:1px solid var(--timer-edge);background:var(--timer-button);color:var(--text);font-weight:850;font-size:.8rem}
.timer-editor-buttons button[type=submit]{background:var(--accent);border-color:transparent;color:#06111d}
:root[data-theme="light"] .timer-editor-buttons button[type=submit]{color:#fff}
.timer-grip,.timer-float-toggle{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:100;border-radius:100px;padding:10px 15px;background:#eaf6ff;color:#07111f;font-size:.85rem;font-weight:850;box-shadow:0 6px 20px rgba(0,0,0,.15);transition:transform .18s,opacity .18s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:1110px){.topbar{align-items:flex-start}.controls{justify-content:flex-start}.station-grid{grid-template-columns:minmax(0,1fr) minmax(275px,.83fr)}.brand{flex-basis:auto}.quickstart{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:825px){.station-grid{grid-template-columns:1fr}.station-head{align-items:flex-start}.timer-dock{flex:0 0 214px}.timer-panel{width:214px}.clock{font-size:3rem}.vocab-grid,.toolkit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.station-body{padding:17px}}
@media(max-width:650px){.app{padding:9px 10px 115px}.topbar{position:relative;gap:8px;padding:10px;margin-bottom:11px}.brand{width:100%;flex:1 1 100%}.controls{justify-content:flex-start;gap:7px}.control-group{flex-wrap:wrap;gap:3px}.control-label{display:none}.lang-select{font-size:.82rem;max-width:133px}.level-switch button{min-width:34px}.small-hide{display:none}.btn.icon-only{min-width:35px;padding:6px 9px}.hero{padding:24px 17px 22px;border-radius:22px}.hero-intro{font-size:.92rem}.quickstart{grid-template-columns:1fr 1fr;gap:7px}.quickstep{padding:10px;font-size:.78rem}.goal-strip{display:block}.goal-strip span{display:block;margin-bottom:4px}.warm-content{padding-left:18px}.warmup summary{padding:13px}.nav-heading{margin-top:14px}.station{border-radius:21px;scroll-margin-top:12px}.station-head{min-height:0;padding:19px 16px}.station-ident{gap:10px}.station-num{flex-basis:39px;width:39px;height:39px;font-size:1rem;border-radius:12px}.station-title{font-size:1.75rem}.station-subtitle{font-size:.82rem}.station-body{padding:12px}.card{padding:15px}.main-question{font-size:1.5rem}.question{padding:10px;font-size:.88rem}.toolbox{padding:13px}.nav-buttons{width:100%}.nav-buttons .btn{flex:1}.resource-card{padding:16px}.vocab-grid,.toolkit-grid{grid-template-columns:1fr}.lesson-tip{font-size:.8rem}}
@media (min-width:900px) and (max-height:850px){.station-head{padding:13px 22px;min-height:130px}.station-body{padding:15px 22px}.card{padding:15px}.main-question{font-size:clamp(1.35rem,2vw,1.8rem);margin:8px 0 12px}.question{padding:8px 10px;font-size:.86rem}.toolbox{padding:11px}.tools{gap:8px}.timer-panel{padding:9px 12px}.clock{font-size:3rem}}
/* On touch phones the same countdown becomes a movable fixed overlay. */
@media(max-width:650px),(max-height:550px) and (pointer:coarse){
 .timer-dock{display:none} .station-ident{width:100%;flex:1 1 auto}
 .timer-panel{position:fixed;left:auto;top:auto;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;align-items:center;gap:5px;width:fit-content;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);padding:5px 7px;border:1px solid var(--timer-edge);border-radius:17px;box-shadow:0 12px 38px rgba(0,0,0,.43);overflow:visible}
 .timer-grip,.timer-float-toggle{display:grid;place-items:center;flex:0 0 auto;width:29px;height:39px;border:0;border-radius:10px;padding:0;background:transparent;color:var(--muted);font-weight:900;font-size:1.06rem}
 .timer-grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
 .timer-grip:active{cursor:grabbing;background:var(--timer-button)}
 .timer-float-toggle{width:37px;background:var(--timer-button);color:var(--accent)}
 .timer-panel:not(.mobile-expanded) .timer-label,.timer-panel:not(.mobile-expanded) .timer-hint,.timer-panel:not(.mobile-expanded) .timer-buttons{display:none}
 .timer-panel:not(.mobile-expanded) .clock{width:auto;min-width:82px;padding:5px 3px;font-size:1.65rem;line-height:1.15;letter-spacing:-.05em}
 .timer-panel.mobile-expanded{display:grid;grid-template-columns:34px minmax(0,1fr) 37px;gap:3px 5px;align-items:center;width:min(302px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:11px 12px 12px;border-radius:19px;overflow-y:auto;overscroll-behavior:contain}
 .timer-panel.mobile-expanded .timer-grip{grid-column:1;grid-row:1}
 .timer-panel.mobile-expanded .timer-label{grid-column:2;grid-row:1;font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .timer-panel.mobile-expanded .timer-float-toggle{grid-column:3;grid-row:1}
 .timer-panel.mobile-expanded .clock{grid-column:1/-1;grid-row:2;font-size:3.45rem;margin:2px 0 0}
 .timer-panel.mobile-expanded .timer-hint{grid-column:1/-1;grid-row:3;margin:1px 0 5px}
 .timer-panel.mobile-expanded .timer-buttons{grid-column:1/-1;grid-row:4;display:grid}
 .timer-panel.mobile-expanded .timer-editor{position:static;grid-column:1/-1;grid-row:5;width:100%;max-width:100%;margin-top:8px;padding:11px;box-shadow:none}
 .timer-panel.mobile-expanded .timer-editor input{font-size:1.5rem;padding:6px 4px}
 .timer-panel.mobile-expanded .timer-time-fields{gap:6px}
 .timer-panel.mobile-expanded .timer-separator{font-size:1.7rem}
 .toast{bottom:calc(75px + env(safe-area-inset-bottom,0px))}
}
@media print{body{background:#fff!important;color:#000!important}.topbar,.section-nav,.nav-heading,.station-foot,.timer-panel,.lesson-tip,.footer-credit{display:none!important}.hero,.warmup,.station,.resource-card{background:#fff!important;color:#000!important;box-shadow:none!important;border:1px solid #999!important}.station{break-inside:avoid}.warmup .warm-content{display:block!important}.station-grid{grid-template-columns:1fr 1fr!important}.reveal[hidden]{display:block!important}.vocab-item,.question,.toolbox,.card{background:#fff!important;color:#000!important}}

any legs do spiders have?","Have you ever seen wolves or geese?","Which animal plurals have no -s?"],"challenge":"Describe an imaginary zoo with eight animals in the plural.","stretch":"Compare “wolf – wolves”, “goose – geese” and “fish – fish”.","support":["We saw some …","There were lots of …","The plural of … is …"]},{"title":"My room","subtitle":"Things in pairs and groups","main":"What does your room look like?","questions":["How many shelves or cupboards do you have?","Do you have any plants or posters?","What do you keep in boxes?"],"challenge":"Describe your room to a partner; your partner draws it.","stretch":"Find words ending in -f or -fe that change to -ves.","support":["There are two …","I keep my … in boxes.","My … are on the shelves."]},{"title":"Town and transport","subtitle":"Getting around","main":"How do people travel in your town?","questions":["How many buses stop near your school?","Are there any bike lanes or cafés?","What are the plurals of “city” and “day”?"],"challenge":"Give directions using five plural nouns.","stretch":"Compare “city – cities” and “day – days”. Why is the spelling different?","support":["There are a lot of …","Take one of the …","You can see two …"]},{"title":"Tricky words","subtitle":"Don’t add -s!","main":"Which plurals do learners often get wrong?","questions":["Is it “informations” or “information”?","Is “news” singular or plural?","What are the plurals of “tooth” and “person”?"],"challenge":"Make a list of five tricky words and test your partner.","stretch":"Explain the difference between “two pieces of advice” and “two advices”.","support":["You can’t say …","The correct form is …","I always forget …"]},{"title":"Party plans","subtitle":"Organising together","main":"What do we need for a class party?","questions":["How many guests are coming?","Do we need any glasses, plates or knives?","Who brings the snacks?"],"challenge":"Plan a party with a partner and agree on the numbers.","stretch":"Use “some”, “any”, “many” and “a few” in four sentences.","support":["Let’s buy some …","We don’t need any …","How many … should we get?"]}],"vocab":[["some","nějaké, několik"],["any","nějaké (v otázce a záporu)"],["many","mnoho (u počitatelných)"],["a lot of","hodně"],["a few","několik, pár"],["How many …?","Kolik …?"],["no / not any","žádné"],["a pair of","pár (dvojice)"],["glasses","brýle"],["trousers","kalhoty"],["scissors","nůžky"],["people","lidé"]],"toolkit":[["Ask about quantity","How many … are there?"],["Answer","There are a lot of … / There aren’t any …"],["Compare","We have more … than …"],["Agree","Yes, two … are enough."]]},"B1":{"warm":"Sort these words by their plural: bus, baby, boy, knife, child, sheep, photo, potato. Explain one group.","stations":[{"title":"Regular endings","subtitle":"-s or -es?","main":"When do English nouns add -s and when -es?","questions":["Why do “bus”, “box” and “church” add -es?","What happens to “baby” and “day”?","Can you think of an exception?"],"challenge":"Collect ten nouns from a textbook page and sort them by their plural ending.","stretch":"Explain the -y rule to a younger learner in three sentences.","support":["In English, nouns ending in … add …","This is an exception because …","In Czech we say …, but in English …"]},{"title":"Sound and spelling","subtitle":"What do you hear?","main":"How is the plural ending pronounced?","questions":["Do “cats”, “dogs” and “horses” end with the same sound?","Why does “horses” have an extra syllable?","Is the sound rule easier than the spelling rule?"],"challenge":"Read ten plurals aloud; your partner sorts them into /s/, /z/ and /ɪz/.","stretch":"Find a plural whose spelling and pronunciation follow different patterns.","support":["In English, nouns ending in … add …","This is an exception because …","In Czech we say …, but in English …"]},{"title":"Irregular plurals","subtitle":"Old forms today","main":"Why does English still have plurals like “men”, “feet” and “children”?","questions":["Which irregular plurals do you use every day?","Why are they easy to remember?","Do irregular plurals make English harder or more interesting?"],"challenge":"Create a quiz with eight irregular plurals.","stretch":"Compare “mouse – mice” with a computer mouse: which plural do people use?","support":["In English, nouns ending in … add …","This is an exception because …","In Czech we say …, but in English …"]},{"title":"Countable or uncountable?","subtitle":"Information, advice, furniture","main":"Why can’t we say “two informations” in English?","questions":["Which nouns are uncountable in English but countable in Czech?","How do we count uncountable things?","Is “money” countable?"],"challenge":"Make sentences with “a piece of”, “a bit of” and “some” for five uncountable nouns.","stretch":"Explain why “hair” and “a hair” mean different things.","support":["In English, nouns ending in … add …","This is an exception because …","In Czech we say …, but in English …"]},{"title":"Only in the plural","subtitle":"Trousers, glasses, scissors","main":"Which English nouns are used only in the plural?","questions":["Why is it “my trousers are” and not “my trousers is”?","How do you talk about one item?","Are there similar words in Czech?"],"challenge":"Describe an outfit using plural-only nouns.","stretch":"Compare English and Czech: which words are plural-only in both languages?","support":["In English, nouns ending in … add …","This is an exception because …","In Czech we say …, but in English …"]},{"title":"Agreement","subtitle":"Is or are?","main":"How does the plural affect the rest of the sentence?","questions":["When do we use “there is” and “there are”?","Do adjectives change in the plural in English?","Which pronouns refer to plural nouns?"],"challenge":"Describe a picture with “there is” and “there are” and ten nouns.","stretch":"Find a sentence in which the verb is hard to choose, e.g. “a lot of people …”.","support":["In English, nouns ending in … add …","This is an exception because …","In Czech we say …, but in English …"]},{"title":"Words from other languages","subtitle":"Photo, potato, cactus","main":"Why do some loanwords have unusual plurals?","questions":["Why is it “photos” but “potatoes”?","What is the plural of “cactus”?","Do you know plurals ending in -a or -i?"],"challenge":"Make a list of five loanwords and check their plurals in a dictionary.","stretch":"Decide whether “cacti” or “cactuses” sounds more natural to you, and why.","support":["In English, nouns ending in … add …","This is an exception because …","In Czech we say …, but in English …"]},{"title":"Fix the mistakes","subtitle":"Help a classmate","main":"Which plural mistakes do learners make most often?","questions":["Which mistakes have you made yourself?","Why might a Czech speaker say “informations”?","What is the best way to remember a tricky plural?"],"challenge":"Correct five wrong sentences with a partner and explain each correction.","stretch":"Write three wrong sentences for another pair to correct.","support":["In English, nouns ending in … add …","This is an exception because …","In Czech we say …, but in English …"]}],"vocab":[["-s / -es","koncovky množného čísla"],["consonant + y → -ies","souhláska + y → -ies (baby → babies)"],["-f / -fe → -ves","knife → knives, leaf → leaves"],["irregular plural","nepravidelné množné číslo"],["zero plural","stejný tvar v j. i mn. č. (sheep)"],["countable noun","počitatelné podstatné jméno"],["uncountable noun","nepočitatelné podstatné jméno"],["plural-only noun","pomnožné podstatné jméno"],["a piece of","kus (u nepočitatelných)"],["agreement","shoda (is / are)"],["loanword","přejaté slovo"],["exception","výjimka"]],"toolkit":[["Explain a rule","Nouns ending in -ch add -es."],["Give an exception","But “stomach” only adds -s."],["Check","Is it “a news” or “some news”?"],["Correct","I think it should be …, because …"]]},"B2":{"warm":"Decide quickly: “The team is” or “The team are”? “The data is” or “The data are”? Explain your choice.","stations":[{"title":"Collective nouns","subtitle":"The team is or the team are?","main":"How do collective nouns behave in English?","questions":["Why can both “the team is” and “the team are” be correct?","How do British and American English differ here?","Which nouns always take a plural verb, like “police” or “people”?"],"challenge":"Write two short news reports about a fictional sports team – one in British and one in American style.","stretch":"Decide which version sounds more natural to you and justify your choice.","support":["Both forms are possible, but …","In this context I would choose …, because …","A typical mistake is … – the correct form is …"],"explanations":[["A collective noun names a group of people or things, e.g. team, family, government. The verb can be singular if you see the group as one unit, or plural if you think of the individual members (“notional agreement”).","Compare “The team is in the final” with “The team are arguing about tactics”. Which sentence focuses on the group and which on the members?"],["British English often allows a plural verb with collective nouns, especially in speech and sports reporting; American English usually prefers the singular. Both systems are standard in their own variety.","Imagine a headline: “England … through to the final.” Would you use “is” or “are”? Would an American newspaper choose the same?"],["Some nouns look singular but always take a plural verb, e.g. “police”, “people”, “cattle”. Others look plural but take a singular verb, e.g. “news”, “physics”.","Complete: “The police … investigating.” “The news … good.” Can you explain the difference to a partner?"]]},{"title":"Compound nouns","subtitle":"Passers-by and mothers-in-law","main":"Where does the plural ending go in compound nouns?","questions":["Why do we say “passers-by” but “bus stops”?","What is the plural of “mother-in-law”?","Which compound plurals vary in everyday use?"],"challenge":"Collect eight compound nouns and form their plurals.","stretch":"Explain why both “mothers-in-law” and “mother-in-laws” appear in real use.","support":["Both forms are possible, but …","In this context I would choose …, because …","A typical mistake is … – the correct form is …"],"explanations":[["In most compound nouns the plural ending goes on the main word, which is usually the last one: bus stops, toothbrushes. When the main noun comes first, it takes the ending: passers-by, runners-up.","Ask yourself which word names the person or thing: in “passer-by” it is the passer. Try “runner-up” and “attorney general”."],["The standard plural is “mothers-in-law”, because “mother” is the main noun. The same applies to “sisters-in-law” and “fathers-in-law”.","Your partner says “my brother-in-laws”. How would you correct this politely and explain the rule in one sentence?"],["In informal use, some speakers treat the whole compound as one word and add -s at the end, e.g. “mother-in-laws”, “spoonfuls/spoonsful”. Dictionaries record some of these variants.","Compare “two cupfuls” and “two cupsful”. Which one sounds more natural to you? Look it up and see what the dictionary says."]]},{"title":"Latin and Greek plurals","subtitle":"Criteria, phenomena, data","main":"Should modern English keep classical plurals?","questions":["What are the singulars of “criteria” and “phenomena”?","Is “data” singular or plural?","Which classical plurals are being replaced by -s forms?"],"challenge":"Find five classical plurals and their regular alternatives, e.g. formulae – formulas.","stretch":"Defend one position: keep the classical forms or regularise them.","support":["Both forms are possible, but …","In this context I would choose …, because …","A typical mistake is … – the correct form is …"],"explanations":[["Classical plurals come from Latin or Greek: criterion → criteria, phenomenon → phenomena, analysis → analyses. Using the plural form as a singular (“a criteria”) is considered a mistake in formal English.","Make two sentences: one with “criterion” and one with “criteria”. Then try the same with “phenomenon”."],["“Data” is originally a Latin plural (singular “datum”). Today many speakers and style guides use it as a mass noun with a singular verb (“the data shows”), while others, especially in science, prefer the plural (“the data are”).","Read two sentences aloud: “The data shows a trend” and “The data show a trend”. Which sounds more natural to you, and in which context would you use each?"],["Many classical plurals are being regularised: formulae → formulas, cacti → cactuses, syllabi → syllabuses. Usually both forms are correct, but the regular form is more common in everyday language.","Choose three words – formula, cactus, appendix – and decide which plural you would use in a science report and which in a text message."]]},{"title":"Plural and meaning","subtitle":"When the plural says something new","main":"How can the plural change the meaning of a noun?","questions":["What is the difference between “custom” and “customs”, or “manner” and “manners”?","Why does “glasses” not simply mean “more than one glass”?","Does Czech have similar pairs?"],"challenge":"Write a short dialogue using three pairs with different meanings.","stretch":"Explain one pair to a younger learner without translating it.","support":["Both forms are possible, but …","In this context I would choose …, because …","A typical mistake is … – the correct form is …"],"explanations":[["Some nouns have a plural with a special meaning: “customs” (border control or traditions), “manners” (polite behaviour), “goods” (products). The plural is not just “more than one custom”.","Make two sentences each: “It is a custom to …” and “We had to go through customs.” What is the difference?"],["“Glasses” usually means spectacles, while “a glass” is a drinking container – and “glass” without an article is the material. The context tells you which meaning is intended.","Complete: “I can’t read without my …” and “Could you pass me two …?” Which word do you need in each case?"],["Czech also has pairs where the plural changes the meaning, e.g. “noviny” (newspaper) or “dveře” (door), which are plural in form but refer to one object. Comparing the two languages helps you notice such differences.","Think of a Czech word that is plural in form but singular in meaning. How would you translate it into English, and is the English word singular or plural?"]]},{"title":"Numbers and measures","subtitle":"A ten-minute walk","main":"Why do some nouns stay singular after numbers?","questions":["Why do we say “a ten-minute walk” but “ten minutes”?","What is the difference between “two dozen eggs” and “dozens of eggs”?","How do you say prices, weights and distances correctly?"],"challenge":"Describe a fictional recipe or trip using five measurements.","stretch":"Formulate a rule for number + noun before another noun and test it.","support":["Both forms are possible, but …","In this context I would choose …, because …","A typical mistake is … – the correct form is …"],"explanations":[["When a number + noun is used before another noun as a description, the noun stays singular and is joined with a hyphen: a ten-minute walk, a five-year-old girl. Without the following noun, it takes the plural: ten minutes, five years.","Turn these into descriptions: “The walk takes ten minutes.” → “It’s a … walk.” “The girl is five years old.” → “She’s a … girl.”"],["“Two dozen eggs” means exactly 24 eggs; “dozen” stays singular after a number. “Dozens of eggs” means an unspecified large number. The same pattern works with “hundred” and “thousand”.","Compare “three hundred people” and “hundreds of people”. Which one is precise and which one is vague?"],["Prices and measurements use the plural after numbers greater than one: two pounds, five kilometres. In compound adjectives and some fixed phrases the singular is used: a five-pound note, a two-litre bottle.","Describe a fictional shopping trip: how much did things cost, how heavy were they, how far did you walk? Use each pattern at least once."]]},{"title":"Names and nationalities","subtitle":"The Smiths, the French","main":"How do names and nationalities form the plural?","questions":["How do you refer to a whole family, e.g. the Smiths or the Joneses?","Why is it “the French” but “the Germans”?","Is it “two Marys” or “two Maries”?"],"challenge":"Describe a street of fictional neighbours using family names in the plural.","stretch":"Explain when we use “the + adjective” for a group, e.g. “the young”.","support":["Both forms are possible, but …","In this context I would choose …, because …","A typical mistake is … – the correct form is …"],"explanations":[["To talk about a whole family, add -s to the surname: the Smiths, the Browns. Names ending in -s, -x, -ch or -sh add -es: the Joneses, the Foxes.","Invent two neighbouring families with surnames ending in -s and -ch. How would you invite them both to a party?"],["Nationality words ending in -sh, -ch or -ese are used with “the” and a plural meaning but no -s: the French, the British, the Japanese. Other nationality nouns take -s: the Germans, the Czechs.","Sort these: Spanish, Italian, Chinese, Dutch, Polish, American. Which ones need -s when you talk about the people?"],["First names and surnames keep their spelling in the plural, so names ending in -y just add -s: two Marys, the Kennedys – not “Maries” or “Kennedies”.","In a fictional class there are three students called Harry. How do you write the sentence “There are three … in our class”?"]]},{"title":"Spoken English","subtitle":"“There’s two problems”","main":"How strictly do speakers follow plural agreement in everyday speech?","questions":["Why do many speakers say “there’s” before a plural noun?","Is this a mistake or a feature of spoken English?","When should you avoid it?"],"challenge":"Collect examples from films or songs and decide whether they are formal or informal.","stretch":"Write an informal and a formal version of the same message.","support":["Both forms are possible, but …","In this context I would choose …, because …","A typical mistake is … – the correct form is …"],"explanations":[["In informal speech many speakers use “there’s” (“there is”) before plural nouns: “There’s two problems.” The contraction is easier to say, and the speaker often hasn’t decided on the noun yet.","Listen to yourself: would you say “There’s lots of people here”? Why might this be more common than “There is two problems”?"],["Linguists see this as a feature of spoken English rather than a random mistake: it appears regularly, even in the speech of educated speakers. However, it is not accepted in formal writing.","Decide: is the line “There’s two ways to go” in a song a mistake? What would change if it appeared in an essay?"],["In exams, essays, formal emails and presentations you should use the standard agreement “there are” with plural nouns. Knowing the informal form helps you understand native speakers.","Rewrite this text message for a formal email: “Hi! There’s three things I need to tell you about the trip.”"]]},{"title":"Learning strategies","subtitle":"Remembering tricky plurals","main":"What is the most effective way to learn irregular and unusual plurals?","questions":["Do rules or examples help you more?","How useful are dictionaries and apps?","How do you notice your own mistakes?"],"challenge":"Design a short game that practises ten tricky plurals.","stretch":"Compare your strategy with your partner’s and agree on the best one.","support":["Both forms are possible, but …","In this context I would choose …, because …","A typical mistake is … – the correct form is …"],"explanations":[["Some learners remember rules better (e.g. -f → -ves), others remember examples (knife – knives, leaf – leaves). Combining both usually works best.","Try both methods with three words: wolf, thief, roof. Which method helped you notice that “roof” is an exception?"],["Good learner’s dictionaries show irregular plurals and mark uncountable nouns with [U]. Apps can help with repetition, but they rarely explain why a form is used.","Look up “advice”, “equipment” and “sheep” in a dictionary. What information does it give you about the plural?"],["Recording your own speech, using a checklist when you write, or asking a partner to note your mistakes can help you notice errors that you don’t hear yourself.","Speak for one minute about your weekend while your partner notes every plural you use. Were any of them wrong?"]]}],"vocab":[["collective noun","noun for a group, e.g. team, family"],["notional agreement","agreement based on meaning, not form"],["compound noun","noun made of two or more words"],["classical plural","Latin or Greek plural form, e.g. criteria"],["regularisation","replacing an irregular form with -s"],["plural-only noun","noun used only in the plural, e.g. scissors"],["unit noun","word that makes a mass countable, e.g. a piece of"],["attributive noun","noun used before another noun, e.g. a ten-minute walk"],["proper noun","name of a specific person or place"],["variant","alternative acceptable form"],["register","level of formality"],["error","form that breaks the standard rules"]],"toolkit":[["Justify","I’d choose … because the context …"],["Contrast","In British English …, whereas in American English …"],["Qualify","This is acceptable in speech, but not in formal writing."],["Correct politely","You could also say …"]]},"C1":{"warm":"Is “octopi” more correct than “octopuses”? Give your first answer, then the strongest counterargument.","stations":[{"title":"Norm and usage","subtitle":"Who decides what is correct?","main":"Who decides which plural form is correct – dictionaries, teachers or speakers?","questions":["How do dictionaries deal with forms like “octopuses” and “octopi”?","Why do some “incorrect” plurals become accepted?","Should learners follow the dictionary or common usage?"],"challenge":"Compare the entries for three disputed plurals in two dictionaries.","stretch":"Analyse the claim that “octopi” sounds more educated than “octopuses”.","support":["Dictionaries record …, whereas many speakers …","The plural changes the meaning from … to …","In formal writing it is safer to …"],"explanations":[["Dictionaries describe usage and often list several forms. For “octopus” they usually give “octopuses” as the main plural and mention “octopi” (and rarely “octopodes”) as variants.","Look up “octopus” in two dictionaries. Which plural is listed first, and is there a usage note?"],["A form becomes accepted when it is used widely, by many speakers and in respected texts, over a long time. Dictionaries then record it, sometimes with a label such as “informal”.","Think of a plural you once thought was wrong but now hear everywhere. What made it acceptable?"],["Learners need forms that are understood and accepted. In practice, it is safest to follow the standard form in formal contexts while recognising common variants in speech.","You are writing a school report and a message to a friend. Would you choose the same plural forms in both? Give an example."]]},{"title":"Varieties of English","subtitle":"British, American and beyond","main":"How do plural use and agreement differ between varieties of English?","questions":["Where do British and American English differ in agreement with collective nouns?","Are there differences in nouns like “accommodation(s)” or “sport(s)”?","How should learners choose a variety?"],"challenge":"Rewrite a short British text for an American audience.","stretch":"Discuss whether mixing varieties in one text is a problem.","support":["Dictionaries record …, whereas many speakers …","The plural changes the meaning from … to …","In formal writing it is safer to …"],"explanations":[["In British English collective nouns can take a singular or plural verb, depending on the focus; in American English the singular is clearly preferred: “The government has decided” (AmE) vs “The government have decided” (possible in BrE).","Rewrite “The committee are meeting today” for an American newspaper."],["Some nouns differ in countability: American English often uses “accommodations” and “sports”, British English prefers “accommodation” and “sport” (“I like sport”). “Math” (AmE) and “maths” (BrE) are another example.","Your American and British friends are planning a trip. How would each of them say “We need to book accommodation”?"],["Learners can choose a variety based on their goals, teachers or exams. Consistency is usually more important than which variety you choose.","Decide which variety you mostly use and find two plural-related features that show it."]]},{"title":"Singular “they”","subtitle":"Number and identity","main":"What does singular “they” reveal about grammatical number?","questions":["Why do we say “they are” even when we mean one person?","How long has singular “they” existed in English?","Why do some speakers still object to it?"],"challenge":"Rewrite a short text so that it refers to unknown people without “he or she”.","stretch":"Evaluate arguments for and against singular “they” in formal writing.","support":["Dictionaries record …, whereas many speakers …","The plural changes the meaning from … to …","In formal writing it is safer to …"],"explanations":[["English uses “they” for one person when the gender is unknown or not relevant, or when a person prefers it. The verb stays plural (“they are”), just as “you are” is used for one person.","Complete: “Someone left … umbrella here. I hope … come back for it.” Which pronouns did you choose?"],["Singular “they” has been used in English since at least the 14th century and appears in writers such as Shakespeare and Jane Austen. What is new is its use for specific, known individuals.","Find an older example of “everyone … their” and compare it with a modern example such as “Alex said they were tired”."],["Objections are usually based on the idea that “they” must be plural, or on a preference for traditional style. Supporters argue that language already uses plural forms for singular reference.","List one argument against singular “they” and respond to it with a counterexample from English grammar."]]},{"title":"Mass and count","subtitle":"One noun, two uses","main":"How can the same noun be both countable and uncountable?","questions":["What is the difference between “coffee” and “two coffees”, or “experience” and “experiences”?","Why do “wines” and “cheeses” often mean types?","How does context decide?"],"challenge":"Write pairs of sentences showing count and mass uses of five nouns.","stretch":"Explain the difference between “paper” and “a paper”, or “iron” and “an iron”.","support":["Dictionaries record …, whereas many speakers …","The plural changes the meaning from … to …","In formal writing it is safer to …"],"explanations":[["Many nouns are uncountable when they refer to a substance or general idea (“coffee”, “experience”) and countable when they refer to a portion, a type or an event (“two coffees”, “interesting experiences”).","Make two sentences each with “coffee”, “experience” and “time” – one countable, one uncountable."],["When mass nouns are used in the plural, they often refer to different kinds: “French wines”, “soft cheeses”. This is called a “type” or “sort” plural.","Describe a fictional market stall using three plural mass nouns that mean different types."],["Context decides whether a noun is countable: the article, quantifiers (much/many) and the situation show the speaker’s intended meaning.","Is “chicken” countable or uncountable in “We had chicken for dinner” and “There are chickens in the garden”? Explain how you know."]]},{"title":"Abstract plurals","subtitle":"Freedoms, rights, values","main":"What changes when abstract nouns are used in the plural?","questions":["What is the difference between “freedom” and “freedoms”?","Why do political texts often use plurals like “rights” and “values”?","Can every abstract noun be used in the plural?"],"challenge":"Analyse plural abstract nouns in a short fictional political speech.","stretch":"Discuss whether plural abstractions make a text more precise or more vague.","support":["Dictionaries record …, whereas many speakers …","The plural changes the meaning from … to …","In formal writing it is safer to …"],"explanations":[["“Freedom” is a general idea; “freedoms” refers to specific rights or areas of liberty, e.g. freedom of speech, freedom of movement. The plural makes the concept concrete and countable.","List three “freedoms” that a fictional school charter might protect. Why does the plural fit better than the singular here?"],["Political and legal texts often use plural abstract nouns (“rights”, “values”, “responsibilities”) to suggest a set of clearly defined items or to appeal to shared principles.","Read the phrase “our shared values” aloud. Which values might the speaker mean – and does the phrase tell you?"],["Not every abstract noun can be pluralised naturally: “happinesses” or “informations” sound strange, while “beauties” or “kindnesses” are possible in specific meanings.","Test five abstract nouns in the plural. Which sound acceptable, and what meaning do they have?"]]},{"title":"Register","subtitle":"Data, media, criteria","main":"How does register influence the choice of plural forms?","questions":["Is “the data shows” acceptable in academic English?","Why do some style guides prefer “the media are”?","When does a classical plural sound pretentious?"],"challenge":"Rewrite a casual paragraph in academic style, paying attention to number.","stretch":"Compare the advice of two style guides on “data” and decide which you would follow.","support":["Dictionaries record …, whereas many speakers …","The plural changes the meaning from … to …","In formal writing it is safer to …"],"explanations":[["In many academic and journalistic contexts “data” is used as a mass noun with a singular verb; some disciplines and style guides still require the plural. Both are widely accepted today.","Find a published sentence with “data” and decide whether the writer treats it as singular or plural."],["“Media” is the plural of “medium”. Some style guides prefer “the media are” to show that it refers to many outlets, while “the media is” treats the press as a single institution.","Rewrite “The media is responsible for …” in a way that emphasises the variety of outlets."],["Classical plurals such as “fora” or “stadia” are correct but can sound pretentious in everyday writing. Writers choose them to signal precision or tradition.","Would you write “discussion fora” or “discussion forums” in a school newsletter? Justify your choice."]]},{"title":"Plural for effect","subtitle":"We, you and the royal “we”","main":"How can plural forms be used for rhetorical or social effect?","questions":["What are the “royal we” and the “editorial we”?","Why do doctors or teachers sometimes say “How are we feeling today?”","What effect does “we” have in a political speech?"],"challenge":"Rewrite a short message from “I” to “we” and discuss the effect.","stretch":"Analyse when an inclusive “we” can sound manipulative.","support":["Dictionaries record …, whereas many speakers …","The plural changes the meaning from … to …","In formal writing it is safer to …"],"explanations":[["The “royal we” is used by a monarch or a powerful person to refer to themselves (“We are not amused”). The “editorial we” is used by authors or newspapers to present an opinion as collective.","Rewrite “I think this proposal is weak” as a newspaper editorial. What changes in tone?"],["Doctors, nurses or teachers sometimes use “we” instead of “you” (“How are we feeling today?”). It can sound caring and inclusive, but also patronising.","How might a fictional patient react to “Have we taken our tablets?” Suggest a more respectful alternative."],["In political speeches “we” creates a sense of community between speaker and audience, but it can also blur responsibility – who exactly is “we”?","Analyse the sentence “We must make sacrifices.” Who is likely to make them, and who is speaking?"]]},{"title":"English and Czech","subtitle":"Translating number","main":"Where do English and Czech treat grammatical number differently?","questions":["Which nouns are plural in Czech but singular in English, e.g. “dveře – door”?","Why does English say “the police are” while Czech says “policie přijela”?","How do numbers affect nouns in Czech compared with English?"],"challenge":"Translate five short sentences and mark every change in number.","stretch":"Explain one difference to an English speaker who is learning Czech.","support":["Dictionaries record …, whereas many speakers …","The plural changes the meaning from … to …","In formal writing it is safer to …"],"explanations":[["Some Czech nouns exist only in the plural but refer to one object (pluralia tantum): “dveře”, “noviny”, “housle”. Their English equivalents are often singular: door, newspaper, violin.","Translate: “Ty dveře jsou otevřené.” “Noviny leží na stole.” Which verb forms do you need in English?"],["Some nouns differ in grammatical number between the two languages: English “police” always takes a plural verb (“the police are”), whereas Czech “policie” is singular (“policie přijela”). With “information” or “advice” it is the other way round: uncountable in English, countable in Czech.","Translate “Policie už je tady” and “Dal mi dvě dobré rady.” What changes in number and structure in English?"],["Czech changes the noun form after numbers: 1 kniha, 2–4 knihy, 5+ knih (genitive plural). English uses the same plural form for all numbers above one.","Explain to an English speaker why Czech says “dvě knihy” but “pět knih”. Can you find a simple rule?"]]}],"vocab":[["norm","what is considered correct in a community"],["usage","how people actually speak and write"],["doublet","two accepted forms of the same word"],["variety","form of a language used in a region or group"],["singular “they”","they used for one person"],["mass noun","noun that is not normally counted"],["count noun","noun that can be counted"],["abstract noun","noun naming an idea or quality"],["style guide","rules for writing in an institution"],["royal “we”","we used by a single powerful speaker"],["inclusive “we”","we that includes the listener"],["number","grammatical category of singular and plural"]],"toolkit":[["Distinguish","We should distinguish the norm from actual usage."],["Refer to sources","According to most dictionaries, …"],["Analyse effect","The plural creates the impression that …"],["Concede","Admittedly, …; nevertheless …"]]},"C2":{"warm":"Test the claim: “English plurals are easy – you just add -s.” Find the strongest counterexample.","stations":[{"title":"Rules or memory?","subtitle":"How plurals are learned","main":"Do speakers store irregular plurals as words or produce plurals by rule?","questions":["Why do young children say “foots” or “mouses” at some stage?","What does the “wug test” show?","What might this mean for learning a foreign language?"],"challenge":"Invent three new nouns and ask your partner for their plurals.","stretch":"Evaluate whether learners should memorise lists or practise rules.","support":["This rule works for …, but it fails when …","The evidence suggests that …","A more precise description would be …"],"explanations":[["Children learning English often go through a stage where they produce “foots” or “mouses”, even if they said “feet” before. This shows that they have discovered the -s rule and apply it too widely (overregularisation).","Ask a partner to explain why a child might say “two mans”. What does the child already know about English?"],["In the “wug test” (Jean Berko Gleason, 1958) children saw a picture of an invented creature, a “wug”, and correctly said “two wugs”. This proved that they used a rule rather than memorised forms.","Invent your own creature name and test whether your partner produces /s/, /z/ or /ɪz/ in the plural."],["Many researchers think regular plurals are produced by rule, while irregular ones are stored in memory. For learners this suggests practising rules for regular forms and memorising frequent exceptions.","Which irregular plurals did you learn as whole words, and which plural did you ever “invent” using a rule?"]]},{"title":"Language change","subtitle":"From “oxen” to “octopuses”","main":"Why do some irregular plurals disappear while others survive?","questions":["Why have most old plurals in -en disappeared, except a few like “oxen” and “children”?","Why do frequent words keep irregular forms longer?","Which current plurals might change next?"],"challenge":"Predict two plurals that may be regularised in the next fifty years and justify your prediction.","stretch":"Test the claim that frequency protects irregular forms.","support":["This rule works for …, but it fails when …","The evidence suggests that …","A more precise description would be …"],"explanations":[["Old English had several plural types, including -en (oxen, children). Over centuries most nouns switched to the -s plural by analogy; only a few -en plurals survived.","Compare “shoe – shoes” with the old plural “shoon”. Why might the -s form have won?"],["Frequent words resist change because speakers hear and use them so often that the irregular form is strongly remembered. Rare words are more likely to be regularised.","Compare “child – children” (very frequent) with “brethren” (rare and old). What happened to the second one?"],["Some current variants show possible changes: cacti → cactuses, octopi → octopuses, formulae → formulas. Forms with classical plurals and low frequency are the most likely to change.","Choose a classical plural you rarely use. Do you think your grandchildren will still use it? Why?"]]},{"title":"Corpora and grammar books","subtitle":"Evidence for rules","main":"What can large collections of real texts reveal about plural use?","questions":["How could a corpus show whether “data is” or “data are” is more common?","What are the limits of frequency as evidence?","Should grammar books follow corpora?"],"challenge":"Design a small investigation into one disputed plural.","stretch":"Discuss whether the most frequent form is automatically the correct one.","support":["This rule works for …, but it fails when …","The evidence suggests that …","A more precise description would be …"],"explanations":[["A corpus is a large collection of real texts. By searching for “data is” and “data are” in different text types, you can see which form is more frequent in which context.","Plan a search: which text types (news, science, blogs) would you compare, and what would you expect to find?"],["Frequency shows what is common, not automatically what is appropriate in every context. Corpus results also depend on which texts are included.","A form is frequent online but rare in academic journals. Is it correct? What else would you need to know?"],["Many modern grammars and dictionaries are based on corpora, but they still make choices about what to recommend. Description and recommendation are different tasks.","Find a dictionary entry with a usage note. Is it describing usage, recommending a form, or both?"]]},{"title":"Correctness and judgement","subtitle":"Error or variant?","main":"Why do some plural “mistakes” provoke strong reactions?","questions":["Who is judged when they say “criterias” or “phenomenons”?","What is the difference between an error and a variant?","How should teachers respond to non-standard plurals?"],"challenge":"Role-play a discussion between a strict editor and a linguist.","stretch":"Formulate a principle for correcting plurals that is fair to learners.","support":["This rule works for …, but it fails when …","The evidence suggests that …","A more precise description would be …"],"explanations":[["Plural “mistakes” such as “criterias” or “phenomenons” are often used as signs of a speaker’s education or social background. The reaction says as much about social attitudes as about grammar.","Imagine a job interview in which the candidate says “two criterias”. How might the interviewer react, and is the reaction fair?"],["An error breaks the rules of a variety and is not used systematically by its speakers; a variant is used regularly by a group and may be accepted in some contexts. The boundary can shift over time.","Is “there’s two problems” an error or a variant? What evidence would you use to decide?"],["Teachers can distinguish between errors that hinder understanding and forms that are simply non-standard, and explain where each form is appropriate rather than only marking it wrong.","Write a short comment for a fictional learner who used “informations”: correct the form and explain why without discouraging them."]]},{"title":"Teaching plurals","subtitle":"Clear but not oversimplified","main":"How can plural rules be taught clearly without hiding their complexity?","questions":["When is the rule “add -s” useful and when does it mislead?","In what order would you introduce exceptions?","How can learners discover rules themselves?"],"challenge":"Design a ten-minute mini-lesson on English plurals for A2 learners.","stretch":"Identify one oversimplification in your lesson and improve it.","support":["This rule works for …, but it fails when …","The evidence suggests that …","A more precise description would be …"],"explanations":[["The rule “add -s” covers most nouns and helps beginners start speaking. It misleads when learners apply it to irregular forms, uncountable nouns or classical plurals.","List five words for which “add -s” gives a wrong result. Which group would you teach first?"],["A common sequence is: regular -s, then spelling changes (-es, -ies), then frequent irregular forms, then uncountable and plural-only nouns, and finally variants and classical plurals.","Do you agree with this order? Change one step and justify the change."],["Learners can discover rules by sorting examples, comparing sounds or finding patterns in a text. Discovery often leads to better understanding than memorising a rule.","Give a partner ten plural pairs and ask them to formulate the rule themselves. How close did they get?"]]},{"title":"Number across languages","subtitle":"Is “one” always singular?","main":"How do languages differ in the way they express number?","questions":["Why does Czech use different forms after 2–4 and after 5?","Do all languages mark the plural on nouns?","What do dual forms, e.g. in Slovenian, show?"],"challenge":"Compare how English, Czech and one other language say “one book, two books, five books”.","stretch":"Discuss whether English plural marking is simple or just different.","support":["This rule works for …, but it fails when …","The evidence suggests that …","A more precise description would be …"],"explanations":[["Czech uses three forms after numbers: 1 kniha, 2–4 knihy, 5 and more knih. English uses one plural form after all numbers greater than one.","Count from one to six in Czech with “pes”. Then do the same in English. Which system is more complex?"],["Not all languages mark the plural on nouns. In Chinese or Japanese, for example, the noun often stays the same and the number or context shows the quantity.","How would you understand “I bought book” if English had no plural ending? Which words would tell you the quantity?"],["Some languages, such as Slovenian, have a dual – a special form for exactly two. Old English and Old Czech also had dual forms, of which some traces remain (Czech “oči”, “uši”, “ruce”).","Why might languages have a special form for two? Think of things that usually come in pairs."]]},{"title":"Grammar and identity","subtitle":"When number becomes political","main":"Can grammatical number become a social or political issue?","questions":["Why did singular “they” become part of public debates?","Should institutions prescribe usage?","How do other languages deal with similar questions?"],"challenge":"Draft a short guideline on gender-neutral language for a fictional school newsletter.","stretch":"Test your guideline against a difficult case.","support":["This rule works for …, but it fails when …","The evidence suggests that …","A more precise description would be …"],"explanations":[["Singular “they” became a public topic when it was used for non-binary people and adopted by dictionaries and style guides. The debate is as much about identity and respect as about grammar.","Find one argument based on grammar and one based on respect in the debate. Which do you find more convincing?"],["Institutions such as schools, newspapers or companies often publish style guides. They can recommend usage but cannot control how people speak in private.","Should a school newsletter follow a style guide? Who should decide what it contains?"],["Other languages face similar questions: German debates gender stars (Lehrer*innen), Spanish and French discuss inclusive forms. The solutions differ because the grammar differs.","Compare singular “they” with a solution in another language you know. Which is easier to use in speech?"]]},{"title":"Limits of rules","subtitle":"Edge cases","main":"Where do the rules for English plurals reach their limits?","questions":["Why is it “still lifes” and not “still lives”?","Why is a hockey team called the “Maple Leafs”?","What do such cases show about meaning and form?"],"challenge":"Collect five edge cases and propose a rule that explains them.","stretch":"Defend or reject the idea that rules only describe typical cases.","support":["This rule works for …, but it fails when …","The evidence suggests that …","A more precise description would be …"],"explanations":[["“Still life” is a compound that names a type of painting, not a kind of life. Because the meaning is not “a life that is still”, speakers use the regular plural “still lifes”.","Try the same idea with “lowlife” and “walk-on” roles. What plurals would you expect?"],["The Toronto ice-hockey team is called the “Maple Leafs”, not “Leaves”, because the name refers to the team, not to leaves. Names are often treated as new words with regular plurals.","Invent a team name that includes an irregular noun (e.g. “Mouse”). What plural would the fans use?"],["Such cases show that speakers use irregular forms only when they still recognise the original word; when the meaning changes, the regular rule takes over.","Collect five similar examples (e.g. computer mice/mouses, Walkmans, sabre-tooths) and decide which rule they follow."]]}],"vocab":[["overregularisation","applying a regular rule to an irregular word"],["productivity","ability of a pattern to form new words"],["analogy","change based on similarity with other forms"],["frequency effect","influence of how often a word is used"],["corpus","large collection of real texts"],["prescriptivism","telling people how they should use language"],["descriptivism","describing how people actually use language"],["dual","grammatical number for exactly two"],["exocentric compound","compound whose meaning is not a kind of its last element"],["edge case","example at the limit of a rule"],["evidence","data supporting a claim"],["simplification","making something easier by leaving out details"]],"toolkit":[["Test a claim","This claim holds for …, but not for …"],["Cite evidence","Corpus data suggest that …"],["Revise","A more accurate rule would be …"],["Challenge","It does not follow that …"]]}},"uiSimple":{"eyebrow":"SPEAK · ASK · ANSWER · LISTEN","hero":"People, school things, food, animals, rooms and streets: name many things in English and practise plurals in short dialogues.","privacy":"Mistakes help you learn. You can invent people and things.","step3":"Ask your partner a question.","step4":"Need more? Open the next task.","questions":"More questions","supportTitle":"Need help?","supportDesc":"Words to start your sentence.","supportShow":"Show help","supportHide":"Hide help","challengeTitle":"More to talk about","challengeDesc":"When you finish the main question.","challengeShow":"Show task","challengeHide":"Hide task","stretchTitle":"A harder task","stretchDesc":"When you want more.","stretchShow":"Show harder task","stretchHide":"Hide harder task","progress":"Say why. Give an example. Ask your partner.","vocabLabel":"USEFUL WORDS","vocabDesc":"Use the words that help you.","toolkitLabel":"USEFUL PHRASES","toolkitDesc":"Talk together: ask and answer.","title":"Plural – English Nouns","strap":"One word, many things: practise English plurals"},"uiB1":{"stretchTitle":"Go one step further","stretchDesc":"A harder task for confident speakers.","vocabDesc":"Choose words that are useful; you don’t need to use them all.","progress":"Give reasons, examples and real reactions.","title":"Plural – English Nouns","strap":"One word, many things: practise English plurals"}},"es":{"ui":{"title":"El plural – Sustantivos en español","strap":"Una cosa, muchas: practica el plural en español","brand":"LABORATORIO DE CONVERSACIÓN","subbrand":"Una conversación, no un examen","eyebrow":"HABLA · CUESTIONA · JUSTIFICA · RESPONDE","hero":"Descubre cómo forman el plural los sustantivos españoles y úsalos en conversaciones reales: personas, escuela, compras, animales, casa y ciudad; y, en los niveles altos, reglas, excepciones y cambios en la lengua.","privacy":"Taller de gramática: los errores forman parte del aprendizaje. Podéis usar siempre ejemplos inventados.","format":"En parejas","estimated":"40–55 min","changeLevel":"Nivel MCER","changeLanguage":"Idioma","themeDay":"Claro","themeNight":"Oscuro","fullscreen":"Pantalla completa","exitFullscreen":"Salir de pantalla completa","resetLesson":"Reiniciar","levelGoal":"Objetivo oral","step1":"Piensa un momento.","step2":"Da una razón o un ejemplo.","step3":"Haz una pregunta a tu compañero o compañera.","step4":"Abre el reto si quieres seguir hablando.","warmTitle":"Calentamiento","warmTime":"2–3 min · opcional","warmHint":"Opcional: una actividad corta para empezar.","station

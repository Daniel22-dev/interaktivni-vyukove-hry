y cosas en plural y usar números.","goalA2":"Hablar de cantidades con algunos, muchos, pocos y ningún.","goalB1":"Explicar las reglas principales del plural español y sus excepciones.","goalB2":"Usar el plural en contextos difíciles y justificar la elección.","goalC1":"Analizar la variación, la norma y los cambios de significado.","goalC2":"Debatir cómo se aprenden, cambian y se limitan las reglas del plural.","tipA1":"Elegid tres o cuatro estaciones. Bastan respuestas breves; utilizad las palabras útiles.","tipA2":"Elegid cuatro estaciones. Hablad del año pasado y explicad al menos un motivo.","tipB1":"Elegid cuatro o cinco estaciones. Dad ejemplos y haced preguntas de seguimiento.","tipB2":"Elegid cinco o seis estaciones. Comparad situaciones y buscad compromisos.","tipC1":"Elegid cinco o seis estaciones. Contrastad perspectivas y precisad los conceptos.","tipC2":"Elegid cinco o seis estaciones. Cuestionad premisas y revisad las conclusiones.","startLesson":"Empezar a conversar →","offline":"Sin conexión","controlsAria":"Controles de la actividad","stationNavAria":"Estaciones de conversación","questionHelpTip":"Abrid una pregunta para ver una explicación sencilla y una propuesta concreta para debatir.","questionHelpOpen":"Explicar","questionHelpClose":"Ocultar","questionHelpMeaning":"¿QUÉ SIGNIFICA?","questionHelpTry":"EJEMPLO O ACTIVIDAD"},"levels":{"A1":{"warm":"Di el plural de libro, mujer, lápiz, ciudad y ratón. Comparad las respuestas.","stations":[{"title":"Personas","subtitle":"Familia y escuela","main":"¿Cómo hablas de varias personas?","questions":["¿Cuál es el plural de «amigo» y «profesor»?","¿Cuántos amigos tienes en tu clase?","¿Qué personas ves todos los días?"],"challenge":"Presenta a tres personas de tu familia o de tu clase usando el plural.","stretch":"Compara «el hombre – los hombres» y «la mujer – las mujeres». Haz frases cortas con «dos» y «muchos».","support":["Tengo dos …","Hay muchos …","El singular es … y el plural es …"]},{"title":"Objetos de clase","subtitle":"En el aula","main":"¿Qué objetos de tu clase puedes nombrar en plural?","questions":["Un libro – dos …","Un lápiz – tres …","¿Qué hay ahora en tu mesa?"],"challenge":"Nombra cinco objetos de clase en plural.","stretch":"Describe tu clase con cuatro sustantivos en plural.","support":["Hay tres …","En la mesa hay …","Un …, pero dos …"]},{"title":"Comida y compras","subtitle":"En el mercado","main":"¿Qué compras en varias unidades?","questions":["Una manzana – cinco …","Un tomate – tres …","¿Cómo pides dos bocadillos?"],"challenge":"Representad una conversación corta en el mercado con cinco plurales.","stretch":"Di en voz alta «manzanas», «limones» y «peces». ¿Qué terminaciones oyes?","support":["Quiero dos …, por favor.","¿Cuánto cuestan los …?","Necesitamos unos …"]},{"title":"Animales","subtitle":"Muchos animales","main":"¿Qué animales sabes nombrar en plural?","questions":["Un perro – dos …","Un ratón – muchos …","¿Qué animales viven en una granja?"],"challenge":"Nombra cinco animales en plural.","stretch":"Explica por qué «pez» cambia a «peces».","support":["Veo muchos …","En la granja hay …","Un … se convierte en …"]},{"title":"En casa","subtitle":"Habitaciones y muebles","main":"¿Qué cosas tienes repetidas en casa?","questions":["Una habitación – dos …","Una silla – cuatro …","¿Qué muebles hay en tu dormitorio?"],"challenge":"Describe una habitación con cinco plurales.","stretch":"Diseña un piso ideal y nombra los muebles con números.","support":["En mi habitación hay …","Tenemos dos …","Los … son grandes."]},{"title":"Ciudad y transporte","subtitle":"Por la ciudad","main":"¿Qué ves en una ciudad?","questions":["Un autobús – dos …","Una ciudad – muchas …","¿Qué tiendas hay en tu calle?"],"challenge":"Describe una calle con cinco plurales.","stretch":"Busca tres palabras que añaden -es en plural, como «ciudad» o «autobús».","support":["En la calle hay …","En la ciudad hay muchos …","Aquí hay tres …"]},{"title":"Formas especiales","subtitle":"Descubre las sorpresas","main":"¿Qué plurales te sorprenden en español?","questions":["¿Por qué «lápiz» se convierte en «lápices»?","¿Cambia «el lunes» en plural?","¿Qué pasa con la tilde en «canción – canciones»?"],"challenge":"Forma tres parejas singular–plural con algún cambio especial.","stretch":"Clasifica diez plurales en «-s», «-es» y «especiales».","support":["Una forma especial es …","El plural termina en …","No estoy seguro, pero …"]},{"title":"Minidiálogo","subtitle":"Hablamos juntos","main":"¿Puedes usar plurales en una conversación corta?","questions":["Pregunta por tres cosas de la clase.","Responde con un número.","Haz otra pregunta."],"challenge":"Representad un diálogo con seis sustantivos en plural.","stretch":"Corrige con amabilidad tres plurales incorrectos: «lápizes», «ratónes», «ciudads».","support":["¿Tienes dos …?","Aquí están los …","También necesitamos …"]}],"vocab":[["el amigo → los amigos","kamarád → kamarádi"],["el niño → los niños","chlapec, dítě → děti"],["la mujer → las mujeres","žena → ženy"],["el libro → los libros","kniha → knihy"],["el lápiz → los lápices","tužka → tužky"],["la ciudad → las ciudades","město → města"],["el árbol → los árboles","strom → stromy"],["el autobús → los autobuses","autobus → autobusy"],["el ratón → los ratones","myš → myši"],["el pez → los peces","ryba → ryby"],["el lunes → los lunes","pondělí → pondělky"],["la canción → las canciones","píseň → písně"]],"toolkit":[["Cantidad","Tengo tres libros."],["Comparar","Un niño – dos niños."],["Preguntar","¿Cuál es el plural de «lápiz»?"],["Corregir","Creo que es «lápices», no «lápizes»."]]},"A2":{"warm":"Haz una lista de diez cosas de tu mochila en plural. ¿Quién tiene más cosas?","stations":[{"title":"Familia y amigos","subtitle":"Hablar de personas","main":"¿Cuántas personas hay en tu familia o en tu grupo de amigos?","questions":["¿Tienes hermanos, primos o primas?","¿Por qué decimos «la gente es simpática» y no «la gente son»?","¿Cuántos alumnos hay en tu clase?"],"challenge":"Describe una familia inventada con al menos cinco sustantivos en plural.","stretch":"Compara tu familia inventada con la de tu compañero: ¿quién tiene más primos, tías o mascotas?","support":["Tengo dos …","No tengo ningún …","Somos … personas."]},{"title":"Mi mochila","subtitle":"¿Qué hay dentro?","main":"¿Qué llevas en la mochila todos los días?","questions":["¿Cuántos libros llevas hoy?","¿Tienes algunos bolígrafos o lápices?","¿Qué cosas nombramos siempre en plural, como «las gafas»?"],"challenge":"Prepara la mochila para una excursión y nombra diez cosas en plural.","stretch":"Explica por qué decimos «unas tijeras» aunque hablamos de un solo objeto.","support":["En mi mochila hay …","No tengo ningún …","Necesito unas …"]},{"title":"La lista de la compra","subtitle":"En el supermercado","main":"¿Qué necesitamos para un pícnic de clase?","questions":["¿Cuántos bocadillos necesitamos?","¿Hay tomates o limones?","¿Qué compras por kilos?"],"challenge":"Escribe una lista de la compra para seis personas y léela en voz alta.","stretch":"Busca alimentos cuyo plural termina en -es, como «limones» o «melones».","support":["Necesitamos unos …","¿Cuántos … necesitamos?","No quedan …"]},{"title":"Animales","subtitle":"En el zoo y en la granja","main":"¿Qué animales te gustaría ver en una excursión?","questions":["¿Cuántas patas tienen las arañas?","¿Has visto alguna vez peces de colores o leones?","¿Qué animales tienen un plural en -es?"],"challenge":"Describe un zoo inventado con ocho animales en plural.","stretch":"Compara «el león – los leones», «el pez – los peces» y «el ratón – los ratones».","support":["Vimos algunos …","Había muchos …","El plural de … es …"]},{"title":"Mi habitación","subtitle":"Cosas en pares y en grupos","main":"¿Cómo es tu habitación?","questions":["¿Cuántas estanterías o armarios tienes?","¿Tienes algunas plantas o pósteres?","¿Qué guardas en cajas?"],"challenge":"Describe tu habitación; tu compañero la dibuja.","stretch":"Busca palabras que pierden o ganan la tilde en plural, como «canción» o «joven».","support":["Hay dos …","Guardo mis … en cajas.","Mis … están en las estanterías."]},{"title":"Ciudad y transporte","subtitle":"Moverse por la ciudad","main":"¿Cómo se mueve la gente en tu ciudad?","questions":["¿Cuántos autobuses paran cerca del instituto?","¿Hay carriles bici o cafeterías?","¿Cuál es el plural de «ciudad» y de «tren»?"],"challenge":"Explica un camino usando cinco sustantivos en plural.","stretch":"Compara «el tren – los trenes» y «el metro – los metros». ¿Por qué cambia la terminación?","support":["Hay muchos …","Toma uno de los …","Puedes ver dos …"]},{"title":"Palabras difíciles","subtitle":"¡Cuidado con el plural!","main":"¿Qué plurales suelen equivocar los estudiantes?","questions":["¿Cuál es el plural de «el lunes» y «la crisis»?","¿Es «la gente» singular o plural?","¿Cuál es el plural de «el jersey»?"],"challenge":"Haz una lista de cinco palabras difíciles y pon a prueba a tu compañero.","stretch":"Explica por qué «el paraguas» no cambia en plural.","support":["No se dice …","La forma correcta es …","Siempre me equivoco con …"]},{"title":"Una fiesta","subtitle":"Organizar juntos","main":"¿Qué necesitamos para una fiesta de clase?","questions":["¿Cuántos invitados vienen?","¿Necesitamos vasos, platos o cuchillos?","¿Quién trae los aperitivos?"],"challenge":"Planifica una fiesta con tu compañero y poneos de acuerdo en las cantidades.","stretch":"Usa «unos», «algunos», «muchos» y «pocos» en cuatro frases.","support":["Vamos a comprar unos …","No necesitamos ningún …","¿Cuántos … compramos?"]}],"vocab":[["unos / unas","nějací, několik"],["algunos / algunas","některé, několik"],["muchos / muchas","mnoho"],["pocos / pocas","málo"],["ningún / ninguna","žádný"],["¿Cuántos …? / ¿Cuántas …?","Kolik …?"],["un par de","pár, dvojice"],["las gafas","brýle"],["las tijeras","nůžky"],["los pantalones","kalhoty"],["las vacaciones","prázdniny, dovolená"],["la gente","lidé (j. č. ve španělštině)"]],"toolkit":[["Preguntar por cantidades","¿Cuántos … hay?"],["Responder","Hay muchos … / No hay ningún …"],["Comparar","Tenemos más … que …"],["Estar de acuerdo","Sí, con dos … es suficiente."]]},"B1":{"warm":"Clasificad estas palabras según su plural: mesa, reloj, luz, café, crisis, joven, rey, jersey. Explicad un grupo.","stations":[{"title":"Terminaciones regulares","subtitle":"¿-s o -es?","main":"¿Cuándo añaden los sustantivos -s y cuándo -es?","questions":["¿Por qué «mesa» añade -s y «papel» añade -es?","¿Qué pasa con «luz» y «vez»?","¿Conocéis alguna excepción?"],"challenge":"Reunid diez sustantivos de una página del libro y clasificadlos según su plural.","stretch":"Explicad la regla de la -z a un alumno más joven en tres frases.","support":["Las palabras que terminan en … forman el plural con …","Es una excepción porque …","En checo decimos …, pero en español …"]},{"title":"La tilde en plural","subtitle":"Canción, joven, examen","main":"¿Por qué algunas palabras pierden o ganan la tilde en plural?","questions":["¿Por qué «canción» pierde la tilde en «canciones»?","¿Por qué «joven» la gana en «jóvenes»?","¿Cambia la sílaba tónica en «carácter – caracteres»?"],"challenge":"Leed diez plurales en voz alta y marcad la sílaba tónica.","stretch":"Formulad la regla de acentuación que explica estos cambios.","support":["Las palabras que terminan en … forman el plural con …","Es una excepción porque …","En checo decimos …, pero en español …"]},{"title":"Palabras que no cambian","subtitle":"El lunes, la crisis, el paraguas","main":"¿Por qué algunas palabras tienen la misma forma en singular y en plural?","questions":["¿Qué tienen en común «lunes», «crisis» y «paraguas»?","¿Cómo sabemos entonces si hablamos de uno o de varios?","¿Por qué «el autobús» sí cambia?"],"challenge":"Haced un concurso con ocho palabras invariables y ocho que sí cambian.","stretch":"Explicad el papel del artículo cuando la palabra no cambia.","support":["Las palabras que terminan en … forman el plural con …","Es una excepción porque …","En checo decimos …, pero en español …"]},{"title":"Contable o incontable","subtitle":"Información, consejos, muebles","main":"¿Qué sustantivos se cuentan en español y cuáles no?","questions":["¿Se puede decir «dos informaciones»?","¿Por qué en español se dice «dos consejos», pero en inglés no?","¿Cómo contamos cosas incontables como «el agua» o «el pan»?"],"challenge":"Haced frases con «un poco de», «una barra de» y «un vaso de» para cinco sustantivos.","stretch":"Comparad español, inglés y checo: ¿qué sustantivos se cuentan de forma distinta?","support":["Las palabras que terminan en … forman el plural con …","Es una excepción porque …","En checo decimos …, pero en español …"]},{"title":"Solo en plural","subtitle":"Gafas, tijeras, vacaciones","main":"¿Qué sustantivos se usan casi siempre en plural?","questions":["¿Por qué decimos «mis gafas son nuevas» aunque son un objeto?","¿Se dice «el pantalón» o «los pantalones»?","¿Hay palabras parecidas en checo?"],"challenge":"Describid un viaje usando cinco sustantivos que se usan en plural.","stretch":"Comparad el español y el checo: ¿qué palabras son plurales en las dos lenguas?","support":["Las palabras que terminan en … forman el plural con …","Es una excepción porque …","En checo decimos …, pero en español …"]},{"title":"La concordancia","subtitle":"Artículos, adjetivos y verbos","main":"¿Qué cambia en la frase cuando un sustantivo va en plural?","questions":["¿Qué palabras deben concordar con «los coches rojos»?","¿Por qué decimos «la gente está contenta»?","¿Concuerda el verbo en «hay muchos coches»?"],"challenge":"Describid una imagen con diez sustantivos y comprobad todas las concordancias.","stretch":"Buscad una frase en la que sea difícil elegir el verbo, como «la mayoría de los alumnos …».","support":["Las palabras que terminan en … forman el plural con …","Es una excepción porque …","En checo decimos …, pero en español …"]},{"title":"Palabras de otras lenguas","subtitle":"Club, menú, sándwich","main":"¿Cómo forman el plural las palabras de otras lenguas?","questions":["¿Se dice «clubs» o «clubes»?","¿Cuál es el plural de «menú» y de «sándwich»?","¿Por qué «jersey» se convierte en «jerséis»?"],"challenge":"Haced una lista de cinco préstamos y comprobad su plural en el diccionario.","stretch":"Decidid qué forma os parece más natural en «clubs/clubes» y por qué.","support":["Las palabras que terminan en … forman el plural con …","Es una excepción porque …","En checo decimos …, pero en español …"]},{"title":"Corregir errores","subtitle":"Ayudar a un compañero","main":"¿Qué errores de plural son más frecuentes?","questions":["¿Qué errores habéis cometido vosotros?","¿Por qué un hablante checo podría decir «las gentes son»?","¿Cuál es la mejor forma de recordar un plural difícil?"],"challenge":"Corregid cinco frases incorrectas y explicad cada corrección.","stretch":"Escribid tres frases con errores para que otra pareja las corrija.","support":["Las palabras que terminan en … forman el plural con …","Es una excepción porque …","En checo decimos …, pero en español …"]}],"vocab":[["vocal + -s","samohláska + -s (casa → casas)"],["consonante + -es","souhláska + -es (papel → papeles)"],["-z → -ces","luz → luces"],["la tilde","čárka (přízvuk) v písmu"],["la palabra invariable","slovo se stejným tvarem v j. i mn. č."],["el sustantivo contable","počitatelné podstatné jméno"],["el sustantivo incontable","nepočitatelné podstatné jméno"],["el plural inherente","pomnožné jméno (las gafas)"],["la concordancia","shoda (los coches rojos)"],["el préstamo","přejaté slovo"],["la excepción","výjimka"],["el diccionario","slovník"]],"toolkit":[["Explicar una regla","Las palabras acabadas en consonante añaden -es."],["Dar una excepción","Pero «el lunes» no cambia."],["Comprobar","¿Se dice «la gente es» o «la gente son»?"],["Corregir","Creo que debería ser …, porque …"]]},"B2":{"warm":"Decidid rápido: «La mayoría de los alumnos votó» o «votaron»; «Había muchas personas» o «Habían». Justificad vuestra elección.","stations":[{"title":"Sustantivos colectivos","subtitle":"La mayoría votó o votaron","main":"¿Cómo concuerda el verbo con los sustantivos colectivos?","questions":["¿Por qué son posibles «la mayoría de los alumnos votó» y «votaron»?","¿Por qué se dice «el equipo ganó» y no «el equipo ganaron»?","¿Qué diferencia hay entre «la gente» y «las personas»?"],"challenge":"Escribid dos noticias breves sobre un equipo ficticio y comprobad las concordancias.","stretch":"Decidid cuál de las dos concordancias os parece más natural y explicad por qué.","support":["Las dos formas son posibles, pero …","En este contexto elegiría …, porque …","Un error típico es … – lo correcto es …"],"explanations":[["Un sustantivo colectivo designa un grupo: equipo, familia, mayoría. Cuando va solo, el verbo suele ir en singular. Si lleva un complemento en plural («la mayoría de los alumnos»), el verbo puede concordar con la forma (singular) o con el significado (plural).","Comparad «La mayoría de los alumnos aprobó» y «La mayoría de los alumnos aprobaron». ¿Cuál se centra en el grupo y cuál en las personas?"],["Con un colectivo sin complemento, la concordancia en plural se considera incorrecta: «el equipo ganó», «la familia vive aquí». El plural solo es aceptable cuando hay un complemento plural o el verbo está lejos del sujeto.","Corregid con tacto: «El público aplaudieron con entusiasmo». ¿Cómo explicaríais la corrección en una frase?"],["«La gente» es gramaticalmente singular aunque designe a muchas personas: «la gente está contenta». «Las personas» es plural y lleva verbo en plural. En checo, «lidé» es plural, por eso el error es frecuente.","Completad: «La gente … (decir) que hace calor» y «Las personas … (decir) que hace calor»."]]},{"title":"Palabras compuestas","subtitle":"Sacacorchos y coches cama","main":"¿Dónde va la marca de plural en las palabras compuestas?","questions":["¿Por qué «sacacorchos» no cambia en plural?","¿Cuál es el plural de «coche cama» y de «hombre rana»?","¿Y el de «bocacalle»?"],"challenge":"Reunid ocho compuestos y formad su plural.","stretch":"Explicad por qué los compuestos escritos en una sola palabra se comportan de otra manera.","support":["Las dos formas son posibles, pero …","En este contexto elegiría …, porque …","Un error típico es … – lo correcto es …"],"explanations":[["Los compuestos escritos en una sola palabra cuyo segundo elemento ya termina en -s no cambian: el sacacorchos – los sacacorchos, el paraguas – los paraguas. El artículo indica el número.","Formad el plural de «el cumpleaños», «el lavaplatos» y «el abrelatas». ¿Qué tienen en común?"],["En los compuestos de dos palabras separadas, normalmente solo el primer sustantivo lleva el plural: coches cama, hombres rana, niños prodigio. El segundo funciona como una especie de adjetivo.","Formad el plural de «ciudad dormitorio» y «palabra clave». ¿Dónde ponéis la -s?"],["Cuando el compuesto se escribe en una sola palabra y termina como una palabra normal, forma el plural de manera regular al final: bocacalle – bocacalles, pasatiempo – pasatiempos.","Comparad «el pasatiempo – los pasatiempos» con «el pasapuré». ¿Por qué el segundo no cambia?"]]},{"title":"Préstamos","subtitle":"Récords, cómics, champús","main":"¿Cómo se adaptan los préstamos al plural español?","questions":["¿Por qué decimos «récords» y no «récordes»?","¿Cuál es el plural de «test» y de «champú»?","¿Qué préstamos tienen dos plurales aceptados?"],"challenge":"Buscad cinco préstamos y comparad sus plurales en el diccionario.","stretch":"Defended una postura: ¿hay que adaptar los préstamos o mantener su forma original?","support":["Las dos formas son posibles, pero …","En este contexto elegiría …, porque …","Un error típico es … – lo correcto es …"],"explanations":[["Los préstamos terminados en consonantes poco habituales al final de palabra en español (-k, -t, -c, -p…) o en grupo de consonantes forman el plural con -s: cómics, robots, récords, tests. Los terminados en -l, -r, -n, -d, -z, -j suelen seguir la regla general y añaden -es: chóferes, másteres.","Formad el plural de «récord», «cómic» y «robot». Comprobad después en el diccionario."],["Las palabras agudas terminadas en vocal tónica, como «sofá», «café», «menú» o «champú», forman normalmente el plural con -s: sofás, cafés, menús, champús. En las terminadas en -í o -ú hay a veces dos formas (tabúes/tabús).","¿Qué plural usaríais en la carta de un restaurante ficticio para «menú» y «café»? ¿Y para «tabú» en un artículo?"],["Algunos préstamos tienen dos plurales admitidos: «clubs/clubes», «sándwiches» (y «sándwichs» en el uso), «yogures». Las academias suelen recomendar la forma adaptada al español.","Elegid tres préstamos con dos plurales posibles y decidid cuál usaríais en un examen y cuál en un mensaje."]]},{"title":"Plural y significado","subtitle":"Esposas, celos, deberes","main":"¿Cómo puede cambiar el significado de un sustantivo en plural?","questions":["¿Qué diferencia hay entre «una esposa» y «unas esposas»?","¿Qué significan «el deber» y «los deberes»?","¿Hay pares parecidos en checo?"],"challenge":"Escribid un diálogo breve con tres pares de este tipo.","stretch":"Explicad uno de estos pares a un alumno más joven sin traducirlo.","support":["Las dos formas son posibles, pero …","En este contexto elegiría …, porque …","Un error típico es … – lo correcto es …"],"explanations":[["Algunos sustantivos cambian de significado en plural: «una esposa» es una mujer casada, «unas esposas» son los aros metálicos que usa la policía.","Escribid dos frases: una con «esposa» y otra con «esposas» en el sentido policial. ¿Cómo ayuda el contexto?"],["«El deber» es una obligación; «los deberes» son las tareas que se hacen en casa. «El celo» es esmero, «los celos» son el miedo a perder el cariño de alguien.","Completad: «Tengo muchos … de Matemáticas» y «Cumplió con su …». ¿Qué forma necesitáis en cada caso?"],["En checo también hay sustantivos cuyo plural tiene un significado especial o que solo existen en plural, como «noviny» o «dveře». Comparar las lenguas ayuda a notar estas diferencias.","Pensad en una palabra checa que sea plural de forma pero singular de significado. ¿Cómo la traduciríais al español?"]]},{"title":"Números y medidas","subtitle":"Un millón, cero grados","main":"¿Qué ocurre con el plural después de los números?","questions":["¿Se dice «1,5 millón» o «1,5 millones»?","¿Por qué decimos «cero grados» en plural?","¿Cómo se dice correctamente «los años 80»?"],"challenge":"Describid una receta o un viaje ficticio con cinco medidas.","stretch":"Formulad una regla para el plural con números decimales y comprobadla.","support":["Las dos formas son posibles, pero …","En este contexto elegiría …, porque …","Un error típico es … – lo correcto es …"],"explanations":[["Con números decimales, el sustantivo va en plural: «1,5 millones», «2,3 kilos». Solo «uno» exacto exige el singular: «un millón».","Leed en voz alta: «La ciudad tiene 1,8 … de habitantes» y «El paquete pesa 1,5 …»."],["Con «cero» el sustantivo va en plural: «cero grados», «cero euros». Es una convención del español que puede sorprender.","Describid el tiempo de un día de invierno ficticio usando «cero» y otras temperaturas."],["Para las décadas se dice «los años ochenta» o «los ochenta»; las cifras no llevan -s: «los años 80», no «los 80s». Esta última forma es un calco del inglés.","Corregid el titular ficticio «La música de los 90s vuelve» y explicad por qué."]]},{"title":"Apellidos y nombres","subtitle":"Los García, las dos Marías","main":"¿Cómo forman el plural los nombres propios?","questions":["¿Por qué decimos «los García» y no «los Garcías»?","¿Por qué en cambio se dice «los Borbones»?","¿Cuál es el plural de «María» si hay dos en clase?"],"challenge":"Describid una calle de vecinos inventados usando apellidos en plural.","stretch":"Investigad el plural de las siglas: ¿«las ONG» o «las ONGs»?","support":["Las dos formas son posibles, pero …","En este contexto elegiría …, porque …","Un error típico es … – lo correcto es …"],"explanations":[["Los apellidos no cambian en plural cuando se refieren a una familia: los García, los Fernández. El artículo en plural indica que se habla de varias personas.","Invitad por escrito a una familia ficticia llamada «Martínez». ¿Cómo empezaríais: «Queridos …»?"],["Los nombres de dinastías o de familias muy conocidas suelen pluralizarse: los Borbones, los Austrias. Es una tradición histórica.","Buscad otro ejemplo de dinastía o familia famosa en plural. ¿Por qué creéis que se pluraliza?"],["Los nombres de pila forman un plural regular: «las dos Marías», «los Pablos». Las siglas, según la norma académica, no cambian en la escritura: «las ONG», no «las ONGs».","En vuestra clase ficticia hay tres alumnos llamados Juan. ¿Cómo lo decís? Y ¿cómo escribiríais el plural de «el DVD»?"]]},{"title":"La lengua hablada","subtitle":"«Habían muchas personas»","main":"¿Por qué muchos hablantes dicen «habían» o «hubieron» en lugar de «había» o «hubo»?","questions":["¿Por qué se considera incorrecto «habían muchas personas»?","¿Por qué resulta tan frecuente en la lengua hablada?","¿En qué situaciones debéis evitarlo?"],"challenge":"Buscad ejemplos en series, canciones o redes y decidid si son formales o informales.","stretch":"Escribid una versión informal y otra formal del mismo mensaje.","support":["Las dos formas son posibles, pero …","En este contexto elegiría …, porque …","Un error típico es … – lo correcto es …"],"explanations":[["«Haber» como verbo impersonal («hay», «había», «hubo») no tiene sujeto; el sustantivo es su complemento directo. Por eso la norma exige singular: «había muchas personas», no «habían».","Transformad «Hay tres problemas» al pasado y al futuro. ¿Qué forma del verbo usáis?"],["La forma «habían muchas personas» es muy frecuente porque los hablantes interpretan el sustantivo como sujeto y hacen concordar el verbo, igual que con «estaban muchas personas».","Explicad a un compañero por qué es lógico el error, aunque no sea correcto según la norma."],["En exámenes, redacciones, correos formales y presentaciones debéis usar «había» y «hubo». Conocer la forma coloquial os ayuda a entender a los hablantes nativos.","Reescribid este mensaje para un correo formal: «Ayer hubieron muchos problemas con el autobús»."]]},{"title":"Estrategias de aprendizaje","subtitle":"Recordar los plurales difíciles","main":"¿Cuál es la forma más eficaz de aprender los plurales difíciles?","questions":["¿Os ayudan más las reglas o los ejemplos?","¿Qué utilidad tienen el diccionario y las aplicaciones?","¿Cómo os dais cuenta de vuestros propios errores?"],"challenge":"Diseñad un juego breve para practicar diez plurales difíciles.","stretch":"Comparad vuestra estrategia con la de vuestro compañero y elegid la mejor.","support":["Las dos formas son posibles, pero …","En este contexto elegiría …, porque …","Un error típico es … – lo correcto es …"],"explanations":[["Algunas personas recuerdan mejor las reglas («-z → -ces»), otras los ejemplos («lápiz – lápices, luz – luces»). Combinar ambas cosas suele funcionar mejor.","Probad los dos métodos con «voz», «nariz» y «vez». ¿Cuál os ha ayudado más?"],["El Diccionario de la lengua española y el Diccionario panhispánico de dudas indican los plurales dudosos. Las aplicaciones ayudan a repetir, pero rara vez explican el porqué.","Buscad en el diccionario el plural de «tabú», «jersey» y «régimen». ¿Qué información encontráis?"],["Grabaros al hablar, usar una lista de control al escribir o pedir a un compañero que anote vuestros errores ayuda a notar fallos que no oís.","Hablad un minuto sobre vuestro fin de semana mientras vuestro compañero anota cada plural. ¿Había alguno incorrecto?"]]}],"vocab":[["el sustantivo colectivo","nombre que designa un grupo (equipo, familia)"],["la concordancia ad sensum","concordancia según el significado, no la forma"],["el compuesto","palabra formada por dos o más palabras"],["el préstamo","palabra tomada de otra lengua"],["la adaptación","ajuste de un préstamo al español"],["el plural inherente","sustantivo que se usa en plural (gafas)"],["el apellido","příjmení"],["la sigla","palabra formada por iniciales (ONG)"],["el haber impersonal","«hay», «había» sin sujeto"],["la variante","forma alternativa aceptada"],["el registro","nivel de formalidad"],["el error","forma contraria a la norma"]],"toolkit":[["Justificar","Elegiría … porque el contexto …"],["Contrastar","En la lengua hablada …, mientras que en un texto formal …"],["Matizar","Es aceptable al hablar, pero no por escrito."],["Corregir con tacto","También se podría decir …"]]},"C1":{"warm":"¿Es más correcto «los clubes» que «los clubs»? Dad vuestra primera respuesta y luego el mejor contraargumento.","stations":[{"title":"Norma y uso","subtitle":"¿Quién decide lo correcto?","main":"¿Quién decide qué plural es correcto: las academias, el profesorado o los hablantes?","questions":["¿Cómo tratan las obras de la RAE dobletes como «clubs/clubes»?","¿Por qué algunas formas consideradas incorrectas acaban aceptándose?","¿Deben los estudiantes seguir la norma académica o el uso general?"],"challenge":"Comparad lo que dicen dos obras de consulta sobre tres plurales dudosos.","stretch":"Analizad la idea de que «clubes» es más culto que «clubs».","support":["La norma recomienda …, mientras que muchos hablantes …","El plural cambia el significado de … a …","En un texto formal es más seguro …"],"explanations":[["Las obras académicas describen el uso y recomiendan formas. Para dobletes como «clubs/clubes» suelen aceptar ambas y señalar cuál es preferible en un registro culto.","Consultad «club» en el Diccionario panhispánico de dudas. ¿Qué plural recomienda y con qué argumento?"],["Una forma se acepta cuando la usan muchos hablantes durante mucho tiempo y aparece en textos de prestigio. Entonces las academias la registran, a veces con una marca de uso.","Pensad en un plural que antes os parecía incorrecto y ahora oís constantemente. ¿Qué lo ha hecho aceptable?"],["Los estudiantes necesitan formas comprensibles y aceptadas. En la práctica, conviene seguir la norma en contextos formales y reconocer las variantes del uso oral.","Escribís un informe escolar y un mensaje a un amigo. ¿Usaríais los mismos plurales? Dad un ejemplo."]]},{"title":"Variedades del español","subtitle":"España y América","main":"¿En qué se diferencian las variedades del español en el uso del plural?","questions":["¿Por qué en casi toda América se usa «ustedes» en lugar de «vosotros»?","¿Qué otros plurales varían según el país, como «las gafas» y «los anteojos»?","¿Cómo debería elegir un estudiante una variedad?"],"challenge":"Adaptad un breve texto de España para un público de México.","stretch":"Debatid si es un problema mezclar variedades en un mismo texto.","support":["La norma recomienda …, mientras que muchos hablantes …","El plural cambia el significado de … a …","En un texto formal es más seguro …"],"explanations":[["En casi toda Hispanoamérica y en Canarias y parte de Andalucía, «ustedes» se usa como único plural de segunda persona, tanto formal como informal. «Vosotros» es propio de la mayor parte de España.","Transformad «¿Vosotros venís a la fiesta?» para un público de Colombia. ¿Qué cambia en el verbo?"],["Hay diferencias de léxico que afectan al plural: «las gafas» (España) y «los anteojos» o «los lentes» (gran parte de América); «los vaqueros» y «los jeans».","Elaborad una lista de tres objetos que se nombran en plural con palabras distintas en España y en América."],["Los estudiantes pueden elegir una variedad según sus objetivos, profesores o exámenes. Suele ser más importante la coherencia que la variedad elegida.","Decidid qué variedad usáis más y buscad dos rasgos relacionados con el plural que lo muestren."]]},{"title":"Masculino genérico","subtitle":"Plural y género","main":"¿Qué revela el plural masculino genérico sobre la relación entre gramática y sociedad?","questions":["¿Por qué «los alumnos» puede incluir a chicas y chicos?","¿Qué alternativas existen: desdoblamiento, sustantivos colectivos, formas nuevas?","¿Por qué rechaza la RAE formas como «alumnes» o «alumn@s»?"],"challenge":"Reescribid un texto breve para que incluya a todas las personas sin repetir constantemente «los y las».","stretch":"Evaluad argumentos a favor y en contra del lenguaje inclusivo en textos formales.","support":["La norma recomienda …, mientras que muchos hablantes …","El plural cambia el significado de … a …","En un texto formal es más seguro …"],"explanations":[["En español el masculino plural se usa tradicionalmente para grupos mixtos: «los alumnos» puede incluir a alumnos y alumnas. Este uso se llama masculino genérico.","Leed «Los profesores se reunieron ayer». ¿Pensáis en un grupo solo de hombres o mixto? ¿Por qué?"],["Existen alternativas: el desdoblamiento («alumnos y alumnas»), los colectivos («el alumnado», «el profesorado») y formas nuevas como «alumnes», «alumnxs» o «alumn@s».","Reescribid «Los vecinos deben dejar las bicicletas en el patio» con dos alternativas distintas."],["La RAE considera que el masculino genérico es suficiente gramaticalmente y rechaza «-e», «-x» y «@» porque no forman parte del sistema morfológico del español. Otros hablantes las usan como posición social o política.","Formulad un argumento gramatical y otro social sobre «todes». ¿Cuál os parece más convincente?"]]},{"title":"Contable y no contable","subtitle":"Un sustantivo, dos usos","main":"¿Cómo puede un mismo sustantivo ser contable y no contable?","questions":["¿Qué diferencia hay entre «café» y «dos cafés»?","¿Por qué «los vinos» o «los quesos» suelen significar tipos?","¿Cómo decide el contexto?"],"challenge":"Escribid pares de frases con usos contables y no contables de cinco sustantivos.","stretch":"Explicad la diferencia entre «papel» y «un papel», o entre «hierro» y «un hierro».","support":["La norma recomienda …, mientras que muchos hablantes …","El plural cambia el significado de … a …","En un texto formal es más seguro …"],"explanations":[["Muchos sustantivos son no contables cuando se refieren a una materia o idea general («café», «experiencia») y contables cuando se refieren a una porción, un tipo o un hecho concreto («dos cafés», «experiencias interesantes»).","Haced dos frases con «café», «experiencia» y «tiempo»: una contable y otra no contable."],["Cuando un sustantivo de materia se usa en plural, a menudo designa clases distintas: «los vinos de Rioja», «los quesos manchegos». Es un plural de tipos.","Describid un puesto de mercado ficticio con tres sustantivos de materia en plural que signifiquen tipos."],["El contexto (artículos, cuantificadores como «mucho/muchos» y la situación) muestra si el hablante cuenta o no: «comimos pollo» frente a «hay pollos en el corral».","¿Es contable «pescado» en «Hoy comemos pescado»? ¿Y «peces» en «Hay peces en el río»? Explicad la diferencia."]]},{"title":"Plurales abstractos","subtitle":"Libertades, derechos, valores","main":"¿Qué cambia cuando un sustantivo abstracto se usa en plural?","questions":["¿Qué diferencia hay entre «la libertad» y «las libertades»?","¿Por qué los discursos políticos usan tanto «derechos» y «valores»?","¿Puede pluralizarse cualquier sustantivo abstracto?"],"challenge":"Analizad los plurales abstractos de un breve discurso político ficticio.","stretch":"Debatid si los plurales abstractos hacen un texto más preciso o más vago.","support":["La norma recomienda …, mientras que muchos hablantes …","El plural cambia el significado de … a …","En un texto formal es más seguro …"],"explanations":[["«La libertad» es una idea general; «las libertades» son derechos concretos, como la libertad de expresión o de reunión. El plural vuelve concreta y enumerable la idea.","Nombrad tres «libertades» que podría proteger el reglamento de un instituto ficticio. ¿Por qué encaja mejor el plural?"],["Los textos políticos y jurídicos usan a menudo plurales abstractos («derechos», «valores», «responsabilidades») para sugerir un conjunto definido o para apelar a principios compartidos.","Leed «nuestros valores comunes». ¿Qué valores podría querer decir quien habla? ¿Lo dice realmente?"],["No todos los sustantivos abstractos admiten bien el plural: «las felicidades» es una fórmula de felicitación, no muchas felicidades; «las informaciones» puede significar noticias concretas.","Probad cinco sustantivos abstractos en plural. ¿Cuáles suenan naturales y qué significado tienen?"]]},{"title":"Registro académico","subtitle":"Siglas, datos y «nosotros»","main":"¿Cómo influye el registro en el uso del plural?","questions":["¿Por qué recomienda la RAE escribir «las ONG» sin -s?","¿Por qué muchos textos académicos usan «nosotros» aunque los escriba una sola persona?","¿Cuándo suena pedante un plural muy culto?"],"challenge":"Reescribid un párrafo informal en estilo académico prestando atención al número.","stretch":"Comparad dos guías de estilo sobre el plural de siglas y decidid cuál seguiríais.","support":["La norma recomienda …, mientras que muchos hablantes …","El plural cambia el significado de … a …","En un texto formal es más seguro …"],"explanations":[["Según la norma académica, las siglas no añaden -s en la escritura: «las ONG», «los DVD». El plural se marca con el artículo. La forma «ONGs» es un calco del inglés.","Corregid el titular ficticio «Las ONGs piden más ayudas» y explicad la corrección."],["El plural de modestia («nosotros», «consideramos») se usa en textos académicos aunque haya un solo autor, para sonar menos personal y más objetivo.","Transformad «Yo creo que los resultados son claros» en estilo académico. ¿Qué cambia en el tono?"],["Plurales muy cultos o latinizantes («los currícula», «los memoranda») pueden sonar pedantes. Hoy la norma prefiere formas adaptadas: «los currículos», «los memorandos».","¿Escribiríais «currícula» o «currículos» en la web de un instituto? Justificad la elección."]]},{"title":"El plural con intención","subtitle":"Nosotros, ustedes y el plural mayestático","main":"¿Cómo puede el plural usarse con fines retóricos o sociales?","questions":["¿Qué es el plural mayestático?","¿Por qué un médico dice a veces «¿Cómo estamos hoy?»?","¿Qué efecto tiene «nosotros» en un discurso político?"],"challenge":"Reescribid un mensaje breve pasando del «yo» al «nosotros» y comentad el efecto.","stretch":"Analizad cuándo un «nosotros» inclusivo puede resultar manipulador.","support":["La norma recomienda …, mientras que muchos hablantes …","El plural cambia el significado de … a …","En un texto formal es más seguro …"],"explanations":[["El plural mayestático es el «nosotros» que usan reyes o autoridades para referirse a sí mismos («Nos, el Rey…»). Hoy se encuentra sobre todo en textos históricos o solemnes.","Reescribid «Yo declaro abierta la sesión» como lo haría una autoridad antigua. ¿Qué efecto produce?"],["Médicos, enfermeras o profesores dicen a veces «¿Cómo estamos hoy?» en lugar de «¿Cómo está usted?». Es el llamado plural sociativo: puede sonar cercano, pero también paternalista.","¿Cómo podría reaccionar un paciente ficticio ante «¿Ya nos hemos tomado las pastillas?»? Proponed una alternativa más respetuosa."],["En los discursos políticos, «nosotros» crea comunidad entre orador y público, pero también puede difuminar la responsabilidad: ¿quién es exactamente «nosotros»?","Analizad la frase «Tenemos que hacer sacrificios». ¿Quién los hará probablemente y quién habla?"]]},{"title":"Español y checo","subtitle":"Traducir el número","main":"¿En qué se diferencian el español y el checo en el número gramatical?","questions":["¿Qué sustantivos son plurales en checo y singulares en español, como «dveře – la puerta»?","¿Qué sustantivos son colectivos en español pero plurales en checo, como «la gente – lidé»?","¿Cómo cambian los sustantivos después de los números en checo y en español?"],"challenge":"Traducid cinco frases breves y marcad cada cambio de número.","stretch":"Explicad una diferencia a un hispanohablante que aprende checo.","support":["La norma recomienda …, mientras que muchos hablantes …","El plural cambia el significado de … a …","En un texto formal es más seguro …"],"explanations":[["Algunos sustantivos checos solo existen en plural pero designan un objeto («dveře», «noviny», «housle»). En español suelen ser singulares: la puerta, el periódico, el violín.","Traducid: «Ty dveře jsou otevřené» y «Noviny leží na stole». ¿Qué forma verbal necesitáis en español?"],["«La gente» es singular en español, mientras que «lidé» es plural en checo. Por eso los hablantes checos dicen a menudo «la gente son». Otros sustantivos colectivos funcionan igual: el público, la policía.","Traducid «Lidé jsou unavení» y «Policie přijela». ¿Qué número tiene el verbo en cada lengua?"],["El checo cambia la forma del sustantivo después de los números: 1 kniha, 2–4 knihy, 5+ knih. El español usa la misma forma plural para todos los números mayores que uno.","Explicad a un hispanohablante por qué en checo se dice «dvě knihy» pero «pět knih». ¿Encontráis una regla sencilla?"]]}],"vocab":[["la norma","lo que una comunidad considera correcto"],["el uso","cómo hablan y escriben realmente las personas"],["el doblete","dos formas aceptadas de una misma palabra"],["la variedad","forma de la lengua de una región o grupo"],["el masculino genérico","masculino que incluye a hombres y mujeres"],["el desdoblamiento","nombrar los dos géneros (alumnos y alumnas)"],["el sustantivo de materia","sustantivo que normalmente no se cuenta"],["el plural de modestia","«nosotros» usado por un solo autor"],["el plural mayestático","«nosotros» usado por una autoridad"],["el registro","nivel de formalidad"],["la RAE","Real Academia Española"],["el número gramatical","categoría de singular y plural"]],"toolkit":[["Distinguir","Hay que distinguir la norma del uso real."],["Citar fuentes","Según el Diccionario panhispánico de dudas, …"],["Analizar el efecto","El plural produce la impresión de que …"],["Conceder","Es cierto que …; sin embargo, …"]]},"C2":{"warm":"Poned a prueba la afirmación: «El plural español es fácil: se añade -s o -es». Buscad el contraejemplo más fuerte.","stations":[{"title":"¿Reglas o memoria?","subtitle":"Cómo se aprende el plural","main":"¿Guardamos los plurales en la memoria o los formamos mediante reglas?","questions":["¿Por qué algunos niños dicen «pieses» en lugar de «pies»?","¿Qué demuestra que los hablantes forman sin dudar el plural de palabras inventadas?","¿Qué consecuencias tiene esto para aprender una lengua extranjera?"],"challenge":"Inventad tres sustantivos nuevos y pedid a vuestro compañero que forme su plural.","stretch":"Evaluad si los estudiantes deben memorizar listas o practicar reglas.","support":["Esta regla funciona para …, pero falla cuando …","Los datos indican que …","Una descripción más precisa sería …"],"explanations":[["Los niños que aprenden español producen a veces formas como «pieses» o «manes». Esto muestra que aplican una regla de plural, incluso donde no hace falta (sobrerregularización).","Pedid a un compañero que explique por qué un niño diría «pieses». ¿Qué sabe ya el niño sobre el plural?"],["Si se muestra a los hablantes una palabra inventada («un tolpe», «un brisal»), forman sin dudar el plural: «tolpes», «brisales». Eso indica que usan reglas y no solo formas memorizadas.","Inventad dos palabras, una terminada en vocal y otra en consonante, y comprobad qué plural forma vuestro compañero."],["Muchos investigadores creen que los plurales regulares se forman con reglas y que las excepciones se guardan en la memoria. Para aprender una lengua, esto sugiere practicar las reglas y memorizar las excepciones frecuentes.","¿Qué plurales aprendisteis como palabras enteras y cuál «inventasteis» alguna vez usando una regla?"]]},{"title":"Cambio lingüístico","subtitle":"De «clubs» a «clubes»","main":"¿Cómo y por qué cambian los plurales con el tiempo?","questions":["¿Por qué muchos préstamos pasan de un plural extranjero a uno español?","¿Por qué conviven formas como «tabúes» y «tabús»?","¿Qué plurales actuales podrían cambiar en el futuro?"],"challenge":"Predecid dos plurales que podrían cambiar en los próximos cincuenta años y justificadlo.","stretch":"Poned a prueba la idea de que el uso frecuente acelera la adaptación de un préstamo.","support":["Esta regla funciona para …, pero falla cuando …","Los datos indican que …","Una descripción más precisa sería …"],"explanations":[["Los préstamos suelen entrar con el plural de la lengua de origen («clubs», «sándwichs») y luego se adaptan al sistema español («clubes», «sándwiches»). La adaptación puede durar décadas.","Elegid un préstamo reciente del inglés. ¿Qué plural usa la gente hoy y cuál creéis que se usará dentro de veinte años?"],["En las palabras agudas terminadas en -í o -ú conviven dos plurales: «tabúes/tabús», «jabalíes/jabalís». La forma en -es es más culta; la forma en -s, más frecuente en la lengua hablada.","Pronunciad «los tabúes» y «los tabús». ¿Cuál os resulta más natural y por qué?"],["Las formas con doble plural, como «pieses» o «cafeses», aparecen en el habla popular de algunas zonas. Muestran que los hablantes buscan una marca de plural clara.","¿Por qué «cafés» podría parecer a algunos hablantes un plural poco marcado? Pensad en la terminación."]]},{"title":"Corpus y gramáticas","subtitle":"Datos para las reglas","main":"¿Qué pueden revelar las grandes colecciones de textos sobre el uso del plural?","questions":["¿Cómo podría un corpus mostrar si «clubs» o «clubes» es más frecuente?","¿Qué límites tiene la frecuencia como prueba?","¿Deberían las gramáticas seguir los datos de los corpus?"],"challenge":"Diseñad una pequeña investigación sobre un plural dudoso.","stretch":"Debatid si la forma más frecuente es automáticamente la correcta.","support":["Esta regla funciona para …, pero falla cuando …","Los datos indican que …","Una descripción más precisa sería …"],"explanations":[["Un corpus es una gran colección de textos reales. Buscando «clubs» y «clubes» en distintos tipos de texto se puede ver qué forma es más frecuente en cada contexto.","Planificad una búsqueda: ¿qué tipos de texto (prensa, ciencia, foros) compararíais y qué esperáis encontrar?"],["La frecuencia muestra lo que es común, no necesariamente lo adecuado en cualquier contexto. Además, los resultados dependen de qué textos incluye el corpus.","Una forma es frecuente en internet pero rara en textos académicos. ¿Es correcta? ¿Qué más necesitaríais saber?"],["Las gramáticas modernas, como la Nueva gramática de la lengua española, se basan en corpus, pero siguen haciendo recomendaciones. Describir y recomendar son tareas distintas.","Buscad una entrada del Diccionario panhispánico de dudas sobre un plural. ¿Describe el uso, recomienda una forma o hace ambas cosas?"]]},{"title":"Corrección y prejuicio","subtitle":"¿Error o variante?","main":"¿Por qué algunos «errores» de plural provocan reacciones tan fuertes?","questions":["¿A quién se juzga cuando dice «habían muchos problemas»?","¿Qué diferencia hay entre un error y una variante?","¿Cómo debería reaccionar el profesorado ante plurales no normativos?"],"challenge":"Representad un debate entre un corrector muy estricto y una lingüista.","stretch":"Formulad un principio justo para corregir errores de plural.","support":["Esta regla funciona para …, pero falla cuando …","Los datos indican que …","Una descripción más precisa sería …"],"explanations":[["Formas como «habían muchas personas» o «los cafeses» se usan a menudo como señal de la formación o el origen social de quien habla. La reacción dice tanto de las actitudes sociales como de la gramática.","Imaginad una entrevista de trabajo en la que el candidato dice «hubieron problemas». ¿Cómo reaccionaría el entrevistador? ¿Es justa la reacción?"],["Un error contradice las reglas de una variedad y no lo usan sistemáticamente sus hablantes; una variante la usa regularmente un grupo y puede ser aceptable en ciertos contextos. El límite puede cambiar con el tiempo.","¿Es «habían muchas personas» un error o una variante? ¿Qué datos usaríais para decidirlo?"],["El profesorado puede distinguir entre errores que dificultan la comprensión y formas simplemente no normativas, y explicar dónde es adecuada cada una en lugar de limitarse a tacharla.","Escribid un comentario breve para un estudiante ficticio que escribió «las crisises»: corregid la forma y explicad por qué sin desanimarlo."]]},{"title":"Enseñar el plural","subtitle":"Claro, pero no simplista","main":"¿Cómo se puede enseñar el plural con claridad sin ocultar su complejidad?","questions":["¿Cuándo es útil la regla «-s tras vocal, -es tras consonante» y cuándo engaña?","¿En qué orden introduciríais las excepciones?","¿Cómo pueden los estudiantes descubrir las reglas por sí mismos?"],"challenge":"Diseñad una minilección de diez minutos sobre el plural para estudiantes de nivel A2.","stretch":"Identificad una simplificación en vuestra lección y mejoradla.","support":["Esta regla funciona para …, pero falla cuando …","Los datos indican que …","Una descripción más precisa sería …"],"explanations":[["La regla «-s tras vocal, -es tras consonante» cubre la mayoría de los sustantivos y ayuda a empezar a hablar. Engaña con las palabras invariables, los cambios de tilde, la -z y los préstamos.","Haced una lista de cinco palabras para las que la regla básica da un resultado incorrecto. ¿Qué grupo enseñaríais primero?"],["Un orden habitual es: -s y -es, luego -z → -ces, después los cambios de tilde, las palabras invariables, los plurales inherentes y, al final, los préstamos y las variantes.","¿Estáis de acuerdo con este orden? Cambiad un paso y justificad el cambio."],["Los estudiantes pueden descubrir reglas clasificando ejemplos, comparando sonidos o buscando patrones en un texto. Descubrir suele llevar a una comprensión más profunda que memorizar.","Dad a un compañero diez parejas singular–plural y pedidle que formule él mismo la regla. ¿Se ha acercado?"]]},{"title":"El número en las lenguas","subtitle":"¿«Uno» es siempre singular?","main":"¿En qué se diferencian las lenguas al expresar el número?","questions":["¿Por qué el checo usa formas distintas después de 2–4 y después de 5?","¿Marcan todas las lenguas el plural en el sustantivo?","¿Qué muestra el dual de lenguas como el esloveno?"],"challenge":"Comparad cómo se dice «un libro, dos libros, cinco libros» en español, checo y otra lengua.","stretch":"Debatid si el plural español es sencillo o simplemente diferente.","support":["Esta regla funciona para …, pero falla cuando …","Los datos indican que …","Una descripción más precisa sería …"],"explanations":[["El checo usa tres formas después de los números: 1 kniha, 2–4 knihy, 5 o más knih. El español usa una sola forma plural para todos los números mayores que uno.","Contad del uno al seis en checo con «pes» y después en español con «perro». ¿Qué sistema es más complejo?"],["No todas las lenguas marcan el plural en el sustantivo. En chino o en japonés, por ejemplo, el sustantivo suele quedar igual y la cantidad se expresa con números o por el contexto.","¿Cómo entenderíais «compré libro» si el español no tuviera plural? ¿Qué palabras os indicarían la cantidad?"],["Algunas lenguas, como el esloveno, tienen dual: una forma especial para dos. El checo antiguo también lo tenía, y quedan restos en formas como «oči», «uši» o «ruce».","¿Por qué podría una lengua tener una forma especial para dos? Pensad en cosas que suelen ir en pares."]]},{"title":"Gramática e identidad","subtitle":"Cuando el número se vuelve político","main":"¿Puede convertirse el plural en un asunto social o político?","questions":["¿Por qué el masculino genérico en plural se ha convertido en tema de debate público?","¿Deben las instituciones imponer un uso concreto?","¿Cómo abordan otras lenguas preguntas parecidas?"],"challenge":"Redactad una breve guía de lenguaje inclusivo para la revista de un instituto ficticio.","stretch":"Poned a prueba vuestra guía con un caso difícil.","support":["Esta regla funciona para …, pero falla cuando …","Los datos indican que …","Una descripción más precisa sería …"],"explanations":[["El masculino genérico en plural se ha convertido en tema público porque muchas personas lo relacionan con la visibilidad de las mujeres y de las personas no binarias. El debate trata tanto de identidad como de gramática.","Buscad un argumento gramatical y otro social en este debate. ¿Cuál os parece más convincente?"],["Instituciones como academias, administraciones o centros educativos publican guías de estilo. Pueden recomendar usos, pero no controlar cómo habla la gente en privado.","¿Debería la revista de un instituto seguir una guía de estilo? ¿Quién debería decidir qué contiene?"],["Otras lenguas se enfrentan a preguntas parecidas: el inglés con el «they» singular, el alemán con el asterisco (Lehrer*innen), el francés con la escritura inclusiva. Las soluciones difieren porque la gramática es distinta.","Comparad una solución española con la de otra lengua que conozcáis. ¿Cuál es más fácil de usar al hablar?"]]},{"title":"Los límites de las reglas","subtitle":"Casos límite","main":"¿Dónde llegan a su límite las reglas del plural español?","questions":["¿Cuál es el plural de «sí» y de «no» como sustantivos?","¿Por qué se acepta tanto «jabalíes» como «jabalís»?","¿Qué muestran estos casos sobre la relación entre forma y uso?"],"challenge":"Reunid cinco casos límite y proponed una regla que los explique.","stretch":"Defended o rechazad la idea de que las reglas solo describen los casos típicos.","support":["Esta regla funciona para …, pero falla cuando …","Los datos indican que …","Una descripción más precisa sería …"],"explanations":[["Cuando «sí» y «no» funcionan como sustantivos, la norma da como plurales «síes» y «noes»: «los síes ganaron por pocos votos». Son formas poco frecuentes que sorprenden a muchos hablantes.","Escribid una frase sobre una votación ficticia usando «síes» y «noes». ¿Suena natural?"],["En las palabras agudas terminadas en -í tónica, la norma acepta tanto «-íes» como «-ís»: jabalíes/jabalís, maniquíes/maniquís. La forma en -es es más culta.","Elegid tres palabras de este tipo y decidid qué plural usaríais en una redacción y cuál en una conversación."],["Estos casos muestran que la forma del plural depende también de la frecuencia, del registro y de la percepción de los hablantes, no solo de una regla fonológica.","Reunid cinco casos dudosos (por ejemplo «el déficit», «el álbum», «el régimen») y comprobad si una sola regla los explica."]]}],"vocab":[["la sobrerregularización","aplicar una regla regular a una forma irregular"],["la productividad","capacidad de un patrón para formar palabras nuevas"],["la analogía","cambio por semejanza con otras formas"],["el doble plural","plural añadido dos veces (pieses)"],["el corpus","gran colección de textos reales"],["el prescriptivismo","decir cómo se debe usar la lengua"],["el descriptivismo","describir cómo se usa realmente la lengua"],["el dual","número gramatical para dos"],["el caso límite","ejemplo en el límite de una regla"],["la evidencia","datos que apoyan una afirmación"],["la simplificación","explicación más fácil que omite detalles"],["la ideología lingüística","creencias sobre cómo debe ser la lengua"]],"toolkit":[["Poner a prueba","Esta afirmación vale para …, pero no para …"],["Citar datos","Los datos del corpus indican que …"],["Revisar","Una regla más exacta sería …"],["Cuestionar","De ello no se deduce que …"]]}},"uiSimple":{"eyebrow":"HABLA · PREGUNTA · RESPONDE · ESCUCHA","hero":"Personas, cosas de clase, comida, animales, habitaciones y calles: nombrad muchas cosas en español y practicad el plural en diálogos cortos.","privacy":"Los errores ayudan a aprender. Podéis inventar personas y cosas.","step4":"¿Quieres más? Abre la siguiente tarea.","questions":"Más preguntas","supportTitle":"¿Necesitas ayuda?","supportDesc":"Palabras para empezar tus frases.","supportShow":"Ver ayuda","supportHide":"Ocultar ayuda","challengeTitle":"Más para hablar","challengeDesc":"Para después de la pregunta principal.","challengeShow":"Ver tarea","challengeHide":"Ocultar tarea","stretchTitle":"Una tarea más difícil","stretchDesc":"Si quieres hacer más.","stretchShow":"Ver tarea difícil","stretchHide":"Ocultar tarea difícil","progress":"Di por qué. Da un ejemplo. Haz una pregunta.","vocabLabel":"PALABRAS ÚTILES","vocabDesc":"Usa las palabras que te ayudan.","toolkitLabel":"FRASES ÚTILES","toolkitDesc":"Hablad juntos: preguntad y responded.","title":"El plural – Sustantivos en español","strap":"Una cosa, muchas: practica el plural en español"},"uiB1":{"stretchTitle":"Un paso más","stretchDesc":"Una tarea más difícil si ya habláis con seguridad.","vocabDesc":"Elegid las palabras útiles; no hace falta usarlas todas.","progress":"Dad razones y ejemplos, y reaccionad a lo que dice la otra persona.","title":"El plural – Sustantivos en español","strap":"Una cosa, muchas: practica el plural en español"}},"de":{"ui":{"title":"Plural – Mehrzahl der Nomen","strap":"Ein Wort, viele Dinge: Plural im Gespräch","brand":"KONVERSATIONSLABOR","subbrand":"Ein Gespräch, keine Prüfung","eyebrow":"SPRECHEN · HINTERFRAGEN · BEGRÜNDEN · REAGIEREN","hero":"Entdecke, wie deutsche Nomen den Plural bilden, und verwende ihn aktiv im Gespräch: Menschen, Schule, Einkauf, Tiere, Zuhause und Stadt – auf höheren Niveaus auch Regeln, Ausnahmen und Sprachwandel.","privacy":"Grammatikwerkstatt: Fehler gehören zum Lernen. Ihr könnt jederzeit mit erfundenen Beispielen arbeiten.","format":"Partnerarbeit","estimated":"40–55 min","changeLevel":"GER-Niveau","changeLanguage":"Sprache","themeDay":"Hell","themeNight":"Dunkel","fullscreen":"Vollbild","exitFullscreen":"Vollbild beenden","resetLesson":"Zurücksetzen","levelGoal":"Sprechziel","step1":"Denk kurz nach.","step2":"Nenne einen Grund oder ein Beispiel.","step3":"Stelle dein einklappen","lessonResetToast":"Aktivität zurückgesetzt","fullError":"Vollbild ist in diesem Browser nicht verfügbar.","formatHint":"PARTNERGESPRÄCH","goalA1":"Menschen und Dinge im Plural nennen und Zahlen verwenden.","goalA2":"Über Mengen sprechen: einige, viele, wenige, kein.","goalB1":"Die wichtigsten Pluralmuster und ihre Ausnahmen erklären.","goalB2":"Den Plural in schwierigen Kontexten richtig verwenden und begründen.","goalC1":"Variation, Norm und Bedeutungsunterschiede im Plural analysieren.","goalC2":"Erwerb, Wandel und Grenzen der Pluralregeln diskutieren.","tipA1":"Wähle drei bis vier Stationen. Kurze Antworten sind gut. Nutze die Wortliste und frage einmal zurück.","tipA2":"Wähle etwa vier Stationen. Erzähle mindestens einmal vom letzten Jahr und nenne einen Grund.","tipB1":"Bearbeitet vier bis fünf Stationen. Begründet eure Meinungen mit Beispielen und stellt Rückfragen.","tipB2":"Bearbeitet fünf bis sechs Stationen. Begründet, vergleicht und sucht bei Konflikten faire Kompromisse.","tipC1":"Bearbeitet fünf bis sechs Stationen. Berücksichtigt Gegenpositionen und achtet auf präzise Begriffe.","tipC2":"Bearbeitet fünf bis sechs Stationen. Prüft Prämissen, konstruiert Grenzfälle und überdenkt eure Position.","startLesson":"Gespräch beginnen →","offline":"Offline","controlsAria":"Steuerung der Unterrichtseinheit","stationNavAria":"Gesprächsstationen","questionHelpTip":"Öffnet eine Frage für eine verständliche Erklärung und ein konkretes Gesprächsbeispiel.","questionHelpOpen":"Erklären","questionHelpClose":"Schließen","questionHelpMeaning":"WAS IST GEMEINT?","questionHelpTry":"BEISPIEL ODER AUFGABE"},"levels":{"A1":{"warm":"Bilde den Plural: Buch, Frau, Kind, Auto, Apfel. Vergleicht dann eure Antworten.","stations":[{"title":"Menschen","subtitle":"Familie und Schule","main":"Wie sprichst du über mehrere Menschen?","questions":["Was ist der Plural von „Freund“ und „Lehrer“?","Wie viele Freunde oder Freundinnen hast du in deiner Klasse?","Welche Personen siehst du jeden Tag?"],"challenge":"Stelle drei Personen aus deiner Familie oder Klasse im Plural vor.","stretch":"Vergleiche „der Mann – die Männer“ und „die Frau – die Frauen“. Bilde kurze Sätze mit „zwei“ und „viele“.","support":["Ich habe zwei …","In meiner Klasse gibt es viele …","Der Singular ist …, der Plural ist …"]},{"title":"Dinge in der Schule","subtitle":"Im Klassenzimmer","main":"Welche Dinge in deinem Klassenzimmer kannst du im Plural nennen?","questions":["Ein Buch – zwei …?","Ein Stuhl – drei …?","Was liegt gerade auf deinem Tisch?"],"challenge":"Nenne fünf Schulsachen im Plural.","stretch":"Beschreibe dein Klassenzimmer mit mindestens vier Pluralformen.","support":["Hier sind drei …","Auf dem Tisch liegen …","Ein …, aber zwei …"]},{"title":"Essen und Einkaufen","subtitle":"Auf dem Markt","main":"Was kaufst du in mehreren Stück?","questions":["Ein Apfel – fünf …?","Eine Tomate – drei …?","Wie bestellst du zwei Brötchen?"],"challenge":"Spielt ein kurzes Einkaufsgespräch mit fünf Pluralformen.","stretch":"Vergleiche „Äpfel“, „Bananen“ und „Eier“: Welche Endungen hörst du?","support":["Ich möchte bitte zwei …","Wie viel kosten die …?","Wir brauchen mehrere …"]},{"title":"Tiere","subtitle":"Viele Tiere","main":"Welche Tiere kannst du im Plural nennen?","questions":["Ein Hund – zwei …?","Eine Maus – viele …?","Welche Tiere leben auf dem Bauernhof?"],"challenge":"Nenne fünf Tiere im Plural.","stretch":"Erkläre den Unterschied zwischen „Mäuse“ und „Hunde“.","support":["Ich sehe viele …","Auf dem Bauernhof leben …","Ein … wird zu …"]},{"title":"Zu Hause","subtitle":"Zimmer und Möbel","main":"Was gibt es bei dir zu Hause mehrfach?","questions":["Ein Zimmer – zwei …?","Ein Fenster – viele …?","Welche Möbel stehen in deinem Zimmer?"],"challenge":"Beschreibe ein Zimmer mit fünf Pluralformen.","stretch":"Plane eine Traumwohnung und nenne die Möbel mit Zahlen.","support":["In meinem Zimmer stehen …","Wir haben zwei …","Die … sind groß."]},{"title":"Stadt und Verkehr", ],["Korrigieren","Ich glaube, es heißt „die Mäuse“."]]},"A2":{"warm":"Nenne zehn Dinge aus deiner Schultasche im Plural. Wer hat mehr Dinge?","stations":[{"title":"Familie und Freunde","subtitle":"Über Menschen sprechen","main":"Wie viele Menschen gibt es in deiner Familie oder deinem Freundeskreis?","questions":["Hast du Geschwister, Cousins oder Cousinen?","Warum gibt es „die Eltern“ nur im Plural?","Wie viele Schülerinnen und Schüler sind in deiner Klasse?"],"challenge":"Beschreibe eine erfundene Familie mit mindestens fünf Pluralformen.","stretch":"Vergleiche deine erfundene Familie mit der deines Partners: Wer hat mehr Cousins, Tanten oder Haustiere?","support":["Ich habe zwei …","Ich habe keine …","Wir sind … Personen."]},{"title":"Meine Schultasche","subtitle":"Was ist drin?","main":"Was trägst du jeden Tag in deiner Schultasche?","questions":["Wie viele Bücher hast du heute dabei?","Hast du einige Stifte oder Hefte?","Welche Dinge nennt man oft mit „ein Paar“?"],"challenge":"Packe eine Tasche für einen Schulausflug und nenne zehn Dinge im Plural.","stretch":"Erkläre den Unterschied zwischen „ein Paar Schuhe“ und „ein paar Schuhe“.","support":["In meiner Tasche sind …","Ich habe keine …","Ich brauche ein Paar …"]},{"title":"Einkaufszettel","subtitle":"Im Supermarkt","main":"Was brauchen wir für ein Klassenpicknick?","questions":["Wie viele Brötchen brauchen wir?","Gibt es noch Tomaten oder Äpfel?","Was kaufst du kiloweise?"],"challenge":"Schreibe einen Einkaufszettel für sechs Personen und lies ihn laut vor.","stretch":"Finde Lebensmittel, die meistens nur im Singular stehen, z. B. „Obst“ oder „Milch“.","support":["Wir brauchen einige …","Wie viele … brauchen wir?","Es gibt keine … mehr."]},{"title":"Tiere","subtitle":"Im Zoo und auf dem Bauernhof","main":"Welche Tiere möchtest du bei einem Ausflug sehen?","questions":["Wie viele Beine haben Spinnen?","Hast du schon einmal Wölfe oder Gänse gesehen?","Welche Tiere haben im Plural einen Umlaut?"],"challenge":"B

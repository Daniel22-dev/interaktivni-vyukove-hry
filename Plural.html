vázání (les‿amis)"],["le nom comptable","počitatelné podstatné jméno"],["le nom non comptable","nepočitatelné podstatné jméno"],["le nom toujours au pluriel","pomnožné jméno (les vacances)"],["l’accord","shoda (les grandes maisons)"],["l’emprunt","přejaté slovo"],["l’exception","výjimka"]],"toolkit":[["Expliquer une règle","Les noms en -eau prennent un -x au pluriel."],["Donner une exception","Mais « pneu » prend un -s."],["Vérifier","Dit-on « des festivals » ou « des festivaux » ?"],["Corriger","Je pense qu’il faut dire …, parce que …"]]},"B2":{"warm":"Décidez vite : « La plupart des élèves est venue » ou « sont venus » ? « Quatre-vingt » ou « quatre-vingts » ? Justifiez votre choix.","stations":[{"title":"Les noms collectifs","subtitle":"La plupart des élèves sont venus","main":"Comment le verbe s’accorde-t-il avec un nom collectif ?","questions":["Pourquoi dit-on « la plupart des élèves sont venus » au pluriel ?","« Une foule de gens attendait » ou « attendaient » : les deux sont-ils possibles ?","Pourquoi dit-on « l’équipe a gagné » au singulier ?"],"challenge":"Rédigez deux brèves sur une équipe fictive et vérifiez tous les accords.","stretch":"Décidez quel accord vous paraît le plus naturel avec « une foule de » et justifiez votre choix.","support":["Les deux formes sont possibles, mais …","Dans ce contexte, je choisirais …, parce que …","Une erreur fréquente est … – la forme correcte est …"],"explanations":[["Après « la plupart de » suivi d’un nom au pluriel, le verbe se met au pluriel et s’accorde avec ce nom : « la plupart des élèves sont venus ». On accorde selon le sens, car on parle des élèves.","Complétez : « La plupart des invités … (partir) tôt. » Quel participe utilisez-vous et pourquoi ?"],["Avec « une foule de », « un grand nombre de », « une majorité de », les deux accords sont possibles : au singulier si l’on pense au groupe, au pluriel si l’on pense aux individus.","Comparez « Une foule de gens attendait devant le cinéma » et « … attendaient ». Laquelle insiste sur le groupe ?"],["Un nom collectif employé seul (« l’équipe », « la classe », « le public ») s’accorde au singulier : « l’équipe a gagné ». L’accord au pluriel est ici considéré comme une faute.","Corrigez avec tact : « Le public ont applaudi. » Comment expliqueriez-vous la correction en une phrase ?"]]},{"title":"Les noms composés","subtitle":"Grands-mères et porte-monnaie","main":"Où se place la marque du pluriel dans les noms composés ?","questions":["Pourquoi écrit-on « des grands-mères » avec deux marques ?","Quel est le pluriel de « timbre-poste » et de « chef-d’œuvre » ?","Qu’ont changé les rectifications de 1990 pour « porte-monnaie » ?"],"challenge":"Rassemblez huit noms composés et formez leur pluriel.","stretch":"Expliquez pourquoi le sens de chaque élément décide du pluriel.","support":["Les deux formes sont possibles, mais …","Dans ce contexte, je choisirais …, parce que …","Une erreur fréquente est … – la forme correcte est …"],"explanations":[["Dans un nom composé, seuls les noms et les adjectifs peuvent prendre la marque du pluriel, si le sens le permet : des grands-mères, des choux-fleurs. Les verbes, adverbes et prépositions restent invariables.","Formez le pluriel de « un coffre-fort » et « un arc-en-ciel ». Quels éléments varient ?"],["Le sens décide : « des timbres-poste » (des timbres pour la poste), « des arcs-en-ciel » (des arcs dans le ciel). Le complément reste au singulier quand il n’indique pas une pluralité.","Formez le pluriel de « un pot-de-vin » et « un hors-d’œuvre ». Le sens vous aide-t-il ?"],["Les rectifications de 1990 proposent de traiter les composés « verbe + nom » comme des mots simples : « des porte-monnaies », « des après-midis ». Les formes traditionnelles restent admises.","Écrivez le pluriel de « un garde-manger » selon la tradition (« des garde-manger ») et selon les rectifications (« des garde-mangers »). Laquelle préférez-vous ?"]]},{"title":"Les emprunts","subtitle":"Matchs, scénarios, maximums","main":"Comment les emprunts s’adaptent-ils au pluriel français ?","questions":["Dit-on « des matchs » ou « des matches » ?","Pourquoi « scénarios » a-t-il remplacé « scenarii » ?","Quels emprunts ont deux pluriels acceptés ?"],"challenge":"Cherchez cinq emprunts et comparez leurs pluriels dans deux dictionnaires.","stretch":"Défendez une position : faut-il franciser le pluriel des emprunts ?","support":["Les deux formes sont possibles, mais …","Dans ce contexte, je choisirais …, parce que …","Une erreur fréquente est … – la forme correcte est …"],"explanations":[["Les emprunts anglais terminés par une consonne prennent généralement un simple -s : « des matchs », « des sandwichs ». Les pluriels anglais « matches », « sandwiches » restent admis mais sont moins courants.","Dans un journal sportif français, écririez-vous « des matchs » ou « des matches » ? Vérifiez dans un dictionnaire."],["Les emprunts italiens et latins ont longtemps gardé leur pluriel d’origine (« scenarii », « maxima »). Aujourd’hui, l’usage et les rectifications de 1990 préfèrent le pluriel français : « scénarios », « maximums ».","Comparez « des maxima » et « des maximums ». Dans quel type de texte trouveriez-vous chacune de ces formes ?"],["Plusieurs emprunts ont deux pluriels admis : « des sandwichs / sandwiches », « des minimums / minima ». La forme francisée est généralement recommandée.","Choisissez trois emprunts à deux pluriels et décidez lequel vous utiliseriez dans un examen et lequel dans un message."]]},{"title":"Pluriel et sens","subtitle":"Lunettes, vacances, affaires","main":"Comment le pluriel peut-il changer le sens d’un nom ?","questions":["Quelle différence y a-t-il entre « une lunette » et « des lunettes » ?","Que signifient « une vacance » et « des vacances » ?","Existe-t-il des paires semblables en tchèque ?"],"challenge":"Écrivez un court dialogue avec trois paires de ce type.","stretch":"Expliquez une de ces paires à un élève plus jeune sans la traduire.","support":["Les deux formes sont possibles, mais …","Dans ce contexte, je choisirais …, parce que …","Une erreur fréquente est … – la forme correcte est …"],"explanations":[["Certains noms changent de sens au pluriel : « une lunette » est un instrument d’optique, « des lunettes » servent à mieux voir. « Une vacance » désigne un poste libre, « les vacances » une période de repos.","Écrivez deux phrases : une avec « lunette » et une avec « lunettes ». Comment le contexte aide-t-il ?"],["« Une affaire » peut être un procès ou une bonne occasion ; « les affaires » désignent le commerce ou les objets personnels. « Le papier » est une matière, « les papiers » sont des documents d’identité.","Complétez : « N’oublie pas tes … pour le voyage » et « Range tes … dans ton sac ». Quel sens a chaque pluriel ?"],["Le tchèque connaît aussi des mots qui n’existent qu’au pluriel ou dont le pluriel a un sens particulier, comme « noviny » ou « dveře ». Comparer les langues aide à repérer ces différences.","Pensez à un mot tchèque pluriel par la forme mais singulier par le sens. Comment le traduiriez-vous en français ?"]]},{"title":"Nombres et mesures","subtitle":"Quatre-vingts, deux cents, mille","main":"Quand les nombres prennent-ils la marque du pluriel ?","questions":["Pourquoi écrit-on « quatre-vingts » mais « quatre-vingt-trois » ?","Pourquoi « mille » ne prend-il jamais de -s ?","Dit-on « 1,5 million » ou « 1,5 millions » ?"],"challenge":"Décrivez une recette ou un voyage fictif avec cinq nombres écrits en lettres.","stretch":"Formulez la règle de « vingt » et « cent » et testez-la sur cinq nombres.","support":["Les deux formes sont possibles, mais …","Dans ce contexte, je choisirais …, parce que …","Une erreur fréquente est … – la forme correcte est …"],"explanations":[["« Vingt » et « cent » prennent un -s quand ils sont multipliés et ne sont pas suivis d’un autre nombre : « quatre-vingts », « deux cents ». Mais : « quatre-vingt-trois », « deux cent cinq ».","Écrivez en lettres : 80, 87, 200, 210 et 300. Où mettez-vous un -s ?"],["« Mille », adjectif numéral, est toujours invariable : « deux mille euros ». « Million » et « milliard » sont des noms et prennent un -s : « deux millions d’habitants ».","Écrivez en lettres le nombre d’habitants de trois villes imaginaires : 2 000, 2 000 000 et 3 500 000."],["Pour les nombres décimaux, « million » reste au singulier tant que la partie entière est inférieure à deux : « 1,5 million d’habitants ». C’est différent de l’espagnol, qui dit « 1,5 millones ».","Lisez à voix haute : « La ville compte 1,8 … d’habitants » et « Le pays compte 2,4 … d’habitants »."]]},{"title":"Noms de famille et sigles","subtitle":"Les Dupont, des CD","main":"Comment les noms propres et les sigles forment-ils leur pluriel ?","questions":["Pourquoi écrit-on « les Dupont » sans -s ?","Pourquoi dit-on pourtant « les Bourbons » ?","Écrit-on « des CD » ou « des CDs » ?"],"challenge":"Décrivez une rue de voisins imaginaires en utilisant des noms de famille au pluriel.","stretch":"Vérifiez dans une grammaire si les prénoms prennent la marque du pluriel (« les deux Marie »).","support":["Les deux formes sont possibles, mais …","Dans ce contexte, je choisirais …, parce que …","Une erreur fréquente est … – la forme correcte est …"],"explanations":[["Les noms de famille restent généralement invariables : « les Dupont », « les Martin ». L’article au pluriel suffit à indiquer qu’on parle de plusieurs personnes.","Rédigez une invitation pour une famille imaginaire appelée « Durand ». Comment commencez-vous : « Chers … » ?"],["Les noms de dynasties célèbres et de familles royales prennent traditionnellement la marque du pluriel : « les Bourbons », « les Césars ». C’est une tradition historique.","Trouvez un autre exemple de dynastie au pluriel. Pourquoi cette exception existe-t-elle selon vous ?"],["Les sigles sont normalement invariables à l’écrit : « des CD », « des PDG ». La forme « CDs » est un calque de l’anglais. Les prénoms restent le plus souvent invariables (« les deux Marie »), mais l’usage varie.","Dans votre classe imaginaire, il y a trois élèves prénommés Louis. Comment l’écririez-vous ? Et le pluriel de « un SMS » ?"]]},{"title":"Le français parlé","subtitle":"Les z-haricots ?","main":"Comment le pluriel se manifeste-t-il dans le français parlé spontané ?","questions":["Pourquoi certains locuteurs disent-ils « quatre-z-enfants » ?","Pourquoi ne fait-on pas la liaison dans « les haricots » ?","Quand faut-il éviter ces formes ?"],"challenge":"Relevez des exemples dans des séries ou des chansons et classez-les : oral familier ou standard.","stretch":"Écrivez une version familière et une version soutenue du même message.","support":["Les deux formes sont possibles, mais …","Dans ce contexte, je choisirais …, parce que …","Une erreur fréquente est … – la forme correcte est …"],"explanations":[["Dans le français parlé familier, on entend des liaisons qui n’existent pas dans la norme, comme « quatre-z-enfants » ou « vingt-z-euros ». Elles montrent que le locuteur veut marquer le pluriel clairement.","Pourquoi « quatre-z-enfants » paraît-il logique, même si c’est une faute ? Pensez à « les‿enfants »."],["Les mots commençant par un h aspiré (« haricot », « héros », « hibou ») n’admettent ni liaison ni élision : « les / haricots », « les / héros ». Faire la liaison est considéré comme une faute.","Lisez à voix haute : « les hommes », « les héros », « les hôtels », « les hiboux ». Où faites-vous la liaison ?"],["Dans les examens, exposés et courriels formels, il faut respecter les liaisons et accords standard. Connaître les formes familières aide à comprendre les locuteurs natifs.","Réécrivez ce message pour un courriel formel : « Y avait quatre-z-élèves absents ce matin. »"]]},{"title":"Stratégies d’apprentissage","subtitle":"Retenir les pluriels difficiles","main":"Quelle est la manière la plus efficace d’apprendre les pluriels difficiles ?","questions":["Les règles ou les exemples vous aident-ils davantage ?","À quoi servent le dictionnaire et les applications ?","Comment remarquez-vous vos propres erreurs ?"],"challenge":"Concevez un petit jeu pour pratiquer dix pluriels difficiles.","stretch":"Comparez votre stratégie avec celle de votre partenaire et choisissez la meilleure.","support":["Les deux formes sont possibles, mais …","Dans ce contexte, je choisirais …, parce que …","Une erreur fréquente est … – la forme correcte est …"],"explanations":[["Certains retiennent mieux les règles (« -al → -aux »), d’autres les exemples (« journal – journaux », « cheval – chevaux »). Combiner les deux fonctionne souvent le mieux.","Testez les deux méthodes avec « festival », « animal » et « bal ». Laquelle vous a aidé à repérer les exceptions ?"],["Les dictionnaires indiquent les pluriels irréguliers et les variantes. Les applications aident à répéter, mais expliquent rarement pourquoi une forme est employée.","Cherchez le pluriel de « ail », « bonhomme » et « vitrail » dans un dictionnaire. Quelles informations trouvez-vous ?"],["Relire ses textes en vérifiant chaque groupe nominal, ou demander à un partenaire de noter ses erreurs, aide à repérer des fautes qu’on ne voit pas soi-même.","Écrivez cinq phrases sur votre week-end, puis échangez-les avec votre partenaire. Combien de marques du pluriel manquaient ?"]]}],"vocab":[["le nom collectif","nom qui désigne un groupe (foule, équipe)"],["l’accord sylleptique","accord selon le sens, et non selon la forme"],["le nom composé","nom formé de plusieurs mots"],["l’emprunt","mot pris à une autre langue"],["les rectifications de 1990","réforme de l’orthographe qui simplifie certains pluriels"],["le pluriel de sens","pluriel qui change le sens du mot"],["le nom propre","nom d’une personne, d’une famille ou d’un lieu"],["le sigle","mot formé d’initiales (CD, PDG)"],["la liaison fautive","liaison qui n’existe pas dans la norme"],["la variante","autre forme acceptée"],["le registre","niveau de langue"],["la faute","forme contraire à la norme"]],"toolkit":[["Justifier","Je choisirais … parce que le contexte …"],["Opposer","À l’oral …, alors qu’à l’écrit …"],["Nuancer","C’est acceptable à l’oral, mais pas dans un texte formel."],["Corriger avec tact","On pourrait aussi dire …"]]},"C1":{"warm":"« Des après-midi » ou « des après-midis » ? Donnez votre première réponse, puis le meilleur contre-argument.","stations":[{"title":"Norme et usage","subtitle":"Qui décide de ce qui est correct ?","main":"Qui décide qu’un pluriel est correct : l’Académie, les dictionnaires ou les locuteurs ?","questions":["Comment les dictionnaires traitent-ils des doublets comme « après-midi / après-midis » ?","Pourquoi les rectifications de 1990 sont-elles encore peu appliquées ?","Les élèves doivent-ils suivre la norme ou l’usage ?"],"challenge":"Comparez ce que disent deux ouvrages de référence sur trois pluriels hésitants.","stretch":"Analysez l’idée selon laquelle « des après-midi » serait plus correct que « des après-midis ».","support":["La norme recommande …, alors que beaucoup de locuteurs …","Au pluriel, le sens passe de … à …","Dans un texte formel, il vaut mieux …"],"explanations":[["Les dictionnaires décrivent l’usage et signalent souvent plusieurs formes. Pour « après-midi », ils admettent généralement « des après-midi » (forme traditionnelle) et « des après-midis » (rectifications de 1990).","Cherchez « après-midi » dans deux dictionnaires. Quelle forme est donnée en premier ? Y a-t-il une remarque sur l’usage ?"],["Les rectifications de 1990 sont recommandées mais non obligatoires. Beaucoup d’adultes ont appris l’orthographe traditionnelle et continuent de l’employer ; les éditeurs et les médias les appliquent inégalement.","Pourquoi une réforme facultative a-t-elle du mal à s’imposer ? Donnez deux raisons."],["Les élèves ont besoin de formes comprises et acceptées. En pratique, les deux orthographes sont correctes ; l’important est d’être cohérent dans un même texte.","Écrivez une phrase avec trois noms composés en appliquant d’abord l’orthographe traditionnelle, puis les rectifications."]]},{"title":"Un pluriel souvent muet","subtitle":"L’oral et l’écrit","main":"Que révèle le décalage entre le pluriel écrit et le pluriel oral en français ?","questions":["Pourquoi l’article est-il souvent la seule marque audible du pluriel ?","Quel rôle jouent la liaison et l’accord du verbe à l’oral ?","Pourquoi l’orthographe garde-t-elle des marques qu’on n’entend pas ?"],"challenge":"Transcrivez une phrase à l’oral et comptez les marques du pluriel audibles et écrites.","stretch":"Débattez : l’orthographe du pluriel aide-t-elle la lecture ou complique-t-elle l’écriture ?","support":["La norme recommande …, alors que beaucoup de locuteurs …","Au pluriel, le sens passe de … à …","Dans un texte formel, il vaut mieux …"],"explanations":[["À l’oral, la plupart des noms ne changent pas au pluriel : « livre » et « livres » se prononcent de la même façon. Le pluriel s’entend surtout grâce au déterminant (« le » / « les »).","Prononcez « la voiture rouge » et « les voitures rouges ». Combien de marques du pluriel entendez-vous ? Combien en voyez-vous ?"],["La liaison (« les‿amis ») et certaines formes verbales (« il finit / ils finissent ») rendent le pluriel audible. Dans « ils mangent », en revanche, le verbe ne se distingue pas de « il mange ».","Trouvez trois verbes dont le pluriel s’entend et trois dont il ne s’entend pas."],["L’orthographe française conserve des marques historiques et grammaticales : elles aident le lecteur à identifier les relations dans la phrase, mais rendent l’écriture plus difficile pour les élèves.","Débattez : faudrait-il supprimer les marques muettes du pluriel ? Que perdrait le lecteur ?"]]},{"title":"Masculin générique","subtitle":"Pluriel et genre","main":"Que révèle le masculin pluriel générique sur le lien entre grammaire et société ?","questions":["Pourquoi « les étudiants » peut-il inclure des étudiantes ?","Quelles alternatives existent : doublets, noms épicènes, point médian ?","Pourquoi l’Académie française s’oppose-t-elle à l’écriture inclusive ?"],"challenge":"Réécrivez un court texte pour qu’il inclue tout le monde sans alourdir chaque phrase.","stretch":"Évaluez les arguments pour et contre l’écriture inclusive dans les textes officiels.","support":["La norme recommande …, alors que beaucoup de locuteurs …","Au pluriel, le sens passe de … à …","Dans un texte formel, il vaut mieux …"],"explanations":[["En français, le masculin pluriel est traditionnellement employé pour les groupes mixtes : « les étudiants » peut désigner des étudiants et des étudiantes. On parle de masculin générique.","Lisez « Les professeurs se sont réunis hier ». Imaginez-vous un groupe d’hommes ou un groupe mixte ? Pourquoi ?"],["Plusieurs procédés existent : les doublets (« les étudiantes et les étudiants »), les noms épicènes ou collectifs (« le corps enseignant », « les élèves ») et le point médian (« les étudiant·e·s »).","Réécrivez « Les candidats doivent présenter leurs papiers » avec deux procédés différents."],["L’Académie française s’est opposée en 2017 à l’écriture inclusive, notamment au point médian, jugé difficile à lire et à prononcer. D’autres y voient un moyen de rendre visibles toutes les personnes.","Formulez un argument linguistique et un argument social sur le point médian. Lequel vous semble le plus convaincant ?"]]},{"title":"Comptable ou massif","subtitle":"Un nom, deux emplois","main":"Comment un même nom peut-il être comptable et non comptable ?","questions":["Quelle différence y a-t-il entre « du café » et « deux cafés » ?","Pourquoi « les vins » ou « les fromages » désignent-ils souvent des sortes ?","Comment le contexte décide-t-il ?"],"challenge":"Écrivez des paires de phrases avec un emploi comptable et un emploi massif pour cinq noms.","stretch":"Expliquez la différence entre « du papier » et « des papiers ».","support":["La norme recommande …, alors que beaucoup de locuteurs …","Au pluriel, le sens passe de … à …","Dans un texte formel, il vaut mieux …"],"explanations":[["Beaucoup de noms sont massifs quand ils désignent une matière ou une idée générale (« du café », « de l’expérience ») et comptables quand ils désignent une portion, une sorte ou un fait précis (« deux cafés », « des expériences intéressantes »).","Faites deux phrases avec « café », « expérience » et « temps » : une comptable, une massive."],["Quand un nom massif est employé au pluriel, il désigne souvent des sortes : « les vins de Bourgogne », « les fromages à pâte molle ». On parle de pluriel de variété.","Décrivez un stand de marché fictif avec trois noms massifs au pluriel qui désignent des sortes."],["Le contexte (articles partitifs, quantificateurs, situation) montre si le locuteur compte ou non : « On a mangé du poulet » / « Il y a des poulets dans la cour ».","« Du poisson » ou « des poissons » : lequel convient pour un repas et lequel pour un aquarium ? Expliquez."]]},{"title":"Pluriels abstraits","subtitle":"Libertés, droits, valeurs","main":"Qu’est-ce qui change quand un nom abstrait est employé au pluriel ?","questions":["Quelle différence y a-t-il entre « la liberté » et « les libertés » ?","Pourquoi les discours politiques emploient-ils tant « les droits » et « les valeurs » ?","Tous les noms abstraits peuvent-ils se mettre au pluriel ?"],"challenge":"Analysez les pluriels abstraits d’un court discours politique fictif.","stretch":"Débattez : les pluriels abstraits rendent-ils un texte plus précis ou plus vague ?","support":["La norme recommande …, alors que beaucoup de locuteurs …","Au pluriel, le sens passe de … à …","Dans un texte formel, il vaut mieux …"],"explanations":[["« La liberté » est une idée générale ; « les libertés » sont des droits précis, comme la liberté d’expression ou de réunion. Le pluriel rend l’idée concrète et dénombrable.","Citez trois « libertés » que pourrait garantir le règlement d’un lycée fictif. Pourquoi le pluriel convient-il mieux ?"],["Les textes politiques et juridiques emploient souvent des pluriels abstraits (« les droits », « les valeurs », « les responsabilités ») pour suggérer un ensemble défini ou faire appel à des principes partagés.","Lisez « nos valeurs communes ». Quelles valeurs l’orateur pourrait-il désigner ? Le dit-il vraiment ?"],["Tous les noms abstraits n’acceptent pas facilement le pluriel : « des bontés » ou « des beautés » changent de sens (actes de bonté, belles choses), « des courages » est très rare.","Testez cinq noms abstraits au pluriel. Lesquels semblent naturels et quel sens prennent-ils ?"]]},{"title":"Registre et politesse","subtitle":"Vous, nous et l’accord","main":"Comment le pluriel grammatical sert-il à exprimer la politesse ou la distance ?","questions":["Pourquoi dit-on « Madame, vous êtes satisfaite » avec un adjectif au singulier ?","Pourquoi un auteur écrit-il « nous pensons » alors qu’il est seul ?","Quand le « on » remplace-t-il le « nous » ?"],"challenge":"Réécrivez un court paragraphe familier dans un style académique en faisant attention au nombre.","stretch":"Comparez « nous » et « on » dans deux textes et expliquez l’effet produit.","support":["La norme recommande …, alors que beaucoup de locuteurs …","Au pluriel, le sens passe de … à …","Dans un texte formel, il vaut mieux …"],"explanations":[["Avec le « vous » de politesse, le verbe est au pluriel mais l’adjectif et le participe s’accordent avec la personne réelle : « Madame, vous êtes satisfaite ? », « Monsieur, vous êtes arrivé ».","Complétez : « Madame Martin, vous êtes … (prêt) ? » et « Monsieur, vous êtes … (venu) seul ? »."],["Le « nous » de modestie est employé par un auteur seul pour paraître moins personnel. Dans ce cas aussi, l’adjectif reste au singulier : « Nous sommes convaincu que… » (accord traditionnel).","Transformez « Je pense que les résultats sont clairs » en style académique. Qu’est-ce qui change dans le ton ?"],["Dans la langue courante, « on » remplace très souvent « nous » : « On va au cinéma ». Le verbe est au singulier, mais l’adjectif peut s’accorder au pluriel : « On est contents ».","Comparez « Nous sommes partis tôt » et « On est partis tôt ». Dans quel registre emploieriez-vous chaque phrase ?"]]},{"title":"Le pluriel pour convaincre","subtitle":"Nous inclusif et nous de majesté","main":"Comment le pluriel peut-il être utilisé à des fins rhétoriques ou sociales ?","questions":["Qu’est-ce que le « nous » de majesté ?","Pourquoi un médecin dit-il parfois « Comment allons-nous aujourd’hui ? » ?","Quel effet produit le « nous » dans un discours politique ?"],"challenge":"Réécrivez un message court en passant du « je » au « nous » et commentez l’effet.","stretch":"Analysez quand un « nous » inclusif peut sembler manipulateur.","support":["La norme recommande …, alors que beaucoup de locuteurs …","Au pluriel, le sens passe de … à …","Dans un texte formel, il vaut mieux …"],"explanations":[["Le « nous » de majesté est employé par un souverain ou une autorité pour parler de soi (« Nous, Louis, roi de France… »). On le trouve aujourd’hui surtout dans des textes historiques ou solennels.","Réécrivez « Je déclare la séance ouverte » à la manière d’une autorité ancienne. Quel effet obtenez-vous ?"],["Médecins, infirmières ou enseignants disent parfois « Comment allons-nous aujourd’hui ? » au lieu de « Comment allez-vous ? ». Ce « nous » peut paraître chaleureux, mais aussi infantilisant.","Comment un patient fictif pourrait-il réagir à « Nous avons bien pris nos médicaments ? » Proposez une formulation plus respectueuse."],["Dans un discours politique, « nous » crée une communauté entre l’orateur et le public, mais peut aussi brouiller les responsabilités : qui est exactement « nous » ?","Analysez la phrase « Nous devons faire des sacrifices ». Qui les fera probablement, et qui parle ?"]]},{"title":"Français et tchèque","subtitle":"Traduire le nombre","main":"Où le français et le tchèque traitent-ils le nombre différemment ?","questions":["Quels noms sont au pluriel en tchèque et au singulier en français, comme « dveře – la porte » ?","Quels noms sont au pluriel dans les deux langues, comme « prázdniny – les vacances » ?","Comment les noms changent-ils après les nombres en tchèque et en français ?"],"challenge":"Traduisez cinq phrases courtes et marquez chaque changement de nombre.","stretch":"Expliquez une différence à un francophone qui apprend le tchèque.","support":["La norme recommande …, alors que beaucoup de locuteurs …","Au pluriel, le sens passe de … à …","Dans un texte formel, il vaut mieux …"],"explanations":[["Certains noms tchèques n’existent qu’au pluriel mais désignent un seul objet (« dveře », « noviny », « housle »). Leurs équivalents français sont souvent au singulier : la porte, le journal, le violon.","Traduisez : « Ty dveře jsou otevřené » et « Noviny leží na stole ». Quelle forme verbale faut-il en français ?"],["Certains mots sont au pluriel dans les deux langues : « prázdniny – les vacances », « lidé – les gens », « nůžky – les ciseaux », « brýle – les lunettes ». Les accords se ressemblent alors.","Trouvez deux autres mots au pluriel dans les deux langues et faites une phrase avec chacun en français."],["Le tchèque change la forme du nom après les nombres : 1 kniha, 2–4 knihy, 5 et plus knih. Le français emploie la même forme plurielle après tous les nombres supérieurs à un.","Expliquez à un francophone pourquoi on dit en tchèque « dvě knihy », mais « pět knih ». Trouvez une règle simple."]]}],"vocab":[["la norme","ce qu’une communauté considère comme correct"],["l’usage","la manière dont on parle et écrit réellement"],["le doublet","deux formes admises d’un même mot"],["la marque du pluriel","signe qui indique le pluriel (-s, -x, article)"],["le masculin générique","masculin qui inclut hommes et femmes"],["l’écriture inclusive","procédés pour rendre visibles tous les genres"],["le nom massif","nom qui ne se compte pas normalement"],["le nous de modestie","« nous » employé par un seul auteur"],["le vous de politesse","« vous » adressé à une seule personne"],["le registre","niveau de langue"],["l’Académie française","institution chargée de la norme du français"],["le nombre grammatical","catégorie du singulier et du pluriel"]],"toolkit":[["Distinguer","Il faut distinguer la norme de l’usage réel."],["Citer une source","Selon l’Académie française, …"],["Analyser l’effet","Le pluriel donne l’impression que …"],["Concéder","Certes …, mais …"]]},"C2":{"warm":"Testez l’affirmation : « Le pluriel français est simple : on ajoute un -s. » Trouvez le contre-exemple le plus fort.","stations":[{"title":"Règles ou mémoire ?","subtitle":"Comment on apprend le pluriel","main":"Stocke-t-on les pluriels en mémoire ou les forme-t-on par des règles ?","questions":["Pourquoi les jeunes enfants disent-ils parfois « des chevals » ?","Que montre le fait que l’on forme sans hésiter le pluriel de mots inventés ?","Qu’est-ce que cela implique pour l’apprentissage d’une langue étrangère ?"],"challenge":"Inventez trois noms nouveaux et demandez leur pluriel à votre partenaire.","stretch":"Évaluez s’il vaut mieux apprendre des listes ou pratiquer des règles.","support":["Cette règle fonctionne pour …, mais elle échoue quand …","Les données montrent que …","Une description plus précise serait …"],"explanations":[["Les jeunes enfants produisent parfois « des chevals » ou « des œils », même s’ils ont déjà entendu les formes correctes. Ils appliquent la règle générale à des mots irréguliers : c’est la surgénéralisation.","Demandez à votre partenaire pourquoi un enfant dirait « des journals ». Que sait déjà l’enfant du pluriel français ?"],["Si l’on présente un mot inventé (« un brigal », « un trapeau »), les locuteurs forment spontanément un pluriel : « des brigals » ou « des brigaux », « des trapeaux ». Cela montre qu’ils utilisent des modèles, pas seulement des formes apprises par cœur.","Inventez deux mots, l’un en -al et l’autre en -eau, et regardez quel pluriel votre partenaire choisit. Hésite-t-il ?"],["Beaucoup de chercheurs pensent que les pluriels réguliers sont produits par règle et que les irréguliers sont stockés en mémoire. Pour apprendre une langue, cela invite à pratiquer les règles et à mémoriser les exceptions fréquentes.","Quels pluriels avez-vous appris comme mots entiers, et lequel avez-vous déjà « inventé » à partir d’une règle ?"]]},{"title":"L’évolution de la langue","subtitle":"De « chevals » à « chevaux »","main":"Pourquoi le pluriel français présente-t-il autant d’irrégularités ?","questions":["D’où vient le pluriel « chevaux » ?","Pourquoi le -x final est-il en partie un héritage des copistes du Moyen Âge ?","Quels pluriels pourraient évoluer à l’avenir ?"],"challenge":"Prédisez deux pluriels qui pourraient changer dans les cinquante prochaines années et justifiez votre prédiction.","stretch":"Testez l’idée que les mots fréquents résistent mieux à la régularisation.","support":["Cette règle fonctionne pour …, mais elle échoue quand …","Les données montrent que …","Une description plus précise serait …"],"explanations":[["En ancien français, « cheval » faisait « chevals ». Devant -s, le l s’est vocalisé en u (« chevaus »), d’où la famille -al / -aux. C’est un changement phonétique devenu une règle morphologique.","Comparez « cheval – chevaux » et « festival – festivals ». Pourquoi le second, emprunté plus tard, n’a-t-il pas suivi la même évolution ?"],["Les copistes médiévaux abrégeaient souvent la finale -us par un signe ressemblant à un x. Plus tard, on a rétabli le u tout en gardant le x : « chevaux ». L’orthographe a ainsi figé une habitude graphique.","Pourquoi une simple habitude d’écriture peut-elle survivre pendant des siècles ? Pensez au rôle de l’école et de l’imprimerie."],["Les mots fréquents résistent mieux à la régularisation, car on les entend et les emploie souvent. Les mots rares ou récents adoptent plus facilement le pluriel régulier en -s.","Choisissez un mot en -al ou -ail que vous employez rarement. Pensez-vous que son pluriel changera ? Pourquoi ?"]]},{"title":"Corpus et grammaires","subtitle":"Des données pour les règles","main":"Que peuvent révéler de grands corpus de textes sur l’usage du pluriel ?","questions":["Comment un corpus pourrait-il montrer si « des après-midis » est plus fréquent que « des après-midi » ?","Quelles sont les limites de la fréquence comme preuve ?","Les grammaires doivent-elles suivre les corpus ?"],"challenge":"Concevez une petite enquête sur un pluriel hésitant.","stretch":"Débattez : la forme la plus fréquente est-elle automatiquement la bonne ?","support":["Cette règle fonctionne pour …, mais elle échoue quand …","Les données montrent que …","Une description plus précise serait …"],"explanations":[["Un corpus est un grand ensemble de textes réels. En cherchant « après-midis » et « après-midi » au pluriel dans différents types de textes, on peut observer quelle forme domine selon le contexte.","Planifiez une recherche : quels types de textes (presse, littérature, forums) compareriez-vous et que vous attendez-vous à trouver ?"],["La fréquence montre ce qui est courant, pas forcément ce qui est approprié dans tous les contextes. Les résultats dépendent aussi des textes inclus dans le corpus.","Une forme est fréquente sur Internet mais rare dans l’édition. Est-elle correcte ? Que vous faudrait-il savoir de plus ?"],["Les grammaires modernes s’appuient sur des corpus, mais continuent de faire des recommandations. Décrire et prescrire sont deux tâches différentes.","Trouvez une remarque d’usage dans un dictionnaire. Décrit-elle l’usage, recommande-t-elle une forme, ou les deux ?"]]},{"title":"Faute et jugement","subtitle":"Erreur ou variante ?","main":"Pourquoi certaines « fautes » de pluriel provoquent-elles des réactions si fortes ?","questions":["Qui est jugé quand il écrit « des chevals » ou fait une liaison fautive ?","Quelle différence y a-t-il entre une faute et une variante ?","Comment les enseignants devraient-ils réagir aux pluriels non standard ?"],"challenge":"Jouez un débat entre un correcteur très strict et une linguiste.","stretch":"Formulez un principe juste pour corriger les erreurs de pluriel.","support":["Cette règle fonctionne pour …, mais elle échoue quand …","Les données montrent que …","Une description plus précise serait …"],"explanations":[["Des formes comme « des chevals » ou une liaison fautive (« quatre-z-enfants ») sont souvent perçues comme des signes de niveau d’instruction ou d’origine sociale. La réaction en dit autant sur les attitudes sociales que sur la grammaire.","Imaginez un entretien d’embauche où le candidat dit « vingt-z-euros ». Comment réagirait le recruteur ? Cette réaction est-elle juste ?"],["Une faute contredit les règles d’une variété et n’est pas employée systématiquement par ses locuteurs ; une variante est employée régulièrement par un groupe et peut être acceptée dans certains contextes. La frontière peut évoluer.","« On est contents » : faute ou variante ? Sur quelles données vous appuieriez-vous pour décider ?"],["Les enseignants peuvent distinguer les erreurs qui gênent la compréhension des formes simplement non standard, et expliquer où chaque forme convient au lieu de seulement la souligner en rouge.","Rédigez un court commentaire pour un élève fictif qui a écrit « des journals » : corrigez la forme et expliquez pourquoi sans le décourager."]]},{"title":"Enseigner le pluriel","subtitle":"Clair, mais pas simpliste","main":"Comment enseigner le pluriel clairement sans cacher sa complexité ?","questions":["Quand la règle « on ajoute un -s » est-elle utile, et quand trompe-t-elle ?","Dans quel ordre présenteriez-vous les exceptions ?","Comment les élèves peuvent-ils découvrir eux-mêmes les règles ?"],"challenge":"Concevez une mini-leçon de dix minutes sur le pluriel pour des élèves de niveau A2.","stretch":"Repérez une simplification dans votre leçon et améliorez-la.","support":["Cette règle fonctionne pour …, mais elle échoue quand …","Les données montrent que …","Une description plus précise serait …"],"explanations":[["La règle « on ajoute un -s » couvre la majorité des noms et permet de commencer à écrire. Elle trompe avec les noms en -eau, -al, -ail, -ou, les noms invariables et les emprunts.","Listez cinq mots pour lesquels « on ajoute un -s » donne un résultat faux. Quel groupe enseigneriez-vous en premier ?"],["Un ordre fréquent : -s, puis -x après -eau/-eu, -al → -aux, les invariables en -s/-x/-z, les sept noms en -ou, -ail, puis les cas particuliers (œil, ciel) et les composés.","Êtes-vous d’accord avec cet ordre ? Modifiez une étape et justifiez votre choix."],["Les élèves peuvent découvrir les règles en classant des exemples, en comparant l’oral et l’écrit ou en cherchant des régularités dans un texte. La découverte mène souvent à une meilleure compréhension.","Donnez dix paires singulier–pluriel à un partenaire et demandez-lui de formuler la règle lui-même. S’en est-il approché ?"]]},{"title":"Le nombre dans les langues","subtitle":"« Un » est-il toujours singulier ?","main":"En quoi les langues diffèrent-elles dans l’expression du nombre ?","questions":["Pourquoi le tchèque utilise-t-il des formes différentes après 2–4 et après 5 ?","Toutes les langues marquent-elles le pluriel sur le nom ?","Que montre le duel de langues comme le slovène ?"],"challenge":"Comparez « un livre, deux livres, cinq livres » en français, en tchèque et dans une autre langue.","stretch":"Débattez : le pluriel français est-il simple ou simplement différent ?","support":["Cette règle fonctionne pour …, mais elle échoue quand …","Les données montrent que …","Une description plus précise serait …"],"explanations":[["Le tchèque emploie trois formes après les nombres : 1 kniha, 2–4 knihy, 5 et plus knih. Le français n’a qu’une forme plurielle pour tous les nombres supérieurs à un.","Comptez de un à six en tchèque avec « pes », puis en français avec « chien ». Quel système est le plus complexe ?"],["Toutes les langues ne marquent pas le pluriel sur le nom. En chinois ou en japonais, par exemple, le nom reste souvent identique ; la quantité est indiquée par un nombre ou par le contexte.","Comment comprendriez-vous « j’ai acheté livre » si le français n’avait pas de pluriel ? Quels mots vous indiqueraient la quantité ?"],["Certaines langues, comme le slovène, ont un duel : une forme spéciale pour deux. Le vieux tchèque le connaissait aussi, et il en reste des traces dans « oči », « uši » ou « ruce ».","Pourquoi une langue aurait-elle une forme spéciale pour deux ? Pensez aux choses qui vont par paires."]]},{"title":"Grammaire et identité","subtitle":"Quand le nombre devient politique","main":"Le pluriel peut-il devenir un enjeu social ou politique ?","questions":["Pourquoi le masculin pluriel générique est-il devenu un sujet de débat public ?","Les institutions doivent-elles imposer un usage ?","Comment d’autres langues abordent-elles des questions semblables ?"],"challenge":"Rédigez un court guide de langage inclusif pour le journal d’un lycée fictif.","stretch":"Testez votre guide sur un cas difficile.","support":["Cette règle fonctionne pour …, mais elle échoue quand …","Les données montrent que …","Une description plus précise serait …"],"explanations":[["Le masculin pluriel générique est devenu un sujet public parce que beaucoup le relient à la visibilité des femmes et des personnes non binaires. Le débat porte autant sur l’identité que sur la grammaire.","Trouvez un argument grammatical et un argument social dans ce débat. Lequel vous paraît le plus convaincant ?"],["En France, l’Académie française et plusieurs textes officiels se sont prononcés contre certaines formes d’écriture inclusive, notamment dans les documents administratifs et à l’école. Les institutions peuvent recommander ou interdire dans leurs textes, mais pas contrôler l’usage privé.","Le journal d’un lycée doit-il suivre ces recommandations ? Qui devrait décider de son style ?"],["D’autres langues se posent des questions semblables : l’anglais avec le « they » singulier, l’allemand avec l’astérisque (Lehrer*innen), l’espagnol avec « -e » ou « -x ». Les solutions diffèrent parce que les grammaires diffèrent.","Comparez une solution française avec celle d’une autre langue que vous connaissez. Laquelle est la plus facile à employer à l’oral ?"]]},{"title":"Les limites des règles","subtitle":"Cas limites","main":"Où les règles du pluriel français atteignent-elles leurs limites ?","questions":["Pourquoi « amour », « délice » et « orgue » peuvent-ils devenir féminins au pluriel ?","Pourquoi dit-on « les vieilles gens » mais « les gens sont vieux » ?","Que montrent ces cas sur la relation entre forme et sens ?"],"challenge":"Rassemblez cinq cas limites et proposez une règle qui les explique.","stretch":"Défendez ou rejetez l’idée que les règles ne décrivent que les cas typiques.","support":["Cette règle fonctionne pour …, mais elle échoue quand …","Les données montrent que …","Une description plus précise serait …"],"explanations":[["« Amour », « délice » et « orgue » sont masculins au singulier, mais peuvent être féminins au pluriel dans la langue soutenue : « de grandes orgues », « des amours passionnées », « ce sont de pures délices ».","Écrivez deux phrases avec « orgue » : une au singulier, une au pluriel solennel. Comment s’accorde l’adjectif ?"],["Avec « gens », un adjectif placé juste avant se met au féminin, mais un adjectif placé après reste au masculin : « les vieilles gens », « les gens sont vieux ». C’est une particularité héritée de l’histoire du mot.","Complétez : « Ce sont de … (bon) gens » et « Ces gens sont très … (gentil) ». Expliquez la différence."],["Ces cas montrent que le pluriel dépend aussi du sens, de l’histoire des mots et du registre, pas seulement d’une règle formelle.","Rassemblez cinq cas difficiles (par exemple « œil », « ciel », « aïeul », « gens », « orgue ») et vérifiez si une seule règle les explique."]]}],"vocab":[["la surgénéralisation","appliquer une règle régulière à une forme irrégulière"],["la productivité","capacité d’un modèle à former des mots nouveaux"],["l’analogie","changement par ressemblance avec d’autres formes"],["la vocalisation","passage d’une consonne à une voyelle (l → u)"],["le corpus","grand ensemble de textes réels"],["le prescriptivisme","dire comment on doit employer la langue"],["le descriptivisme","décrire comment la langue est employée"],["le duel","nombre grammatical pour deux"],["le cas limite","exemple à la frontière d’une règle"],["la preuve","donnée qui appuie une affirmation"],["la simplification","explication plus facile qui omet des détails"],["l’idéologie linguistique","croyances sur ce que la langue doit être"]],"toolkit":[["Tester","Cette affirmation vaut pour …, mais pas pour …"],["Citer des données","Les données du corpus montrent que …"],["Réviser","Une règle plus exacte serait …"],["Contester","Il ne s’ensuit pas que …"]]}},"uiSimple":{"eyebrow":"PARLE · DEMANDE · RÉPONDS · ÉCOUTE","hero":"Personnes, affaires d’école, nourriture, animaux, pièces et rues : nommez beaucoup de choses en français et pratiquez le pluriel dans de courts dialogues.","privacy":"Les erreurs aident à apprendre. Vous pouvez inventer des personnes et des objets.","step4":"Tu veux continuer ? Ouvre l’activité suivante.","questions":"Autres questions","supportTitle":"Besoin d’aide ?","supportDesc":"Des mots pour commencer tes phrases.","supportShow":"Voir l’aide","supportHide":"Masquer l’aide","challengeTitle":"Encore une activité","challengeDesc":"Après la question principale.","challengeShow":"Voir l’activité","challengeHide":"Masquer l’activité","stretchTitle":"Une activité plus difficile","stretchDesc":"Si tu veux aller plus loin.","stretchShow":"Voir l’activité difficile","stretchHide":"Masquer l’activité difficile","progress":"Dis pourquoi. Donne un exemple. Pose une question.","vocabLabel":"MOTS UTILES","vocabDesc":"Utilise ces mots pour parler.","toolkitLabel":"PHRASES UTILES","toolkitDesc":"Parlez ensemble : posez des questions et répondez.","title":"Le pluriel – Noms en français","strap":"Un objet, plusieurs : pratique le pluriel en français"},"uiB1":{"stretchTitle":"Va plus loin","stretchDesc":"Une activité plus difficile si vous parlez déjà avec aisance.","vocabDesc":"Choisissez les mots utiles ; inutile de tous les employer.","progress":"Donnez des raisons et des exemples, et réagissez à ce que dit l’autre.","title":"Le pluriel – Noms en français","strap":"Un objet, plusieurs : pratique le pluriel en français"}}};

 en:'Focus mode: the browser bars can stay visible.',
 es:'Modo concentración: las barras del navegador pueden seguir visibles.',

 fr:'Mode concentration : les barres du navigateur peuvent rester visibles.'

const fsElement=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
function fsSupported(){
 const root=document.documentElement;
 if(!(typeof root.requestFullscreen==='function'||typeof root.webkitRequestFullscreen==='function'))return false;
 if(document.fullscreenEnabled===false&&document.webkitFullscreenEnabled!==true)return false;
 if(document.permissionsPolicy?.allowsFeature?.('fullscreen')===false)return false;
 if(document.featurePolicy?.allowsFeature?.('fullscreen')===false)return false;
 return true;
}

async function toggleFullscreen(){

 if(root.classList.contains('lesson-focus')){exitFocus();return;}
 if(fsElement()){
  try{if(d.exitFullscreen)await d.exitFullscreen();else if(d.webkitExitFullscreen)await d.webkitExitFullscreen();}

 }

 }

const normLookup=s=>String(s).toLocaleLowerCase().replace(/[’‘]/g,"'").replace(/[‐‑‒–—]/g,'-');
const isLookupLetter=c=>/^[\p{L}\p{M}\p{N}]$/u.test(c||'');
function hideLookup(){$('lookupPopover').hidden=true;}
function readWordAt(text,offset){
 const words=[...text.matchAll(/[\p{L}\p{M}]+(?:[’'-][\p{L}\p{M}]+)*/gu)];
 let selected=words.find(m=>m.index<=offset&&offset<m.index+m[0].length);
 if(!selected)selected=words.find(m=>Math.abs(offset-(m.index+m[0].length))<=1);
 return selected?{word:selected[0],index:selected.index}:null;
}
function localPhraseFor(text,index,sourceLang){
 const flat=normLookup(text), phrases=CZ_GLOSSARY.phrases[sourceLang]||{};
 let best=null;
 for(const [phrase,translation] of Object.entries(phrases)){
  const needle=normLookup(phrase);
  let from=0;
  for(let at;(at=flat.indexOf(needle,from))!==-1;){
   const end=at+needle.length;from=at+1;
   if(index<at||index>=end)continue;
   if((at>0&&isLookupLetter(flat[at-1]))||(end<flat.length&&isLookupLetter(flat[end])))continue;
   if(!best||needle.length>best.expression.length)best={expression:text.slice(at,end),translation,kind:'phrase'};
  }
 }
 return best;
}
function sentenceForLookup(text,index){
 const breaks=[...text.matchAll(/[.!?]+(?=\s|$)/g)];
 let start=0,end=text.length;
 for(const br of breaks){const after=br.index+br[0].length;if(after<=index)start=after;else{end=after;break;}}
 return text.slice(start,end).trim().slice(0,500)||text.trim().slice(0,500);
}
function locateWord(evt,block){
 const x=evt.clientX,y=evt.clientY;
 let caret=null;
 if(typeof document.caretRangeFromPoint==='function')caret=document.caretRangeFromPoint(x,y);
 else if(typeof document.caretPositionFromPoint==='function'){
  const pos=document.caretPositionFromPoint(x,y);
  if(pos){caret=document.createRange();caret.setStart(pos.offsetNode,pos.offset);caret.collapse(true);}
 }
 if(!caret){const s=getSelection();if(s?.rangeCount)caret=s.getRangeAt(0).cloneRange();}
 if(!caret||!block.contains(caret.startContainer))return null;
 try{
  const upto=document.createRange();upto.selectNodeContents(block);
  upto.setEnd(caret.startContainer,caret.startOffset);
  return readWordAt(block.textContent,upto.toString().length);
 }catch(_){return null;}
}
function setLookupCard(result,sentence,x,y,source){
 const pop=$('lookupPopover');
 $('lookupExpression').textContent=result.expression;
 $('lookupTranslation').textContent=result.translation;
 $('lookupContext').textContent='Ve větě: '+sentence;
 $('lookupOrigin').textContent=source;
 pop.hidden=false;
 pop.style.left='12px';pop.style.top='12px';
 const rect=pop.getBoundingClientRect(),v=window.visualViewport;
 const w=v?v.width:innerWidth,h=v?v.height:innerHeight;
 const xBase=v?v.offsetLeft:0,yBase=v?v.offsetTop:0;
 const left=Math.max(xBase+8,Math.min(x+12,xBase+w-rect.width-8));
 const top=Math.max(yBase+8,Math.min(y+12,yBase+h-rect.height-8));
 pop.style.left=left+'px';pop.style.top=top+'px';
}
// Offline-only vocabulary support. No external API, no requests, no credentials.
function lookupWordMeaning(word,sourceLang){
 const dict=CZ_GLOSSARY.words[sourceLang]||{};
 const norm=normLookup(word);
 if(Object.prototype.hasOwnProperty.call(dict,norm))return {translation:dict[norm],base:null};
 const candidate=[];
 const add=stem=>{if(stem.length>=3&&!candidate.includes(stem))candidate.push(stem);};
 if(sourceLang==='en'){
  if(norm.endsWith("'s"))add(norm.slice(0,-2));
  if(norm.endsWith('ies'))add(norm.slice(0,-3)+'y');
  if(norm.endsWith('ied'))add(norm.slice(0,-3)+'y');
  if(norm.endsWith('ing')){
   const stem=norm.slice(0,-3);add(stem);add(stem+'e');
   if(stem.length>3&&stem.at(-1)===stem.at(-2))add(stem.slice(0,-1));
  }
  if(norm.endsWith('ed')){const stem=norm.slice(0,-2);add(stem);add(stem+'e');}
  if(norm.endsWith('es')){add(norm.slice(0,-2));add(norm.slice(0,-1));}
  if(norm.endsWith('s'))add(norm.slice(0,-1));
 }else if(sourceLang==='es'){
  if(norm.endsWith('ces'))add(norm.slice(0,-3)+'z');
  if(norm.endsWith('es'))add(norm.slice(0,-2));
  if(norm.endsWith('s'))add(norm.slice(0,-1));
 }else if(sourceLang==='fr'){
  let base=norm.replace(/^(?:qu|[dljnstmc])'(?=.)/,'');
  const addLoose=x=>{if(x&&!candidate.includes(x))candidate.push(x);};
  if(base!==norm)addLoose(base);
  for(let i=0;i<3;i++){const cut=base.replace(/-(?:t-)?(?:je|tu|il|elle|on|nous|vous|ils|elles|le|la|les|lui|leur|en|y|moi|toi|ce)$/,'');if(cut===base)break;base=cut;addLoose(base);}
  if(base.endsWith('s'))add(base.slice(0,-1));
  if(norm.endsWith('s'))add(norm.slice(0,-1));
 }else if(sourceLang==='de'){
  if(norm.endsWith('innen'))add(norm.slice(0,-5));
 }
 for(const stem of candidate){if(Object.prototype.hasOwnProperty.call(dict,stem))return {translation:dict[stem],base:stem};}
 return null;
}
function triggerLookup(evt){
 const element=evt.target instanceof Element?evt.target:null;
 if(element?.closest('.question-expandable > summary'))return;
 if(element?.closest('[lang="cs"]'))return;
 const block=evt.__block||element?.closest(LOOKUP_SELECTOR);if(!block||$('lookupPopover').contains(element))return;
 const text=block.textContent?.trim();if(!text)return;
 const hit=evt.__hit||locateWord(evt,block);if(!hit)return;
 const word=hit.word,sentence=sentenceForLookup(text,hit.index);
 const phrase=localPhraseFor(text,hit.index,lang);
 const meaning=lookupWordMeaning(word,lang);
 if(phrase){
  setLookupCard(phrase,sentence,evt.clientX,evt.clientY,'Překlad celé fráze · rozšířený offline slovník');
 }else if(meaning){
  setLookupCard({expression:word,translation:meaning.translation,kind:'word'},sentence,evt.clientX,evt.clientY,
   meaning.base?'Základní význam odvozený od „'+meaning.base+'“ · offline slovník':'Základní význam · offline slovník; přesný význam může záviset na větě');
 }else{
  setLookupCard({expression:word,translation:'Tento výraz zatím v rozšířeném offline slovníku není.',kind:'word'},sentence,evt.clientX,evt.clientY,
    'Bez připojení · zkus odvodit význam z kontextu nebo se zeptej vyučujícího');
 }
}

// Desktop: preserve native double-click selection; iPads/iPhones: one tap avoids Safari double-tap zoom.
document.querySelector('.app').addEventListener('dblclick',e=>triggerLookup(e));
let tapStart=null;
document.querySelector('.app').addEventListener('pointerdown',e=>{
 tapStart=(e.pointerType==='touch'||e.pointerType==='pen')?{x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId}:null;
});
document.querySelector('.app').addEventListener('pointercancel',()=>{tapStart=null;});
document.querySelector('.app').addEventListener('pointerup',e=>{
 if(!(e.pointerType==='touch'||e.pointerType==='pen')||!tapStart||tapStart.id!==e.pointerId)return;
 const moved=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y),held=performance.now()-tapStart.t;tapStart=null;
 if(moved<=10&&held<=600)triggerLookup(e);
});
function lookupSelection(){
 const sel=getSelection();if(!sel||!sel.rangeCount||sel.isCollapsed)return false;
 const range=sel.getRangeAt(0),node=range.startContainer,el=node.nodeType===1?node:node.parentElement;
 const block=el?.closest(LOOKUP_SELECTOR);if(!block)return false;
 const upto=document.createRange();upto.selectNodeContents(block);upto.setEnd(range.startContainer,range.startOffset);
 const offset=upto.toString().length,text=block.textContent,box=range.getBoundingClientRect();
 const hit=readWordAt(text,offset+Math.max(0,text.slice(offset).search(/[\p{L}\p{M}]/u)));if(!hit)return false;
 triggerLookup({target:el,clientX:box.left,clientY:box.bottom,__hit:hit,__block:block});return true;
}
$('lookupClose').addEventListener('click',hideLookup);
document.addEventListener('pointerdown',e=>{
 if(!$('lookupPopover').hidden&&!$('lookupPopover').contains(e.target)&&!(e.target instanceof Element&&e.target.closest(LOOKUP_SELECTOR)))hideLookup();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('lookupPopover').hidden){hideLookup();e.preventDefault();return;}
 if(e.key==='Enter'&&!e.target.closest?.('input,select,textarea,button,a,#timerEditor')&&lookupSelection())e.preventDefault();
});

 setText('timerHint',ticker!==null?u.timerRunning:duration===0?u.timerInit:seconds===0?u.timerDone:left<duration*1000?u.timerPaused:u.timerReady);
}
let wakeLock=null;
async function holdWake(){try{if('wakeLock' in navigator&&!wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}catch(_){wakeLock=null;}}
function dropWake(){try{wakeLock?.release();}catch(_){}wakeLock=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ticker!==null)holdWake();});
function stopTimer(){if(ticker!==null){left=Math.max(0,endAt-Date.now());clearInterval(ticker);ticker=null;}dropWake();}
function toggleTimer(){if(!$('timerEditor').hidden)return;if(ticker!==null){stopTimer();refreshTimer();return;}if(left<=0)return;endAt=Date.now()+left;ticker=setInterval(refreshTimer,100);holdWake();refreshTimer();}
function openEditor(reset=false){stopTimer();if(reset){duration=0;left=0;}refreshTimer();const secs=Math.ceil(left/1000);$('timerEditor').hidden=false;setText('timeError','');$('timerMinutes').value=duration?String(Math.floor(secs/60)).padStart(2,'0'):'';$('timerSeconds').value=duration?String(secs%60).padStart(2,'0'):'';$('timerMinutes').focus();$('timerMinutes').select();requestAnimationFrame(keepFloatingInView);}
function closeEditor(){$('timerEditor').hidden=true;setText('timeError','');}
function parseTime(mm,ss){const m=mm.trim(),s=ss.trim();if(!/^\d{0,2}$/.test(m)||!/^\d{0,2}$/.test(s)||(!m&&!s))return null;const minutes=Number(m||0),seconds=Number(s||0);if(seconds>59)return null;const total=minutes*60+seconds;return total>=5&&total<=99*60+59?total:null;}
function submitTime(e){e.preventDefault();const seconds=parseTime($('timerMinutes').value,$('timerSeconds').value);if(seconds===null){setText('timeError',ui().timerError);(Number($('timerSeconds').value)>59?$('timerSeconds'):$('timerMinutes')).focus();return;}stopTimer();duration=seconds;left=seconds*1000;closeEditor();refreshTimer();$('clock').focus();showToast(ui().timerSetToast);}
function resetTimer(){closeEditor();stopTimer();left=duration*1000;refreshTimer();}
function showToast(txt){const el=$('toast');el.textContent=txt;el.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.remove('show'),2300);}
$('startLessonBtn').addEventListener('click',()=>goTo(current));
$('languageSelect').addEventListener('change',e=>switchVariant(e.target.value,level));
$('levelSwitch').addEventListener('click',e=>{const button=e.target.closest('button[data-level]');if(button)switchVariant(lang,button.dataset.level);});
$('themeBtn').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';applyTheme();renderHeader();savePrefs();});
$('fullBtn').addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',updateFullscreenButton);document.addEventListener('webkitfullscreenchange',updateFullscreenButton);
$('resetBtn').addEventListener('click',()=>{stopTimer();duration=0;left=0;closeEditor();refreshTimer();$('warmDetails').open=false;current=0;goTo(0,{scroll:false});showToast(ui().lessonResetToast);window.scrollTo({top:0,behavior:'smooth'});});
$('previousBtn').addEventListener('click',()=>goTo(current-1));$('nextBtn').addEventListener('click',()=>goTo(current+1));
for(const name of ['support','challenge','stretch'])$(name+'Btn').addEventListener('click',()=>toggleDetails(name,$(name+'Reveal').hidden));
$('clock').addEventListener('click',()=>{if(mobileTimerQuery.matches&&!$('timerPanel').classList.contains('mobile-expanded'))setFloatingExpanded(true);else openEditor();});
$('timerFloatToggle').addEventListener('click',()=>setFloatingExpanded(!$('timerPanel').classList.contains('mobile-expanded')));
$('timerGrip').addEventListener('pointerdown',e=>{if(!mobileTimerQuery.matches||e.button!==0)return;const r=$('timerPanel').getBoundingClientRect();timerDrag={pointerId:e.pointerId,x:e.clientX,y:e.clientY,left:r.left,top:r.top};$('timerGrip').setPointerCapture(e.pointerId);e.preventDefault();});
$('timerGrip').addEventListener('pointermove',e=>{if(!timerDrag||e.pointerId!==timerDrag.pointerId)return;const p=$('timerPanel');const x=Math.min(Math.max(8,timerDrag.left+e.clientX-timerDrag.x),Math.max(8,innerWidth-p.offsetWidth-8));const y=Math.min(Math.max(8,timerDrag.top+e.clientY-timerDrag.y),Math.max(8,innerHeight-p.offsetHeight-8));p.style.left=x+'px';p.style.top=y+'px';p.style.right='auto';p.style.bottom='auto';floatingTimerDragged=true;});
function endDrag(e){if(timerDrag&&e.pointerId===timerDrag.pointerId){timerDrag=null;keepFloatingInView();}}
$('timerGrip').addEventListener('pointerup',endDrag);$('timerGrip').addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>{if(mobileTimerQuery.matches)requestAnimationFrame(keepFloatingInView);});
window.visualViewport?.addEventListener('resize',()=>{if(mobileTimerQuery.matches)requestAnimationFrame(keepFloatingInView);});
mobileTimerQuery.addEventListener('change',()=>{closeEditor();mountTimer();});
$('timerStart').addEventListener('click',toggleTimer);$('timerReset').addEventListener('click',resetTimer);
$('timerEditor').addEventListener('submit',submitTime);
for(const id of ['timerMinutes','timerSeconds'])$(id).addEventListener('input',()=>{$(id).value=$(id).value.replace(/\D/g,'').slice(0,2);setText('timeError','');});
$('timerMinutes').addEventListener('input',()=>{if($('timerMinutes').value.length===2){$('timerSeconds').focus();$('timerSeconds').select();}});
$('timerMinutes').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){$('timerSeconds').focus();$('timerSeconds').select();e.preventDefault();}});
$('cancelEdit').addEventListener('click',()=>{closeEditor();refreshTimer();$('clock').focus();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('timerEditor').hidden){closeEditor();refreshTimer();$('clock').focus();e.preventDefault();}});
document.addEventListener('keydown',e=>{if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;const t=e.target;if(t&&t.closest&&t.closest('input,select,textarea,[contenteditable],#timerEditor,.question-expandable summary'))return;
 const dir={ArrowRight:1,PageDown:1,ArrowLeft:-1,PageUp:-1}[e.key];if(!dir)return;const n=current+dir;if(n<0||n>7)return;e.preventDefault();goTo(n);});
window.addEventListener('pagehide',stopTimer);
$('sectionNav').addEventListener('scroll',updateNavHint,{passive:true});window.addEventListener('resize',updateNavHint);
const topbar=document.querySelector('.topbar');const syncTopbar=()=>document.documentElement.style.setProperty('--topbar-h',topbar.offsetHeight+'px');
if('ResizeObserver' in window)new ResizeObserver(syncTopbar).observe(topbar);syncTopbar();
loadPrefs();applyTheme();renderAll();
</script>
<script>

/* Keep the movable mobile timer from covering Previous and Next. */
(() => {
 const panel=document.getElementById('timerPanel');
 const footer=document.querySelector('.station-foot');
 if(!panel||!footer||!('IntersectionObserver' in window))return;
 const small=window.matchMedia('(max-width:650px), (max-height:550px) and (pointer:coarse)');
 let inView=false;
 const sync=()=>panel.classList.toggle('avoid-station-nav',small.matches&&inView);
 const observer=new IntersectionObserver(entries=>{inView=entries[0].isIntersecting;sync();},{threshold:0});
 observer.observe(footer);
 if(small.addEventListener)small.addEventListener('change',sync);
 window.addEventListener('resize',sync,{passive:true});
 sync();
})();
</script>

 mit …","Das ist eine Ausnahme, weil …","Auf Tschechisch sagt man …, aber auf Deutsch …"]},{"title":"Genus und Plural","subtitle":"Tendenzen statt fester Regeln","main":"Hilft das Genus dabei, den Plural vorherzusagen?","questions":["Welchen Plural haben die meisten Feminina auf -e?","Was passiert mit Maskulina und Neutra auf -er, -el und -en?","Warum sprechen Grammatiken eher von Tendenzen als von Regeln?"],"challenge":"Testet die Tendenz „Feminina auf -e → -n“ an zehn Wörtern.","stretch":"Findet eine Ausnahme zu einer der Tendenzen und erklärt sie.","support":["Nomen auf … bilden den Plural meistens mit …","Das ist eine Ausnahme, weil …","Auf Tschechisch sagt man …, aber auf Deutsch …"]},{"title":"Der Dativ Plural","subtitle":"Mit den Kindern","main":"Warum bekommen viele Nomen im Dativ Plural ein -n?","questions":["Warum heißt es „mit den Kindern“, aber „mit den Autos“?","Welche Nomen bekommen im Dativ Plural kein zusätzliches -n?","Hört man diesen Fehler im Alltag oft?"],"challenge":"Beschreibt ein Bild mit fünf Präpositionen und Dativ Plural.","stretch":"Formuliert die Regel für den Dativ Plural so kurz wie möglich.","support":["Nomen auf … bilden den Plural meistens mit …","Das ist eine Ausnahme, weil …","Auf Tschechisch sagt man …, aber auf Deutsch …"]},{"title":"Nur Singular oder nur Plural","subtitle":"Obst, Milch – Eltern, Ferien","main":"Welche Nomen gibt es nur im Singular oder nur im Plural?","questions":["Warum sagt man „das Obst“, aber nicht „die Obste“?","Warum gibt es „die Eltern“ und „die Ferien“ nur im Plural?","Gibt es ähnliche Wörter im Tschechischen?"],"challenge":"Erzählt von erfundenen Ferien mit fünf Nomen, die nur im Plural vorkommen.","stretch":"Vergleicht Deutsch und Tschechisch: Welche Wörter sind in beiden Sprachen Pluralwörter?","support":["Nomen auf … bilden den Plural meistens mit …","Das ist eine Ausnahme, weil …","Auf Tschechisch sagt man …, aber auf Deutsch …"]},{"title":"Artikel und Adjektive","subtitle":"Die neuen Bücher","main":"Was verändert sich im Satz, wenn ein Nomen im Plural steht?","questions":["Warum ist der Artikel im Plural immer „die“?","Wie ändern sich Adjektive: „die neuen Bücher“, „neue Bücher“?","Woran erkennt man den Plural, wenn das Nomen gleich bleibt?"],"challenge":"Beschreibt ein Bild mit zehn Nomen und prüft alle Endungen.","stretch":"Findet einen Satz, in dem nur der Artikel den Plural zeigt, z. B. „der Lehrer – die Lehrer“.","support":["Nomen auf … bilden den Plural meistens mit …","Das ist eine Ausnahme, weil …","Auf Tschechisch sagt man …, aber auf Deutsch …"]},{"title":"Fremdwörter","subtitle":"Museum, Thema, Pizza","main":"Wie bilden Fremdwörter den Plural?","questions":["Warum heißt es „Museen“ und „Themen“?","Sagt man „Pizzas“ oder „Pizzen“?","Warum bekommen viele Fremdwörter ein -s?"],"challenge":"Schreibt fünf Fremdwörter auf und prüft ihren Plural im Wörterbuch.","stretch":"Entscheidet, welche Form von „Pizza“ euch natürlicher vorkommt, und begründet es.","support":["Nomen auf … bilden den Plural meistens mit …","Das ist eine Ausnahme, weil …","Auf Tschechisch sagt man …, aber auf Deutsch …"]},{"title":"Fehler verbessern","subtitle":"Einem Mitschüler helfen","main":"Welche Pluralfehler kommen am häufigsten vor?","questions":["Welche Fehler habt ihr selbst schon gemacht?","Warum sagt man nicht „die Kinders“?","Wie kann man sich schwierige Pluralformen am besten merken?"],"challenge":"Verbessert zu zweit fünf falsche Sätze und begründet jede Korrektur.","stretch":"Schreibt drei Sätze mit Fehlern für ein anderes Paar.","support":["Nomen auf … bilden den Plural meistens mit …","Das ist eine Ausnahme, weil …","Auf Tschechisch sagt man …, aber auf Deutsch …"]}],"vocab":[["-e","koncovka -e (Tisch → Tische)"],["-er","koncovka -er (Kind → Kinder)"],["-(e)n","koncovka -(e)n (Frau → Frauen)"],["-s","koncovka -s (Auto → Autos)"],["ohne Endung","bez koncovky (Lehrer → Lehrer)"],["der Umlaut","přehláska (Buch → Bücher)"],["der Dativ Plural","3. pád mn. č. (mit den Kindern)"],["das Fremdwort","přejaté slovo"],["das Pluraletantum","pomnožné jméno (die Eltern)"],["das Singularetantum","jméno jen v j. č. (das Obst)"],["die Tendenz","tendence, obvyklé pravidlo"],["die Ausnahme","výjimka"]],"toolkit":[["Regel erklären","Feminina auf -e bilden den Plural meistens mit -n."],["Ausnahme nennen","Aber „die Mutter“ wird zu „die Mütter“."],["Nachprüfen","Heißt es „mit den Freunden“ oder „mit den Freunde“?"],["Korrigieren","Ich glaube, es muss … heißen, weil …"]]},"B2":{"warm":"Entscheidet schnell: „Eine Menge Leute kam“ oder „kamen“? „Zwei Kilo“ oder „zwei Kilos“? Begründet eure Wahl.","stations":[{"title":"Kollektiva","subtitle":"Eine Menge Leute kam oder kamen?","main":"Wie richtet sich das Verb nach Sammelbezeichnungen?","questions":["Warum sind „Eine Menge Leute kam“ und „kamen“ beide möglich?","Heißt es „Die Hälfte der Schüler ist krank“ oder „sind krank“?","Warum sagt man „Das Team hat gewonnen“ im Singular?"],"challenge":"Schreibt zwei kurze Meldungen über eine erfundene Mannschaft und prüft alle Verbformen.","stretch":"Entscheidet, welche Kongruenz euch bei „eine Menge“ natürlicher vorkommt, und begründet es.","support":["Beide Formen sind möglich, aber …","In diesem Kontext würde ich … wählen, weil …","Ein typischer Fehler ist … – richtig ist …"],"explanations":[["Ein Kollektivum bezeichnet eine Gruppe: Team, Menge, Hälfte. Steht ein Kollektivum mit einem Plural („eine Menge Leute“, „die Hälfte der Schüler“), kann sich das Verb nach der Form (Singular) oder nach der Bedeutung (Plural) richten.","Vergleicht „Eine Menge Leute kam zum Konzert“ und „Eine Menge Leute kamen zum Konzert“. Welcher Satz betont die Gruppe, welcher die einzelnen Menschen?"],["Bei „die Hälfte der Schüler“ ist grammatisch „die Hälfte“ das Subjekt, deshalb gilt der Singular als standardsprachlich. Der Plural („sind krank“) ist in der gesprochenen Sprache verbreitet und wird oft akzeptiert.","Ergänzt: „Die Hälfte der Gäste … (sein) schon gegangen.“ Welche Form würdet ihr in einer Prüfung wählen?"],["Steht ein Kollektivum allein („das Team“, „die Klasse“, „das Publikum“), steht das Verb im Singular: „Das Team hat gewonnen.“ Der Plural gilt hier als Fehler.","Verbessert höflich: „Die Mannschaft haben gut gespielt.“ Wie würdet ihr die Korrektur in einem Satz erklären?"]]},{"title":"Komposita","subtitle":"Haustüren und Fußballspieler","main":"Welcher Teil eines Kompositums bestimmt den Plural?","questions":["Warum heißt es „die Haustüren“ und nicht „die Häusertür“?","Was ist der Plural von „Fußballspieler“ und „Handschuh“?","Ändert sich der Plural, wenn sich das Grundwort ändert?"],"challenge":"Sammelt acht Komposita und bildet ihren Plural.","stretch":"Erklärt, warum das Grundwort auch das Genus des ganzen Wortes bestimmt.","support":["Beide Formen sind möglich, aber …","In diesem Kontext würde ich … wählen, weil …","Ein typischer Fehler ist … – richtig ist …"],"explanations":[["In einem Kompositum bestimmt der letzte Teil, das Grundwort, den Plural: „die Haustür – die Haustüren“, „der Fußballspieler – die Fußballspieler“. Das Bestimmungswort bleibt meist unverändert.","Bildet den Plural von „Schulbuch“, „Handschuh“ und „Bahnhof“. Welcher Teil verändert sich?"],["„Der Handschuh – die Handschuhe“, „der Bahnhof – die Bahnhöfe“: Der Plural folgt immer dem Grundwort, auch wenn das ganze Wort eine neue Bedeutung hat.","Erfindet ein neues Kompositum (z. B. „Mathebuch“) und bildet den Plural. Woran habt ihr euch orientiert?"],["Da das Grundwort auch das Genus bestimmt, hilft es, das Grundwort mit Artikel und Plural zu kennen: „das Haus – die Häuser“, aber „die Haustür – die Haustüren“.","Vergleicht „das Haus“ und „die Haustür“. Warum sind Genus und Plural so verschieden?"]]},{"title":"Fremdwörter und Doppelformen","subtitle":"Konten, Kontos, Kommata","main":"Wie gehen Sprecher mit Fremdwörtern mit zwei Pluralformen um?","questions":["Sagt man „Konten“ oder „Kontos“?","Warum gibt es „Kommas“ und „Kommata“?","Welche Form wirkt in welchem Kontext natürlicher?"],"challenge":"Sucht fünf Fremdwörter mit Doppelformen und vergleicht sie im Wörterbuch.","stretch":"Verteidigt eine Position: Soll man Fremdwörter eindeutschen oder ihren ursprünglichen Plural behalten?","support":["Beide Formen sind möglich, aber …","In diesem Kontext würde ich … wählen, weil …","Ein typischer Fehler ist … – richtig ist …"],"explanations":[["Viele Fremdwörter haben zwei zulässige Pluralformen: „Konten/Kontos“, „Pizzas/Pizzen“, „Kommas/Kommata“. Oft ist die eingedeutschte Form häufiger, die ältere Form wirkt bildungssprachlich.","Schlagt „Konto“ und „Komma“ im Duden nach. Welche Formen werden angegeben?"],["„Kommata“ ist der ursprüngliche griechische Plural, „Kommas“ die eingedeutschte Form. Beide sind korrekt; in Schulbüchern findet man meist „Kommas“.","In welchem Text würdet ihr „Kommata“ schreiben, in welchem „Kommas“? Begründet die Wahl."],["Die Wahl hängt vom Register und von der Gewohnheit ab: Im Alltag wirkt „Pizzas“ oder „Kontos“ natürlich, in Fachtexten eher „Konten“.","Sammelt drei Fremdwörter mit Doppelformen und entscheidet, welche Form ihr in einer Bankmitteilung und welche in einer Chatnachricht verwenden würdet."]]},{"title":"Plural und Bedeutung","subtitle":"Bänke oder Banken?","main":"Wie kann der Plural die Bedeutung eines Nomens verändern?","questions":["Was ist der Unterschied zwischen „Bänke“ und „Banken“?","Wann sagt man „Wörter“ und wann „Worte“?","Was sind „Mütter“ und was sind „Muttern“?"],"challenge":"Schreibt einen kurzen Dialog mit drei solchen Paaren.","stretch":"Erklärt eines der Paare einem jüngeren Lernenden, ohne es zu übersetzen.","support":["Beide Formen sind möglich, aber …","In diesem Kontext würde ich … wählen, weil …","Ein typischer Fehler ist … – richtig ist …"],"explanations":[["Manche Nomen haben zwei Pluralformen mit verschiedenen Bedeutungen: „die Bänke“ sind Sitzmöbel, „die Banken“ Geldinstitute.","Schreibt zwei Sätze: einen mit „Bänke“ und einen mit „Banken“. Wie hilft der Kontext?"],["„Wörter“ sind einzelne Wörter, z. B. in einem Wörterbuch; „Worte“ sind zusammenhängende Äußerungen: „Er fand die richtigen Worte.“","Ergänzt: „Das Wörterbuch enthält 10 000 …“ und „Ihre … haben mich berührt.“ Welche Form passt jeweils?"],["„Die Mütter“ sind Eltern, „die Muttern“ sind Teile einer Schraube. Ähnlich: „die Sträuße“ (Blumen) und „die Strauße“ (Vögel).","Erfindet einen lustigen Satz, in dem beide Bedeutungen von „Mutter“ oder „Strauß“ vorkommen."]]},{"title":"Maße und Mengen","subtitle":"Zwei Kilo, drei Glas","main":"Warum bleiben manche Nomen nach Zahlen im Singular?","questions":["Warum sagt man „zwei Kilo Äpfel“, aber „zwei Tassen Kaffee“?","Heißt es „drei Glas Wasser“ oder „drei Gläser Wasser“?","Wie nennt man Preise und Längen richtig?"],"challenge":"Beschreibt ein erfundenes Rezept oder eine Reise mit fünf Maßangaben.","stretch":"Formuliert eine Regel für Maßangaben und testet sie an fünf Beispielen.","support":["Beide Formen sind möglich, aber …","In diesem Kontext würde ich … wählen, weil …","Ein typischer Fehler ist … – richtig ist …"],"explanations":[["Maskuline und neutrale Maßangaben bleiben nach Zahlen meist im Singular: „zwei Kilo“, „drei Glas Bier“, „fünf Meter“. Feminine Maßangaben stehen im Plural: „zwei Tassen“, „drei Flaschen“.","Ergänzt: „Ich hätte gern drei … (Glas) Saft und zwei … (Flasche) Wasser.“"],["„Drei Glas Wasser“ bezeichnet eine Menge; „drei Gläser“ meint die Gegenstände selbst: „Auf dem Tisch stehen drei Gläser.“","Erklärt den Unterschied zwischen „Ich habe zwei Glas Milch getrunken“ und „Ich habe zwei Gläser zerbrochen“."],["Bei Geld steht die Währung meist im Singular: „zehn Euro“, „fünf Dollar“. „Cent“ kann im Plural „Cent“ oder „Cents“ sein; in Preisangaben ist „Cent“ üblich.","Beschreibt einen erfundenen Einkauf mit drei Preisen und zwei Maßangaben."]]},{"title":"Namen und Abkürzungen","subtitle":"Die Müllers, die LKWs","main":"Wie bilden Eigennamen und Abkürzungen den Plural?","questions":["Warum sagt man umgangssprachlich „die Müllers“?","Wie sagt man das in einem formellen Text?","Schreibt man „die LKW“ oder „die LKWs“?"],"challenge":"Beschreibt eine Straße mit erfundenen Nachbarn und verwendet Familiennamen im Plural.","stretch":"Erklärt, wann Vornamen einen Plural bekommen, z. B. „die beiden Annas“.","support":["Beide Formen sind möglich, aber …","In diesem Kontext würde ich … wählen, weil …","Ein typischer Fehler ist … – richtig ist …"],"explanations":[["Umgangssprachlich bilden Familiennamen den Plural mit -s: „die Müllers“, „die Schmidts“. In formellen Texten schreibt man eher „Familie Müller“.","Schreibt eine Einladung an eine erfundene Familie „Becker“ – einmal locker, einmal formell."],["Endet ein Name auf einen Zischlaut, wird der Plural oft umschrieben: „die Familie Fuchs“ statt „die Fuchses“. Manche Sprecher sagen „Fuchsens“ – das wirkt sehr umgangssprachlich.","Wie würdet ihr über eine Familie „Lutz“ sprechen? Probiert verschiedene Möglichkeiten."],["Abkürzungen bekommen im Plural oft ein -s („die LKWs“, „die CDs“). Der Duden lässt bei Abkürzungen auch Formen ohne -s zu („die LKW“), vor allem wenn der Artikel den Plural schon zeigt.","Schreibt den Plural von „PKW“, „SMS“ und „CD“. Welche Formen findet ihr im Wörterbuch?"]]},{"title":"Gesprochene Sprache","subtitle":"Jungs, Mädels, Kumpels","main":"Welche Pluralformen hört man vor allem in der Alltagssprache?","questions":["Warum sagt man oft „Jungs“ statt „Jungen“?","Sind „Mädels“ und „Kumpels“ Fehler oder umgangssprachliche Formen?","Wann solltet ihr diese Formen vermeiden?"],"challenge":"Sammelt Beispiele aus Serien oder Liedern und ordnet sie: umgangssprachlich oder standardsprachlich?","stretch":"Schreibt eine umgangssprachliche und eine formelle Version derselben Nachricht.","support":["Beide Formen sind möglich, aber …","In diesem Kontext würde ich … wählen, weil …","Ein typischer Fehler ist … – richtig ist …"],"explanations":[["„Jungs“ ist die umgangssprachliche Pluralform von „Junge“; standardsprachlich heißt es „Jungen“. Ähnlich: „Mädels“, „Kumpels“, „Kerls“. Das -s wirkt vertraut und locker.","Wo hört ihr eher „die Jungs“, wo eher „die Jungen“? Nennt je eine typische Situation."],["Diese Formen sind keine zufälligen Fehler, sondern feste Bestandteile der Umgangssprache. Viele Wörterbücher verzeichnen sie mit dem Hinweis „umgangssprachlich“.","Schlagt „Kumpel“ im Wörterbuch nach. Welche Pluralformen werden angegeben?"],["In Prüfungen, Aufsätzen, formellen E-Mails und Referaten solltet ihr die standardsprachlichen Formen verwenden. Die umgangssprachlichen Formen zu kennen, hilft beim Verstehen.","Formuliert diese Nachricht für eine formelle E-Mail um: „Hi, die Jungs aus der 10b kommen später.“"]]},{"title":"Lernstrategien","subtitle":"Schwierige Pluralformen merken","main":"Wie lernt man schwierige Pluralformen am wirksamsten?","questions":["Helfen euch eher Regeln oder Beispiele?","Warum empfehlen viele, Nomen immer mit Artikel und Plural zu lernen?","Wie bemerkt ihr eure eigenen Fehler?"],"challenge":"Entwerft ein kurzes Spiel, mit dem man zehn schwierige Pluralformen üben kann.","stretch":"Vergleicht eure Strategie mit der eures Partners und wählt die beste aus.","support":["Beide Formen sind möglich, aber …","In diesem Kontext würde ich … wählen, weil …","Ein typischer Fehler ist … – richtig ist …"],"explanations":[["Manche merken sich Regeln besser („Feminina auf -e → -n“), andere Beispiele („die Lampe – die Lampen“). Eine Kombination funktioniert meist am besten.","Probiert beide Methoden mit „Blume“, „Tasche“ und „Mutter“. Welche hat euch geholfen, die Ausnahme zu finden?"],["Wer ein Nomen immer mit Artikel und Plural lernt („der Tisch, die Tische“), erspart sich später viel Raten. Wörterbücher geben beides an.","Schlagt drei neue Nomen nach und schreibt sie im Format „der/die/das … – die …“ auf."],["Eigene Texte mit einer Checkliste zu prüfen oder eine Partnerin Fehler notieren zu lassen, hilft, Fehler zu bemerken, die man selbst überhört.","Sprecht eine Minute über euer Wochenende; euer Partner notiert alle Pluralformen. War eine falsch?"]]}],"vocab":[["das Kollektivum","Sammelbezeichnung für eine Gruppe (Team, Menge)"],["die Kongruenz","Übereinstimmung von Subjekt und Verb"],["das Kompositum","zusammengesetztes Wort"],["das Grundwort","letzter, bestimmender Teil eines Kompositums"],["das Fremdwort","Wort aus einer anderen Sprache"],["die Doppelform","zwei zulässige Pluralformen"],["die Maßangabe","Angabe einer Menge (zwei Kilo)"],["der Eigenname","Name einer Person oder Familie"],["die Abkürzung","Kurzwort (LKW, CD)"],["die Umgangssprache","informelle Alltagssprache"],["das Register","Stilebene"],["der Fehler","Form, die gegen die Norm verstößt"]],"toolkit":[["Begründen","Ich würde … wählen, weil der Kontext …"],["Gegenüberstellen","Im Gespräch …, in einem formellen Text dagegen …"],["Einschränken","Mündlich ist das akzeptabel, schriftlich aber nicht."],["Höflich korrigieren","Man könnte auch sagen: …"]]},"C1":{"warm":"„Kakteen“ oder „Kaktusse“? Nennt eure erste Antwort und dann das stärkste Gegenargument.","stations":[{"title":"Norm und Gebrauch","subtitle":"Wer entscheidet, was richtig ist?","main":"Wer entscheidet, welche Pluralform richtig ist – Wörterbücher, Lehrkräfte oder Sprecher?","questions":["Wie behandelt der Duden Doppelformen wie „Kakteen/Kaktusse“?","Warum werden manche „falschen“ Formen mit der Zeit akzeptiert?","Sollen Lernende der Norm oder dem verbreiteten Gebrauch folgen?"],"challenge":"Vergleicht, was zwei Nachschlagewerke zu drei schwankenden Pluralformen sagen.","stretch":"Analysiert die Behauptung, „Kakteen“ sei gebildeter als „Kaktusse“.","support":["Die Norm empfiehlt …, während viele Sprecher …","Im Plural verändert sich die Bedeutung von … zu …","In einem formellen Text ist es sicherer, …"],"explanations":[["Der Duden beschreibt den Gebrauch und gibt häufig mehrere Formen an. Bei „Kaktus“ verzeichnet er „Kakteen“ und „Kaktusse“, wobei „Kakteen“ als häufiger und standardsprachlich gilt.","Schlagt „Kaktus“ und „Atlas“ im Duden nach. Welche Formen stehen dort, und gibt es Hinweise zum Gebrauch?"],["Eine Form wird akzeptiert, wenn sie über längere Zeit von vielen Sprechern und in angesehenen Texten verwendet wird. Dann nehmen Wörterbücher sie auf, manchmal mit einem Hinweis wie „umgangssprachlich“.","Denkt an eine Pluralform, die euch früher falsch vorkam und die ihr heute überall hört. Was hat sie akzeptabel gemacht?"],["Lernende brauchen verständliche und akzeptierte Formen. In formellen Kontexten ist die Norm sicherer; im Gespräch sollte man verbreitete Varianten wenigstens erkennen.","Ihr schreibt einen Schulbericht und eine Nachricht an Freunde. Würdet ihr dieselben Pluralformen wählen? Nennt ein Beispiel."]]},{"title":"Varietäten des Deutschen","subtitle":"Deutschland, Österreich, Schweiz","main":"Wie unterscheiden sich die Varietäten des Deutschen beim Plural?","questions":["Warum sagt man in Österreich „die Pölster“ und in der Schweiz „die Pärke“?","Wo hört man „die Wägen“ statt „die Wagen“?","Wie sollten Lernende mit solchen Unterschieden umgehen?"],"challenge":"Passt einen kurzen Text aus Deutschland für Leserinnen und Leser in Österreich an.","stretch":"Diskutiert, ob es ein Problem ist, Varietäten in einem Text zu mischen.","support":["Die Norm empfiehlt …, während viele Sprecher …","Im Plural verändert sich die Bedeutung von … zu …","In einem formellen Text ist es sicherer, …"],"explanations":[["Das Deutsche hat mehrere Standardvarietäten. In Österreich heißt es „der Polster – die Pölster“, in der Schweiz „der Park – die Pärke“. Diese Formen sind dort standardsprachlich.","Sucht in einem österreichischen oder Schweizer Wörterbuch nach einer weiteren Pluralform, die sich vom Deutschen in Deutschland unterscheidet."],["„Die Wägen“ statt „die Wagen“ hört man vor allem in Süddeutschland und Österreich. Der Umlaut macht den Plural dort hörbar, wo er sonst nicht zu erkennen wäre.","Warum könnte ein Umlaut bei „Wagen“ praktisch sein? Denkt an „der Wagen – die Wagen“."],["Lernende können sich an der Varietät orientieren, die sie am häufigsten hören oder für Prüfungen brauchen. Wichtig ist vor allem, die anderen Varietäten zu verstehen und nicht als Fehler zu werten.","Entscheidet, welche Varietät ihr meistens lernt, und nennt zwei Pluralformen, die das zeigen."]]},{"title":"Generisches Maskulinum","subtitle":"Plural und Geschlecht","main":"Was zeigt das generische Maskulinum im Plural über das Verhältnis von Grammatik und Gesellschaft?","questions":["Warum können „die Lehrer“ auch Lehrerinnen einschließen?","Welche Alternativen gibt es: Paarformen, Partizipien, Genderzeichen?","Warum sind Formen wie „Lehrer*innen“ umstritten?"],"challenge":"Formuliert einen kurzen Text so um, dass er alle einschließt, ohne jeden Satz zu verlängern.","stretch":"Bewertet Argumente für und gegen Genderzeichen in offiziellen Texten.","support":["Die Norm empfiehlt …, während viele Sprecher …","Im Plural verändert sich die Bedeutung von … zu …","In einem formellen Text ist es sicherer, …"],"explanations":[["Im Deutschen wird traditionell das Maskulinum Plural für gemischte Gruppen verwendet: „die Lehrer“ kann Lehrerinnen und Lehrer meinen. Man spricht vom generischen Maskulinum.","Lest „Die Lehrer trafen sich gestern.“ Stellt ihr euch eine Gruppe von Männern oder eine gemischte Gruppe vor? Warum?"],["Es gibt verschiedene Alternativen: Paarformen („Lehrerinnen und Lehrer“), neutrale Wörter („Lehrkräfte“), Partizipien („Studierende“) und Genderzeichen („Lehrer*innen“, „Lehrer:innen“).","Formuliert „Die Schüler sollen ihre Fahrräder im Hof abstellen“ mit zwei verschiedenen Alternativen um."],["Genderzeichen sind umstritten: Befürworter sehen darin mehr Sichtbarkeit für alle Geschlechter, Kritiker verweisen auf Lesbarkeit und darauf, dass der Rat für deutsche Rechtschreibung sie nicht zum Kernbestand der Rechtschreibung zählt.","Formuliert ein sprachliches und ein gesellschaftliches Argument zum Genderstern. Welches überzeugt euch mehr?"]]},{"title":"Zählbar und nicht zählbar","subtitle":"Ein Nomen, zwei Verwendungen","main":"Wie kann dasselbe Nomen zählbar und nicht zählbar sein?","questions":["Was ist der Unterschied zwischen „Kaffee“ und „zwei Kaffee“?","Warum bedeuten „die Weine“ oder „die Käse“ oft Sorten?","Wie entscheidet der Kontext?"],"challenge":"Schreibt Satzpaare mit zählbarer und nicht zählbarer Verwendung von fünf Nomen.","stretch":"Erklärt den Unterschied zwischen „das Papier“ und „die Papiere“.","support":["Die Norm empfiehlt …, während viele Sprecher …","Im Plural verändert sich die Bedeutung von … zu …","In einem formellen Text ist es sicherer, …"],"explanations":[["Viele Nomen sind nicht zählbar, wenn sie einen Stoff oder eine allgemeine Idee bezeichnen („Kaffee“, „Erfahrung“), und zählbar, wenn sie eine Portion, eine Sorte oder ein Ereignis meinen („zwei Kaffee“, „neue Erfahrungen“).","Bildet je zwei Sätze mit „Kaffee“, „Erfahrung“ und „Zeit“: einmal zählbar, einmal nicht zählbar."],["Werden Stoffnamen in den Plural gesetzt, bezeichnen sie oft Sorten: „die Weine aus der Pfalz“, „die Biere dieser Brauerei“. Bei „Käse“ bleibt die Form gleich: „verschiedene Käse“.","Beschreibt einen erfundenen Marktstand mit drei Stoffnamen im Plural, die Sorten bezeichnen."],["Der Kontext (Artikel, Mengenwörter, Situation) zeigt, ob gezählt wird: „Wir essen Fisch“ gegenüber „Im Teich schwimmen Fische“.","Erklärt, warum „Papier“ ein Stoff ist, „die Papiere“ aber Ausweisdokumente sein können."]]},{"title":"Abstrakta im Plural","subtitle":"Freiheiten, Rechte, Werte","main":"Was verändert sich, wenn abstrakte Nomen im Plural stehen?","questions":["Was ist der Unterschied zwischen „Freiheit“ und „Freiheiten“?","Warum verwenden politische Reden so oft „Rechte“ und „Werte“?","Kann man jedes Abstraktum in den Plural setzen?"],"challenge":"Analysiert die Abstrakta im Plural in einer kurzen erfundenen politischen Rede.","stretch":"Diskutiert, ob Abstrakta im Plural einen Text genauer oder vager machen.","support":["Die Norm empfiehlt …, während viele Sprecher …","Im Plural verändert sich die Bedeutung von … zu …","In einem formellen Text ist es sicherer, …"],"explanations":[["„Freiheit“ ist eine allgemeine Idee; „Freiheiten“ sind konkrete Rechte oder Spielräume, z. B. Meinungs- oder Versammlungsfreiheit. Der Plural macht die Idee konkret und zählbar.","Nennt drei „Freiheiten“, die eine erfundene Schulordnung schützen könnte. Warum passt hier der Plural besser?"],["Politische und juristische Texte verwenden häufig Abstrakta im Plural („Rechte“, „Werte“, „Pflichten“), um eine klar umrissene Menge anzudeuten oder an gemeinsame Grundsätze zu appellieren.","Lest den Ausdruck „unsere gemeinsamen Werte“. Welche Werte könnten gemeint sein – und sagt der Sprecher es?"],["Nicht jedes Abstraktum lässt sich natürlich in den Plural setzen: „die Glücke“ ist ungewöhnlich, „die Schönheiten einer Stadt“ dagegen möglich – mit veränderter Bedeutung.","Testet fünf Abstrakta im Plural. Welche klingen natürlich, und welche Bedeutung bekommen sie?"]]},{"title":"Register und Fachsprache","subtitle":"Daten, Kriterien, Praktika","main":"Wie beeinflusst das Register die Wahl der Pluralform?","questions":["Warum gibt es „das Datum“ und „die Daten“ mit verschiedenen Bedeutungen?","Wann klingen lateinische Pluralformen wie „Praktika“ oder „Visa“ angemessen?","Warum schreiben viele wissenschaftliche Texte „wir“, obwohl sie nur einen Autor haben?"],"challenge":"Formuliert einen lockeren Absatz in wissenschaftlichem Stil um und achtet auf den Numerus.","stretch":"Vergleicht zwei Fachtexte und erklärt, welche Pluralformen typisch für das Fach sind.","support":["Die Norm empfiehlt …, während viele Sprecher …","Im Plural verändert sich die Bedeutung von … zu …","In einem formellen Text ist es sicherer, …"],"explanations":[["„Das Datum“ ist ein Kalendertag; „die Daten“ sind in der Regel Informationen oder Messwerte. Der Plural „Daten“ wird in Fachsprachen fast nur in dieser Bedeutung verwendet.","Bildet zwei Sätze: einen mit „Datum“, einen mit „Daten“. Welche Bedeutung hat jeweils das Wort?"],["Lateinische und griechische Pluralformen wie „Praktika“, „Visa“ oder „Themata“ wirken bildungs- oder fachsprachlich. Viele haben eingedeutschte Konkurrenten („Visen“, „Themen“), die heute häufiger sind.","Würdet ihr „Praktika“ oder „Praktikums“ in einer Bewerbung schreiben? Begründet die Wahl."],["Der Pluralis Modestiae („wir zeigen“, „wie wir gesehen haben“) wird in wissenschaftlichen Texten von einzelnen Autoren verwendet, um weniger persönlich zu wirken und die Leser einzubeziehen.","Formuliert „Ich denke, die Ergebnisse sind eindeutig“ in wissenschaftlichem Stil um. Was verändert sich im Ton?"]]},{"title":"Plural mit Wirkung","subtitle":"Wir, Sie und der Pluralis Majestatis","main":"Wie kann der Plural für rhetorische oder soziale Wirkung eingesetzt werden?","questions":["Was ist der Pluralis Majestatis?","Warum sagen Ärztinnen oder Pfleger manchmal „Wie geht es uns denn heute?“","Welche Wirkung hat „wir“ in einer politischen Rede?"],"challenge":"Formuliert eine kurze Nachricht vom „ich“ ins „wir“ um und besprecht die Wirkung.","stretch":"Analysiert, wann ein einschließendes „wir“ manipulativ wirken kann.","support":["Die Norm empfiehlt …, während viele Sprecher …","Im Plural verändert sich die Bedeutung von … zu …","In einem formellen Text ist es sicherer, …"],"explanations":[["Der Pluralis Majestatis ist das „wir“, mit dem sich früher Herrscher bezeichneten („Wir, Kaiser von Österreich …“). Heute findet man ihn vor allem in historischen oder feierlichen Texten.","Formuliert „Ich erkläre die Sitzung für eröffnet“ wie ein früherer Herrscher. Welche Wirkung entsteht?"],["Ärzte, Pflegekräfte oder Lehrkräfte sagen manchmal „Wie geht es uns denn heute?“ statt „Wie geht es Ihnen?“. Dieses „wir“ kann fürsorglich wirken, aber auch bevormundend.","Wie könnte ein erfundener Patient auf „Haben wir unsere Tabletten schon genommen?“ reagieren? Schlagt eine respektvollere Formulierung vor."],["In politischen Reden schafft „wir“ Gemeinschaft zwischen Redner und Publikum, kann aber auch Verantwortung verwischen: Wer genau ist „wir“?","Analysiert den Satz „Wir müssen Opfer bringen.“ Wer wird sie wahrscheinlich bringen, und wer spricht?"]]},{"title":"Deutsch und Tschechisch","subtitle":"Numerus übersetzen","main":"Wo behandeln Deutsch und Tschechisch den Numerus unterschiedlich?","questions":["Welche Nomen sind im Tschechischen Plural, im Deutschen aber Singular, z. B. „dveře – die Tür“?","Welche Nomen sind in beiden Sprachen Pluralwörter, z. B. „rodiče – die Eltern“?","Wie verändern sich Nomen nach Zahlen im Tschechischen und im Deutschen?"],"challenge":"Übersetzt fünf kurze Sätze und markiert jede Veränderung im Numerus.","stretch":"Erklärt einen Unterschied einer deutschsprachigen Person, die Tschechisch lernt.","support":["Die Norm empfiehlt …, während viele Sprecher …","Im Plural verändert sich die Bedeutung von … zu …","In einem formellen Text ist es sicherer, …"],"explanations":[["Manche tschechischen Nomen gibt es nur im Plural, obwohl sie einen Gegenstand bezeichnen („dveře“, „noviny“, „housle“). Im Deutschen sind die Entsprechungen meist Singular: die Tür, die Zeitung, die Geige.","Übersetzt: „Ty dveře jsou otevřené“ und „Noviny leží na stole“. Welche Verbformen braucht ihr im Deutschen?"],["Einige Wörter sind in beiden Sprachen Pluralwörter: „rodiče – die Eltern“, „prázdniny – die Ferien“, „lidé – die Leute“. Andere nur in einer Sprache: „brýle“ ist Plural, „die Brille“ Singular.","Findet zwei weitere Paare: eines, das in beiden Sprachen Plural ist, und eines, das sich unterscheidet."],["Das Tschechische verändert das Nomen nach Zahlen: 1 kniha, 2–4 knihy, 5 und mehr knih. Das Deutsche verwendet nach allen Zahlen über eins dieselbe Pluralform.","Erklärt einer deutschsprachigen Person, warum man im Tschechischen „dvě knihy“, aber „pět knih“ sagt. Findet eine einfache Regel."]]}],"vocab":[["die Norm","was in einer Sprachgemeinschaft als richtig gilt"],["der Sprachgebrauch","wie Menschen tatsächlich sprechen und schreiben"],["die Doppelform","zwei zulässige Formen eines Wortes"],["die Varietät","Sprachform einer Region oder Gruppe"],["das generische Maskulinum","Maskulinum, das alle Geschlechter einschließen soll"],["das Gendern","geschlechtergerechte Formulierung"],["der Sortenplural","Plural für verschiedene Sorten (Weine)"],["der Pluralis Modestiae","„wir“ eines einzelnen Autors"],["der Pluralis Majestatis","„wir“ einer Herrscherin oder eines Herrschers"],["das Register","Stilebene"],["der Duden","maßgebliches Wörterbuch des Deutschen"],["der Numerus","grammatische Kategorie von Singular und Plural"]],"toolkit":[["Unterscheiden","Man muss Norm und tatsächlichen Gebrauch unterscheiden."],["Quellen nennen","Laut Duden …"],["Wirkung analysieren","Der Plural erweckt den Eindruck, dass …"],["Zugestehen","Zwar …, dennoch …"]]},"C2":{"warm":"Prüft die Behauptung: „Den deutschen Plural kann man nicht lernen, man muss ihn auswendig wissen.“ Findet das stärkste Gegenargument.","stations":[{"title":"Regel oder Gedächtnis?","subtitle":"Wie der Plural erworben wird","main":"Speichern Sprecher Pluralformen als ganze Wörter oder bilden sie sie nach Regeln?","questions":["Warum sagen kleine Kinder zeitweise Formen wie „die Hunds“ oder „die Buchs“?","Was zeigt es, dass Sprecher ohne Zögern den Plural erfundener Wörter bilden?","Was bedeutet das für das Lernen einer Fremdsprache?"],"challenge":"Erfindet drei neue Nomen und fragt euren Partner nach dem Plural.","stretch":"Bewertet, ob Lernende Listen auswendig lernen oder Tendenzregeln üben sollten.","support":["Diese Regel gilt für …, aber sie scheitert, wenn …","Die Daten deuten darauf hin, dass …","Eine genauere Beschreibung wäre …"],"explanations":[["Kinder, die Deutsch lernen, bilden zeitweise Formen wie „die Hunds“ oder „die Buchs“, obwohl sie die richtigen Formen schon gehört haben. Sie wenden ein Muster auf Wörter an, bei denen es nicht gilt (Übergeneralisierung).","Fragt euren Partner, warum ein Kind „die Autoen“ sagen könnte. Was weiß das Kind bereits über den Plural?"],["Zeigt man Sprechern ein erfundenes Wort („der Pank“, „die Wiste“), bilden sie spontan einen Plural, oft nach den typischen Tendenzen: „die Panke“, „die Wisten“. Das zeigt, dass sie Muster verwenden.","Erfindet zwei Wörter – ein Maskulinum und ein Femininum auf -e – und prüft, welchen Plural euer Partner wählt."],["Viele Forschende sehen den -s-Plural als eine Art Standardlösung für ungewöhnliche Wörter (Namen, Abkürzungen, Fremdwörter), während andere Muster eher gespeichert werden. Diese Frage ist in der Sprachwissenschaft umstritten.","Welche Pluralformen habt ihr als ganze Wörter gelernt, und welche habt ihr schon einmal nach einem Muster „erfunden“?"]]},{"title":"Sprachwandel","subtitle":"Das -s auf dem Vormarsch?","main":"Breitet sich der -s-Plural im Deutschen aus?","questions":["Warum bekommen neue Wörter wie „Handy“, „Emoji“ oder „Uni“ meist ein -s?","Warum hört man umgangssprachlich „Jungs“ oder „Kumpels“?","Welche Pluralformen könnten sich in Zukunft verändern?"],"challenge":"Sagt zwei Pluralformen voraus, die sich in den nächsten fünfzig Jahren verändern könnten, und begründet die Vorhersage.","stretch":"Prüft die These, dass häufige Wörter ihre Pluralform länger bewahren.","support":["Diese Regel gilt für …, aber sie scheitert, wenn …","Die Daten deuten darauf hin, dass …","Eine genauere Beschreibung wäre …"],"explanations":[["Neue Wörter, Abkürzungen und Wörter auf Vollvokal bekommen meist ein -s: „die Handys“, „die Emojis“, „die Unis“, „die Kitas“. Diese Gruppe wächst durch Entlehnungen und Kurzwörter ständig.","Sammelt fünf neue Wörter aus Technik oder Jugendsprache und bildet ihren Plural. Welche Endung überwiegt?"],["In der Umgangssprache verbreitet sich das -s auch bei älteren Wörtern: „Jungs“, „Kumpels“, „Kerls“. Ob das ein langfristiger Wandel ist, ist offen.","Hört ihr in eurer Umgebung weitere -s-Formen, die in Wörterbüchern als umgangssprachlich gelten? Nennt Beispiele."],["Häufige Wörter bewahren ihre Formen länger, weil Sprecher sie oft hören und gut im Gedächtnis haben. Seltene Wörter werden eher an produktive Muster angeglichen.","Wählt ein seltenes Wort mit unregelmäßigem Plural (z. B. „Atlas – Atlanten“). Glaubt ihr, dass es sich verändern wird? Warum?"]]},{"title":"Korpora und Grammatiken","subtitle":"Belege für Regeln","main":"Was können große Textsammlungen über den Pluralgebrauch zeigen?","questions":["Wie könnte ein Korpus zeigen, ob „Pizzas“ oder „Pizzen“ häufiger ist?","Wo liegen die Grenzen der Häufigkeit als Beleg?","Sollten Grammatiken den Korpusdaten folgen?"],"challenge":"Entwerft eine kleine Untersuchung zu einer schwankenden Pluralform.","stretch":"Diskutiert, ob die häufigste Form automatisch die richtige ist.","support":["Diese Regel gilt für …, aber sie scheitert, wenn …","Die Daten deuten darauf hin, dass …","Eine genauere Beschreibung wäre …"],"explanations":[["Ein Korpus ist eine große Sammlung echter Texte, z. B. das DWDS-Korpus. Sucht man nach „Pizzas“ und „Pizzen“ in verschiedenen Textsorten, sieht man, welche Form wo häufiger ist.","Plant eine Suche: Welche Textsorten (Zeitung, Speisekarten, Foren) würdet ihr vergleichen, und was erwartet ihr?"],["Häufigkeit zeigt, was verbreitet ist – nicht automatisch, was in jedem Kontext angemessen ist. Außerdem hängen die Ergebnisse davon ab, welche Texte im Korpus enthalten sind.","Eine Form ist im Internet häufig, in Lehrbüchern selten. Ist sie richtig? Was müsstet ihr noch wissen?"],["Moderne Grammatiken und Wörterbücher stützen sich auf Korpora, geben aber trotzdem Empfehlungen. Beschreiben und Vorschreiben sind unterschiedliche Aufgaben.","Sucht einen Wörterbucheintrag mit einem Gebrauchshinweis. Beschreibt er den Gebrauch, empfiehlt er eine Form oder beides?"]]},{"title":"Richtigkeit und Urteil","subtitle":"Fehler oder Variante?","main":"Warum lösen manche Pluralfehler so starke Reaktionen aus?","questions":["Wer wird beurteilt, wenn jemand „die Kaktusse“ oder „mit den Kinder“ sagt?","Was unterscheidet einen Fehler von einer Variante?","Wie sollten Lehrkräfte auf nicht standardsprachliche Pluralformen reagieren?"],"challenge":"Spielt eine Diskussion zwischen einem strengen Lektor und einer Sprachwissenschaftlerin.","stretch":"Formuliert einen fairen Grundsatz für das Korrigieren von Pluralfehlern.","support":["Diese Regel gilt für …, aber sie scheitert, wenn …","Die Daten deuten darauf hin, dass …","Eine genauere Beschreibung wäre …"],"explanations":[["Formen wie „mit den Kinder“ oder „die Kaktusse“ werden oft als Zeichen für Bildung oder soziale Herkunft gedeutet. Die Reaktion sagt ebenso viel über gesellschaftliche Einstellungen wie über Grammatik.","Stellt euch ein Vorstellungsgespräch vor, in dem jemand „mit den Kunde“ sagt. Wie könnte die Personalchefin reagieren, und ist das fair?"],["Ein Fehler verstößt gegen die Regeln einer Varietät und wird von ihren Sprechern nicht systematisch verwendet; eine Variante wird regelmäßig von einer Gruppe gebraucht und ist in bestimmten Kontexten akzeptiert. Die Grenze kann sich verschieben.","Ist „die Jungs“ ein Fehler oder eine Variante? Mit welchen Belegen würdet ihr entscheiden?"],["Lehrkräfte können unterscheiden zwischen Fehlern, die das Verständnis stören, und Formen, die nur nicht standardsprachlich sind – und erklären, wo welche Form passt, statt sie nur rot anzustreichen.","Schreibt einen kurzen Kommentar für einen erfundenen Lernenden, der „die Kinders“ geschrieben hat: Korrigiert die Form und erklärt sie, ohne zu entmutigen."]]},{"title":"Plural vermitteln","subtitle":"Klar, aber nicht vereinfacht","main":"Wie kann man den deutschen Plural klar vermitteln, ohne seine Komplexität zu verschweigen?","questions":["Wann helfen Tendenzregeln wie „Feminina auf -e → -n“, und wann führen sie in die Irre?","In welcher Reihenfolge würdet ihr die Pluralmuster einführen?","Wie können Lernende Regeln selbst entdecken?"],"challenge":"Entwerft eine zehnminütige Mini-Lektion zum Plural für Lernende auf A2-Niveau.","stretch":"Findet eine Vereinfachung in eurer Lektion und verbessert sie.","support":["Diese Regel gilt für …, aber sie scheitert, wenn …","Die Daten deuten darauf hin, dass …","Eine genauere Beschreibung wäre …"],"explanations":[["Tendenzregeln wie „Feminina auf -e bilden den Plural mit -n“ treffen auf einen großen Teil der Wörter zu und erleichtern den Einstieg. Sie führen in die Irre, wenn Lernende sie für ausnahmslose Gesetze halten.","Nennt fünf Wörter, bei denen eine Tendenzregel ein falsches Ergebnis liefert. Welche würdet ihr zuerst unterrichten?"],["Eine mögliche Reihenfolge: Feminina auf -e (-n), Maskulina mit -e, Wörter ohne Endung auf -er/-el/-en, -s bei Fremdwörtern und Abkürzungen, dann Umlaut und -er, schließlich Doppelformen und Fremdwortplurale.","Seid ihr mit dieser Reihenfolge einverstanden? Ändert einen Schritt und begründet die Änderung."],["Lernende können Regeln entdecken, indem sie Beispiele sortieren, Genus und Endung vergleichen oder in einem Text Muster suchen. Entdecken führt oft zu tieferem Verständnis als Auswendiglernen.","Gebt eurem Partner zehn Wortpaare und lasst ihn die Regel selbst formulieren. Wie nah kam er an die Tendenz heran?"]]},{"title":"Numerus im Sprachvergleich","subtitle":"Ist „eins“ immer Singular?","main":"Wie unterscheiden sich Sprachen darin, wie sie den Numerus ausdrücken?","questions":["Warum hat das Tschechische unterschiedliche Formen nach 2–4 und nach 5?","Markieren alle Sprachen den Plural am Nomen?","Was zeigt der Dual in Sprachen wie dem Slowenischen?"],"challenge":"Vergleicht „ein Buch, zwei Bücher, fünf Bücher“ auf Deutsch, Tschechisch und in einer weiteren Sprache.","stretch":"Diskutiert, ob der deutsche Plural kompliziert oder einfach anders ist.","support":["Diese Regel gilt für …, aber sie scheitert, wenn …","Die Daten deuten darauf hin, dass …","Eine genauere Beschreibung wäre …"],"explanations":[["Das Tschechische verwendet nach Zahlen drei Formen: 1 kniha, 2–4 knihy, 5 und mehr knih. Das Deutsche hat nach allen Zahlen über eins nur eine Pluralform.","Zählt auf Tschechisch von eins bis sechs mit „pes“ und dann auf Deutsch mit „Hund“. Welches System ist komplexer?"],["Nicht alle Sprachen markieren den Plural am Nomen. Im Chinesischen oder Japanischen bleibt das Nomen oft gleich; die Menge zeigen Zahlwörter oder der Kontext.","Wie würdet ihr „Ich habe Buch gekauft“ verstehen, wenn das Deutsche keinen Plural hätte? Welche Wörter würden die Menge zeigen?"],["Manche Sprachen, z. B. das Slowenische, haben einen Dual – eine besondere Form für genau zwei. Auch das Alttschechische hatte ihn; Reste finden sich in „oči“, „uši“ oder „ruce“.","Warum könnte eine Sprache eine eigene Form für zwei haben? Denkt an Dinge, die meist paarweise vorkommen."]]},{"title":"Sprache und Identität","subtitle":"Wenn der Plural politisch wird","main":"Kann der Plural zu einer gesellschaftlichen oder politischen Frage werden?","questions":["Warum ist das Gendern im Plural Gegenstand öffentlicher Debatten geworden?","Sollen Institutionen einen bestimmten Sprachgebrauch vorschreiben?","Wie gehen andere Sprachen mit ähnlichen Fragen um?"],"challenge":"Entwerft einen kurzen Leitfaden für geschlechtergerechte Sprache in einer erfundenen Schülerzeitung.","stretch":"Prüft euren Leitfaden an einem schwierigen Fall.","support":["Diese Regel gilt für …, aber sie scheitert, wenn …","Die Daten deuten darauf hin, dass …","Eine genauere Beschreibung wäre …"],"explanations":[["Das Gendern im Plural ist zu einem öffentlichen Thema geworden, weil viele es mit der Sichtbarkeit von Frauen und nicht binären Menschen verbinden. Die Debatte betrifft Identität ebenso wie Grammatik.","Findet ein grammatisches und ein gesellschaftliches Argument in dieser Debatte. Welches überzeugt euch mehr?"],["Institutionen wie Behörden, Hochschulen oder Schulen geben Leitfäden heraus; einige Bundesländer haben Genderzeichen in Schulen oder Verwaltungen untersagt. Institutionen können ihre eigenen Texte regeln, nicht aber den privaten Sprachgebrauch.","Sollte sich eine Schülerzeitung an einen solchen Leitfaden halten? Wer sollte über ihren Stil entscheiden?"],["Andere Sprachen stehen vor ähnlichen Fragen: Englisch mit dem singularen „they“, Spanisch mit „-e“ oder „-x“, Französisch mit der „écriture inclusive“. Die Lösungen unterscheiden sich, weil die Grammatik verschieden ist.","Vergleicht eine deutsche Lösung mit der einer anderen Sprache, die ihr kennt. Welche ist mündlich leichter zu verwenden?"]]},{"title":"Grenzen der Regeln","subtitle":"Grenzfälle","main":"Wo stoßen die Regeln des deutschen Plurals an ihre Grenzen?","questions":["Warum sagt man „zwei Mal“ oder „zweimal“, aber „viele Male“?","Was ist der Plural von „Status“ und „Globus“?","Was zeigen solche Fälle über das Verhältnis von Form und Bedeutung?"],"challenge":"Sammelt fünf Grenzfälle und schlagt eine Regel vor, die sie erklärt.","stretch":"Verteidigt oder widerlegt die Ansicht, dass Regeln nur typische Fälle beschreiben.","support":["Diese Regel gilt für …, aber sie scheitert, wenn …","Die Daten deuten darauf hin, dass …","Eine genauere Beschreibung wäre …"],"explanations":[["„Mal“ als Zählwort steht nach Zahlen im Singular („zweimal“, „drei Mal“), als Nomen im Plural aber „die Male“: „viele Male“, „beim nächsten Mal“. Das zeigt, dass Zählwörter eigene Regeln haben.","Bildet zwei Sätze mit „Mal“: einen mit einer Zahl, einen mit „viele“. Warum ist die Form verschieden?"],["„Der Status – die Status“ hat im Plural dieselbe Schreibung, wird aber mit langem u gesprochen. „Der Globus“ hat zwei Formen: „die Globen“ und „die Globusse“.","Sprecht „der Status“ und „die Status“ laut aus. Hört ihr einen Unterschied? Schlagt nach, ob das stimmt."],["Solche Fälle zeigen, dass Pluralbildung auch von Herkunft, Häufigkeit und Bedeutung abhängt, nicht nur von einer formalen Regel.","Sammelt fünf Grenzfälle (z. B. „die Leute“ ohne Singular, „das Obst“ ohne Plural, „die Visa/Visen“) und prüft, ob eine einzige Regel sie erklärt."]]}],"vocab":[["die Übergeneralisierung","Anwendung einer Regel auf Ausnahmen"],["die Produktivität","Fähigkeit eines Musters, neue Wörter zu bilden"],["die Analogie","Wandel durch Angleichung an ähnliche Formen"],["der Default-Plural","Pluralform, die gewählt wird, wenn keine andere greift"],["das Korpus","große Sammlung echter Texte"],["die Präskription","Vorschreiben, wie man sprechen soll"],["die Deskription","Beschreiben, wie man tatsächlich spricht"],["der Dual","Numerus für genau zwei"],["der Grenzfall","Beispiel an der Grenze einer Regel"],["der Beleg","Beispiel, das eine Aussage stützt"],["die Vereinfachung","leichtere Darstellung, die Details auslässt"],["die Sprachideologie","Überzeugungen darüber, wie Sprache sein soll"]],"toolkit":[["These prüfen","Diese Behauptung gilt für …, aber nicht für …"],["Belege nennen","Korpusdaten zeigen, dass …"],["Revidieren","Eine genauere Regel wäre …"],["Widersprechen","Daraus folgt nicht, dass …"]]}},"uiSimple":{"eyebrow":"SPRECHEN · FRAGEN · ANTWORTEN · ZUHÖREN","hero":"Menschen, Schulsachen, Essen, Tiere, Zimmer und Straßen: Nennt viele Dinge auf Deutsch und übt den Plural in kurzen Dialogen.","privacy":"Fehler helfen beim Lernen. Ihr könnt euch Personen und Dinge ausdenken.","step3":"Stelle deinem Partner oder deiner Partnerin eine Frage.","step4":"Mehr? Öffne die nächste Aufgabe.","main":"HAUPTFRAGE","questions":"Weitere Fragen","supportTitle":"Brauchst du Hilfe?","supportDesc":"Wörter für den Satzanfang.","supportShow":"Hilfe zeigen","supportHide":"Hilfe ausblenden","challengeTitle":"Noch mehr sprechen","challengeDesc":"Nach der Hauptfrage.","challengeShow":"Aufgabe zeigen","challengeHide":"Aufgabe ausblenden","stretchTitle":"Eine schwierigere Aufgabe","stretchDesc":"Möchtest du mehr sprechen?","stretchShow":"Schwierige Aufgabe zeigen","stretchHide":"Schwierige Aufgabe ausblenden","progress":"Sag, warum. Gib ein Beispiel. Stell eine Frage.","vocabLabe

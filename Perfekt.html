<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Multilingual CEFR conversation lab – Perfekt / Present Perfect / Pretérito perfecto / Passé composé">
<title>Perfekt · Conversation Lab</title>
<style>
:root{
  color-scheme:dark;--bg:#07111f;--panel:#0d1b2e;--panel2:#11253d;
  --text:#f7fbff;--muted:#acbfd2;--accent:#6ee7ff;--accent2:#9b8cff;
  --good:#58e6a9;--warn:#ffd166;--danger:#ff7b8a;--border:rgba(255,255,255,.13);
  --shadow:0 22px 64px rgba(0,0,0,.34);--timer-edge:#354c65;
  --timer-bg:#0c1f33;--timer-button:#1b324c;--timer-editor-bg:#10233a;--timer-field-bg:#0b1c2f;
}
:root[data-theme="light"]{
  color-scheme:light;--bg:#eef4fa;--panel:#fff;--panel2:#eaf2f9;
  --text:#17283b;--muted:#425c73;--accent:#076a90;--accent2:#6550a9;
  --good:#10704f;--warn:#92600c;--danger:#a52f50;--border:rgba(40,77,115,.2);
  --shadow:0 15px 42px rgba(46,91,130,.13);--timer-edge:#afc0cd;
  --timer-bg:#edf6fb;--timer-button:#eaf1f6;--timer-editor-bg:#fff;--timer-field-bg:#eff5f9;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 12% 4%,rgba(110,231,255,.11),transparent 30%),radial-gradient(circle at 88% 9%,rgba(155,140,255,.11),transparent 27%),var(--bg);font:400 16px/1.49 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:root[data-theme="light"] body{background:radial-gradient(circle at 8% 3%,rgba(83,178,219,.14),transparent 32%),radial-gradient(circle at 90% 5%,rgba(172,151,222,.15),transparent 34%),var(--bg)}
button,select,input{font:inherit}
button,select{cursor:pointer}
button:disabled{opacity:.38;cursor:not-allowed}
:where(button,select,input,summary):focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.app{width:min(1280px,100%);margin:0 auto;padding:15px 20px 70px}
.topbar{position:sticky;top:0;z-index:45;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 13px;margin:0 0 15px;border:1px solid var(--border);border-radius:18px;background:rgba(7,17,31,.94);backdrop-filter:blur(18px);box-shadow:0 8px 25px rgba(0,0,0,.13)}
:root[data-theme="light"] .topbar{background:rgba(255,255,255,.96)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 310px}
.logo{flex:0 0 42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#6ee7ff,#9b8cff);color:#06111d;font-weight:950;letter-spacing:-.06em}
.brand-copy{min-width:0}.brand-copy strong{display:block;font-size:.91rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-copy span{display:block;color:var(--muted);font-size:.72rem}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 680px}
.control-group{display:flex;gap:6px;align-items:center;min-width:0}
.control-label{color:var(--muted);font-size:.7rem;letter-spacing:.05em;font-weight:850;white-space:nowrap}
.lang-select{max-width:135px;min-height:36px;background:var(--timer-button);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:6px 6px;font-weight:800;font-size:.82rem}
.level-switch{display:flex;gap:3px;padding:3px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.045)}
.level-switch button{min-width:34px;padding:5px 6px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:.77rem;font-weight:900}
.level-switch button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05121f;box-shadow:0 2px 10px rgba(0,0,0,.16)}
:root[data-theme="light"] .level-switch button.active{color:#fff}
.btn{min-height:36px;padding:7px 11px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.055);color:var(--text);font-size:.82rem;font-weight:780;transition:background .14s}
.btn:hover{background:rgba(110,231,255,.09)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#07111f}
:root[data-theme="light"] .btn.primary{color:white}
.btn.ghost{background:transparent}
.hero{padding:33px 34px 29px;border:1px solid var(--border);border-radius:27px;background:linear-gradient(125deg,rgba(255,255,255,.065),rgba(255,255,255,.018));box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-110px;top:-155px;width:355px;height:355px;border-radius:100%;pointer-events:none;background:radial-gradient(circle,rgba(110,231,255,.15),transparent 68%)}
.kicker{color:var(--accent);font-size:.69rem;font-weight:930;letter-spacing:.18em}
h1{font-size:clamp(2.1rem,5vw,4.3rem);line-height:1.03;letter-spacing:-.057em;margin:8px 0 8px;max-width:960px}
.strap{font-size:clamp(1.05rem,2.5vw,1.45rem);font-weight:850;letter-spacing:-.015em;margin:0 0 10px;color:var(--accent)}
.hero-intro{max-width:850px;color:var(--muted);font-size:.98rem;margin:0 0 16px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--border);background:rgba(255,255,255,.05);padding:6px 10px;border-radius:100px;font-weight:750;font-size:.76rem}
.goal-strip{margin:16px 0 0;max-width:850px;background:rgba(110,231,255,.065);border:1px solid rgba(110,231,255,.19);padding:10px 13px;border-radius:12px;display:flex;gap:10px;align-items:flex-start}
.goal-strip span{color:var(--accent);font-size:.72rem;font-weight:950;text-transform:uppercase;white-space:nowrap}
.goal-strip strong{font-size:.89rem;font-weight:650}
.privacy-notice{font-size:.75rem;color:var(--muted);margin:10px 0 0;max-width:980px}.begin-row{margin-top:14px;display:flex;justify-content:flex-end}.begin-row .btn{font-size:.88rem;padding:10px 16px}
.quickstart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:14px}
.quickstep{border:1px solid var(--border);border-radius:13px;padding:12px 13px;background:rgba(255,255,255,.032);font-size:.83rem;color:var(--muted)}
.quickstep b{display:block;color:var(--accent);font-size:.71rem;letter-spacing:.07em;margin-bottom:3px}
.warmup{margin-top:13px;border:1px solid var(--border);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.04)}
.warmup summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:13px;font-weight:850}
.warmup summary::-webkit-details-marker{display:none}
.warm-bubble{width:34px;height:34px;border-radius:11px;background:rgba(110,231,255,.14);color:var(--accent);display:grid;place-items:center;flex:none}
.warm-summary-text{flex:1;min-width:0}.warm-summary-text small{display:block;color:var(--muted);font-size:.76rem;font-weight:500}
.warm-chevron{color:var(--accent);font-size:1.2rem;transition:transform .2s}
.warmup[open] .warm-chevron{transform:rotate(180deg)}
.warm-content{padding:0 18px 19px 65px;color:var(--text)}.warm-content p{margin:0 0 6px}.warm-content small{color:var(--muted)}
.nav-heading{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:18px 3px 6px}
.nav-heading span{font-size:.7rem;letter-spacing:.15em;color:var(--accent);font-weight:900}
.section-nav{display:flex;gap:7px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;padding:6px 3px 10px}
.section-nav button{flex:0 0 auto;max-width:255px;border:1px solid var(--border);border-radius:50px;padding:9px 12px;background:rgba(255,255,255,.04);color:var(--muted);font-size:.78rem;font-weight:790;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-nav button.active{background:var(--accent);color:#06111d;border-color:transparent}
:root[data-theme="light"] .section-nav button.active{color:#fff}
.station{scroll-margin-top:calc(var(--topbar-h,90px) + 12px);border:1px solid var(--border);border-radius:25px;background:linear-gradient(145deg,rgba(17,37,61,.94),rgba(10,25,42,.96));overflow:visible;box-shadow:var(--shadow)}
:root[data-theme="light"] .station{background:linear-gradient(145deg,#fff,#f4f8fc)}
.station-head{display:flex;align-items:center;gap:15px;justify-content:space-between;min-height:164px;padding:20px 24px;border-bottom:1px solid var(--border)}
.station-ident{display:flex;align-items:center;gap:15px;min-width:0;flex:1}
.station-num{flex:0 0 51px;width:51px;height:51px;display:grid;place-items:center;background:linear-gradient(135deg,#6ee7ff,#9b8cff);border-radius:16px;color:#06111d;font-size:1.28rem;font-weight:950}
.station-copy{min-width:0}
.station-eyebrow{color:var(--accent);font-size:.74rem;letter-spacing:.15em;font-weight:900;text-transform:uppercase}
.station-title{font-size:clamp(1.55rem,2.8vw,2.7rem);letter-spacing:-.038em;line-height:1.08;margin:6px 0}
.station-subtitle{font-size:.88rem;color:var(--muted);margin:0}
.timer-dock{flex:0 0 245px;min-width:0;display:flex;justify-content:end}
.station-body{padding:21px 24px 23px}
.station-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(315px,.8fr);gap:15px}
.card{border:1px solid var(--border);background:rgba(255,255,255,.048);border-radius:17px;padding:20px;min-width:0}
.mini-label{font-size:.69rem;color:var(--accent);font-weight:900;letter-spacing:.12em}
.main-question{font-size:clamp(1.42rem,2.35vw,2.1rem);line-height:1.18;letter-spacing:-.023em;font-weight:880;margin:9px 0 18px;overflow-wrap:break-word;text-wrap:pretty}
.questions-label{font-size:.75rem;color:var(--muted);font-weight:850;margin-bottom:8px}
.questions{display:grid;gap:9px}
.question{display:flex;gap:12px;align-items:flex-start;background:rgba(0,0,0,.13);border:1px solid var(--border);padding:11px 12px;border-radius:12px;font-size:.94rem}
:root[data-theme="light"] .question{background:rgba(35,91,145,.045)}
.question .qnum{flex:0 0 18px;color:var(--accent);font-weight:950}
.tools{display:grid;gap:11px;align-content:start}
.toolbox{border:1px solid var(--border);border-radius:16px;padding:15px;background:rgba(0,0,0,.14)}
:root[data-theme="light"] .toolbox{background:rgba(35,91,145,.045)}
.toolbox-title{font-size:.99rem;font-weight:850;line-height:1.2;margin:0 0 5px}
.toolbox-desc{font-size:.81rem;color:var(--muted);margin:0 0 9px}
.toolbox .btn{min-height:32px;padding:6px 10px;font-size:.77rem}
.reveal{padding:11px 12px;margin-top:9px;border:1px solid rgba(110,231,255,.24);border-radius:12px;background:rgba(110,231,255,.065);font-size:.87rem;line-height:1.45}
.reveal.support{border-color:rgba(88,230,169,.29);background:rgba(88,230,169,.07)}
.reveal.stretch{border-color:rgba(155,140,255,.32);background:rgba(155,140,255,.09)}
.reveal.challenge{border-color:rgba(255,209,102,.3);background:rgba(255,209,102,.07)}
.reveal ul{padding-left:18px;margin:0}.reveal li+li{margin-top:6px}
.station-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px;flex-wrap:wrap}
.progress{font-size:.79rem;color:var(--muted)}
.nav-buttons{display:flex;gap:8px}
.nav-buttons .btn{min-width:103px}
.resource-card{margin-top:15px;border:1px solid var(--border);border-radius:20px;padding:20px;background:rgba(255,255,255,.042)}
.resource-card h2{font-size:1.05rem;line-height:1.3;margin:5px 0 5px}
.resource-desc{color:var(--muted);font-size:.84rem;margin:0 0 12px}
.vocab-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.vocab-item{padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,.09);min-width:0;overflow-wrap:anywhere}
:root[data-theme="light"] .vocab-item{background:rgba(35,91,145,.04)}
.vocab-item b{display:block;color:var(--accent);font-size:.89rem;margin-bottom:3px}
.vocab-item span{display:block;color:var(--muted);font-size:.8rem}
.toolkit-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.lesson-tip{margin:20px 4px 0;text-align:center;color:var(--muted);font-size:.83rem}
.lesson-tip b{color:var(--accent)}
.footer-credit{margin:9px 0 0;text-align:center;font-size:.72rem;color:var(--muted);opacity:.8}
.timer-panel{position:relative;width:245px;min-width:0;border:1px solid var(--timer-edge);border-radius:18px;background:var(--timer-bg);padding:12px 13px;text-align:center}
.timer-label{display:block;color:var(--accent);font-size:.66rem;font-weight:950;letter-spacing:.12em;text-transform:uppercase}
.clock{display:block;width:100%;padding:0;border:1px dashed transparent;border-radius:10px;background:transparent;color:var(--text);font-variant-numeric:tabular-nums;font-feature-settings:'tnum';font-weight:950;font-size:3.45rem;letter-spacing:-.08em;line-height:1.09;white-space:nowrap}
.clock:hover{background:var(--timer-button);border-color:var(--accent)}
.clock.almost{color:var(--warn)}.clock.finished{color:var(--danger)}
.timer-hint{display:block;font-size:.72rem;color:var(--muted);margin:3px 0 9px;min-height:1.2em}
.timer-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.timer-buttons button{min-width:0;padding:8px 6px;border:1px solid var(--timer-edge);border-radius:9px;background:var(--timer-button);color:var(--text);font-size:.81rem;font-weight:900}
.timer-buttons .start{background:var(--accent);border-color:transparent;color:#05121d}
:root[data-theme="light"] .timer-buttons .start{color:#fff}
.timer-editor{position:absolute;right:-1px;top:38px;width:min(320px,85vw);z-index:70;text-align:left;padding:15px;background:var(--timer-editor-bg);border:2px solid var(--accent);border-radius:16px;box-shadow:0 18px 44px rgba(0,0,0,.3)}
.timer-editor-title{font-weight:850;font-size:.85rem;margin-bottom:9px}
.timer-time-fields{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:9px}
.timer-time-field{min-width:0}
.timer-time-field label{display:block;text-align:center;color:var(--muted);font-size:.74rem;font-weight:850;margin-bottom:4px}
.timer-editor input{display:block;width:100%;min-width:0;background:var(--timer-field-bg);border:1px solid var(--timer-edge);border-radius:10px;padding:8px 4px;text-align:center;font-weight:900;font-size:1.9rem;color:var(--text);font-variant-numeric:tabular-nums}
.timer-separator{font-size:2rem;font-weight:900;line-height:1.65;color:var(--accent)}
.timer-help{font-size:.74rem;color:var(--muted);margin:9px 0 4px}
.timer-error{font-size:.73rem;color:var(--danger);font-weight:800;min-height:1em}
.timer-editor-buttons{display:flex;gap:7px;margin-top:8px}
.timer-editor-buttons button{flex:1;padding:8px 5px;border-radius:9px;border:1px solid var(--timer-edge);background:var(--timer-button);color:var(--text);font-weight:850;font-size:.8rem}
.timer-editor-buttons button[type=submit]{background:var(--accent);border-color:transparent;color:#06111d}
:root[data-theme="light"] .timer-editor-buttons button[type=submit]{color:#fff}
.timer-grip,.timer-float-toggle{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:100;border-radius:100px;padding:10px 15px;background:#eaf6ff;color:#07111f;font-size:.85rem;font-weight:850;box-shadow:0 6px 20px rgba(0,0,0,.15);transition:transform .18s,opacity .18s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:1110px){.topbar{align-items:flex-start}.controls{justify-content:flex-start}.station-grid{grid-template-columns:minmax(0,1fr) minmax(275px,.83fr)}.brand{flex-basis:auto}.quickstart{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:825px){.station-grid{grid-template-columns:1fr}.station-head{align-items:flex-start}.timer-dock{flex:0 0 214px}.timer-panel{width:214px}.clock{font-size:3rem}.vocab-grid,.toolkit-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.station-body{padding:17px}}
@media(max-width:650px){.app{padding:9px 10px 115px}.topbar{position:relative;gap:8px;padding:10px;margin-bottom:11px}.brand{width:100%;flex:1 1 100%}.controls{justify-content:flex-start;gap:7px}.control-group{flex-wrap:wrap;gap:3px}.control-label{display:none}.lang-select{font-size:.82rem;max-width:133px}.level-switch button{min-width:34px}.small-hide{display:none}.btn.icon-only{min-width:35px;padding:6px 9px}.hero{padding:24px 17px 22px;border-radius:22px}.hero-intro{font-size:.92rem}.quickstart{grid-template-columns:1fr 1fr;gap:7px}.quickstep{padding:10px;font-size:.78rem}.goal-strip{display:block}.goal-strip span{display:block;margin-bottom:4px}.warm-content{padding-left:18px}.warmup summary{padding:13px}.nav-heading{margin-top:14px}.station{border-radius:21px;scroll-margin-top:12px}.station-head{min-height:0;padding:19px 16px}.station-ident{gap:10px}.station-num{flex-basis:39px;width:39px;height:39px;font-size:1rem;border-radius:12px}.station-title{font-size:1.75rem}.station-subtitle{font-size:.82rem}.station-body{padding:12px}.card{padding:15px}.main-question{font-size:1.5rem}.question{padding:10px;font-size:.88rem}.toolbox{padding:13px}.nav-buttons{width:100%}.nav-buttons .btn{flex:1}.resource-card{padding:16px}.vocab-grid,.toolkit-grid{grid-template-columns:1fr}.lesson-tip{font-size:.8rem}}
@media (min-width:900px) and (max-height:850px){.station-head{padding:13px 22px;min-height:130px}.station-body{padding:15px 22px}.card{padding:15px}.main-question{font-size:clamp(1.35rem,2vw,1.8rem);margin:8px 0 12px}.question{padding:8px 10px;font-size:.86rem}.toolbox{padding:11px}.tools{gap:8px}.timer-panel{padding:9px 12px}.clock{font-size:3rem}}
/* On touch phones the same countdown becomes a movable fixed overlay. */
@media(max-width:650px),(max-height:550px) and (pointer:coarse){
 .timer-dock{display:none} .station-ident{width:100%;flex:1 1 auto}
 .timer-panel{position:fixed;left:auto;top:auto;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;align-items:center;gap:5px;width:fit-content;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);padding:5px 7px;border:1px solid var(--timer-edge);border-radius:17px;box-shadow:0 12px 38px rgba(0,0,0,.43);overflow:visible}
 .timer-grip,.timer-float-toggle{display:grid;place-items:center;flex:0 0 auto;width:29px;height:39px;border:0;border-radius:10px;padding:0;background:transparent;color:var(--muted);font-weight:900;font-size:1.06rem}
 .timer-grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
 .timer-grip:active{cursor:grabbing;background:var(--timer-button)}
 .timer-float-toggle{width:37px;background:var(--timer-button);color:var(--accent)}
 .timer-panel:not(.mobile-expanded) .timer-label,.timer-panel:not(.mobile-expanded) .timer-hint,.timer-panel:not(.mobile-expanded) .timer-buttons{display:none}
 .timer-panel:not(.mobile-expanded) .clock{width:auto;min-width:82px;padding:5px 3px;font-size:1.65rem;line-height:1.15;letter-spacing:-.05em}
 .timer-panel.mobile-expanded{display:grid;grid-template-columns:34px minmax(0,1fr) 37px;gap:3px 5px;align-items:center;width:min(302px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:11px 12px 12px;border-radius:19px;overflow-y:auto;overscroll-behavior:contain}
 .timer-panel.mobile-expanded .timer-grip{grid-column:1;grid-row:1}
 .timer-panel.mobile-expanded .timer-label{grid-column:2;grid-row:1;font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .timer-panel.mobile-expanded .timer-float-toggle{grid-column:3;grid-row:1}
 .timer-panel.mobile-expanded .clock{grid-column:1/-1;grid-row:2;font-size:3.45rem;margin:2px 0 0}
 .timer-panel.mobile-expanded .timer-hint{grid-column:1/-1;grid-row:3;margin:1px 0 5px}
 .timer-panel.mobile-expanded .timer-buttons{grid-column:1/-1;grid-row:4;display:grid}
 .timer-panel.mobile-expanded .timer-editor{position:static;grid-column:1/-1;grid-row:5;width:100%;max-width:100%;margin-top:8px;padding:11px;box-shadow:none}
 .timer-panel.mobile-expanded .timer-editor input{font-size:1.5rem;padding:6px 4px}
 .timer-panel.mobile-expanded .timer-time-fields{gap:6px}
 .timer-panel.mobile-expanded .timer-separator{font-size:1.7rem}
 .toast{bottom:calc(75px + env(safe-area-inset-bottom,0px))}
}
@media print{body{background:#fff!important;color:#000!important}.topbar,.section-nav,.nav-heading,.station-foot,.timer-panel,.lesson-tip,.footer-credit{display:none!important}.hero,.warmup,.station,.resource-card{background:#fff!important;color:#000!important;box-shadow:none!important;border:1px solid #999!important}.station{break-inside:avoid}.warmup .warm-content{display:block!important}.station-grid{grid-template-columns:1fr 1fr!important}.reveal[hidden]{display:block!important}.vocab-item,.question,.toolbox,.card{background:#fff!important;color:#000!important}}

.","stretch":"Correct a mix-up between “for” and “since”.","support":["I’ve studied English for three years.","I’ve already …, but I haven’t … yet.","How long have you …? – For … / Since …"]},{"title":"Good news","subtitle":"Things that matter now","main":"What good news have you received recently?","questions":["Have you passed a test?","Has someone helped you today?","Have you learned something useful?"],"challenge":"Share two examples with a result you can see now.","stretch":"Ask why the result matters.","support":["I’ve passed the test, so I’m happy.","I’ve already …, but I haven’t … yet.","How long have you …? – For … / Since …"]},{"title":"Lost and found","subtitle":"Recent problems","main":"Have you ever lost something important?","questions":["What have you lost before?","Have you ever found a lost phone?","Have you already looked everywhere?"],"challenge":"Role-play a conversation about a missing bag.","stretch":"Use one negative present perfect sentence.","support":["I’ve lost my keys. Have you seen them?","I’ve already …, but I haven’t … yet.","How long have you …? – For … / Since …"]},{"title":"This week","subtitle":"Unfinished time","main":"What have you done this week?","questions":["Have you met your friends this week?","Have you watched a good film today?","Have you finished your tasks yet?"],"challenge":"List four things that have happened so far this week.","stretch":"Explain why “last week” changes your choice of tense.","support":["I’ve watched two films this week.","I’ve already …, but I haven’t … yet.","How long have you …? – For … / Since …"]},{"title":"What happened when?","subtitle":"Two tenses","main":"What experiences have you had, and when did they happen?","questions":["Have you ever been to a concert?","When did you go?","Who did you go with?"],"challenge":"Interview your partner using both tenses.","stretch":"Correct “I’ve visited London last year”.","support":["I’ve been to a concert. I went last summer.","I’ve already …, but I haven’t … yet.","How long have you …? – For … / Since …"]},{"title":"An experience quiz","subtitle":"Speaking game","main":"What have your classmates tried or achieved?","questions":["Who has ever written a story?","Who has never flown in a plane?","Who has already tried a new sport?"],"challenge":"Make a quiz with five present perfect questions.","stretch":"Report three answers with “has” or “hasn’t”.","support":["Mia has tried skiing, but she hasn’t flown.","I’ve already …, but I haven’t … yet.","How long have you …? – For … / Since …"]}],"vocab":[["just","právě (teď)"],["already","už"],["yet","už (v otázce) / ještě (v záporu)"],["for","po dobu (for three years)"],["since","od (since 2020)"],["I have just finished","právě jsem dokončil(a)"],["I haven’t done it yet","ještě jsem to neudělal(a)"],["I’ve known her for years","znám ji už roky"],["has gone to","odjel(a) do (pravděpodobně dosud tam je)"],["has been to","byl(a) v (a vrátil(a) se)"],["this week","tento týden"],["so far","zatím, doposud"]],"toolkit":[["Result","I’ve just finished …"],["Unfinished","I haven’t … yet."],["Duration","I’ve known … for … years."],["Follow-up","Have you ever …?"]]},"B1":{"warm":"Start with “Have you ever…?” and then ask “When did you…?”. Compare the tenses.","stations":[{"title":"Life experience","subtitle":"General to specific","main":"What is an experience you have learned from?","questions":["Have you ever made a difficult decision?","How did it turn out?","What have you learned from it?"],"challenge":"Interview someone, starting with present perfect questions.","stretch":"Switch naturally to past simple for the details.","support":["I’ve made a few mistakes; I learned the most from one last month.","I’ve …, and I … last year.","I’ve been …, so I’ve …"]},{"title":"A changing routine","subtitle":"Since and for","main":"How has your life changed over the last few years?","questions":["How long have you studied at this school?","What have you enjoyed recently?","Which habits have you kept?"],"challenge":"Compare two changes that have continued up to now.","stretch":"Ask questions with both “since” and “for”.","support":["I’ve known my classmate since September.","I’ve …, and I … last year.","I’ve been …, so I’ve …"]},{"title":"A project update","subtitle":"Just, already and yet","main":"What progress have you made on a group project?","questions":["Which parts have you finished already?","What haven’t you completed yet?","Has anyone just made a useful suggestion?"],"challenge":"Give a realistic progress update for a fictional project.","stretch":"Discuss one problem that remains unsolved.","support":["We’ve finished the introduction, but we haven’t checked the sources yet.","I’ve …, and I … last year.","I’ve been …, so I’ve …"]},{"title":"Travel stories","subtitle":"Been or gone","main":"Have you ever visited somewhere unexpectedly?","questions":["Where have you been recently?","Who has gone away and hasn’t returned yet?","What did you do on the trip?"],"challenge":"Act out a phone call about someone’s location.","stretch":"Explain why “been” and “gone” aren’t always interchangeable.","support":["I’ve been to Brno; my brother has gone to Olomouc.","I’ve …, and I … last year.","I’ve been …, so I’ve …"]},{"title":"Learning over time","subtitle":"Present perfect continuous","main":"What have you been practising lately?","questions":["How long have you been working on this skill?","What progress have you made?","Are you still doing it?"],"challenge":"Compare an ongoing activity and a completed result.","stretch":"Use “have been doing” and “have done” appropriately.","support":["I’ve been practising guitar, and I’ve learned three songs.","I’ve …, and I … last year.","I’ve been …, so I’ve …"]},{"title":"The news today","subtitle":"Recent events","main":"What news have you heard today?","questions":["Has anything surprising happened?","Who has confirmed the information?","What happened earlier?"],"challenge":"Deliver a 30-second bulletin about fictional good news.","stretch":"Separately identify what happened at a finished past time.","support":["Scientists have discovered something interesting.","I’ve …, and I … last year.","I’ve been …, so I’ve …"]},{"title":"Correct the story","subtitle":"Error spotting","main":"Can you fix a short account that uses the wrong tense?","questions":["What’s wrong with “I’ve met her yesterday”?","Would you use “since” or “for” with two years?","How do you form a negative question?"],"challenge":"Correct four mistakes and explain one.","stretch":"Keep the conversation flowing after each correction.","support":["I’ve known her for two years; I met her in 2024.","I’ve …, and I … last year.","I’ve been …, so I’ve …"]},{"title":"My learning journey","subtitle":"Reflection","main":"What have you achieved since you started learning?","questions":["What have you found difficult?","How long have you worked on it?","What haven’t you mastered yet?"],"challenge":"Conduct a supportive progress interview.","stretch":"Summarize your partner’s progress with “has” and “hasn’t”.","support":["I’ve improved my speaking, but I haven’t mastered every tense yet.","I’ve …, and I … last year.","I’ve been …, so I’ve …"]}],"vocab":[["present perfect","předpřítomný čas"],["past simple","minulý čas prostý"],["I’ve been studying","už nějakou dobu se učím (důraz na průběh)"],["I learned it yesterday","naučil(a) jsem se to včera"],["How long have you…?","Jak dlouho už…?"],["unfinished time","dosud neukončené časové období"],["recently","nedávno, v poslední době"],["lately","v poslední době"],["still","stále, pořád"],["I’ve lived here since …","bydlím tady od …"],["a result","výsledek"],["an update","aktuální zpráva o stavu"]],"toolkit":[["Life experience","I’ve visited …"],["Past detail","I went there last year."],["Ongoing activity","I’ve been learning …"],["Progress","I’ve already …, but I haven’t … yet."]]},"B2":{"warm":"Compare “I’ve lived here for five years” with “I lived there for five years”. Who still lives there?","stations":[{"title":"Result or activity?","subtitle":"Simple or continuous perfect","main":"How does “I’ve painted the kitchen” differ from “I’ve been painting the kitchen”?","questions":["Which sentence tells us that the job is finished?","Which one explains why someone has paint on their clothes?","Why does “I’ve painted three rooms” sound better than “I’ve been painting three rooms”?"],"challenge":"Describe a fictional busy weekend with two results and two activities.","stretch":"Find a context where both forms are natural and explain the difference in focus.","support":["I’ve been … all day, so I’m tired.","I’ve finished …, so now I can …","The continuous form shows …"],"explanations":[["A finished job is a result you can see or check now. The question asks which of the two sentences guarantees that the kitchen is done.","Imagine a friend visits and hears one of the two sentences. Would your friend expect a newly painted kitchen in both cases? What might they see in each?"],["The continuous perfect often explains a present situation by pointing to a recent activity: tiredness, dirty hands, a messy room. The question asks which sentence fits that kind of explanation.","Someone asks: “Why are your hands blue?” Which of the two answers sounds like a natural reply, and why would the other one sound slightly strange?"],["When we count completed units (three rooms, five emails, two pages), we usually talk about a result. The question asks why a number pushes us towards the simple form.","Compare “I’ve been writing emails all morning” and “I’ve written twelve emails this morning”. Which detail in each sentence decides the form?"]]},{"title":"Open or closed period?","subtitle":"Today, this morning, so far","main":"Why can you say “I’ve had two coffees this morning” at 10 a.m. but not at 4 p.m.?","questions":["When is “this morning” still open?","Why do “so far”, “today” and “this year” often go with the present perfect?","Which time expressions always close the period?"],"challenge":"Make five sentences with time expressions and decide together whether each period is open or closed.","stretch":"Explain why “I’ve seen him yesterday” sounds wrong to most English speakers.","support":["It’s still …, so I can say …","The period has finished, so …","“Yesterday” closes the period because …"],"explanations":[["A time period is open while the speaker is still inside it. The question asks how the clock at the moment of speaking changes the tense.","It is 11 a.m. and you are talking about breakfast. Then it is 6 p.m. and you tell the same story. Which words in your sentence change?"],["Expressions like “so far”, “today” or “this year” include the moment of speaking. The question asks why they fit a tense that connects the past with now.","Finish these openings in two ways: “So far this year, I …” and “Last year, I …”. What do you notice about the verb forms you choose?"],["Some expressions point to a finished time: yesterday, last week, in 2020, two days ago. The question asks you to sort expressions into those that close the period and those that leave it open.","Sort these with your partner: recently, in May, ever, at 8 o’clock, lately, when I was ten. Which ones are tricky, and why?"]]},{"title":"Still a problem?","subtitle":"Present results","main":"Why does “I’ve lost my keys” sound like a problem, but “I lost my keys” sounds like a story?","questions":["What does the listener expect after “I’ve broken my arm”?","Can you say “I’ve lost my keys, but I found them”?","How does the present perfect make a past event feel like news?"],"challenge":"Role-play three small emergencies and react helpfully.","stretch":"Tell the same incident twice: once as current news and once as a finished anecdote.","support":["Oh no! Have you checked …?","It happened last year, so …","The problem still matters because …"],"explanations":[["“I’ve broken my arm” usually signals that the result is still there: a cast, pain, no sport. The question asks what reaction or question the speaker expects.","Your friend says it in the corridor. Then imagine a grandparent saying “I broke my arm when I was twelve.” How would your reactions differ?"],["The present perfect presents the result as current. The question asks whether that fits a second clause saying that the problem has already been solved.","Say both versions aloud: “I’ve lost my keys, but I found them” and “I lost my keys, but I found them”. Which one sounds logical, and what makes the other strange?"],["News is information that matters now. The question asks how the choice of tense can make the same fact sound fresh or finished.","Compare a message saying “The school has cancelled the trip!” and a diary entry saying “The school cancelled the trip.” Who might write each, and when?"]]},{"title":"Breaking news","subtitle":"From headline to details","main":"Why do news reports often start with the present perfect and then switch to the past simple?","questions":["What does “The government has announced new rules” tell us?","Why does the next sentence say “The minister made the announcement on Monday”?","What happens if a report stays in the present perfect for every detail?"],"challenge":"Present a 30-second news item about a fictional local event: one present perfect lead and three past simple details.","stretch":"Rewrite the item for a weekly summary and explain which tenses change.","support":["… has announced that …","The announcement came …","Witnesses said that …"],"explanations":[["A news lead presents an event as new and relevant without giving its exact time. The question asks what the reader learns from such a first sentence.","Read the lead and decide: Do you know when it happened? Do you know that it matters today? Which words tell you each?"],["Once a specific time, place or detail is mentioned, the event is anchored in the past. The question asks why the report changes tense at that moment.","Add three details to the lead: a day, a place and a quotation. Which tense do you use for each detail, and why?"],["Using only the present perfect for a whole story can sound unnatural, because details belong to a finished moment. The question asks what effect that would have on a listener.","Try telling a short report about a fictional fire using only “has …” forms. Where does it start to sound odd to your partner?"]]},{"title":"Knowing and having","subtitle":"Stative verbs and duration","main":"Why do we say “I’ve known her for years”, not “I’ve been knowing her”?","questions":["Which verbs usually avoid the continuous form?","Is there a difference between “I’ve lived here for ten years” and “I’ve been living here for ten years”?","Why is “I am here since Monday” a typical mistake for Czech speakers?"],"challenge":"Interview a partner about things they have had, known or belonged to for a long time.","stretch":"Find a stative verb that can be continuous with a different meaning, for example “I’ve been having problems”.","support":["I’ve had … since …","I’ve known … for …","In Czech we say …, but in English …"],"explanations":[["Stative verbs describe states, not actions: know, own, belong, believe. The question asks why such verbs normally appear in the simple form even with long periods.","Test these verbs in a sentence with “for years”: know, play, own, wait, believe, work. Which ones sound wrong in the continuous form?"],["With verbs like live, work or study, both forms are possible. The continuous form can make the situation sound temporary or recent; the simple form sounds more permanent. The question asks you to describe this subtle difference.","An exchange student and a grandparent who was born in the town both talk about where they live. Which form might each choose, and why?"],["Czech uses the present tense for a situation that started in the past and still continues (“jsem tady od pondělí”). English needs the present perfect. The question asks you to explain this typical transfer mistake.","Translate with your partner: “Znám ho od dětství.” “Bydlíme tady pět let.” “Jak dlouho se učíš anglicky?” Check each other’s versions."]]},{"title":"Firsts and bests","subtitle":"Experience patterns","main":"Why do we say “It’s the first time I’ve flown” and “the best film I’ve ever seen”?","questions":["Which verb form follows “It’s the first time …”?","Why does “ever” fit superlatives so well?","What does “It’s been ages since I last …” mean?"],"challenge":"Share three “firsts”, two “bests” and one “It’s been ages since …” about real or fictional experiences.","stretch":"Compare these patterns with a past situation: “It was the first time I had …”.","support":["It’s the first time I’ve …","It’s the best … I’ve ever …","It’s been ages since I last …"],"explanations":[["“It’s the first time” counts experiences up to the present moment, so English uses the present perfect after it. The question asks why another tense sounds wrong here.","You are on your first plane right now, and your partner says “It’s the first time I fly.” How would you correct it politely and explain why?"],["A superlative compares something with your whole experience up to now; “ever” means “at any time until now”. The question asks why these two fit together with the present perfect.","Complete with your partner and compare: “the most delicious meal I …”, “the strangest place I …”. Which verb forms did you both choose?"],["“It’s been ages since …” means that a long time has passed since the last occasion. The question asks you to explain the meaning and the tenses in this pattern.","Think of something you used to do but haven’t done for a long time. Say it with “It’s been ages since I last …”. Which tense follows “since” here?"]]},{"title":"The interview","subtitle":"Achievements and evidence","main":"How can the present perfect help you present your achievements in a job or school interview?","questions":["Why might “I’ve organised several events” work well as a first answer?","When should you add a past simple example with a date?","How can you avoid exaggerating?"],"challenge":"Role-play a short interview for a summer job; answer with a general claim and a concrete example.","stretch":"Challenge your partner’s claims politely by asking for one specific occasion.","support":["I’ve worked with … – for example, last summer I …","Could you give me a specific example?","When exactly did you …?"],"explanations":[["A present perfect claim summarises experience up to now without dates, which suits a first, general answer. The question asks why this can sound strong in an interview.","Compare two first answers: “I’ve led a team of volunteers.” and “I led a team in 2023.” Which one sounds like a summary of your skills, and which like a single story?"],["A general claim needs evidence. A concrete example with a time and a place usually moves into the past simple. The question asks where that switch belongs.","Your partner says “I’ve dealt with difficult customers.” Ask one follow-up question that requires a specific example, then listen for the change of tense."],["The present perfect can make experience sound bigger than it is. The question asks how to be persuasive and honest at the same time.","Rewrite this exaggerated claim more accurately: “I’ve managed big projects.” Which details would make it honest but still positive?"]]},{"title":"Error clinic","subtitle":"Typical mistakes of Czech speakers","main":"Which present perfect mistakes do Czech speakers make most often, and why?","questions":["What is wrong with “I have seen him yesterday”?","Why is “since three years” incorrect?","Why do learners say “How long are you here?” instead of “How long have you been here?”"],"challenge":"Create five incorrect sentences, swap them with another pair and correct them.","stretch":"Explain one mistake by comparing English and Czech grammar.","support":["The problem is that …","It should be …, because …","Czech uses …, but English …"],"explanations":[["“Yesterday” marks a finished time, while the present perfect connects the past with now. The question asks you to explain the clash.","Fix the sentence in two different ways: once by changing the verb, once by changing the time expression. Do both versions mean the same?"],["“Since” introduces a starting point (since 2023, since Monday); “for” introduces a length of time (for three years). The question asks why mixing them is wrong.","Make pairs with “since” or “for”: Christmas, two weeks, I was ten, ages, last summer. Then build one sentence for each."],["In Czech, “Jak dlouho jsi tady?” uses the present tense, and learners often translate it word for word. The question asks you to explain why English needs the present perfect.","Ask your partner three “How long have you …?” questions and answer each with “for” or “since”. Did either of you slip into the Czech pattern?"]]}],"vocab":[["I’ve been painting","maluju / maloval(a) jsem (důraz na činnost)"],["I’ve painted the room","vymaloval(a) jsem pokoj (důraz na výsledek)"],["current relevance","souvislost s přítomností"],["time frame","časový rámec"],["stative verb","stavové sloveso"],["It’s the first time I’ve …","je to poprvé, co …"],["It’s been ages since …","už je to věčnost, co …"],["the best … I’ve ever …","nejlepší …, jaký jsem kdy …"],["breaking news","nejnovější zprávy"],["an achievement","úspěch"],["a typical mistake","typická chyba"],["a counterexample","protipříklad"]],"toolkit":[["Result","I’ve written three pages."],["Activity","I’ve been writing all morning."],["Open period","So far this week, I’ve …"],["Finished time","I did it on Monday."]]},"C1":{"warm":"Discuss two implications of “We have already reached a decision.” Who might the speaker be talking to?","stations":[{"title":"What is implied?","subtitle":"Present relevance in discourse","main":"What does a speaker communicate beyond the facts by saying “We’ve reached a decision”?","questions":["Does “We’ve reached a decision” suggest that the discussion is closed?","When would “We reached a decision on Friday” be more appropriate?","How can the next sentence change the meaning?"],"challenge":"Deliver the same update to a fictional manager, a team and a close friend.","stretch":"Analyse which version gives the listener the least room to object.","support":["This wording implies that …","The listener may infer …","A more neutral version would be …"],"explanations":[["The present perfect presents the decision as a current state: it now exists and is in force. The question asks whether this framing signals that further discussion is unwelcome.","A team leader opens a meeting with this sentence. How might team members who wanted to discuss the issue feel? What could the leader add to keep the door open?"],["Adding a specific time anchors the event in the past and makes the report more neutral and historical. The question asks when that is the better choice.","Write two short notes: one informing a client today, one in a project log read months later. Which tense fits each, and why?"],["Implications are not fixed; the next sentence can confirm or cancel them. The question asks how context reshapes the meaning of the same clause.","Continue “We’ve reached a decision …” in three ways: “… and it’s final”, “… but we’d like your feedback”, “… which we may revisit”. How does the first clause sound different each time?"]]},{"title":"Irritation and enthusiasm","subtitle":"The continuous with emotional colouring","main":"Why can “I’ve been calling you all morning!” sound annoyed?","questions":["What does the continuous form add when an action is repeated?","How would “I’ve called you five times” sound different?","Can the same form express enthusiasm instead of irritation?"],"challenge":"Act out two reunions, one irritated and one excited, using perfect continuous forms.","stretch":"Rephrase an irritated message so that it remains honest but sounds calmer.","support":["I’ve been trying to …","I’ve called you … times.","I didn’t mean to sound …"],"explanations":[["With repeated actions, the continuous perfect presents them as one ongoing effort up to now. The question asks why this can sound emotional, especially in a complaint.","Say “I’ve been waiting for you” in two tones: patient and annoyed. Which words or intonation would help your partner recognise the emotion?"],["Counting actions (five times) sounds more factual than describing an ongoing effort. The question asks how the effect on the listener changes.","Your partner missed your calls. Which version would you rather hear: “I’ve called you five times” or “I’ve been calling you all morning”? Discuss why."],["The same grammatical form can carry very different feelings, depending on context. The question asks whether the perfect continuous is negative in itself.","Create one positive sentence with the same form, for example about a hobby or about looking forward to something. Does it sound warm or annoyed?"]]},{"title":"When you’ve finished","subtitle":"The perfect in time clauses","main":"Why do we say “Call me when you’ve finished” and not “when you will have finished”?","questions":["What does the present perfect show in “as soon as I’ve read it”?","Is there a difference between “when you finish” and “when you’ve finished”?","Why don’t we use “will” after “when” in such clauses?"],"challenge":"Give a partner instructions for a fictional task using “when”, “after”, “as soon as” and “once”.","stretch":"Find a context in which “when you finish” and “when you’ve finished” would lead to different actions.","support":["As soon as you’ve …, please …","Once I’ve …, I’ll …","There is a slight difference: …"],"explanations":[["In time clauses about the future, English uses present forms; the present perfect stresses that one action must be complete before the next one starts. The question asks what “as soon as I’ve read it” promises.","Your teacher says: “I’ll give you feedback as soon as I’ve read your essay.” What exactly must happen first? What would change with “as soon as I read it”?"],["Often both forms are possible, but the perfect underlines completion. The question asks whether you can hear a difference in emphasis.","Compare “Text me when you get home” and “Text me when you’ve got home.” Is there a situation in which the difference would matter?"],["English does not normally use “will” in time clauses after “when”, “after” or “as soon as”; the main clause carries the future meaning. The question asks you to describe this rule in your own words.","Correct together: “I’ll call you when I will have arrived.” Explain the correction to a learner who translates the Czech “až dorazím” word for word."]]},{"title":"What must have happened?","subtitle":"Speculating about the past","main":"How do “must have”, “might have” and “can’t have” help us guess what happened?","questions":["What is the difference between “She must have forgotten” and “She might have forgotten”?","When do we say “He can’t have seen it”?","Why is “You should have told me” more than a guess?"],"challenge":"Solve a fictional mystery (an empty classroom, a missing cake) by speculating with modal perfect forms.","stretch":"Rank your guesses from most to least certain and justify the ranking with clues.","support":["It must have been …, because …","They might have …","You shouldn’t have …"],"explanations":[["Modal perfects show how certain we are about a past event: “must have” means almost certain, “might”, “may” or “could have” mean possible. The question asks you to compare these degrees of certainty.","A friend didn’t come to the meeting. Say what you think happened at three levels of certainty. What evidence would move you from “might” to “must”?"],["“Can’t have” is a confident negative conclusion: we are almost sure something did not happen. The question asks when the evidence justifies such a strong claim.","The door is locked and the lights are off. Make one sentence with “can’t have” and explain which clue supports it."],["“Should have done” does not guess; it criticises or regrets a past action that did not happen. The question asks why it can sound like a reproach.","Turn “You should have told me” into a softer version for a colleague. Which words make it less accusing?"]]},{"title":"Mistakes have been made","subtitle":"Responsibility and the passive","main":"Why do official statements so often say “Mistakes have been made”?","questions":["Who is responsible in “Mistakes have been made”?","What changes in “We have made mistakes”?","When is it legitimate to leave the agent out?"],"challenge":"Write two apologies from a fictional company: one that hides responsibility and one that takes it.","stretch":"Ask follow-up questions that make the hidden agent visible.","support":["The sentence doesn’t say who …","Taking responsibility would mean …","Who exactly has …?"],"explanations":[["The passive perfect reports an action and its present relevance without naming who did it. The question asks what information disappears in this sentence.","Read the sentence as a journalist. Write down three questions you would ask the speaker immediately."],["The active voice with “we” makes the speaker part of the responsible group. The question asks how this changes trust and accountability.","Imagine you are a customer. Which version would make you more willing to accept the apology? Why?"],["Leaving out the agent can be fair when it is unknown, obvious or unimportant. The question asks you to distinguish fair omission from avoidance.","Decide for each: “The window has been broken.” “The results have been published.” “Your data has been shared.” In which case would you insist on knowing who did it?"]]},{"title":"Studies have shown","subtitle":"Academic and report style","main":"Why does academic English say “Studies have shown …” but “Smith (2019) argued …”?","questions":["What does the present perfect suggest about a body of research?","Why does a single dated study often appear in the past simple?","When might a writer prefer the present simple: “Smith argues …”?"],"challenge":"Summarise three fictional research findings using appropriate tenses.","stretch":"Discuss how tense choice can make research sound more or less up to date.","support":["Research has shown that …","In a 2019 study, … found that …","… argues that …"],"explanations":[["The present perfect presents findings as an accumulated body of knowledge that is still valid. The question asks why this is useful when summarising a research field.","Compare “Studies have shown that sleep improves memory” with “A study showed that …”. Which sounds like general knowledge, and which like one result?"],["A specific study with a date is a finished past event, so the past simple is common. The question asks why the date pushes the writer towards the past.","Write one sentence about a fictional experiment from 2015. Then try it in the present perfect. What sounds wrong?"],["Writers can also use the present simple to discuss an author’s ideas as part of an ongoing debate. The question asks what effect each tense has.","Rewrite “Smith argued that homework is useless” as “Smith argues …”. Does the idea sound more alive, more current or more open to debate?"]]},{"title":"Living and dead subjects","subtitle":"The experiential perfect","main":"Why does “Shakespeare has written many plays” sound odd, while “I’ve seen the Mona Lisa” is fine?","questions":["What does the present perfect assume about the subject?","Can a museum guide say “Picasso has painted …”?","How does the idea of a life span explain these sentences?"],"challenge":"Prepare a short museum talk about a fictional artist who is still alive and one who has died.","stretch":"Find an exception: when can a dead person appear with the present perfect, as in “Shakespeare has influenced …”?","support":["Since he is no longer alive, …","The work still …, so …","In this sentence the focus is on …"],"explanations":[["The experiential perfect counts experiences in a period that is still open, often a person’s life. The question asks why this sounds strange when the person’s life is over.","Compare: “My grandmother has travelled a lot” (she is alive) and “My great-grandfather has travelled a lot” (he died long ago). How does your partner react to each?"],["A museum guide can focus on the works, which still exist, rather than on the painter’s life. The question asks whether the subject or the object decides.","Test these: “Picasso painted Guernica.” “Guernica has been shown in many museums.” Which period is open in each sentence?"],["When the result or influence continues today, even a dead author can appear with the present perfect. The question asks you to find such contexts.","Complete: “Shakespeare has influenced …” and “Newton’s laws have …”. What links the past with the present in your sentences?"]]},{"title":"Polite pressure","subtitle":"Interpersonal framing","main":"Why might “Have you made a decision yet?” feel more pressing than “Did you decide?”","questions":["What does “yet” suggest about the speaker’s expectations?","How does “I’ve been wondering whether …” soften a request?","Which formulation leaves the other person room to say no?"],"challenge":"Rewrite three awkward questions to a teacher, a friend and a client more tactfully.","stretch":"Discuss when directness is better than softness.","support":["I’ve been wondering whether …","Have you had a chance to …?","No rush, but …"],"explanations":[["“Yet” implies that the speaker expects the action to happen and may be waiting for it. The question asks why this can sound like pressure.","Say “Have you finished?” and “Have you finished yet?” to your partner in a neutral tone. Which one feels more like a reminder?"],["“I’ve been wondering” presents the question as a long-standing, tentative thought rather than a demand. The question asks how this grammar creates politeness.","Turn “Can I have a day off?” into a request that begins with “I’ve been wondering …”. Does it sound more polite, more indirect or less clear?"],["Polite framing can give the other person space, but too much of it can sound unclear. The question asks you to compare formulations by how much freedom they leave.","Rank three versions from most to least pressing: “Have you done it?”, “Have you had a chance to look at it?”, “I need it today.” Discuss when each one is appropriate."]]}],"vocab":[["an implication","nevyslovený důsledek, implikace"],["to infer","vyvodit, usoudit"],["must have done","určitě udělal (téměř jisté)"],["might have done","možná udělal"],["can’t have done","nemohl to udělat (téměř jistě ne)"],["should have done","měl udělat (ale neudělal)"],["as soon as I’ve finished","jakmile dokončím"],["Mistakes have been made","Byly učiněny chyby"],["the agent","původce děje"],["Studies have shown","Studie ukázaly"],["I’ve been wondering","přemýšlím, zda …"],["a reproach","výčitka"]],"toolkit":[["Implication","This wording suggests that …"],["Speculation","She must have …"],["Criticism","You should have …"],["Caution","That doesn’t necessarily mean …"]]},"C2":{"warm":"Test the claim “The present perfect simply means the recent past.” Find two counterexamples.","stations":[{"title":"Four kinds of perfect","subtitle":"Beyond “recent past”","main":"Can one rule explain “I’ve been to Japan”, “I’ve lost my keys”, “I’ve lived here for years” and “The minister has resigned”?","questions":["Which sentence is about experience, result, continuation or hot news?","Is “recent past” true for all of them?","What, if anything, do they have in common?"],"challenge":"Classify ten examples into the four uses and defend borderline cases.","stretch":"Propose one unifying definition and test it against counterexamples.","support":["This example illustrates …","The common thread seems to be …","A counterexample would be …"],"explanations":[["Grammars often distinguish four uses: experiential (ever in life), resultative (a result now), continuative (a state up to now) and hot news (a new event). The question asks you to match the sentences to these uses.","Label each of the four sentences, then create a fifth example that seems to fit two categories at once."],["“I’ve been to Japan” can refer to a trip forty years ago, so “recent” is not a reliable criterion. The question asks how far the textbook rule holds.","Find one example that is recent but needs the past simple and one that is remote but takes the present perfect. What decides the tense instead of distance?"],["Many linguists describe the common core as “current relevance” or as a time span that includes now. The question asks whether such a general notion explains the data or merely labels it.","Test “current relevance” on “I’ve been to Japan”. In what sense is that trip relevant now? Is the explanation convincing or circular?"]]},{"title":"Two Englishes?","subtitle":"British and American preferences","main":"Is “Did you eat yet?” a mistake or a legitimate American usage?","questions":["Where is the past simple with “already”, “just” and “yet” common?","What kind of corpus evidence would show whether the difference is growing or shrinking?","How should a teacher or editor respond to mixed usage?"],"challenge":"Prepare advice on tense consistency for the editor of an international school magazine.","stretch":"Argue whether exams should accept both “Did you eat yet?” and “Have you eaten yet?”.","support":["In American usage …","A consistent style would …","Corpus data could show …"],"explanations":[["In informal American English, the past simple often appears with “just”, “already” and “yet” where British English prefers the present perfect. The question asks you to judge whether this is an error or a norm of a particular variety.","An American exchange student writes “I already ate.” A British teacher marks it wrong. Discuss whether the correction is fair."],["Corpus linguists compare large collections of texts to see how usage changes over time. The question asks what kind of evidence would support claims of convergence or divergence.","Design a simple mini-study: which phrases would you search for, in which kinds of texts, and how would you compare British and American results?"],["Editors usually aim for consistency within one text and for appropriateness to the audience, not for one universally correct form. The question asks how to handle a document written by people from different regions.","Your magazine has authors from London, Chicago and Prague. Draft a one-sentence style guideline on this tense question."]]},{"title":"The present perfect puzzle","subtitle":"Why “yesterday” is blocked","main":"Why is “I’ve seen him yesterday” impossible in standard English, when German and French allow the equivalent?","questions":["What do “Ich habe ihn gestern gesehen” and “Je l’ai vu hier” show?","Why can’t English combine the perfect with a definite past time?","Are there varieties or contexts in which English does it?"],"challenge":"Compare the English, German and French perfects in three minimal sentences.","stretch":"Evaluate an explanation of the “puzzle” and propose a counterargument.","support":["In German, the perfect can …","English, however, …","One explanation is that …"],"explanations":[["In German and French, the perfect has largely become a general past tense in speech, so it combines freely with “yesterday”. The question asks you to contrast this with English.","Translate “I saw him yesterday” into German or French and back again. What happens to the tense each time?"],["Linguists call this the “present perfect puzzle”: the English perfect seems to require a time span reaching up to now, which conflicts with a closed time such as yesterday. The question asks you to formulate this constraint.","Add different adverbs to “I’ve seen him …”: today, recently, before, on Monday, twice. Which combinations fail, and what do they have in common?"],["Some spoken contexts loosen the rule, for example sports commentary or narrative uses in some regional varieties. The question asks whether these are errors or signs of change.","A football commentator says: “He’s hit the post there, and the ball has gone out.” Is this the same as a timeline mistake? What makes it natural in commentary?"]]},{"title":"Headlines and spin","subtitle":"Framing an event","main":"How can tense choice shape how important, recent or settled an event appears?","questions":["What does “Company has cut 500 jobs” foreground compared with “Company cut 500 jobs in March”?","Why do headlines often use the present simple, as in “Minister resigns”?","When is a perfect technically true but misleading?"],"challenge":"Write three headlines for the same fictional event and analyse the effect of each one.","stretch":"Create a headline that uses tense to make an old event look new, then rewrite it transparently.","support":["This headline foregrounds …","By omitting the date, …","A more transparent version would be …"],"explanations":[["Without a date, the present perfect presents the event as current and relevant; a date makes it historical. The question asks what the reader assumes in each case.","Ask your partner when they think the job cuts happened in each version. Do your assumptions differ?"],["Headline style uses the present simple for recent events to keep them short and vivid. The question asks how this convention differs from the present perfect in the article itself.","Turn the headline “Minister resigns” into the first sentence of an article. Which tense do you use, and why?"],["A sentence can be literally true but create a false impression of timing or relevance. The question asks how to detect this.","A website says in 2026: “Our product has won an award.” The award was in 2014. Is this honest? How would you rewrite it?"]]},{"title":"Translating from Czech","subtitle":"Aspect versus tense","main":"How do Czech aspect and English perfect forms relate when you translate?","questions":["How would you translate “Už jsem to udělal”, “Bydlím tady od roku 2020” and “Četl jsem tu knihu”?","Does a Czech perfective verb always correspond to the English present perfect?","Which clues in the context decide the translation?"],"challenge":"Translate six Czech sentences into English and compare alternatives.","stretch":"Explain to a Czech learner why aspect and the perfect are different categories.","support":["The Czech sentence focuses on …","In English, the decisive factor is …","Both translations are possible if …"],"explanations":[["The three Czech sentences express a result, a state up to now and an experience or a past activity. The question asks which English forms fit each of them.","Translate them individually, then compare with your partner. Where did you choose different tenses, and could both be right?"],["Czech aspect marks whether an action is complete (udělat) or ongoing or repeated (dělat); English tense marks how the event relates to the present. The question asks whether these systems overlap.","Translate “Napsal jsem dopis” in two contexts: (a) the letter is lying on the table now; (b) it was in 1999. Which English tense appears in each?"],["Context, time adverbs and the speaker’s purpose often decide the English tense. The question asks you to identify such clues.","Translate “Viděl jsi ten film?” for a friend who is deciding what to watch tonight, and then for a teacher asking about last week’s lesson. Do you choose the same tense?"]]},{"title":"Scope and negation","subtitle":"What exactly is denied?","main":"What is the difference between “I haven’t always agreed with him” and “I’ve never agreed with him”?","questions":["Which statement allows for some agreement?","How can stress and intonation change the reading of “I haven’t always agreed”?","Why can such sentences be strategically vague?"],"challenge":"Rewrite an ambiguous public statement so that each possible reading becomes explicit.","stretch":"Discuss when vagueness is useful diplomacy and when it is evasion.","support":["This statement denies …","Another reading is …","To be unambiguous, one could say …"],"explanations":[["“Not always” denies that agreement was constant, so some agreement remains possible; “never” denies any agreement at all. The question asks you to describe the scope of each negation.","Draw a quick timeline of a ten-year working relationship for each sentence. Where do the moments of agreement appear?"],["Stress can shift the focus: “I haven’t ALWAYS agreed” versus “I haven’t always AGREED (sometimes I simply obeyed)”. The question asks how intonation influences interpretation.","Read the sentence with different stress patterns. Ask your partner what extra meaning they hear each time."],["Speakers sometimes choose formulations that allow several readings in order to avoid commitment. The question asks you to recognise this strategy.","A politician says: “I haven’t always supported this policy.” Write two follow-up questions that would force a clearer answer."]]},{"title":"English in motion","subtitle":"Variation and change","main":"Is the English present perfect becoming less common, or is it simply used differently?","questions":["Where do we hear narrative perfects such as “And then he’s come in and he’s grabbed my bag”?","How does sports commentary use the perfect?","Should learners imitate such patterns?"],"challenge":"Collect three examples from films, podcasts or commentary and classify them.","stretch":"Argue whether these uses show decline, change or simply register variation.","support":["This use seems typical of …","It differs from the standard pattern in that …","It would be risky for learners to …"],"explanations":[["In some informal varieties, for instance in parts of Australia and Britain, speakers use the present perfect to narrate past events vividly, which breaks the textbook rule. The question asks where such uses appear.","Read the example aloud with your partner. Does it sound like a mistake, a dialect or a dramatic storytelling style? Which clues guide your judgement?"],["Live commentary often uses the perfect for actions that have just happened and are still visible on screen. The question asks how this fits the idea of present relevance.","Commentate on an imaginary football move with your partner using “has …” forms. Then retell it as if it were the next day. Which tense do you use?"],["Learners have to decide whether a pattern is safe to copy in exams and formal writing. The question asks you to weigh authenticity against the risk of being marked wrong.","List two patterns you would use only in casual speech and two you would use anywhere. Justify your choice."]]},{"title":"Teaching the perfect","subtitle":"Rules of thumb and reality","main":"How would you teach the present perfect honestly without overwhelming learners?","questions":["Which rule of thumb is useful but incomplete?","How would you use timelines or real conversations?","Which exceptions should be postponed until a higher level?"],"challenge":"Design a ten-minute mini-lesson for A2 learners and present it.","stretch":"Critique your partner’s mini-lesson: what might mislead a learner later?","support":["A simple rule could be …","This would be misleading because …","At a higher level, learners should notice …"],"explanations":[["Rules such as “present perfect = recent past” or “use it with just, already and yet” help beginners but break down quickly. The question asks you to evaluate such shortcuts.","Pick one rule of thumb and find two sentences that break it. Would you still teach the rule? With what warning?"],["Timelines show the relation between a past event and now; authentic dialogues show real use. The question asks how to combine clarity with authenticity.","Sketch a timeline for “I’ve lived here since 2020” and for “I lived there from 2015 to 2020”. Explain both to your partner as if they were A2 learners."],["Good teaching sequences introduce the most frequent patterns first and leave rarer subtleties for later. The question asks you to set priorities.","Sort these into A2, B2 or C2: “for/since”, the American “Did you eat yet?”, “It’s the first time I’ve …”, the present perfect puzzle. Compare your order with another pair."]]}],"vocab":[["the experiential perfect","předpřítomný čas zkušenosti"],["the resultative perfect","předpřítomný čas výsledku"],["the continuative perfect","předpřítomný čas trvání"],["the hot-news perfect","předpřítomný čas čerstvé zprávy"],["temporal anchoring","časové ukotvení"],["the present perfect puzzle","„hádanka“ předpřítomného času"],["a corpus","korpus (rozsáhlý soubor textů)"],["a variety","varieta (jazyka)"],["the scope of negation","dosah záporu"],["to foreground","zdůraznit, postavit do popředí"],["grammatical aspect","slovesný vid / aspekt"],["a rule of thumb","orientační pravidlo"]],"toolkit":[["Classification","This is an experiential use."],["Counterexample","That doesn’t explain …"],["Variation","In some varieties …"],["Evaluation","A more defensible account is …"]]}},"uiSimple":{"eyebrow":"SPEAK · ASK · ANSWER · LISTEN","hero":"Ask short “Have you ever…?” questions, talk about things you have tried, and report what you have done today.","privacy":"You may invent experiences. Nobody has to share personal events. Different experiences are equally valuable.","step3":"Ask your partner a question.","step4":"Need more? Open the next task.","questions":"More questions","supportTitle":"Need help?","supportDesc":"Words to start your sentence.","supportShow":"Show help","supportHide":"Hide help","challengeTitle":"More to talk about","challengeDesc":"When you finish the main question.","challengeShow":"Show task","challengeHide":"Hide task","stretchTitle":"A harder task","stretchDesc":"When you want more.","stretchShow":"Show harder task","stretchHide":"Hide harder task","progress":"Say why. Give an example. Ask your partner.","vocabLabel":"USEFUL WORDS","vocabDesc":"Use the words that help you.","toolkitLabel":"USEFUL PHRASES","toolkitDesc":"Talk together: ask and answer.","title":"Present Perfect · Have you ever…?","strap":"What have you experienced, achieved or learned?"},"uiB1":{"stretchTitle":"Go one step further","stretchDesc":"A harder task for confident speakers.","vocabDesc":"Useful present perfect forms, time expressions and Czech translations.","progress":"Give reasons, examples and real reactions."}},"es":{"ui":{"title":"Pretérito perfecto compuesto · Experiencias y actualidad","strap":"¿Qué has hecho y qué ha cambiado?","brand":"LABORATORIO DE CONVERSACIÓN","subbrand":"Una conversación, no un examen","eyebrow":"HABLA · CUESTIONA · JUSTIFICA · RESPONDE","hero":"Practica el pretérito perfecto compuesto en español: experiencias, noticias recientes, participios, pronombres y contrastes con otros pasados, sin olvidar la variación regional.","privacy":"Puedes inventar tus experiencias. Nadie tiene que revelar información personal. Se respetan las diferentes variedades del español.","format":"Por parejas","estimated":"45–55 minutos","changeLevel":"Nivel MCER","changeLanguage":"Idioma","themeDay":"Claro","themeNight":"Oscuro","fullscreen":"Pantalla completa","exitFullscreen":"Salir de pantalla completa","resetLesson":"Reiniciar","levelGoal":"Objetivo oral","step1":"Piensa un momento.","step2":"Da una razón o un ejemplo.","step3":"Haz una pregunta a tu compañero o compañera.","step4":"Abre el reto si quieres seguir hablando.","warmTitle":"Calentamiento","warmTime":"2–3 min · opcional","warmHint":"Opcional: una actividad corta para empezar.","stations":"Estaciones de conversación","station":"Estación","of":"de","main":"PREGUNTA PRINCIPAL","questions":"Explora el tema","supportTitle":"¿Necesitas ayuda para expresarte?","supportDesc":"Frases útiles si no sabes cómo continuar.","supportShow":"Mostrar ayuda","supportHide":"Ocultar ayuda","challengeTitle":"Profundiza en la conversación","challengeDesc":"Usadlo cuando ya hayáis explorado la pregunta principal.","challengeShow":"Ver reto","challengeHide":"Ocultar reto","stretchTitle":"Ve un paso más allá","stretchDesc":"Una perspectiva más compleja para quien quiera profundizar.","stretchShow":"Ver ampliación","stretchHide":"Ocultar ampliación","previous":"Anterior","next":"Siguiente","stay":"Última estación","progress":"Da razones, ejemplos y respuestas auténticas.","vocabLabel":"VOCABULARIO ÚTIL","vocabDesc":"Expresiones y modelos del español con traducción al checo.","toolkitLabel":"RECURSOS PARA CONVERSAR","toolkitDesc":"Cuatro modelos útiles para hablar.","tipLabel":"Consejo","timerLabel":"TEMPORIZADOR","timerInit":"Toca el reloj para indicar un tiempo","timerRunning":"Cuenta atrás en marcha","timerPaused":"En pausa · toca para editar","timerReady":"Listo · toca para editar","timerDone":"Fin del tiempo · «Reiniciar»: el mismo tiempo otra vez","timerStart":"Iniciar","timerPause":"Pausar","timerReset":"Reiniciar","timerEdit":"Configurar la cuenta atrás","timerMinutes":"Minutos","timerSeconds":"Segundos","timerHelp":"Escribe los minutos y los segundos.","timerError":"Tiempo: de 00:05 a 99:59. Segundos: de 00 a 59.","timerSet":"Guardar","timerCancel":"Cancelar","timerSetToast":"Tiempo preparado. Pulsa Iniciar.","timerFinishToast":"¡Fin del tiempo!","timerDrag":"Mover el temporizador","timerExpand":"Mostrar controles del temporizador","timerCollapse":"Ocultar controles del temporizador","lessonResetToast":"Actividad reiniciada","fullError":"Este navegador no permite la pantalla completa.","formatHint":"CONVERSACIÓN EN PAREJAS","goalA1":"Formar «haber + participio» y hacer preguntas sobre actividades recientes.","goalA2":"Hablar de experiencias, tareas completadas y acciones pendientes.","goalB1":"Distinguir el perfecto del indefinido según el contexto y la variedad.","goalB2":"Usar pronombres, participios irregulares y marcadores temporales con precisión.","goalC1":"Expresar anterioridad, conjeturas, responsabilidad y matices con formas compuestas.","goalC2":"Justificar interpretaciones temporales y decisiones estilísticas complejas.","tipA1":"El participio con «haber» no concuerda: «he escrito las cartas».","tipA2":"Recuerda: «he, has, ha, hemos, habéis, han»; «hacer → hecho».","tipB1":"El uso de perfecto e indefinido depende de la región: no hay una regla universal con «hoy».","tipB2":"«Se lo he dicho»: los pronombres átonos van delante de «haber», nunca entre «haber» y el participio.","tipC1":"«Habrá salido ya» puede expresar una suposición sobre el pasado, no solo un hecho futuro.","tipC2":"Distingue una preferencia dialectal, un matiz discursivo y un error morfológico.","startLesson":"Empezar a conversar →","offline":"Sin conexión","controlsAria":"Controles de la actividad","stationNavAria":"Estaciones de conversación","questionHelpTip":"Abrid una pregunta para ver una explicación sencilla y una propuesta concreta para debatir.","questionHelpOpen":"Explicar","questionHelpClose":"Ocultar","questionHelpMeaning":"¿QUÉ SIGNIFICA?","questionHelpTry":"EJEMPLO O ACTIVIDAD"},"levels":{"A1":{"warm":"Completa: «Hoy he…», «He comido…» y «¿Has visto…?».","stations":[{"title":"Hoy he…","subtitle":"Mi día en tres frases","main":"¿Qué has hecho hoy?","questions":["¿Has desayunado?","¿Has estudiado español?","¿Has hablado con un amigo?"],"challenge":"Di tres frases con «he + participio».","stretch":"Pregunta a tu compañero qué ha hecho hoy.","support":["Hoy he estudiado y he escuchado música.","Hoy he … / He …","¿Has …? – Sí, he … / No, no he …"]},{"title":"La comida","subtitle":"Lo que he comido","main":"¿Qué has comido hoy?","questions":["¿Has comido fruta?","¿Has bebido agua?","¿Has preparado algo?"],"challenge":"Cuenta dos cosas que has comido.","stretch":"Haz tres preguntas con «¿Has…?».","support":["He comido una manzana y he bebido agua.","Hoy he … / He …","¿Has …? – Sí, he … / No, no he …"]},{"title":"En clase","subtitle":"Aprender español","main":"¿Qué has aprendido esta semana?","questions":["¿Has escrito una frase?","¿Has leído un texto?","¿Has entendido la actividad?"],"challenge":"Nombra tres cosas que has hecho en clase.","s

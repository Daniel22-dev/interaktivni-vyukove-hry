habt ihr dort gesehen?","Wann seid ihr zurückgekommen?"],"challenge":"Plant einen erfundenen Ausflug und berichtet im Perfekt.","stretch":"Baue mindestens drei Verben mit „sein“ ein.","support":["Wir sind in die Stadt gefahren und haben Fotos gemacht.","Zuerst habe ich …, danach bin ich …","Ich habe schon …, aber noch nicht …"]},{"title":"Zu Hause geholfen","subtitle":"Pflichten","main":"Wobei hast du zu Hause geholfen, und was hast du erledigt?","questions":["Hast du dein Zimmer aufgeräumt?","Hast du eingekauft?","Hast du den Müll rausgebracht?"],"challenge":"Beschreibe vier erledigte Aufgaben.","stretch":"Bilde einen Satz mit „nicht“ und erkläre den Grund.","support":["Ich habe mein Zimmer aufgeräumt.","Zuerst habe ich …, danach bin ich …","Ich habe schon …, aber noch nicht …"]},{"title":"Etwas Neues","subtitle":"Erfahrungen","main":"Was hast du schon einmal ausprobiert?","questions":["Hast du schon einmal Sushi gegessen?","Hast du ein neues Spiel ausprobiert?","Was hast du noch nie gemacht?"],"challenge":"Frage drei Personen nach ihren Erfahrungen.","stretch":"Unterscheide „schon einmal“ und „noch nie“.","support":["Ich habe schon einmal Sushi probiert.","Zuerst habe ich …, danach bin ich …","Ich habe schon …, aber noch nicht …"]},{"title":"Eine Überraschung","subtitle":"Unerwartete Dinge","main":"Was ist dir neulich passiert?","questions":["Hast du etwas verloren?","Hast du etwas wiedergefunden?","Ist etwas kaputtgegangen?"],"challenge":"Erfinde eine kleine Überraschungsgeschichte.","stretch":"Baue eine Rückfrage mit „Warum?“ ein.","support":["Mein Handy ist kaputtgegangen.","Zuerst habe ich …, danach bin ich …","Ich habe schon …, aber noch nicht …"]},{"title":"Sport und Freizeit","subtitle":"Aktivitäten","main":"Was hast du am letzten freien Tag unternommen?","questions":["Bist du schwimmen gegangen?","Hast du Fußball gespielt?","Wie lange hast du trainiert?"],"challenge":"Vergleicht zwei verschiedene Wochenenden.","stretch":"Benutze „weil“ in einer Begründung.","support":["Ich bin schwimmen gegangen, weil ich Zeit hatte.","Zuerst habe ich …, danach bin ich …","Ich habe schon …, aber noch nicht …"]},{"title":"Ein Problem lösen","subtitle":"Hilfe holen","main":"Was hast du gemacht, als etwas nicht geklappt hat?","questions":["Hast du jemanden angerufen?","Hast du um Hilfe gebeten?","Hat dir jemand geholfen?"],"challenge":"Spielt ein Telefongespräch über ein kleines Problem.","stretch":"Stellt mindestens zwei W-Fragen im Perfekt.","support":["Ich habe meine Freundin angerufen und um Hilfe gebeten.","Zuerst habe ich …, danach bin ich …","Ich habe schon …, aber noch nicht …"]},{"title":"Wochenrückblick","subtitle":"Gemeinsam erzählen","main":"Was ist in deiner Woche gut gelaufen?","questions":["Was hast du gelernt?","Mit wem hast du gesprochen?","Was hast du nicht geschafft?"],"challenge":"Berichtet abwechselnd über eine erfundene Woche.","stretch":"Unterscheidet fünf Verben mit „haben“ und „sein“.","support":["Diese Woche habe ich viel gelernt, aber ich bin kaum ausgegangen.","Zuerst habe ich …, danach bin ich …","Ich habe schon …, aber noch nicht …"]}],"vocab":[["aufgeräumt","uklidil(a)"],["eingekauft","nakoupil(a)"],["angerufen","zavolal(a)"],["ausprobiert","vyzkoušel(a)"],["kaputtgegangen","rozbil(o) se / pokazil(o) se"],["zurückgekommen","vrátil(a) se"],["aufgestanden","vstal(a)"],["eingeschlafen","usnul(a)"],["schon einmal","už někdy"],["noch nie","ještě nikdy"],["zuerst","nejdřív"],["danach","potom"]],"toolkit":[["Abfolge","Zuerst habe ich …, dann bin ich …"],["Verneinung","Ich habe noch nicht …"],["Erfahrung","Ich habe schon einmal …"],["Begründung","Ich habe …, weil …"]]},"B1":{"warm":"Erzählt abwechselnd, wie ein kleines Missgeschick passiert ist. Benutzt mindestens vier Perfektformen.","stations":[{"title":"Eine Panne erzählen","subtitle":"Bericht mit Folgen","main":"Was ist auf einer Reise schiefgelaufen?","questions":["Was ist zuerst passiert?","Wer hat geholfen?","Wie habt ihr das Problem gelöst?"],"challenge":"Erzählt von einer erfundenen Zugpanne in sechs Schritten.","stretch":"Erklärt, warum das Ereignis heute noch wichtig ist.","support":["Wir haben den Zug verpasst und sind zu spät angekommen.","Zunächst ist … passiert, dann habe ich …","Das hat mich überrascht, weil …"]},{"title":"Der letzte Besuch","subtitle":"Menschen und Erlebnisse","main":"Wie erzählst du von einem besonderen Besuch?","questions":["Wen hast du getroffen?","Was habt ihr miteinander unternommen?","Was hat dich dabei überrascht?"],"challenge":"Spielt ein Interview über eine erfundene Begegnung.","stretch":"Verwende mindestens zwei Nebensätze mit „dass“ oder „weil“.","support":["Ich habe jemanden getroffen, den ich lange nicht gesehen hatte.","Zunächst ist … passiert, dann habe ich …","Das hat mich überrascht, weil …"]},{"title":"Was erledigt ist","subtitle":"Ergebnisse","main":"Welche Aufgaben hast du in letzter Zeit geschafft?","questions":["Was hast du schon erledigt?","Was hast du noch nicht gemacht?","Warum hat etwas länger gedauert?"],"challenge":"Plant ein Schulprojekt und gebt einen Zwischenstand im Perfekt.","stretch":"Erklärt den Unterschied zwischen Handlung und Ergebnis.","support":["Ich habe den Text geschrieben, aber die Bilder habe ich noch nicht ausgewählt.","Zunächst ist … passiert, dann habe ich …","Das hat mich überrascht, weil …"]},{"title":"Berichte vergleichen","subtitle":"Perfekt und Präteritum","main":"Wie erzählst du im Gespräch von der Vergangenheit?","questions":["Welche Verben hörst du oft im Präteritum?","Warum sagt man häufig „ich war“ statt „ich bin gewesen“?","Wie klingt derselbe Bericht in gesprochener Sprache?"],"challenge":"Erzählt eine kurze Geschichte mit Perfekt und „war/hatte“.","stretch":"Vergleicht die beiden Zeitformen, ohne eine als grundsätzlich falsch zu bezeichnen.","support":["Ich war müde und habe deshalb früh geschlafen.","Zunächst ist … passiert, dann habe ich …","Das hat mich überrascht, weil …"]},{"title":"Ein überraschender Fund","subtitle":"Unregelmäßige Formen","main":"Was hast du einmal zufällig entdeckt?","questions":["Was hast du gefunden?","Wohin hast du den Fund gebracht?","Was ist danach geschehen?"],"challenge":"Erfindet einen spannenden, aber glaubwürdigen Fundbericht.","stretch":"Verwendet „gefunden“, „genommen“ und „gebracht“ korrekt.","support":["Ich habe einen Schlüssel gefunden und zur Rezeption gebracht.","Zunächst ist … passiert, dann habe ich …","Das hat mich überrascht, weil …"]},{"title":"Neue Erfahrungen","subtitle":"Schon einmal …?","main":"Welche Erfahrung hat dich besonders beeindruckt?","questions":["Was hast du vorher noch nie probiert?","Wie hat sich deine Meinung danach verändert?","Würdest du es wieder machen?"],"challenge":"Führt eine Umfrage mit offenen Anschlussfragen durch.","stretch":"Unterscheidet Erfahrung und konkreten Zeitpunkt im Bericht.","support":["Ich habe zum ersten Mal eine fremde Sprache ausprobiert.","Zunächst ist … passiert, dann habe ich …","Das hat mich überrascht, weil …"]},{"title":"Pläne geändert","subtitle":"Perfekt mit trennbaren Verben","main":"Welche Pläne habt ihr kurzfristig geändert?","questions":["Warum habt ihr abgesagt?","Was habt ihr stattdessen gemacht?","Wen habt ihr informiert?"],"challenge":"Spielt eine Sprachnachricht mit einer verständlichen Erklärung.","stretch":"Verwendet „abgesagt“, „umgeplant“ und „mitgebracht“.","support":["Wir haben den Ausflug abgesagt und einen neuen Termin ausgemacht.","Zunächst ist … passiert, dann habe ich …","Das hat mich überrascht, weil …"]},{"title":"Ein echter Wochenrückblick","subtitle":"Erzählen und reagieren","main":"Wie erzählst du ein Ereignis so, dass andere nachfragen?","questions":["Was ist passiert?","Wie haben die Beteiligten reagiert?","Was habt ihr daraus gelernt?"],"challenge":"Erzählt eine erfundene Anekdote und reagiert auf drei Nachfragen.","stretch":"Achtet auf Satzklammer, Reihenfolge und eine klare Pointe.","support":["Wir haben lange gesucht, bis wir den Weg gefunden haben.","Zunächst ist … passiert, dann habe ich …","Das hat mich überrascht, weil …"]}],"vocab":[["verpasst","zmeškal(a)"],["geschafft","zvládl(a)"],["geholfen","pomohl(a)"],["besprochen","probral(a)"],["abgesagt","zrušil(a)"],["gelungen","podařilo se"],["das Präteritum","jednoduchý minulý čas"],["ich war","byl(a) jsem"],["ich hatte","měl(a) jsem"],["telefoniert","telefonoval(a)"],["verstanden","pochopil(a), rozuměl(a)"],["mitgebracht","přinesl(a) s sebou"]],"toolkit":[["Bericht","Am Wochenende ist … passiert."],["Rückfrage","Wie ist das genau passiert?"],["Erklärung","Das hat mich überrascht, weil …"],["Korrektur","Es heißt „ich bin gekommen“."]]},"B2":{"warm":"Vergleicht „Ich habe ihn gestern getroffen“ und „Ich traf ihn gestern“: Was klingt im Gespräch natürlicher?","stations":[{"title":"haben oder sein?","subtitle":"Bewegung und Zustandsveränderung","main":"Warum heißt es „ich bin eingeschlafen“, aber „ich habe geschlafen“?","questions":["Welche Verben drücken eine Zustandsveränderung aus?","Warum heißt es „ich bin geblieben“, obwohl sich nichts bewegt?","Wie unterscheiden sich „ich bin gefahren“ und „ich habe das Auto gefahren“?"],"challenge":"Erzählt einen chaotischen Morgen mit mindestens sechs Verben, die das Perfekt mit „sein“ bilden.","stretch":"Formuliert eine Faustregel und prüft sie an drei Ausnahmen.","support":["Bei einer Zustandsveränderung …","„Bleiben“ ist eine Ausnahme, weil …","Mit Akkusativobjekt …"],"explanations":[["Verben, die einen Übergang von einem Zustand in einen anderen ausdrücken (einschlafen, aufwachen, sterben, wachsen), bilden das Perfekt mit „sein“. Die Frage verlangt, diese Gruppe zu erkennen.","Sortiert: schlafen, einschlafen, aufwachen, arbeiten, sterben, lachen, werden, wachsen. Welche Verben bezeichnen eine Veränderung?"],["„Sein“, „bleiben“ und „werden“ bilden das Perfekt mit „sein“, obwohl sie keine Bewegung ausdrücken. Die Frage verlangt, diese Ausnahmen bewusst wahrzunehmen.","Bildet je einen Satz: „Ich … krank geworden“, „Wir … zu Hause geblieben“, „Sie … in Berlin gewesen“. Vergleicht mit dem Tschechischen."],["Mit einem Akkusativobjekt wird ein Bewegungsverb transitiv und bildet das Perfekt mit „haben“: Ich bin nach Prag gefahren / Ich habe das Auto gefahren. Die Frage verlangt, den Unterschied zu erklären.","Bildet Paare mit „fliegen“ und „reiten“: einmal ohne, einmal mit Objekt. Prüft gegenseitig das Hilfsverb."]]},{"title":"aufgestanden, verstanden, studiert","subtitle":"Die Bildung des Partizips II","main":"Warum heißt es „aufgestanden“, aber „verstanden“ und „studiert“?","questions":["Wo steht „ge-“ bei trennbaren Verben?","Warum haben untrennbare Verben wie „besuchen“ kein „ge-“?","Was passiert mit Verben auf „-ieren“?"],"challenge":"Erstellt ein Quiz mit zehn Partizipien aus drei Gruppen und testet ein anderes Paar.","stretch":"Erklärt den Unterschied zwischen „übersetzt“ (untrennbar) und „übergesetzt“ (trennbar).","support":["Bei trennbaren Verben steht „ge-“ …","Untrennbare Präfixe wie be-, ver-, er- …","Verben auf -ieren …"],"explanations":[["Bei trennbaren Verben steht „ge-“ zwischen Präfix und Stamm: auf-ge-standen, ein-ge-kauft. Die Frage verlangt, diese Stelle zu bestimmen.","Bildet das Partizip II von: anrufen, mitbringen, zurückkommen, fernsehen. Sprecht die Formen laut aus: Wo liegt die Betonung?"],["Untrennbare Präfixe (be-, ver-, er-, ent-, zer-, ge-, miss-) sind unbetont und verhindern ein zusätzliches „ge-“. Die Frage verlangt, diese Regel anzuwenden.","Bildet das Partizip von: besuchen, vergessen, erklären, zerstören. Prüft: Ist das Präfix betont?"],["Verben auf „-ieren“ werden auf der letzten Silbe betont und bilden das Partizip ohne „ge-“: studiert, telefoniert, passiert. Die Frage verlangt, das Muster zu erkennen.","Sammelt fünf Verben auf „-ieren“ und erzählt damit, was gestern passiert ist."]]},{"title":"Ich habe warten müssen","subtitle":"Modalverben im Perfekt","main":"Wie erzählst du im Perfekt, was du tun musstest oder konntest?","questions":["Warum heißt es „ich habe warten müssen“ und nicht „ich habe warten gemusst“?","Wann sagt man trotzdem „ich habe es gemusst“?","Klingt „ich musste warten“ im Gespräch natürlicher?"],"challenge":"Erzählt einen Tag voller Pflichten mit drei Modalverben, einmal im Perfekt und einmal im Präteritum.","stretch":"Diskutiert, welche Form ihr in einer Nachricht an Freunde wählen würdet.","support":["Ich habe … müssen.","Das habe ich nicht gekonnt.","Im Gespräch sagt man eher …"],"explanations":[["Wenn ein Modalverb mit einem Infinitiv steht, verwendet man im Perfekt den Infinitiv statt des Partizips (Ersatzinfinitiv): „Ich habe warten müssen.“ Die Frage verlangt, diese Form zu erklären.","Formt um: „Ich musste lange warten.“ „Wir konnten nicht kommen.“ „Er durfte nicht mitspielen.“ Schreibt die Perfektform."],["Ohne Infinitiv verwendet man das normale Partizip: „Ich habe es nicht gekonnt.“ Die Frage verlangt, beide Fälle zu vergleichen.","Bildet zwei Sätze mit „wollen“: einmal mit Infinitiv, einmal ohne. Was ändert sich an der Form?"],["Modalverben stehen im Gespräch häufig im Präteritum, weil die Perfektform lang und schwerfällig wirkt. Die Frage verlangt, die Wirkung beider Formen zu vergleichen.","Sagt beide Sätze laut: „Ich musste gestern arbeiten“ und „Ich habe gestern arbeiten müssen.“ Welcher klingt für euch natürlicher?"]]},{"title":"Perfekt oder Präteritum?","subtitle":"Im Gespräch und im Text","main":"Warum sagt man im Gespräch „ich war“ und „ich hatte“, aber „ich habe gegessen“?","questions":["Welche Verben stehen auch mündlich oft im Präteritum?","Wann wirkt ein Bericht im Präteritum zu schriftlich?","Gibt es dabei Unterschiede zwischen Nord- und Süddeutschland?"],"challenge":"Erzählt dieselbe Anekdote zuerst als Gespräch, dann als kurzen Zeitungstext.","stretch":"Unterscheidet typische Tendenzen von festen Regeln.","support":["Ich war …, und dann habe ich …","Im Text würde ich schreiben …","Im Süden hört man eher …"],"explanations":[["„Sein“, „haben“ und die Modalverben stehen auch mündlich meist im Präteritum; die meisten anderen Verben im Perfekt. Die Frage verlangt, diese Verteilung zu beschreiben.","Erzählt euren gestrigen Abend in vier Sätzen. Zählt danach: Welche Verben standen im Präteritum?"],["Das Präteritum ist das typische Erzähltempus geschriebener Texte; im Gespräch kann es förmlich oder literarisch wirken. Die Frage verlangt, diese Wirkung zu erkennen.","Erzählt: „Ich ging nach Hause, aß etwas und schlief ein.“ Wie reagiert euer Partner? Klingt das wie ein Gespräch?"],["Im Süden des deutschen Sprachraums (Bayern, Österreich, Schweiz) wird das Präteritum mündlich noch seltener verwendet als im Norden. Die Frage verlangt, regionale Tendenzen zu nennen.","Wie würde jemand aus Wien „Ich war gestern im Kino“ vielleicht sagen? Vergleicht eure Vermutungen."]]},{"title":"Es ist repariert worden","subtitle":"Das Perfekt Passiv","main":"Wie berichtest du im Perfekt, was mit etwas gemacht worden ist?","questions":["Wie bildet man „Das Fahrrad ist repariert worden“?","Warum heißt es „worden“ und nicht „geworden“?","Wann ist das Passiv in einem Bericht sinnvoll?"],"challenge":"Berichtet über die Renovierung eurer erfundenen Schule mit fünf Passivsätzen im Perfekt.","stretch":"Formt die Sätze ins Aktiv um und vergleicht, welche Informationen dazukommen.","support":["… ist … worden.","Die Wände sind … worden.","Wer hat …?"],"explanations":[["Das Perfekt Passiv besteht aus „sein“ + Partizip II + „worden“. Die Frage verlangt, die drei Teile zu erkennen.","Formt um: „Man hat das Fenster geöffnet.“ → „Das Fenster ist …“ Macht dasselbe mit „Man hat die Prüfungen korrigiert.“"],["Im Passiv verliert „geworden“ sein „ge-“: „worden“. „Geworden“ steht nur, wenn „werden“ Vollverb ist (Er ist Arzt geworden). Die Frage verlangt, die beiden Formen zu unterscheiden.","Vergleicht: „Es ist dunkel geworden“ und „Es ist gebaut worden.“ Erklärt den Unterschied eurem Partner."],["Das Passiv rückt die Handlung oder das Ergebnis in den Vordergrund; wer gehandelt hat, ist dabei unwichtig oder unbekannt. Die Frage verlangt, die Funktion zu beurteilen.","Schreibt eine Mitteilung des Hausmeisters: „Die Heizung ist …“ Fehlt dem Leser eine Information?"]]},{"title":"Wo steht das Verb?","subtitle":"Satzklammer und Nebensatz","main":"Wo stehen Hilfsverb und Partizip in Haupt- und Nebensätzen?","questions":["Wo steht das Partizip im Hauptsatz?","Was passiert nach „weil“, „dass“ oder „obwohl“?","Wo steht „nicht“ in „Ich habe das Buch nicht gelesen“?"],"challenge":"Verbindet sechs Sätze mit „weil“, „obwohl“ und „nachdem“ und prüft gegenseitig die Wortstellung.","stretch":"Erklärt einer tschechischen Lernerin, warum die Satzklammer für sie ungewohnt ist.","support":["…, weil ich … habe.","Das Partizip steht am …","„Nicht“ steht vor …"],"explanations":[["Im Hauptsatz bildet das Perfekt eine Satzklammer: Hilfsverb auf Position 2, Partizip II am Satzende. Die Frage verlangt, diese Klammer zu erkennen.","Baut einen langen Satz: „Ich habe gestern mit meiner Schwester im Park … gespielt.“ Ergänzt immer mehr Informationen in der Mitte."],["Im Nebensatz steht das konjugierte Hilfsverb ganz am Ende, nach dem Partizip: „…, weil ich zu spät gekommen bin.“ Die Frage verlangt, diese Umstellung zu üben.","Verbindet „Ich bin müde. Ich habe schlecht geschlafen.“ mit „weil“. Dann „Ich gehe raus. Es hat geregnet.“ mit „obwohl“."],["„Nicht“ steht meistens vor dem Partizip, wenn es den ganzen Satz verneint. Die Frage verlangt, die Position von „nicht“ zu bestimmen.","Verneint: „Ich habe das Buch gelesen.“ „Wir sind ins Kino gegangen.“ „Er hat mich angerufen.“ Wo steht „nicht“ jeweils?"]]},{"title":"Bis morgen habe ich das erledigt","subtitle":"Perfekt mit Zukunftsbezug","main":"Wie kann das Perfekt über die Zukunft sprechen?","questions":["Was bedeutet „Bis morgen habe ich das erledigt“?","Warum klingt das Futur II „werde erledigt haben“ oft steif?","Wie benutzt man „wenn“ mit Perfekt: „Wenn du gegessen hast, gehen wir“?"],"challenge":"Plant zu zweit einen stressigen Tag mit Fristen und Bedingungen.","stretch":"Vergleicht mit dem Englischen „when you’ve finished“ oder dem Tschechischen „až dojíš“.","support":["Bis … habe ich …","Wenn du … hast, …","Sobald wir … sind, …"],"explanations":[["Das Perfekt kann ein Ergebnis beschreiben, das zu einem künftigen Zeitpunkt abgeschlossen sein wird. Die Frage verlangt, diese Bedeutung zu erklären.","Eure Lehrerin fragt, wann das Referat fertig ist. Antwortet mit „Bis … habe ich …“. Was verspricht ihr damit genau?"],["Das Futur II drückt dasselbe aus, ist im Alltag aber selten und klingt förmlich. Die Frage verlangt, die beiden Formen zu vergleichen.","Sagt beide Varianten laut. In welcher Situation würdet ihr das Futur II wirklich benutzen?"],["Nach „wenn“, „sobald“ oder „nachdem“ kann das Perfekt eine Handlung ausdrücken, die vor einer zukünftigen Handlung abgeschlossen sein muss. Die Frage verlangt, solche Sätze zu bilden.","Ergänzt: „Sobald ich … habe, rufe ich dich an.“ „Wenn ihr … seid, beginnen wir.“"]]},{"title":"Die Reklamation","subtitle":"Höflich, aber klar","main":"Wie erklärst du höflich, was bei einer Bestellung schiefgelaufen ist?","questions":["Was hast du bestellt, und was ist geliefert worden?","Wie beschreibst du den Ablauf ohne Vorwürfe?","Welche Lösung forderst du?"],"challenge":"Spielt ein Telefongespräch mit einem Kundenservice.","stretch":"Wechselt die Rollen: Der Kundenservice erklärt im Perfekt, was schon unternommen worden ist.","support":["Ich habe am … bestellt, aber …","Leider ist … geliefert worden.","Ich hätte gern …"],"explanations":[["In einer Reklamation beschreibt man zuerst klar, was vereinbart war und was tatsächlich passiert ist. Das Perfekt passt, weil das Problem noch aktuell ist. Die Frage verlangt, diese Fakten zu ordnen.","Notiert drei Fakten: das Datum der Bestellung, den bestellten Artikel und den gelieferten Artikel. Formuliert sie im Perfekt."],["Sachliche Formulierungen und das Passiv können Vorwürfe abschwächen: „Es ist ein falscher Artikel geliefert worden“ statt „Sie haben falsch geliefert“. Die Frage verlangt, den Ton zu bewerten.","Vergleicht die beiden Formulierungen. Welche würde ein Kundenservice lieber hören? Welche ist klarer?"],["Eine gute Reklamation endet mit einer konkreten Bitte: Umtausch, Rückerstattung oder Preisnachlass. Die Frage verlangt, eine passende Lösung zu formulieren.","Formuliert eure Forderung höflich und konkret. Euer Partner reagiert als Kundenservice."]]}],"vocab":[["der Ersatzinfinitiv","náhradní infinitiv"],["warten müssen","muset čekat"],["repariert worden","byl(o) opraveno"],["die Satzklammer","větný rámec"],["die Zustandsveränderung","změna stavu"],["ich bin eingeschlafen","usnul(a) jsem"],["ich bin geblieben","zůstal(a) jsem"],["studiert","studoval(a)"],["untrennbar","neodlučitelný"],["der Nebensatz","vedlejší věta"],["bis morgen habe ich … erledigt","do zítřka … vyřídím"],["die Reklamation","reklamace"]],"toolkit":[["Hilfsverb","Ich bin eingeschlafen. / Ich habe geschlafen."],["Modalverb","Ich habe warten müssen."],["Passiv","Das Paket ist geliefert worden."],["Nebensatz","…, weil ich zu spät gekommen bin."]]},"C1":{"warm":"Berichtet indirekt: „Er sagt: Ich habe es gesehen.“ → „Er sagt, er habe es gesehen.“ Was verändert sich an der Haltung des Sprechers?","stations":[{"title":"Er habe es gesehen","subtitle":"Indirekte Rede","main":"Wie gibst du vergangene Aussagen anderer distanziert wieder?","questions":["Was unterscheidet „Er hat erklärt, dass …“ und „Er habe erklärt …“?","Wann heißt es „sie sei angekommen“?","Wann weicht man auf den Konjunktiv II aus, etwa „sie hätten gesagt“?"],"challenge":"Berichtet als Journalisten über eine erfundene Pressekonferenz mit fünf Aussagen.","stretch":"Markiert, an welchen Stellen ihr euch von einer Aussage distanziert.","support":["Laut … habe …","Sie sagte, sie sei …","Die Zeugen gaben an, sie hätten …"],"explanations":[["Der Konjunktiv I Perfekt (er habe gemacht, sie sei gekommen) zeigt, dass man fremde Aussagen wiedergibt, ohne sie als eigene Tatsachen darzustellen. Die Frage verlangt, die Wirkung zu vergleichen.","Formt um: Der Trainer sagt: „Wir haben gut gespielt.“ Die Ministerin sagt: „Ich bin nicht informiert worden.“"],["Bei Verben mit „sein“ heißt es im Konjunktiv I „sei“: sie sei angekommen, er sei gegangen. Die Frage verlangt, die Hilfsverben richtig zu wählen.","Bildet drei Sätze mit „sei“ und drei mit „habe“ über eine erfundene Reise eures Lehrers."],["Wenn der Konjunktiv I mit dem Indikativ übereinstimmt (sie haben), weicht man auf den Konjunktiv II aus (sie hätten). Die Frage verlangt, diesen Ausweg zu erkennen.","Formt um: Die Schüler sagen: „Wir haben nichts gewusst.“ Warum ist „sie haben“ hier ungeeignet?"]]},{"title":"Nachdem ich gegessen hatte","subtitle":"Plusquamperfekt und Vorzeitigkeit","main":"Wie zeigst du, dass etwas vor einem anderen vergangenen Ereignis passiert ist?","questions":["Warum heißt es „Nachdem ich gegessen hatte, ging ich spazieren“?","Ist „Nachdem ich gegessen habe, bin ich spazieren gegangen“ falsch?","Wann ist das Plusquamperfekt wirklich nötig?"],"challenge":"Erzählt eine Verwechslungsgeschichte mit mindestens drei Plusquamperfektformen.","stretch":"Erzählt sie ohne Plusquamperfekt und prüft, ob sie noch verständlich ist.","support":["Nachdem …, …","Als ich ankam, hatten sie schon …","Ich hatte vorher nie …"],"explanations":[["Nach „nachdem“ verlangt die Norm einen Tempuswechsel: Plusquamperfekt im Nebensatz und Präteritum im Hauptsatz (oder Perfekt und Präsens). Die Frage verlangt, diese Tempusfolge zu erklären.","Verbindet „Ich habe die Prüfung geschrieben. Ich bin nach Hause gefahren.“ mit „nachdem“. Achtet auf beide Zeitformen."],["Im mündlichen Gebrauch hört man oft „Nachdem ich gegessen habe, bin ich gegangen“; Grammatiken bewerten das als nicht normgerecht. Die Frage verlangt, Norm und Gebrauch zu unterscheiden.","Diskutiert: Würdet ihr den Satz in einer Prüfung korrigieren? Und im Gespräch mit Freunden?"],["Das Plusquamperfekt ist besonders wichtig, wenn die Reihenfolge sonst missverständlich wäre. Die Frage verlangt, solche Fälle zu finden.","Vergleicht: „Als ich kam, gingen sie“ und „Als ich kam, waren sie gegangen.“ Habt ihr euch in beiden Fällen gesehen?"]]},{"title":"Ich bin gesessen","subtitle":"Regionale Standardvarianten","main":"Warum sagen viele Menschen in Süddeutschland, Österreich und der Schweiz „ich bin gesessen“?","questions":["Welche Verben bilden im Süden das Perfekt mit „sein“ statt mit „haben“?","Ist das ein Fehler oder Standard?","Welche Variante würdet ihr in einem Brief nach Wien wählen?"],"challenge":"Spielt ein Gespräch zwischen einer Hamburgerin und einem Grazer über ihren Urlaub.","stretch":"Diskutiert, wie eine Prüfung mit solchen Varianten umgehen sollte.","support":["Im Süden sagt man …","Das ist kein Fehler, sondern …","Im Norden klingt es …"],"explanations":[["Bei „sitzen“, „stehen“ und „liegen“ verwendet man im Süden des deutschen Sprachraums „sein“, im Norden „haben“. Beide Varianten gelten in ihrer Region als standardsprachlich. Die Frage verlangt, das einzuordnen.","Sagt beide Versionen laut: „Ich habe zwei Stunden im Zug gesessen“ und „Ich bin zwei Stunden im Zug gesessen.“ Welche habt ihr schon gehört?"],["Deutsch ist eine plurizentrische Sprache mit mehreren Standards (Deutschland, Österreich, Schweiz). Die Frage verlangt zu unterscheiden, was ein Fehler und was eine regionale Standardform ist.","Eure Lehrerin aus Salzburg schreibt „ich bin gestanden“. Würdet ihr das korrigieren? Begründet."],["Je nach Adressat kann man bewusst eine Variante wählen. Die Frage verlangt, eine begründete Entscheidung zu treffen.","Schreibt den ersten Satz eines Briefes an eine Gastfamilie in Wien, in dem ihr erzählt, wo ihr gestern gesessen habt."]]},{"title":"Ich habe es vergessen gehabt","subtitle":"Das Doppelperfekt","main":"Was bedeutet „Ich habe das vergessen gehabt“, und darf man das sagen?","questions":["Wie wird das Doppelperfekt gebildet?","Welche Funktion hat es im Gespräch?","Wie bewerten Grammatiken diese Form?"],"challenge":"Sammelt drei Situationen, in denen ein Doppelperfekt natürlich klingen könnte.","stretch":"Formuliert die Sätze standardsprachlich um und vergleicht die Wirkung.","support":["Das Doppelperfekt besteht aus …","Es drückt aus, dass …","Standardsprachlich würde man sagen …"],"explanations":[["Das Doppelperfekt (ich habe es vergessen gehabt) entsteht, wenn man zum Perfekt noch „gehabt“ oder „gewesen“ hinzufügt. Die Frage verlangt, die Form zu analysieren.","Bildet das Doppelperfekt zu „Ich habe den Schlüssel verloren.“ und „Er ist schon gegangen.“ Wie klingt das für euch?"],["Im Gespräch kann es Vorzeitigkeit markieren, ähnlich wie das Plusquamperfekt, das mündlich vor allem im Süden kaum noch vorkommt. Die Frage verlangt, die Funktion zu erkennen.","Erzählt: „Ich wollte dich anrufen, aber ich habe die Nummer vergessen gehabt.“ Was ist hier zuerst passiert?"],["Grammatiken wie die Duden-Grammatik beschreiben das Doppelperfekt als umgangssprachlich oder regional, nicht als standardsprachlich. Die Frage verlangt, Gebrauch und Norm abzuwägen.","Würdet ihr die Form in einem Aufsatz verwenden? In einer Sprachnachricht? Begründet eure Entscheidung."]]},{"title":"Geschlossen oder geschlossen worden?","subtitle":"Zustand und Vorgang","main":"Was ist der Unterschied zwischen „Die Bibliothek ist geschlossen“ und „Die Bibliothek ist geschlossen worden“?","questions":["Welcher Satz beschreibt einen Zustand, welcher einen Vorgang?","Wie fragt man nach dem Verantwortlichen?","Warum ist dieser Unterschied für Tschechischsprechende schwierig?"],"challenge":"Beschreibt eine Stadt nach einem Sturm: zuerst Zustände, dann Vorgänge.","stretch":"Übersetzt eure Sätze ins Tschechische und vergleicht.","support":["… ist … (Zustand)","… ist … worden (Vorgang)","Wer hat …?"],"explanations":[["Das Zustandspassiv (ist geschlossen) beschreibt ein Ergebnis; das Vorgangspassiv im Perfekt (ist geschlossen worden) berichtet über eine Handlung. Die Frage verlangt, beide zu unterscheiden.","Ihr steht vor der Bibliothek. Welcher Satz beschreibt, was ihr seht? Welcher berichtet, was die Stadt beschlossen hat?"],["Beim Vorgangspassiv bleibt der Handelnde oft ungenannt, ist aber mitgedacht; beim Zustandspassiv steht er meist gar nicht im Blick. Die Frage verlangt, nach dem Verantwortlichen zu fragen.","Formuliert zu beiden Sätzen eine Nachfrage. Welche Frage ist natürlicher?"],["Im Tschechischen kann „je zavřeno“ einen Zustand beschreiben, während das Deutsche Zustand und Vorgang formal unterscheidet. Die Frage verlangt, über diese Schwierigkeit nachzudenken.","Übersetzt „Obchod byl zavřen“ in zwei Kontexten: als Beschreibung eines Zustands und als Bericht über eine Maßnahme."]]},{"title":"schon, noch nicht, endlich","subtitle":"Partikeln und Erwartungen","main":"Wie verändern Partikeln die Bedeutung eines Perfektsatzes?","questions":["Was setzt „Hast du schon gegessen?“ voraus?","Was deutet „Er hat endlich angerufen“ an?","Wie wirkt „Das habe ich doch gesagt!“?"],"challenge":"Spielt ein Gespräch zwischen Eltern und Kind vor einer Reise mit sechs Partikeln.","stretch":"Formuliert die Sätze ohne Partikeln und beschreibt, was verloren geht.","support":["„Schon“ setzt voraus, dass …","Mit „endlich“ zeigt man …","„Doch“ klingt …"],"explanations":[["„Schon“ zeigt, dass man eine Handlung erwartet und fragt, ob sie bereits stattgefunden hat. Die Frage verlangt, diese Erwartung zu beschreiben.","Stellt die Frage ohne und mit „schon“. Wann klingt sie eher wie eine Einladung zum Essen?"],["„Endlich“ drückt aus, dass man lange gewartet hat; es kann Erleichterung oder Ungeduld zeigen. Die Frage verlangt, die Gefühle dahinter zu erkennen.","Sagt „Er hat endlich angerufen“ einmal erleichtert, einmal genervt. Was hört euer Partner?"],["„Doch“ kann einen Vorwurf oder eine Erinnerung an etwas Bekanntes ausdrücken. Die Frage verlangt, den Ton zu analysieren.","Formuliert eine freundliche Version von „Das habe ich doch gesagt!“. Welche Wörter helfen?"]]},{"title":"Nachrichten im Perfekt","subtitle":"Vom Einstieg zum Detail","main":"Warum beginnen Nachrichten oft im Perfekt und wechseln dann ins Präteritum?","questions":["Was vermittelt „Die Regierung hat neue Regeln beschlossen“?","Warum steht der nächste Satz oft im Präteritum?","Wie kennzeichnet man, was noch nicht bestätigt ist?"],"challenge":"Präsentiert eine erfundene Schulnachricht: Einstieg im Perfekt, Details im Präteritum.","stretch":"Ergänzt einen Satz in indirekter Rede, der eine unbestätigte Aussage markiert.","support":["Die … hat … beschlossen.","Die Entscheidung fiel am …","Nach Angaben … sei …"],"explanations":[["Der Einstieg im Perfekt stellt ein neues Ereignis als aktuell und relevant dar. Die Frage verlangt, die Wirkung dieses Einstiegs zu beschreiben.","Lest den Satz laut. Wisst ihr, wann es passiert ist? Wisst ihr, dass es heute wichtig ist?"],["Sobald konkrete Zeitpunkte, Orte und Umstände folgen, wechseln geschriebene Nachrichten häufig ins Präteritum. Die Frage verlangt, diesen Wechsel zu erklären.","Ergänzt drei Details: wann, wo und wer was gesagt hat. Welche Zeitform wählt ihr?"],["Unbestätigte Informationen kennzeichnet man mit indirekter Rede, mit „angeblich“ oder mit „nach Angaben von“. Die Frage verlangt, Gesichertes von Behauptetem zu trennen.","Formuliert denselben Inhalt zweimal: als Tatsache und als unbestätigte Aussage. Was ändert sich?"]]},{"title":"Fehler sind gemacht worden","subtitle":"Verantwortung im Bericht","main":"Wie verändert das Perfekt Passiv die Darstellung von Verantwortung?","questions":["Wer ist verantwortlich in „Es sind Fehler gemacht worden“?","Was ändert sich bei „Wir haben Fehler gemacht“?","Wann ist es legitim, den Handelnden wegzulassen?"],"challenge":"Schreibt zwei Entschuldigungen einer erfundenen Firma: eine, die Verantwortung übernimmt, und eine, die sie verschleiert.","stretch":"Stellt journalistische Rückfragen, die den Handelnden sichtbar machen.","support":["Der Satz verschweigt, wer …","Verantwortung zu übernehmen hieße …","Wer genau hat …?"],"explanations":[["Das Perfekt Passiv beschreibt ein Ergebnis ohne Handelnden. Die Frage verlangt, die fehlende Information zu benennen.","Lest den Satz als Journalisten und schreibt drei Fragen auf, die ihr sofort stellen würdet."],["Mit „wir“ im Aktiv übernimmt der Sprecher sichtbar Verantwortung. Die Frage verlangt, die Wirkung auf das Vertrauen zu vergleichen.","Ihr seid Kunden. Welche Version macht euch eher bereit, die Entschuldigung anzunehmen? Warum?"],["Den Handelnden wegzulassen ist legitim, wenn er unbekannt, offensichtlich oder unwichtig ist. Die Frage verlangt, legitime von ausweichenden Fällen zu unterscheiden.","Entscheidet: „Das Fenster ist eingeschlagen worden.“ „Die Ergebnisse sind veröffentlicht worden.“ „Eure Daten sind weitergegeben worden.“ Wo wollt ihr wissen, wer es war?"]]}],"vocab":[["die indirekte Rede","nepřímá řeč"],["er habe erklärt","prý vysvětlil"],["sie sei angekommen","prý dorazila"],["das Plusquamperfekt","předminulý čas"],["nachdem ich gegessen hatte","poté, co jsem se najedl(a)"],["ich bin gesessen","seděl(a) jsem (jihoněmecky, rakousky)"],["das Doppelperfekt","dvojité perfektum"],["ist geschlossen worden","bylo zavřeno (děj)"],["das Zustandspassiv","stavové pasivum"],["die Modalpartikel","modální částice"],["nach Angaben von","podle údajů …"],["die Verantwortung","odpovědnost"]],"toolkit":[["Indirekte Rede","Sie sagt, sie sei angekommen."],["Vorzeitigkeit","Nachdem ich gegessen hatte, …"],["Zustand","Die Tür ist geschlossen."],["Vorgang","Die Tür ist geschlossen worden."]]},"C2":{"warm":"Prüft die Behauptung: „Perfekt und Präteritum bedeuten im Deutschen dasselbe.“ Findet zwei Gegenbeispiele.","stations":[{"title":"Ergebnis oder Vergangenheit?","subtitle":"Zwei Funktionen des Perfekts","main":"Bedeuten „Er ist gestorben“ und „Er starb“ dasselbe?","questions":["Welcher Satz betont eher den heutigen Zustand?","Warum sagt man „Ich habe schon gegessen, ich habe keinen Hunger“, aber kaum „Ich aß schon, ich habe keinen Hunger“?","Ist das deutsche Perfekt ein Vergangenheitstempus oder ein Resultativ?"],"challenge":"Ordnet zehn Beispielsätze nach ihrer Hauptfunktion: Resultat oder Vergangenheit.","stretch":"Vergleicht mit dem Englischen und dem Französischen.","support":["Hier steht der Resultatszustand im Vordergrund.","Hier wird ein Ereignis in der Vergangenheit verortet.","Ein Gegenbeispiel wäre …"],"explanations":[["Das Perfekt kann einen gegenwärtigen Zustand als Ergebnis betonen (er ist tot), das Präteritum eher ein abgeschlossenes Ereignis in einem Erzählzusammenhang. Die Frage verlangt, die Nuance zu beschreiben.","In welcher Situation würdet ihr „Mein Großvater ist gestorben“ sagen, in welcher „Mein Großvater starb 1990“?"],["Das Perfekt kann einen gegenwärtigen Zustand erklären; das Präteritum eignet sich dafür schlechter. Die Frage verlangt, diesen Unterschied zu prüfen.","Sagt beide Varianten laut. Welche Antwort auf „Willst du etwas essen?“ klingt natürlich?"],["In der Sprachwissenschaft wird diskutiert, ob das deutsche Perfekt vor allem ein Vergangenheitstempus ist oder eine resultative Bedeutung bewahrt hat. Die Frage verlangt, Argumente für beide Sichtweisen zu sammeln.","Findet ein Beispiel, in dem Perfekt und Präteritum austauschbar sind, und eines, in dem sie es nicht sind. Was zeigt das?"]]},{"title":"Bin oder habe geschwommen?","subtitle":"Grenzfälle bei Hilfsverben","main":"Warum schwanken Sprecher bei „geschwommen“, „gesegelt“ oder „getanzt“ zwischen „haben“ und „sein“?","questions":["Wie unterscheiden sich „Ich bin über den See geschwommen“ und „Ich habe zwei Stunden geschwommen“?","Welche Rolle spielt die Bewegung zu einem Ziel?","Warum heißt es „Das Eis ist geschmolzen“, aber „Die Sonne hat das Eis geschmolzen“?"],"challenge":"Sammelt zehn Grenzfälle und begründet für jeden eure Wahl.","stretch":"Prüft eure Begründungen mit einem Wörterbuch oder einer Grammatik.","support":["Mit einem Ziel klingt … natürlicher.","Wenn die Tätigkeit im Vordergrund steht, …","Laut Grammatik ist … möglich."],"explanations":[["Bei Bewegungsverben ohne Ziel ist vor allem im Norden auch „haben“ üblich, wenn die Tätigkeit statt der Ortsveränderung im Vordergrund steht; mit einem Ziel oder einer Strecke steht „sein“. Die Frage verlangt, diese Abstufung zu beschreiben.","Ergänzt beide Sätze um weitere Angaben, etwa ein Ziel oder eine Dauer. Ändert sich euer Gefühl für das Hilfsverb?"],["Die Bewegung zu einem Ziel oder entlang einer Strecke verstärkt die Wahl von „sein“. Die Frage verlangt, die Rolle der Zielangabe zu prüfen.","Vergleicht: „Wir sind bis zur Insel gesegelt“ und „Wir haben den ganzen Nachmittag gesegelt.“ Klingen beide für euch richtig?"],["Manche Verben werden intransitiv (mit „sein“) und transitiv (mit „haben“) verwendet: schmelzen, zerbrechen, trocknen. Die Frage verlangt, die Konstruktion zu analysieren.","Bildet Paare mit „zerbrechen“ und „trocknen“: einmal ohne, einmal mit Akkusativobjekt."]]},{"title":"…, dass er hat kommen müssen","subtitle":"Verbgruppen im Nebensatz","main":"Warum steht das Hilfsverb in „…, dass er hat kommen müssen“ vor den Infinitiven?","questions":["Wie lautet die Regel für den Ersatzinfinitiv im Nebensatz?","Wie verhalten sich „lassen“, „sehen“, „hören“ und „brauchen“?","Welche Varianten hört man regional?"],"challenge":"Bildet fünf komplexe Nebensätze und prüft gegenseitig die Reihenfolge.","stretch":"Formuliert die Sätze so um, dass sie leichter verständlich werden.","support":["…, dass ich habe … müssen.","Bei „sehen“ ist auch … möglich.","Verständlicher wäre …"],"explanations":[["Beim Ersatzinfinitiv steht das konjugierte Hilfsverb im Nebensatz nicht am Ende, sondern vor der Verbgruppe: „dass er hat kommen müssen“. Die Frage verlangt, diese Ausnahme zu erklären.","Formt in Nebensätze um: „Er hat arbeiten müssen.“ „Wir haben warten sollen.“ Beginnt jeweils mit „Ich weiß, dass …“."],["Bei „lassen“ steht fast immer der Ersatzinfinitiv; bei „sehen“, „hören“ und „helfen“ sind beide Formen möglich; bei „brauchen“ ist er standardsprachlich üblich. Die Frage verlangt, diese Unterschiede zu kennen.","Vergleicht: „Ich habe ihn kommen sehen“ und „Ich habe ihn kommen gesehen.“ Welche Form klingt für euch vertrauter?"],["Regional und umgangssprachlich hört man auch „dass er kommen hat müssen“ oder „dass er kommen müssen hat“. Die Frage verlangt, Norm und Variation zu unterscheiden.","Sagt die drei Varianten laut. Welche klingt österreichisch, welche standardsprachlich, welche ungewohnt?"]]},{"title":"Stirbt das Präteritum?","subtitle":"Sprachwandel","main":"Verdrängt das Perfekt im Deutschen allmählich das Präteritum?","questions":["Was versteht man unter „oberdeutschem Präteritumschwund“?","Warum bleiben „war“, „hatte“ und die Modalverben stabil?","Welche Parallelen gibt es im Französischen?"],"challenge":"Präsentiert die Entwicklung mit einer einfachen Karte oder Zeitleiste.","stretch":"Argumentiert, ob das Präteritum langfristig nur noch eine Schriftform sein wird.","support":["Im Süden ist das Präteritum …","Stabil bleiben …","Im Französischen hat …"],"explanations":[["Im Süden des deutschen Sprachraums ist das Präteritum in der gesprochenen Sprache weitgehend verschwunden; man spricht vom oberdeutschen Präteritumschwund. Die Frage verlangt, das Phänomen zu beschreiben.","Wie würde jemand aus München oder Wien einen Kinobesuch erzählen? Wie jemand aus Hamburg? Formuliert je zwei Sätze."],["Häufige Verben wie „sein“, „haben“ und die Modalverben bleiben auch mündlich im Präteritum, vermutlich weil ihre Formen kurz und sehr gebräuchlich sind. Die Frage verlangt, nach Erklärungen zu suchen.","Vergleicht „ich war“ mit „ich bin gewesen“ und „ich musste“ mit „ich habe gemusst“. Was spricht für die kurze Form?"],["Im Französischen hat das passé composé das passé simple in der gesprochenen Sprache fast vollständig ersetzt. Die Frage verlangt, die Entwicklungen zu vergleichen.","Übersetzt „Ich sah ihn gestern“ ins Französische. Welche Form verwenden Muttersprachler im Gespräch?"]]},{"title":"Erzählen im Präteritum","subtitle":"Literatur und Gespräch","main":"Warum werden Romane meist im Präteritum erzählt, Gespräche aber im Perfekt?","questions":["Wie wirkt ein Roman, der im Perfekt erzählt wird?","Welche Rolle spielt die Ich-Perspektive?","Wann wechseln Erzähler absichtlich das Tempus?"],"challenge":"Erzählt dieselbe kurze Szene als Romananfang und als Sprachnachricht.","stretch":"Analysiert, an welcher Stelle ein Tempuswechsel eine Pointe verstärkt.","support":["Im Präteritum wirkt die Szene …","Im Perfekt klingt der Erzähler …","Der Wechsel betont …"],"explanations":[["Das Präteritum ist das klassische Erzähltempus der Literatur; es schafft Distanz und einen fortlaufenden Erzählfluss. Die Frage verlangt, diese Wirkung zu beschreiben.","Lest: „Sie öffnete die Tür und erstarrte.“ und „Sie hat die Tür geöffnet und ist erstarrt.“ Welcher Satz klingt nach Roman?"],["Ein Erzählen im Perfekt wirkt mündlich und persönlich und kann den Eindruck eines Berichts aus der Gegenwart des Erzählers erzeugen. Die Frage verlangt, diesen Effekt zu beurteilen.","Schreibt drei Sätze eines Tagebucheintrags im Perfekt. Wie nah fühlt sich der Erzähler an?"],["Ein bewusster Tempuswechsel kann einen Höhepunkt markieren oder vom Bericht zur Bewertung überleiten. Die Frage verlangt, solche Wechsel zu erkennen.","Erzählt eine Anekdote im Präteritum und wechselt am Ende ins Perfekt („… und seitdem habe ich nie wieder …“). Was bewirkt der Wechsel?"]]},{"title":"Zwischen Tschechisch und Deutsch","subtitle":"Aspekt und Tempus","main":"Wie hängen der tschechische Verbalaspekt und die deutschen Vergangenheitsformen zusammen?","questions":["Wie übersetzt ihr „Napsal jsem dopis“ und „Psal jsem dopis“?","Kann das Deutsche den Aspekt ausdrücken?","Welche Mittel nutzt das Deutsche stattdessen, etwa „gerade“, „fertig“ oder „zu Ende“?"],"challenge":"Übersetzt sechs tschechische Sätze und vergleicht eure Lösungen.","stretch":"Erklärt einer deutschen Person, was der tschechische Aspekt leistet.","support":["Der tschechische Satz betont …","Im Deutschen kann man das mit … ausdrücken.","Beide Übersetzungen sind möglich, wenn …"],"explanations":[["Das Deutsche unterscheidet bei „schreiben“ keinen Aspekt; „Ich habe einen Brief geschrieben“ kann beide tschechischen Sätze wiedergeben. Die Frage verlangt, diese Lücke zu erkennen.","Übersetzt beide Sätze ins Deutsche. Habt ihr dieselbe Form gewählt? Was geht verloren?"],["Um Abgeschlossenheit oder Verlauf zu zeigen, nutzt das Deutsche Präfixe (aufessen), Adverbien (gerade, schon) oder Konstruktionen (am Schreiben sein). Die Frage verlangt, diese Mittel zu sammeln.","Übersetzt „Snědl jsem celý dort“ und „Jedl jsem dort, když …“. Welche Wörter helfen euch?"],["Oft entscheidet der Kontext, ob eine deutsche Perfektform als abgeschlossen verstanden wird. Die Frage verlangt, solche Hinweise im Kontext zu finden.","Übersetzt „Celý večer jsem četl“ und „Přečetl jsem tu knihu za večer“. Welche Zeitangaben machen den Unterschied deutlich?"]]},{"title":"Norm und Gebrauch","subtitle":"Wer entscheidet?","main":"Wer entscheidet, ob eine Perfektform „richtig“ ist?","questions":["Welche Rolle spielen Duden, Schule und Sprachgebrauch?","Wie geht man in einer Prüfung mit „ich bin gesessen“ oder dem Doppelperfekt um?","Wann ist eine Korrektur hilfreich, wann bevormundend?"],"challenge":"Entwerft Korrekturrichtlinien für eine internationale Deutschprüfung.","stretch":"Diskutiert, ob Sprachnormen eher beschreiben oder vorschreiben sollten.","support":["Der Duden beschreibt … als …","In einer Prüfung sollte …","Eine Korrektur ist sinnvoll, wenn …"],"explanations":[["Wörterbücher und Grammatiken wie der Duden beschreiben überwiegend den Gebrauch und markieren Varianten als regional oder umgangssprachlich. Die Frage verlangt, ihre Rolle zu beurteilen.","Wie könnte ein Wörterbuch „ich bin gesessen“ markieren? Formuliert einen kurzen Eintrag."],["Prüfungen brauchen klare Kriterien, sollten regionale Standardvarianten aber nicht als Fehler werten. Die Frage verlangt, eine faire Lösung zu finden.","Bewertet drei Sätze: „Ich bin gestanden.“ „Ich habe es vergessen gehabt.“ „Ich habe gestern gegangen.“ Welche Fehler sind echte Fehler?"],["Korrekturen helfen, wenn sie Verständlichkeit oder Angemessenheit verbessern; sie wirken bevormundend, wenn sie legitime Varianten tilgen. Die Frage verlangt, diese Grenze zu bestimmen.","Formuliert eine Korrektur, die einen echten Fehler verbessert, und eine Rückmeldung zu einer Variante, die keine Korrektur ist."]]},{"title":"Der präzise Rückblick","subtitle":"Expertenrevision","main":"Wie bearbeitest du einen Bericht, der grammatisch korrekt, aber missverständlich ist?","questions":["Welcher Zeitbezug bleibt offen?","Wo wird eine Handlung niemandem zugeschrieben?","Welche Tempuswahl unterstützt die beabsichtigte Aussage?"],"challenge":"Überarbeitet einen erfundenen Bericht aus acht Sätzen und begründet jede Änderung.","stretch":"Verteidigt zwei unterschiedliche, aber vertretbare Fassungen.","support":["Diese Änderung ist nötig, weil …","Hier bleibt offen, ob …","Ich schlage … vor, da …"],"explanations":[["Ein Perfekt ohne Zeitangabe kann offenlassen, ob ein Ereignis gerade eben oder vor Jahren stattfand. Die Frage verlangt, solche Unklarheiten aufzuspüren.","Lest: „Das Unternehmen hat seine Ziele erreicht.“ Welche Zeitangabe würde den Satz überprüfbar machen?"],["Passiv- und unpersönliche Konstruktionen lassen Verantwortliche offen. Die Frage verlangt, sie zu erkennen und gegebenenfalls zu ergänzen.","Formt „Es ist beschlossen worden, die Kantine zu schließen“ so um, dass der Verantwortliche sichtbar wird."],["Die Wahl zwischen Perfekt, Präteritum und Plusquamperfekt kann Bilanz, Bericht oder Vorgeschichte hervorheben. Die Frage verlangt, die Wahl auf die Absicht abzustimmen.","Schreibt den Satz „Wir haben das Projekt beendet“ für drei Zwecke um: als Erfolgsmeldung, als Chronik und als Vorgeschichte („…, bevor …“)."]]}],"vocab":[["der Präteritumschwund","ústup préterita"],["der Grenzfall","hraniční případ"],["der Resultatszustand","výsledný stav"],["das Erzähltempus","vyprávěcí čas"],["ich habe ihn kommen sehen","viděl(a) jsem ho přicházet"],["dass er hat kommen müssen","že musel přijít"],["die Vorzeitigkeit","předčasnost (děj předcházející jinému)"],["die Norm","norma"],["plurizentrisch","pluricentrický (s více standardy)"],["eine regionale Variante","regionální varianta"],["der Verbalaspekt","slovesný vid"],["der Sprachgebrauch","jazykový úzus"]],"toolkit":[["Abwägung","Diese Variante wirkt …, weil …"],["Konstruktion","Das Hilfsverb hängt von … ab."],["Variation","Im Süden …"],["Gegenposition","Ein stichhaltiger Einwand wäre …"]]}},"uiSimple":{"eyebrow":"SPRECHEN · FRAGEN · ANTWORTEN · ZUHÖREN","hero":"Erzähle mit kurzen Sätzen, was du gestern gemacht hast, wo du gewesen bist und wen du getroffen hast.","privacy":"Ihr könnt alle Erlebnisse erfinden. Niemand muss private Erfahrungen oder persönliche Informationen teilen. Hier geht es ums Sprechen, nicht um Fehlerfreiheit.","step3":"Stelle deinem Partner oder deiner Partnerin eine Frage.","step4":"Mehr? Öffne die nächste Aufgabe.","main":"HAUPTFRAGE","questions":"Weitere Fragen","supportTitle":"Brauchst du Hilfe?","supportDesc":"Wörter für den Satzanfang.","supportShow":"Hilfe zeigen","supportHide":"Hilfe ausblenden","challengeTitle":"Noch mehr sprechen","challengeDesc":"Nach der Hauptfrage.","challengeShow":"Aufgabe zeigen","challengeHide":"Aufgabe ausblenden","stretchTitle":"Eine schwierigere Aufgabe","stretchDesc":"Möchtest du mehr sprechen?","stretchShow":"Schwierige Aufgabe zeigen","stretchHide":"Schwierige Aufgabe ausblenden","progress":"Sag, warum. Gib ein Beispiel. Stell eine Frage.","vocabLabel":"NÜTZLICHE WÖRTER","vocabDesc":"Benutze diese Wörter beim Sprechen.","toolkitLabel":"NÜTZLICHE SÄTZE","toolkitDesc":"Sprecht zusammen: Fragt und antwortet.","title":"Perfekt · Erzähle, was passiert ist","strap":"Was hast du gemacht – und was ist passiert?"},"uiB1":{"stretchTitle":"Geh einen Schritt weiter","stretchDesc":"Eine schwierigere Aufgabe, wenn ihr schon sicher sprecht.","vocabDesc":"Passende Perfektformen, Signalwörter und Formulierungshilfen mit tschechischer Bedeutung.","progress":"Nennt Gründe und Beispiele und reagiert aufeinander."}},"fr":{"ui":{"title":"Passé composé · Raconter le passé","strap":"Qu’as-tu fait – et que s’est-il passé ?","brand":"LABORATOIRE DE CONVERSATION","subbrand":"Une conversation, pas un examen","eyebrow":"PARLE · QUESTIONNE · JUSTIFIE · RÉAGIS","hero":"Racontez des expériences et des événements en français : auxiliaires avoir et être, participes passés, accords, verbes pronominaux et contraste avec l’imparfait.","privacy":"Vous pouvez inventer les situations. Personne n’a besoin de raconter sa vie privée. Les erreurs font partie de l’apprentissage.","format":"En binômes","estimated":"45–55 minutes","changeLevel":"Niveau CECRL","changeLanguage":"Langue","themeDay":"Clair","themeNight":"Sombre","fullscreen":"Plein écran","exitFullscreen":"Quitter le plein écran","resetLesson":"Réinitialiser","levelGoal":"Objectif oral","step1":"Réfléchis un instant.","step2":"Donne une raison ou un exemple.","step3":"Pose une question à ton partenaire.","step4":"Ouvre le défi pour prolonger la discussion.","warmTitle":"Mise en route","warmTime":"2–3 min · si tu veux","warmHint":"Si tu veux : une courte activité pour commencer.","stations":"Étapes de discussion","station":"Étape","of":"sur","main":"QUESTION PRINCIPALE","questions":"Explorez la question","supportTitle":"Besoin d’aide pour parler ?","supportDesc":"Des débuts de phrases si les mots te manquent.","supportShow":"Afficher l’aide","supportHide":"Masquer l’aide","challengeTitle":"Approfondis la discussion","challengeDesc":"À utiliser après avoir exploré la question principale.","challengeShow":"Afficher le défi","challengeHide":"Masquer le défi","stretchTitle":"Va plus loin","stretchDesc"

 has hecho hoy?"],"challenge":"Haced cuatro preguntas y cuatro respuestas.","stretch":"Presenta una respuesta con «ha» en tercera persona.","support":["Mi compañera ha leído un libro.","Hoy he … / He …","¿Has …? – Sí, he … / No, no he …"]}],"vocab":[["he hablado","mluvil(a) jsem"],["has comido","jedl(a) jsi"],["ha vivido","žil(a) / bydlel(a)"],["hemos terminado","dokončili jsme"],["haber + participio","pomocné haber + příčestí minulé"],["alguna vez","někdy, někdy v životě"],["he desayunado","nasnídal(a) jsem se"],["he visto","viděl(a) jsem"],["he escrito","napsal(a) jsem"],["he hecho","udělal(a) jsem"],["he ido","šel/šla / jel(a) jsem"],["¿Has…?","Už jsi…?"]],"toolkit":[["Afirmación","Hoy he hablado."],["Comida","He comido fruta."],["Pregunta","¿Has visto la película?"],["Respuesta","Sí, la he visto."]]},"A2":{"warm":"Di dos cosas que ya has hecho y una que todavía no has hecho.","stations":[{"title":"Ya o todavía no","subtitle":"Tareas del día","main":"¿Qué has terminado ya?","questions":["¿Has hecho los deberes?","¿Has ordenado tu habitación?","¿Qué no has terminado todavía?"],"challenge":"Comparad tres tareas hechas y pendientes.","stretch":"Usad «ya» y «todavía no» en el mismo diálogo.","support":["Ya he hecho los deberes, pero todavía no he limpiado mi mesa.","Ya he …, pero todavía no he …","Nunca he … / ¿Has … alguna vez?"]},{"title":"Lo que he vivido","subtitle":"Experiencias","main":"¿Qué has hecho alguna vez por primera vez?","questions":["¿Has viajado solo?","¿Has probado una actividad difícil?","¿Has conocido a alguien famoso?"],"challenge":"Entrevista a tu compañero sobre tres experiencias.","stretch":"Usa dos respuestas con «nunca».","support":["He probado el surf, pero nunca he montado a caballo.","Ya he …, pero todavía no he …","Nunca he … / ¿Has … alguna vez?"]},{"title":"Esta semana","subtitle":"Un período abierto","main":"¿Qué has hecho esta semana?","questions":["¿Has ido al cine?","¿Has tenido mucho trabajo?","¿Has aprendido algo útil?"],"challenge":"Haz un resumen de tu semana en cinco frases.","stretch":"Explica por qué con «ayer» usamos otro pasado: «ayer estudié».","support":["Esta semana he leído dos artículos.","Ya he …, pero todavía no he …","Nunca he … / ¿Has … alguna vez?"]},{"title":"Participios especiales","subtitle":"Hecho, dicho y visto","main":"¿Qué cosas importantes has hecho o dicho?","questions":["¿Has escrito un mensaje?","¿Has dicho la verdad?","¿Has abierto un regalo?"],"challenge":"Crea un diálogo con cuatro participios irregulares.","stretch":"Corrige «he escribido» y «he abrido».","support":["He escrito una nota y he abierto la ventana.","Ya he …, pero todavía no he …","Nunca he … / ¿Has … alguna vez?"]},{"title":"Noticias recientes","subtitle":"Acaba de pasar","main":"¿Qué ha ocurrido hoy en tu colegio?","questions":["¿Ha llegado una noticia?","¿Habéis preparado algo?","¿Ha cambiado algún plan?"],"challenge":"Inventa dos noticias escolares y cuéntalas.","stretch":"Pregunta cómo han reaccionado las personas.","support":["Hoy hemos preparado una actividad especial.","Ya he …, pero todavía no he …","Nunca he … / ¿Has … alguna vez?"]},{"title":"Una foto especial","subtitle":"Lo que muestra una imagen","main":"¿Qué has hecho en este lugar?","questions":["¿Has sacado fotos?","¿Has visitado un monumento?","¿Has conocido a alguien?"],"challenge":"Describe una foto inventada con tres frases en perfecto.","stretch":"Formula dos preguntas para conocer más detalles.","support":["He visitado un castillo y he sacado muchas fotos.","Ya he …, pero todavía no he …","Nunca he … / ¿Has … alguna vez?"]},{"title":"Un día difícil","subtitle":"Problemas cotidianos","main":"¿Qué dificultades has tenido hoy?","questions":["¿Has perdido algo?","¿Has encontrado una solución?","¿Alguien te ha ayudado?"],"challenge":"Representad una conversación para resolver un problema.","stretch":"Termina con una buena noticia en pretérito perfecto.","support":["He perdido mis llaves, pero las he encontrado.","Ya he …, pero todavía no he …","Nunca he … / ¿Has … alguna vez?"]},{"title":"¿Y tú?","subtitle":"Encuesta en parejas","main":"¿Qué experiencias compartís?","questions":["¿Has estado en otra ciudad?","¿Has cocinado una comida nueva?","¿Has aprendido un deporte?"],"challenge":"Haz una encuesta con seis preguntas.","stretch":"Resume respuestas usando «ha» y «han».","support":["Ana ha visitado Sevilla; sus amigos han visitado Valencia.","Ya he …, pero todavía no he …","Nunca he … / ¿Has … alguna vez?"]}],"vocab":[["he abierto","otevřel(a) jsem"],["he dicho","řekl(a) jsem"],["he puesto","položil(a) / dal(a) jsem"],["he resuelto","vyřešil(a) jsem"],["he vuelto","vrátil(a) jsem se"],["he roto","rozbil(a) jsem"],["lo he visto","viděl(a) jsem to / ho"],["ya he terminado","už jsem dokončil(a)"],["todavía no","ještě ne"],["nunca he…","nikdy jsem ne…"],["esta semana","tento týden"],["¿Qué has hecho?","Co jsi dělal(a)? / Co jsi udělal(a)?"]],"toolkit":[["Algo hecho","Ya he terminado."],["Algo pendiente","Todavía no he terminado."],["Experiencia","Nunca he viajado solo."],["Pregunta","¿Has probado… alguna vez?"]]},"B1":{"warm":"Compara «hoy he estudiado» y «ayer estudié» en español peninsular.","stations":[{"title":"Perfecto o indefinido","subtitle":"Marcos temporales","main":"¿Cómo eliges el pasado para contar tu semana?","questions":["¿Qué has hecho hoy?","¿Qué hiciste ayer?","¿Por qué pueden variar las respuestas según la región?"],"challenge":"Conversad combinando «hoy he…» y «ayer hice…» en español peninsular.","stretch":"Respetad otras variedades del español sin llamarlas incorrectas.","support":["Hoy he estudiado; ayer estudié en la biblioteca.","Hoy he …, mientras que ayer …","He aprendido que …, porque …"]},{"title":"Nuevas experiencias","subtitle":"Alguna vez y nunca","main":"¿Qué experiencia importante has tenido?","questions":["¿Has viajado a otro país?","¿Qué has aprendido de esa experiencia?","¿Cuándo sucedió exactamente?"],"challenge":"Haz una entrevista de experiencias seguida de detalles.","stretch":"Pasa al indefinido cuando indiques un momento terminado.","support":["He viajado a Italia. Fui allí hace dos años.","Hoy he …, mientras que ayer …","He aprendido que …, porque …"]},{"title":"Una tarea compartida","subtitle":"Resultados y organización","main":"¿Qué habéis conseguido como equipo?","questions":["¿Qué habéis terminado?","¿Qué no habéis resuelto todavía?","¿Qué cambios habéis propuesto?"],"challenge":"Explica el estado de un proyecto ficticio.","stretch":"Usa «ya», «todavía no» y un participio irregular.","support":["Hemos hecho el plan, pero no hemos resuelto el problema.","Hoy he …, mientras que ayer …","He aprendido que …, porque …"]},{"title":"El día de hoy","subtitle":"Lo que acaba de ocurrir","main":"¿Qué ha ocurrido hoy que te ha sorprendido?","questions":["¿Quién ha dado la noticia?","¿Cómo ha reaccionado la clase?","¿Qué se ha decidido?"],"challenge":"Crea un breve informativo sobre una situación imaginaria.","stretch":"Incluye dos preguntas de seguimiento.","support":["Han anunciado una excursión y todos han sonreído.","Hoy he …, mientras que ayer …","He aprendido que …, porque …"]},{"title":"Nunca lo he hecho","subtitle":"Negación y experiencia","main":"¿Qué no has probado todavía?","questions":["¿Has dejado alguna actividad pendiente?","¿Por qué no la has hecho?","¿Te gustaría probarla?"],"challenge":"Explica tres experiencias que faltan en una lista de deseos.","stretch":"Compara «nunca» y «todavía no».","support":["Nunca he buceado; todavía no he aprendido a hacerlo.","Hoy he …, mientras que ayer …","He aprendido que …, porque …"]},{"title":"Alguien me ha ayudado","subtitle":"Historia compartida","main":"¿Qué apoyo has recibido recientemente?","questions":["¿Quién te ha explicado algo?","¿Qué has entendido mejor?","¿Cómo has dado las gracias?"],"challenge":"Cuenta una experiencia positiva de colaboración.","stretch":"Cambia de «yo» a «nosotros» sin perder la concordancia.","support":["Mi amiga me ha explicado el problema y lo he entendido.","Hoy he …, mientras que ayer …","He aprendido que …, porque …"]},{"title":"En otra región","subtitle":"Formas de narrar","main":"¿Por qué alguien puede decir «hoy comí» en lugar de «hoy he comido»?","questions":["¿Qué variedad de español está usando?","¿Qué dos formas has escuchado?","¿Cómo evitarías corregir una variante válida?"],"challenge":"Comparad diálogos imaginarios de España y América.","stretch":"Explicad la diferencia sin generalizar a todos los países.","support":["Hoy he comido temprano. / Hoy comí temprano.","Hoy he …, mientras que ayer …","He aprendido que …, porque …"]},{"title":"Balance del mes","subtitle":"Hacer una reflexión","main":"¿Qué has aprendido este mes?","questions":["¿Qué objetivos has alcanzado?","¿Qué dificultad no has superado todavía?","¿Qué te ha sorprendido?"],"challenge":"Haz un balance oral con causas y resultados.","stretch":"Explica dos frases usando «porque» y «aunque».","support":["Este mes he mejorado mucho, aunque no he terminado el proyecto.","Hoy he …, mientras que ayer …","He aprendido que …, porque …"]}],"vocab":[["el pretérito indefinido","jednoduchý minulý čas (indefinido)"],["ayer estudié","včera jsem se učil(a)"],["hoy he estudiado","dnes jsem se učil(a) (běžné ve Španělsku)"],["el tiempo terminado","uzavřené časové období"],["la variedad regional","regionální varianta"],["un logro","úspěch / dosažený cíl"],["últimamente","v poslední době"],["este año","letos, tento rok"],["hace dos años","před dvěma lety"],["¿Qué ha pasado?","Co se stalo?"],["me ha explicado","vysvětlil(a) mi"],["hemos conseguido","dokázali jsme, podařilo se nám"]],"toolkit":[["Marco abierto","Hoy he estudiado."],["Marco cerrado","Ayer estudié."],["Participio","He resuelto el problema."],["Matiz","Depende de la variedad."]]},"B2":{"warm":"Di tres cosas que has hecho este año y una que todavía no has hecho, pero que quieres hacer.","stations":[{"title":"Lo he visto","subtitle":"Pronombres con el perfecto","main":"¿Dónde se colocan los pronombres en el pretérito perfecto?","questions":["¿Por qué decimos «lo he visto» y no «he lo visto»?","¿Cómo dirías «He dado el libro a María» con dos pronombres?","¿Dónde va el pronombre en «Me alegro de haber terminado el trabajo»?"],"challenge":"Haced un diálogo de preguntas y respuestas sustituyendo todos los objetos por pronombres.","stretch":"Explicad por qué «le lo he dado» se convierte en «se lo he dado».","support":["Ya lo he …","Se lo he …","El pronombre va delante de …"],"explanations":[["Los pronombres átonos (lo, la, le, me, te…) se colocan delante del verbo conjugado. En el perfecto el verbo conjugado es «haber», así que el pronombre va delante de todo el bloque. La pregunta pide explicar esta posición.","Transformad: «He visto la película», «Hemos llamado a tus padres», «Has comprado los billetes». ¿Dónde aparece cada pronombre?"],["Con dos pronombres, el indirecto va primero, y «le» o «les» se convierte en «se» delante de «lo, la, los, las». La pregunta pide aplicar esta regla.","Sustituid los objetos en «Le he enviado el mensaje a Juan» y en «Les hemos devuelto las llaves a los vecinos». Comprobad juntos el orden."],["Con el infinitivo compuesto (haber + participio), el pronombre se une detrás de «haber». La pregunta pide observar este caso especial.","Completad: «Me alegro de haber… (conocer a tu hermana)». ¿Dónde ponéis «la»? ¿Suena posible en otra posición?"]]},{"title":"Escrito, impreso, frito","subtitle":"Participios irregulares y dobles","main":"¿Qué participios irregulares os cuestan más y cuáles tienen dos formas?","questions":["¿Cuál es el participio de «descubrir», «devolver» y «prever»?","¿Se dice «he imprimido» o «he impreso»?","¿Por qué «satisfacer» da «satisfecho»?"],"challenge":"Cread un concurso con ocho participios irregulares y preguntad a otra pareja.","stretch":"Comparad los participios dobles (frito/freído, impreso/imprimido, provisto/proveído) y decid cuál usaríais con «haber» y cuál como adjetivo.","support":["El participio de … es …","Las dos formas son posibles: …","Se parece a … porque …"],"explanations":[["Muchos verbos derivados heredan el participio irregular de su base: cubrir → cubierto, por eso descubrir → descubierto; volver → vuelto, devolver → devuelto; ver → visto, prever → previsto. La pregunta pide aplicar este parentesco.","Formad el participio de: componer, deshacer, envolver, suponer, revolver. ¿Qué verbo base os ha ayudado en cada caso?"],["Unos pocos verbos tienen dos participios aceptados: imprimir (imprimido/impreso), freír (freído/frito), proveer (proveído/provisto). Con «haber» se usan las dos formas; como adjetivo se prefiere la irregular. La pregunta pide comparar estos usos.","Decid «He … el documento» y «El documento está …» con «imprimir». ¿Qué forma elegís en cada frase y por qué?"],["«Satisfacer» se conjuga como «hacer» porque procede de él (en latín, «satis» + «facere»): hecho → satisfecho. La pregunta pide reconocer este patrón.","Conjugad juntos «satisfacer» en perfecto y en futuro. ¿Dónde se nota que funciona como «hacer»?"]]},{"title":"Este año, el año pasado","subtitle":"Períodos abiertos y cerrados","main":"¿Por qué en España se dice «este año he viajado mucho» pero «el año pasado viajé mucho»?","questions":["¿Qué expresiones temporales incluyen el momento en que hablas?","¿Qué pasa con «esta mañana» si hablas por la tarde?","¿Dónde se prefiere el indefinido también con «hoy»?"],"challenge":"Escribid seis frases con marcadores temporales y clasificadlas en períodos abiertos y cerrados.","stretch":"Comparad cómo responderían a «¿Qué has hecho hoy?» una persona de Madrid y otra de México.","support":["Como el período no ha terminado, …","Con «el año pasado» usamos …","En muchas zonas de América …"],"explanations":[["En el español peninsular estándar, el perfecto se usa cuando el período incluye el momento del habla: hoy, esta semana, este año, últimamente, en mi vida. La pregunta pide identificar estas expresiones.","Clasificad: esta semana, ayer, este verano, en 2020, nunca, hace un rato, hasta ahora. ¿Cuáles os parecen dudosas y por qué?"],["«Esta mañana» puede tratarse como período abierto o cerrado, según la hora y la perspectiva del hablante. La pregunta pide pensar cómo cambia la elección.","Son las seis de la tarde. Contad qué hicisteis por la mañana primero con «he» y luego con el indefinido. ¿Os suenan igual de naturales?"],["En gran parte de América, y también en Canarias y en zonas del noroeste de España, el indefinido es mucho más frecuente, incluso con «hoy». La pregunta pide reconocer esta variación sin considerarla un error.","Un amigo argentino dice: «Hoy me levanté temprano». ¿Lo corregiríais? Explicad qué le diríais a un estudiante checo que lo oye."]]},{"title":"Última hora","subtitle":"Las noticias de hoy","main":"¿Por qué los informativos españoles empiezan tantas veces con «El Gobierno ha aprobado…»?","questions":["¿Qué transmite el perfecto en la primera frase de una noticia?","¿Cuándo pasa la noticia al indefinido?","¿Cómo se diría la misma noticia en un informativo mexicano?"],"challenge":"Presentad una noticia escolar ficticia de 30 segundos: la primera frase en perfecto y los detalles en indefinido.","stretch":"Reescribid la noticia para un resumen semanal y explicad los cambios de tiempo.","support":["Esta mañana se ha anunciado que …","Según el director, …","La decisión se tomó …"],"explanations":[["El perfecto presenta el hecho como reciente y relevante para quien escucha hoy. La pregunta pide analizar el efecto de esa primera frase.","Leed en voz alta «El Ayuntamiento ha cerrado el parque» y «El Ayuntamiento cerró el parque». ¿Cuál suena a noticia de hoy y cuál a historia?"],["Cuando se añaden datos concretos (hora, lugar, declaraciones), muchas noticias cambian al indefinido. La pregunta pide localizar ese cambio.","Añadid a la noticia anterior tres detalles: cuándo, quién lo dijo y por qué. ¿Qué tiempos usáis?"],["En muchos medios de América predomina el indefinido incluso para las noticias del día. La pregunta pide comparar variedades sin juzgarlas.","Escribid el titular en dos versiones, para un canal de Madrid y otro de Ciudad de México. ¿Qué cambia y qué se mantiene?"]]},{"title":"Llevo dos años aquí","subtitle":"Duración hasta ahora","main":"¿Cómo expresas en español algo que empezó en el pasado y continúa ahora?","questions":["¿Qué diferencia hay entre «llevo dos años estudiando español» y «he estudiado español dos años»?","¿Cómo se usa «hace dos años que…»?","¿Por qué decimos «estudio español desde 2023» en presente?"],"challenge":"Entrevistad a vuestra pareja sobre tres actividades que hace desde hace tiempo.","stretch":"Comparad estas estructuras con el checo: «Učím se španělsky dva roky».","support":["Llevo … meses …","Hace … que …","… desde …"],"explanations":[["«Llevar + tiempo + gerundio» destaca que la actividad continúa en el presente. «He estudiado dos años» puede sugerir un período cerrado o un balance. La pregunta pide comparar estos matices.","Un estudiante dice «He estudiado alemán dos años». ¿Sigue estudiándolo? Ahora dice «Llevo dos años estudiando alemán». ¿Y ahora?"],["«Hace + tiempo + que + presente» es otra forma muy frecuente de expresar duración hasta ahora. La pregunta pide formar frases con esta estructura.","Transformad «Vivo en Ostrava desde 2019» con «hace … que» y con «llevar». ¿Qué versión os parece más natural en una conversación?"],["Como en checo, el español usa el presente con «desde» para situaciones que continúan; no hace falta el perfecto. La pregunta pide fijarse en esta coincidencia.","Traducid: «Znám ho od dětství», «Čekám tu od osmi». ¿Usaríais el perfecto en alguna frase? ¿Por qué?"]]},{"title":"Ya, todavía, acabo de","subtitle":"Expectativas y cercanía","main":"¿Qué añaden «ya», «todavía no» y «acabar de» a una frase en pasado?","questions":["¿Qué supone «ya he terminado»?","¿Qué expectativa expresa «todavía no ha llamado»?","¿Qué diferencia hay entre «acabo de llegar» y «he llegado hace poco»?"],"challenge":"Representad una conversación entre un jefe impaciente y un empleado tranquilo.","stretch":"Transmitid urgencia sin sonar bruscos usando estos adverbios.","support":["Ya he …, ¿y tú?","Todavía no he …, pero …","Acabo de …"],"explanations":[["«Ya» indica que algo esperado se ha cumplido, a veces antes de lo previsto. La pregunta pide explicar qué expectativa hay detrás.","Decid «He terminado» y «Ya he terminado» con distinta entonación. ¿Cuál suena a orgullo, a alivio o a impaciencia?"],["«Todavía no» o «aún no» niegan el hecho, pero dejan claro que se espera que ocurra. La pregunta pide interpretar esa expectativa.","Tu amiga dice: «Todavía no me ha contestado». ¿Qué crees que siente? ¿Qué pregunta le harías?"],["«Acabar de + infinitivo» expresa algo muy reciente, más inmediato que «hace poco». La pregunta pide comparar el grado de inmediatez.","Llamas por teléfono y la otra persona dice «Acabo de salir de casa». ¿Cuántos minutos imaginas? ¿Y con «He salido hace poco»?"]]},{"title":"Es la primera vez","subtitle":"Experiencias de vida","main":"¿Cómo hablas de experiencias únicas o de lo mejor que has vivido?","questions":["¿Qué tiempo puede seguir a «Es la primera vez que…»?","¿Cómo se forma «el mejor viaje que he hecho en mi vida»?","¿Qué diferencia hay entre «nunca he estado» y «no he estado nunca»?"],"challenge":"Compartid tres «primeras veces» y dos «lo mejor que he…».","stretch":"Contad una experiencia pasada con «Era la primera vez que…».","support":["Es la primera vez que …","Es lo mejor que he … en mi vida.","Nunca había … antes."],"explanations":[["Con «Es la primera vez que» el español puede usar el presente («…que vengo») o el perfecto («…que he venido»). La pregunta pide comparar las dos opciones.","Estás en tu primer concierto de ópera. Decid la frase de las dos maneras. ¿Cuál os sale de forma más espontánea?"],["Con un superlativo y una oración de relativo, el perfecto resume toda la experiencia hasta ahora: el mejor libro que he leído. La pregunta pide formar estas estructuras.","Completad con vuestra pareja: «la comida más rara que …», «el lugar más bonito que …». Comparad vuestras experiencias."],["«Nunca» puede ir delante del verbo sin «no» o detrás con «no»: nunca he estado = no he estado nunca. La pregunta pide comprobar si cambia el significado o solo el énfasis.","Decid las dos versiones con «montar en globo». ¿Cuál suena más enfática? ¿Hay alguna diferencia de registro?"]]},{"title":"El taller de errores","subtitle":"Errores típicos","main":"¿Qué errores con el perfecto cometen los estudiantes checos y por qué?","questions":["¿Qué falla en «He lo visto» y en «He escribido»?","¿Por qué «Ayer he ido al cine» suena raro en el español estándar?","¿Por qué no se dice «Las cartas que he escritas»?"],"challenge":"Escribid cinco frases con errores, intercambiadlas con otra pareja y corregidlas.","stretch":"Explicad un error comparando el español con el checo o el inglés.","support":["El problema es que …","Lo correcto sería …, porque …","En checo decimos …, pero en español …"],"explanations":[["Son dos errores distintos: uno de posición del pronombre y otro de forma del participio. La pregunta pide identificar cada tipo y su regla.","Corregid las dos frases y añadid otro ejemplo de cada tipo de error. ¿Cuál os parece más frecuente en vuestra clase?"],["«Ayer» marca un período cerrado; en el español estándar pide el indefinido. En el habla de algunas zonas de España se oye a veces el perfecto con «ayer», pero se considera no estándar. La pregunta pide explicar la regla y su límite.","Corregid la frase de dos maneras: cambiando el verbo o cambiando el marcador temporal. ¿Significan lo mismo las dos versiones?"],["Con «haber», el participio es invariable; solo concuerda cuando funciona como adjetivo, por ejemplo con «estar» o «ser». La pregunta pide aplicar esta diferencia.","Comparad: «Las cartas que he escrito» y «Las cartas están escritas». ¿Qué palabra concuerda en cada caso y con qué?"]]}],"vocab":[["se lo he dicho","řekl(a) jsem mu / jí to"],["impreso / imprimido","vytištěný / vytiskl(a)"],["frito / freído","smažený / smažil(a)"],["descubierto","objevený / objevil(a)"],["previsto","předpokládaný / předvídal(a)"],["satisfecho","spokojený"],["llevo dos años estudiando","učím se už dva roky"],["hace … que","už … (od té doby, co)"],["acabo de llegar","právě jsem přišel / přišla"],["es la primera vez que…","je to poprvé, co…"],["en mi vida","v životě, za celý život"],["la noticia de última hora","nejnovější zpráva"]],"toolkit":[["Pronombres","Se lo he dicho."],["Duración","Llevo dos años estudiando."],["Período abierto","Este año he …"],["Expectativa","Todavía no lo hemos resuelto."]]},"C1":{"warm":"Compara «he olvidado tu cumpleaños» y «se me ha olvidado tu cumpleaños». ¿Cuál usarías para disculparte?","stations":[{"title":"Se me ha roto","subtitle":"Responsabilidad y disculpas","main":"¿Por qué decimos «se me ha roto el móvil» en lugar de «he roto el móvil»?","questions":["¿Qué diferencia de responsabilidad hay entre las dos frases?","¿Cuándo sería poco honesto usar «se me ha…»?","¿Cómo funciona «se me ha olvidado»?"],"challenge":"Representad tres disculpas: una que asume la culpa, una neutra y una que la evita.","stretch":"Analizad qué forma suelen elegir los niños, los políticos y los empleados en situaciones parecidas.","support":["Se me ha … sin querer.","Lo he … yo, lo siento.","La frase presenta el hecho como …"],"explanations":[["La construcción «se me ha + participio» presenta el hecho como algo que le ha ocurrido al hablante, no como algo que ha hecho a propósito. La pregunta pide comparar el grado de responsabilidad.","Tu hermano dice «Se me ha caído tu taza». Luego dice «He tirado tu taza». ¿Cómo reaccionarías en cada caso?"],["Esta forma puede ser natural y sincera, pero también puede ocultar una acción voluntaria. La pregunta pide distinguir entre ambos usos.","Un compañero rompió una ventana jugando al fútbol en clase y dice «Se me ha roto la ventana». ¿Es una disculpa aceptable? ¿Qué añadirías?"],["Con verbos como «olvidar», el «se» y el pronombre de dativo indican que el olvido «le pasa» a la persona: se me ha olvidado la clave. La pregunta pide analizar cuál es el sujeto gramatical.","Formad frases con «se me ha olvidado», «se te han perdido», «se nos ha acabado». ¿Cuál es el sujeto en cada una? ¿Concuerda el verbo con él?"]]},{"title":"Ya habían salido","subtitle":"El pluscuamperfecto en el relato","main":"¿Cómo indicas que algo ocurrió antes que otro hecho del pasado?","questions":["¿Qué cambia entre «Cuando llegué, salieron» y «Cuando llegué, ya habían salido»?","¿Por qué en un relato se combinan indefinido, imperfecto y pluscuamperfecto?","¿Es siempre necesario el pluscuamperfecto?"],"challenge":"Contad una historia de mala suerte con al menos tres pluscuamperfectos.","stretch":"Reescribid el relato sin pluscuamperfectos y comprobad si sigue siendo claro.","support":["Cuando …, ya había …","Nunca antes había …","Me di cuenta de que …"],"explanations":[["El pluscuamperfecto (había + participio) expresa una acción anterior a otro momento pasado. La pregunta pide comparar el orden de los hechos en las dos frases.","Dibujad una línea temporal para cada frase. ¿Coincidiste con esas personas en la primera? ¿Y en la segunda?"],["En un relato, el indefinido hace avanzar los hechos, el imperfecto describe el fondo y el pluscuamperfecto mira hacia atrás. La pregunta pide explicar cómo colaboran.","Leed: «Llovía. Entré en casa y vi que alguien había abierto la ventana». Señalad la función de cada verbo."],["Si el orden ya está claro gracias a conectores como «antes» o «después», a veces el pluscuamperfecto no es imprescindible. La pregunta pide valorar cuándo aporta claridad.","Comparad: «Después de que comimos, salimos» y «Después de haber comido, salimos». ¿Os parecen igual de naturales?"]]},{"title":"Espero que hayas llegado bien","subtitle":"El perfecto de subjuntivo","main":"¿Cuándo usamos «haya + participio»?","questions":["¿Qué expresa «Espero que hayas llegado bien»?","¿Por qué decimos «No creo que lo haya hecho» y no «No creo que lo ha hecho»?","¿Qué diferencia hay entre «Me alegro de que vengas» y «Me alegro de que hayas venido»?"],"challenge":"Escribid cuatro mensajes breves (felicitación, preocupación, duda, alegría) con el perfecto de subjuntivo.","stretch":"Comparad «Cuando hayas terminado, llámame» con la estructura inglesa «when you’ve finished».","support":["Espero que hayas …","No creo que haya …","Me alegro de que hayáis …"],"explanations":[["El perfecto de subjuntivo expresa un hecho pasado o terminado dentro de una oración que pide subjuntivo (deseo, duda, emoción). La pregunta pide analizar el ejemplo de un mensaje típico.","Un amigo ha viajado a Madrid. Escribidle un mensaje con «espero que…» sobre el viaje, el hotel y la comida."],["Expresiones como «no creer», «dudar» o «no estar seguro» rigen subjuntivo; si el hecho ya ha ocurrido, se usa «haya + participio». La pregunta pide explicar esta regla.","Transformad: «Creo que ha aprobado» → «No creo que …». «Es verdad que lo han visto» → «No es verdad que …»."],["Con «me alegro de que», el presente de subjuntivo se refiere al momento actual o futuro; el perfecto, a algo ya ocurrido. La pregunta pide comparar el tiempo de cada hecho.","Saludad a alguien que llega a vuestra fiesta y despedid a alguien que se va. ¿Qué forma usáis en cada momento?"]]},{"title":"Habrá salido ya","subtitle":"Conjeturas sobre el pasado","main":"¿Cómo haces suposiciones sobre algo que probablemente ya ha pasado?","questions":["¿Qué significa «Habrá salido ya» cuando alguien no contesta?","¿Qué diferencia hay con «Seguramente ha salido»?","¿Cómo expresas preocupación con «¿Habrá perdido el tren?»?"],"challenge":"Resolved un misterio ficticio (un aula vacía, una tarta desaparecida) haciendo conjeturas.","stretch":"Ordenad vuestras hipótesis de más a menos probable y justificadlas con pistas.","support":["Habrá … porque …","Seguramente ha …","Puede que haya …"],"explanations":[["El futuro perfecto (habré, habrás, habrá + participio) puede expresar una suposición sobre un hecho ya ocurrido, no solo un hecho futuro. La pregunta pide interpretar ese valor.","Tu amiga no contesta al teléfono. Decid tres hipótesis con «habrá…». ¿Cuál os parece más probable?"],["«Seguramente ha salido», «debe de haber salido» y «habrá salido» expresan grados parecidos de probabilidad, pero con distinto registro y matiz. La pregunta pide compararlos.","Decid las tres versiones en voz alta. ¿Cuál usaríais en un mensaje informal y cuál en un informe?"],["En una pregunta, el futuro perfecto expresa duda o preocupación: ¿Le habrá pasado algo? La pregunta pide observar el tono que adquiere.","Vuestro hermano no ha llegado a casa a su hora. Formulad dos preguntas preocupadas con «¿Habrá…?» y dos respuestas tranquilizadoras."]]},{"title":"Tengo hechos los deberes","subtitle":"Tener y llevar + participio","main":"¿Qué diferencia hay entre «He hecho los deberes» y «Tengo hechos los deberes»?","questions":["¿Por qué con «tener» el participio concuerda?","¿Qué matiz de resultado añade «tener»?","¿En qué contextos suena natural «Llevo leídas tres novelas»?"],"challenge":"Haced el balance de un proyecto con «tener + participio» y «llevar + participio».","stretch":"Comparad esta construcción con el checo «mám hotovo» o con el inglés «I have it done».","support":["Ya tengo … los …","Llevo … tres …","Con «tener» el participio concuerda con …"],"explanations":[["«Tener + participio» presenta el resultado como algo que el hablante tiene ahora; el participio concuerda con el objeto como un adjetivo. La pregunta pide comparar esta construcción con el perfecto.","Decid «He escrito las cartas» y «Tengo escritas las cartas». ¿Qué frase transmite mejor que las cartas están listas para enviar?"],["La concordancia (hechos, escritas, leídas) muestra que el participio se comporta como adjetivo. La pregunta pide explicar por qué con «haber» no ocurre.","Formad tres frases con «tener» y objetos femeninos y plurales. Comprobad las terminaciones del participio."],["«Llevar + participio» expresa una cantidad acumulada hasta ahora: llevo corregidos veinte exámenes. La pregunta pide identificar contextos de uso.","Sois profesores que corrigen exámenes. Informad del progreso con «llevo…» y «me quedan…»."]]},{"title":"He venido observando","subtitle":"Perífrasis y proceso","main":"¿Qué añade «he venido observando» frente a «he observado»?","questions":["¿Qué matiz de continuidad o progresión expresa «venir + gerundio»?","¿En qué registros es frecuente?","¿Qué diferencia hay con «llevo tiempo observando»?"],"challenge":"Redactad un informe breve sobre un cambio en vuestro instituto usando estas perífrasis.","stretch":"Valorad cuándo estas formas suenan precisas y cuándo burocráticas.","support":["Vengo observando que …","Llevamos meses …","En un registro más informal diría …"],"explanations":[["«Venir + gerundio» presenta una acción que se repite o progresa desde el pasado hasta ahora. La pregunta pide comparar su efecto con el perfecto simple.","Una directora dice «He observado problemas» y luego «Vengo observando problemas desde septiembre». ¿Qué versión transmite más insistencia?"],["Esta perífrasis es frecuente en textos formales, administrativos o periodísticos. La pregunta pide reflexionar sobre el registro.","Imaginad una situación informal y otra formal en las que podría aparecer «venir + gerundio». ¿En cuál os parece natural?"],["«Llevar + tiempo + gerundio» mide la duración; «venir + gerundio» destaca la progresión o la repetición. La pregunta pide distinguir los dos matices.","Comparad «Llevo un año preparando el examen» y «Vengo preparando el examen desde hace un año». ¿Notáis alguna diferencia de énfasis?"]]},{"title":"Se han tomado medidas","subtitle":"Impersonalidad y agentes","main":"¿Qué cambia cuando una institución dice «se han tomado medidas» en lugar de «hemos tomado medidas»?","questions":["¿Quién ha actuado en la pasiva refleja?","¿Por qué esta forma es tan frecuente en los comunicados?","¿Cuándo es legítimo no mencionar al agente?"],"challenge":"Redactad dos comunicados ficticios: uno que nombra a los responsables y otro que los oculta.","stretch":"Haced preguntas de periodista que obliguen a revelar al agente.","support":["La frase no dice quién …","Asumir la responsabilidad sería …","¿Quién exactamente ha …?"],"explanations":[["La pasiva refleja (se + verbo en tercera persona) presenta la acción sin agente explícito. La pregunta pide analizar qué información desaparece.","Leed como periodistas: «Se han detectado irregularidades». Escribid tres preguntas que haríais inmediatamente."],["En los comunicados oficiales, la impersonalidad suena objetiva y prudente, pero también puede diluir la responsabilidad. La pregunta pide valorar estas dos caras.","Comparad: «Se ha decidido cerrar la biblioteca» y «La dirección ha decidido cerrar la biblioteca». ¿Cuál os da más confianza como alumnos?"],["Omitir el agente puede ser legítimo si es desconocido, evidente o irrelevante. La pregunta pide distinguir los casos razonables de los evasivos.","Clasificad: «Se ha publicado el horario», «Se han perdido datos personales», «Se ha arreglado la calefacción». ¿En cuál exigiríais saber quién fue?"]]},{"title":"Hoy comí, hoy he comido","subtitle":"Variedades del español","main":"¿Cómo varía el uso del perfecto en el mundo hispanohablante?","questions":["¿Qué se oye con «hoy» en España, en México y en Argentina?","¿Qué ocurre en Canarias y en partes de Galicia o Asturias?","¿Qué variedad os conviene aprender y por qué?"],"challenge":"Preparad un diálogo entre dos personajes de variedades distintas que se entienden perfectamente.","stretch":"Discutid cómo debería evaluar un examen estas diferencias.","support":["En esta variedad se prefiere …","No es un error, sino …","Para un estudiante checo, lo más útil es …"],"explanations":[["En el centro y el norte de la península el perfecto es habitual con «hoy»; en México, en el Río de la Plata y en gran parte de América predomina el indefinido. La pregunta pide describir esta distribución.","Imaginad que tres hablantes, de Madrid, de Ciudad de México y de Buenos Aires, cuentan qué han hecho hoy. Escribid una frase de cada uno."],["Dentro de España tampoco hay uniformidad: en Canarias y en zonas de Galicia y Asturias se usa mucho el indefinido. La pregunta pide matizar la idea de un único «español de España».","Un profesor gallego dice «Hoy desayuné tarde». ¿Lo consideraríais un error? Explicad vuestra respuesta."],["Para aprender conviene elegir un modelo coherente, pero también entender las demás variedades. La pregunta pide justificar vuestra elección.","Haced una lista de ventajas del uso peninsular y del uso americano. ¿Qué depende de vuestros planes personales?"]]}],"vocab":[["el pluscuamperfecto","předminulý čas"],["ya habían salido","už (předtím) odešli"],["espero que hayas llegado","doufám, že jsi dorazil(a)"],["habrá salido","asi už odešel / odešla"],["tengo hechos los deberes","mám hotové úkoly"],["llevo leídos","mám už přečtené"],["he venido observando","pozoruji už delší dobu"],["se han tomado medidas","byla přijata opatření"],["la pasiva refleja","zvratné pasivum"],["se me ha roto","rozbilo se mi (neúmyslně)"],["la conjetura","dohad, domněnka"],["la responsabilidad","odpovědnost"]],"toolkit":[["Anterioridad","Cuando llegué, ya habían salido."],["Deseo","Espero que hayas descansado."],["Conjetura","Habrá salido ya."],["Responsabilidad","Se ha roto. / Lo he roto."]]},"C2":{"warm":"¿Es verdad que «he comido» se refiere siempre a un pasado más reciente que «comí»? Buscad dos contraejemplos.","stations":[{"title":"Cerca o conectado","subtitle":"¿Pasado reciente o pasado relevante?","main":"¿El perfecto expresa un pasado reciente o un pasado que el hablante incluye en su presente?","questions":["¿Por qué se puede decir «Mi abuelo ha visto muchas guerras» si fue hace décadas?","¿Por qué «Se fue hace un minuto» es perfectamente posible?","¿Qué papel tiene la perspectiva del hablante?"],"challenge":"Analizad seis pares mínimos y decidid qué criterio explica mejor la elección.","stretch":"Proponed una definición del perfecto y ponedla a prueba con contraejemplos.","support":["Este ejemplo contradice …","El criterio decisivo parece ser …","Una explicación más precisa sería …"],"explanations":[["El perfecto de experiencia puede referirse a hechos muy lejanos si el período de la vida sigue abierto. La pregunta pide explicar por qué la distancia temporal no decide.","Comparad «Mi abuelo ha visto muchas guerras» (vive) y «Mi bisabuelo vio muchas guerras» (murió hace años). ¿Qué cambia: el tiempo transcurrido o la situación del sujeto?"],["Un hecho muy reciente puede ir en indefinido si el hablante lo presenta como cerrado, separado de su presente. La pregunta pide analizar ese caso.","Decid en voz alta «Se ha ido hace un minuto» y «Se fue hace un minuto». ¿Os parecen posibles las dos? ¿En qué variedades?"],["Muchas gramáticas hablan de un «presente ampliado»: el intervalo que el hablante considera actual. La pregunta pide pensar cómo lo delimita el contexto.","Un historiador dice: «En este siglo hemos visto grandes avances». ¿Hasta dónde llega su presente? ¿Y el de una alumna que dice «Este curso he aprendido mucho»?"]]},{"title":"La norma y las normas","subtitle":"Enseñar sin estigmatizar","main":"¿Cómo deberíamos enseñar el perfecto sin presentar otras variedades como incorrectas?","questions":["¿Qué dice la gramática académica actual sobre la variación en el uso del perfecto?","¿Qué riesgos tiene enseñar una sola regla?","¿Cómo corregirías a un estudiante que mezcla usos de distintas variedades?"],"challenge":"Diseñad una explicación de cinco minutos para estudiantes de B1 que incluya la variación.","stretch":"Redactad una corrección escrita que sea precisa y respetuosa a la vez.","support":["La gramática reconoce que …","Sería más justo explicar que …","Te sugiero mantener …, porque …"],"explanations":[["La Nueva gramática de la lengua española (RAE y ASALE) describe los usos de distintas zonas como variantes, no como errores. La pregunta pide considerar qué implica esto para la enseñanza.","Imaginad que el libro de texto dice «Con hoy se usa el perfecto». ¿Cómo lo reformularíais para que sea correcto y respetuoso con la variación?"],["Una regla única simplifica el aprendizaje, pero puede llevar a corregir como error lo que es normal para millones de hablantes. La pregunta pide sopesar ventajas e inconvenientes.","Haced dos columnas: ventajas de enseñar solo el modelo peninsular y riesgos de hacerlo. Comparad con otra pareja."],["El problema no es usar una variedad, sino mezclar sistemas de forma incoherente en un mismo texto. La pregunta pide diferenciar la variación legítima de la falta de coherencia.","Un alumno escribe: «Hoy he desayunado tarde, luego fui al instituto y he hablado con Ana». ¿Qué le diríais exactamente?"]]},{"title":"Ayer he ido","subtitle":"La lengua en movimiento","main":"¿Está cambiando el uso del perfecto en el español peninsular?","questions":["¿Habéis oído frases como «Ayer he ido al cine»?","¿Qué significa que el perfecto adquiera un valor de pasado narrativo?","¿Qué paralelos hay con el francés o el alemán?"],"challenge":"Comparad la evolución del perfecto en español, francés y alemán con ejemplos sencillos.","stretch":"Argumentad si este cambio es un error, una tendencia o una variación de registro.","support":["Este uso se ha documentado en …","En francés ya …","Desde el punto de vista normativo …"],"explanations":[["Algunos estudios observan en el habla de ciertas zonas de España un uso del perfecto con marcadores de pasado cerrado, como «ayer». La pregunta pide reflexionar sobre este fenómeno.","Pensad en estas dos frases: «Ayer he ido al médico» y «Ayer fui al médico». ¿Alguna os suena de series o conversaciones? ¿Qué impresión os da?"],["Cuando el perfecto empieza a usarse para contar cualquier hecho pasado, los lingüistas hablan de un uso «aorístico» o narrativo. La pregunta pide explicar el concepto con ejemplos.","Contad una anécdota usando solo el perfecto y luego con el indefinido. ¿Qué versión suena más natural para vuestro oído?"],["En francés (j’ai vu) y en el alemán hablado (ich habe gesehen), el perfecto se ha convertido en el pasado general de la conversación. La pregunta pide comparar esta evolución con el español.","Traducid «Ayer vi a Pedro» al francés o al alemán. ¿Qué tiempo aparece? ¿Qué os dice esto sobre una posible evolución del español?"]]},{"title":"Errores que se han cometido","subtitle":"Titulares y discurso político","main":"¿Cómo se usa el perfecto para encuadrar hechos en titulares y declaraciones públicas?","questions":["¿Qué efecto tiene «Se han cometido errores» frente a «Cometimos errores»?","¿Por qué un titular dice «El paro ha bajado» sin dar fechas?","¿Cuándo una frase es verdadera pero engañosa?"],"challenge":"Escribid tres titulares para un mismo hecho ficticio y analizad su efecto.","stretch":"Reescribid una declaración evasiva para que sea transparente.","support":["Este titular resalta …","Al omitir la fecha, …","Una versión más transparente sería …"],"explanations":[["Combinar el perfecto con la impersonalidad presenta los errores como algo actual, pero sin autor. La pregunta pide comparar el grado de responsabilidad asumida.","Leed las dos frases como ciudadanos. ¿Cuál exige más preguntas? Escribid dos de esas preguntas."],["Sin fecha, el perfecto sugiere un cambio reciente y relevante. La pregunta pide pensar qué puede ocultar la ausencia de datos temporales.","Si el paro bajó hace tres años y desde entonces ha subido, ¿sería honesto el titular? ¿Cómo lo mejoraríais?"],["Una frase puede ser literalmente cierta y dar una impresión falsa sobre el momento o la importancia de un hecho. La pregunta pide detectar ese mecanismo.","Una empresa anuncia en 2026: «Hemos ganado un premio internacional». El premio fue en 2015. ¿Qué opináis? Redactad una versión honesta."]]},{"title":"Entre el checo y el español","subtitle":"Aspecto y tiempo","main":"¿Cómo se relacionan el aspecto verbal checo y los pasados del español?","questions":["¿Cómo traducirías «Už jsem to udělal», «Celý den jsem pracoval» y «Byl jsem v Mexiku»?","¿Corresponde siempre un verbo perfectivo checo al perfecto o al indefinido?","¿Qué pistas del contexto deciden la traducción?"],"challenge":"Traducid seis frases checas y comparad las alternativas.","stretch":"Explicad a un estudiante checo por qué el aspecto y el tiempo son categorías distintas.","support":["La frase checa destaca …","En español lo decisivo es …","Ambas traducciones son posibles si …"],"explanations":[["Las tres frases expresan un resultado, una actividad prolongada y una experiencia. La pregunta pide elegir el tiempo español adecuado para cada una.","Traducid individualmente y comparad con vuestra pareja. ¿Dónde habéis elegido tiempos distintos? ¿Podrían ser correctos los dos?"],["El aspecto checo marca si la acción se presenta completa (udělat) o en curso (dělat); el español combina esta información con el tiempo: indefinido, imperfecto o perfecto. La pregunta pide comprobar si hay una correspondencia directa.","Traducid «Psal jsem dopis» y «Napsal jsem dopis» en dos contextos: hoy y en 1999. ¿Qué formas aparecen?"],["Los marcadores temporales, la situación y la intención del hablante suelen decidir la traducción. La pregunta pide identificar estas pistas.","Traducid «Viděl jsi ten film?» para un amigo que decide qué ver esta noche y para un profesor que pregunta por la clase de ayer. ¿Usáis el mismo tiempo?"]]},{"title":"Lo dicho y lo insinuado","subtitle":"Implicaturas","main":"¿Qué puede sugerir una frase en perfecto más allá de lo que dice literalmente?","questions":["¿Qué insinúa «Ya hemos hablado de eso» en una discusión?","¿Qué implica «Todavía no se ha decidido nada»?","¿Cómo influye la entonación?"],"challenge":"Representad tres miniescenas en las que la misma frase signifique cosas distintas.","stretch":"Reformulad cada frase para eliminar la ambigüedad.","support":["Literalmente dice …, pero sugiere …","Con otra entonación podría …","Para evitar malentendidos diría …"],"explanations":[["«Ya hemos hablado de eso» puede significar simplemente que hubo una conversación o que el tema está cerrado y no se quiere volver a él. La pregunta pide distinguir lo dicho de lo insinuado.","Decid la frase con tres entonaciones: neutra, cansada y cortante. ¿Qué entiende vuestra pareja en cada caso?"],["«Todavía no» presupone que se espera una decisión; «nada» puede sugerir que ni siquiera se ha empezado. La pregunta pide analizar estas presuposiciones.","Un director dice esta frase a unos periodistas. ¿Qué conclusiones podrían sacar? ¿Cuáles serían injustificadas?"],["La entonación, las pausas y el contexto modifican el sentido de una misma estructura gramatical. La pregunta pide observar ese efecto.","Representad la frase «Has llegado» como sorpresa, como reproche y como alivio. ¿Qué cambia además de la entonación?"]]},{"title":"Haber y tener","subtitle":"Historia de una forma","main":"¿Cómo llegó «haber + participio» a ser un tiempo verbal?","questions":["¿Qué significaba originalmente «habeo litteras scriptas» en latín?","¿Por qué en el español medieval el participio podía concordar con el objeto?","¿Está «tener + participio» recorriendo hoy un camino parecido?"],"challenge":"Explicad la evolución con una línea temporal sencilla y tres ejemplos.","stretch":"Comparad con el francés (accord du participe) y con el inglés (I have it written / I have written it).","support":["Originalmente significaba …","Con el tiempo, …","Hoy se observa que …"],"explanations":[["En latín, «habeo litteras scriptas» significaba aproximadamente «tengo cartas escritas»: «habere» expresaba posesión y el participio era un adjetivo. La pregunta pide entender este punto de partida.","Traducid literalmente al checo «Tengo escritas las cartas». ¿Se parece a la frase latina? ¿Qué significado tiene: posesión, resultado o tiempo pasado?"],["En el español medieval el participio todavía podía concordar con el objeto, como un adjetivo; la invariabilidad actual muestra que «haber + participio» se convirtió en una unidad verbal. Los lingüistas llaman a este proceso gramaticalización. La pregunta pide explicarlo.","Comparad «las cartas que he escrito» con una forma concordada como «escritas». ¿Qué indica la pérdida de concordancia sobre el significado de «haber»?"],["«Tener + participio» conserva hoy la concordancia y un sentido de posesión del resultado, como el antiguo «haber». La pregunta pide valorar si podría seguir un camino similar.","Decid «Tengo pensado irme» y «Tengo leídos tres libros». ¿En cuál notáis más el sentido de posesión? ¿En cuál suena casi como un tiempo verbal?"]]},{"title":"La revisión experta","subtitle":"Coherencia temporal","main":"¿Cómo revisas un texto fluido pero temporalmente incoherente?","questions":["¿Qué cambios de tiempo están justificados por el contexto?","¿Cuáles se deben a la mezcla de variedades distintas?","¿Qué expresiones temporales chocan con su verbo?"],"challenge":"Revisad un texto ficticio de ocho frases y justificad cada cambio.","stretch":"Defended dos versiones correctas con criterios diferentes, uno peninsular y otro americano.","support":["Este cambio está justificado porque …","Aquí se mezclan …","Propongo …, ya que …"],"explanations":[["Un cambio de tiempo puede ser deliberado: por ejemplo, pasar del perfecto (balance) al indefinido (detalles). La pregunta pide distinguir los cambios con función de los descuidados.","Leed: «Este año hemos mejorado mucho. En marzo empezamos un proyecto nuevo». ¿Es coherente? ¿Por qué?"],["Mezclar en el mismo texto el sistema peninsular y el americano puede desconcertar al lector. La pregunta pide detectar esas mezclas.","Corregid esta frase para un lector de Madrid y después para uno de Lima: «Hoy fui a clase y he visto a mis amigos». ¿Qué cambia?"],["Algunas combinaciones resultan anómalas en casi todas las variedades, como un perfecto con una fecha cerrada en un texto formal. La pregunta pide localizarlas.","Buscad el error: «En 2019 he terminado el bachillerato y desde entonces estudio en Praga». Proponed una corrección y explicadla."]]}],"vocab":[["la deixis temporal","časová deixe (vztah k okamžiku promluvy)"],["el presente ampliado","rozšířená přítomnost"],["el perfecto de experiencia","perfektum zkušenosti"],["el perfecto aorístico","perfektum ve funkci prostého minulého času"],["la gramaticalización","gramatikalizace"],["la Nueva gramática","Nová gramatika španělštiny (RAE, ASALE)"],["una variante legítima","legitimní varianta"],["el aspecto verbal","slovesný vid / aspekt"],["una implicatura","implikatura, nevyslovený význam"],["la agencia","činitelství, původce děje"],["la coherencia temporal","časová soudržnost textu"],["una corrección con tacto","taktní oprava"]],"toolkit":[["Marco","Este año hemos…"],["Variación","También es natural decir…"],["Inferencia","Eso puede sugerir que…"],["Precisión","Hay que distinguir entre…"]]}},"uiSimple":{"eyebrow":"HABLA · PREGUNTA · RESPONDE · ESCUCHA","hero":"Habla de lo que has hecho hoy o esta semana, pregunta por experiencias y utiliza formas como «he hablado» y «he comido».","privacy":"Puedes inventar tus experiencias. Nadie tiene que revelar información personal. Se respetan las diferentes variedades del español.","step4":"¿Quieres más? Abre la siguiente tarea.","questions":"Más preguntas","supportTitle":"¿Necesitas ayuda?","supportDesc":"Palabras para empezar tus frases.","supportShow":"Ver ayuda","supportHide":"Ocultar ayuda","challengeTitle":"Más para hablar","challengeDesc":"Para después de la pregunta principal.","challengeShow":"Ver tarea","challengeHide":"Ocultar tarea","stretchTitle":"Una tarea más difícil","stretchDesc":"Si quieres hacer más.","stretchShow":"Ver tarea difícil","stretchHide":"Ocultar tarea difícil","progress":"Di por qué. Da un ejemplo. Haz una pregunta.","vocabLabel":"PALABRAS ÚTILES","vocabDesc":"Usa las palabras que te ayudan.","toolkitLabel":"FRASES ÚTILES","toolkitDesc":"Hablad juntos: preguntad y responded.","title":"Pretérito perfecto · ¿Qué has hecho?","strap":"¿Qué has hecho y qué ha cambiado?"},"uiB1":{"stretchTitle":"Un paso más","stretchDesc":"Una tarea más difícil si ya habláis con seguridad.","vocabDesc":"Formas del pretérito perfecto, expresiones temporales y traducciones al checo.","progress":"Dad razones y ejemplos, y reaccionad a lo que dice la otra persona."}},"de":{"ui":{"title":"Perfekt · Die Vergangenheit im Gespräch","strap":"Was hast du gemacht – und was ist passiert?","brand":"KONVERSATIONSLABOR","subbrand":"Ein Gespräch, keine Prüfung","eyebrow":"SPRECHEN · HINTERFRAGEN · BEGRÜNDEN · REAGIEREN","hero":"Erzählt von Erlebnissen, stellt Fragen und übt das deutsche Perfekt: haben oder sein, Partizip II, Satzklammer und später auch stilistische Feinheiten.","privacy":"Ihr könnt alle Erlebnisse erfinden. Niemand muss private Erfahrungen oder persönliche Informationen teilen. Hier geht es ums Sprechen, nicht um Fehlerfreiheit.","format":"Partnerarbeit","estimated":"45–55 Minuten","changeLevel":"GER-Niveau","changeLanguage":"Sprache","themeDay":"Hell","themeNight":"Dunkel","fullscreen":"Vollbild","exitFullscreen":"Vollbild beenden","resetLesson":"Zurücksetzen","levelGoal":"Sprechziel","step1":"Denk kurz nach.","step2":"Nenne einen Grund oder ein Beispiel.","step3":"Stelle deinem Gegenüber eine Rückfrage.","step4":"Öffne die Zusatzaufgabe, wenn du weiterreden möchtest.","warmTitle":"Einstieg","warmTime":"2–3 Min. · wenn du möchtest","warmHint":"Wenn du möchtest: eine kurze Aufgabe zum Start.","stations":"Gesprächsstationen","station":"Station","of":"von","main":"LEITFRAGE","questions":"Entdeckt das Thema","supportTitle":"Brauchst du sprachliche Hilfe?","supportDesc":"Satzanfänge, wenn dir die Worte fehlen.","supportShow":"H richtigen Reihenfolge.","support":["Nach der Schule habe ich gespielt.","Ich habe … / Ich bin …","Hast du …? / Bist du …?"]},{"title":"Frühstück und Essen","subtitle":"Am Tisch","main":"Was hast du heute gegessen oder getrunken?","questions":["Hast du Brot gegessen?","Hast du Wasser getrunken?","Hast du etwas gekocht?"],"challenge":"Nenne zwei Lebensmittel und benutze „gegessen“.","stretch":"Frage nach dem Frühstück und reagiere auf die Antwort.","support":["Ich habe Brot gegessen.","Ich habe … / Ich bin …","Hast du …? / Bist du …?"]},{"title":"Ein Besuch","subtitle":"Freunde und Familie","main":"Wen hast du besucht?","questions":["Hast du einen Freund besucht?","Hast du deine Großeltern angerufen?","Hast du jemanden getroffen?"],"challenge":"Führt einen Dialog mit „besucht“ und „getroffen“.","stretch":"Vergleiche „besuchen“ und „treffen“ in zwei Sätzen.","support":["Ich habe meine Oma besucht.","Ich habe … / Ich bin …","Hast du …? / Bist du …?"]},{"title":"Unterwegs","subtitle":"Ortswechsel","main":"Wohin bist du gegangen?","questions":["Bist du in die Schule gegangen?","Bist du nach Hause gefahren?","Bist du spät gekommen?"],"challenge":"Sag drei Sätze mit „Ich bin …“.","stretch":"Erkläre den Unterschied zwischen „gegangen“ und „gefahren“.","support":["Ich bin nach Hause gegangen.","Ich habe … / Ich bin …","Hast du …? / Bist du …?"]},{"title":"Am Wochenende","subtitle":"Mein Samstag","main":"Was hast du am Samstag gemacht?","questions":["Hast du Sport gemacht?","Hast du einen Film gesehen?","Hast du mit Freunden gesprochen?"],"challenge":"Fasse deinen Samstag in drei Sätzen zusammen.","stretch":"Stelle drei Ja-Nein-Fragen im Perfekt.","support":["Am Samstag habe ich einen Film gesehen.","Ich habe … / Ich bin …","Hast du …? / Bist du …?"]},{"title":"Fragen stellen","subtitle":"Interview","main":"Was hast du heute schon gemacht?","questions":["Hast du schon gefrühstückt?","Hast du deine Tasche gepackt?","Hast du etwas Interessantes gelernt?"],"challenge":"Spielt ein

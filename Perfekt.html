suis allé(e) » : attention à l’auxiliaire.","tipA2":"La négation entoure l’auxiliaire : « je n’ai pas compris ».","tipB1":"L’imparfait décrit souvent la situation ; le passé composé met l’événement au premier plan.","tipB2":"Avec « avoir », accord du participe si le COD précède : « je les ai vues ».","tipC1":"« Elles se sont parlé » mais « elles se sont vues » : COI et COD font la différence.","tipC2":"« La chaleur qu’il a fait » : pas d’accord dans une tournure impersonnelle.","startLesson":"Commencer la discussion →","offline":"Hors ligne","controlsAria":"Commandes de l’activité","stationNavAria":"Étapes de discussion","questionHelpTip":"Ouvrez une question pour voir une explication simple et une situation de discussion.","questionHelpOpen":"Expliquer","questionHelpClose":"Masquer","questionHelpMeaning":"QUE VEUT DIRE LA QUESTION ?","questionHelpTry":"EXEMPLE OU ACTIVITÉ"},"levels":{"A1":{"warm":"Dites deux phrases : « J’ai mangé… » et « Je suis allé(e)… ».","stations":[{"title":"Hier, j’ai…","subtitle":"Petites actions","main":"Qu’est-ce que tu as fait hier ?","questions":["Tu as regardé la télévision ?","Tu as écouté de la musique ?","Tu as étudié le français ?"],"challenge":"Dis trois phrases avec « j’ai … ».","stretch":"Pose deux questions à ton partenaire.","support":["Hier, j’ai écouté de la musique.","Hier, j’ai … / Je suis allé(e) …","Est-ce que tu as … ?"]},{"title":"Mon petit déjeuner","subtitle":"À table","main":"Qu’est-ce que tu as mangé ce matin ?","questions":["Tu as mangé du pain ?","Tu as bu de l’eau ?","Tu as préparé un café ?"],"challenge":"Décris ton petit déjeuner en deux phrases.","stretch":"Demande ce que ton partenaire a mangé.","support":["J’ai mangé du pain et j’ai bu de l’eau.","Hier, j’ai … / Je suis allé(e) …","Est-ce que tu as … ?"]},{"title":"Après les cours","subtitle":"Ma journée","main":"Qu’est-ce que tu as fait après les cours ?","questions":["Tu as joué au football ?","Tu as fait tes devoirs ?","Tu as parlé avec un ami ?"],"challenge":"Raconte trois activités.","stretch":"Réponds avec « je n’ai pas… » une fois.","support":["J’ai fait mes devoirs et j’ai joué.","Hier, j’ai … / Je suis allé(e) …","Est-ce que tu as … ?"]},{"title":"Mes amis","subtitle":"Une visite","main":"Qui as-tu vu récemment ?","questions":["Tu as rencontré un ami ?","Tu as appelé ta famille ?","Tu as vu quelqu’un ce week-end ?"],"challenge":"Jouez un mini-dialogue sur une visite.","stretch":"Pose une question avec « qui » et une avec « où ».","support":["J’ai vu mes amis samedi.","Hier, j’ai … / Je suis allé(e) …","Est-ce que tu as … ?"]},{"title":"Je suis allé(e)","subtitle":"Les déplacements","main":"Où es-tu allé(e) hier ?","questions":["Tu es allé(e) à l’école ?","Tu es rentré(e) tôt ?","Tu es arrivé(e) à l’heure ?"],"challenge":"Dis trois phrases avec « je suis… ».","stretch":"Compare « j’ai joué » et « je suis allé(e) ».","support":["Je suis allé(e) au parc.","Hier, j’ai … / Je suis allé(e) …","Est-ce que tu as … ?"]},{"title":"Un bon film","subtitle":"Culture et loisirs","main":"Qu’est-ce que tu as regardé ou lu ?","questions":["Tu as vu un film ?","Tu as lu un livre ?","Tu as entendu une chanson ?"],"challenge":"Recommande un film que tu as vu.","stretch":"Dis une chose que tu n’as pas vue.","support":["J’ai vu un film et j’ai lu un livre.","Hier, j’ai … / Je suis allé(e) …","Est-ce que tu as … ?"]},{"title":"Question-réponse","subtitle":"Une petite enquête","main":"Peux-tu poser des questions au passé composé ?","questions":["Tu as joué ce matin ?","Tu as étudié hier ?","Tu es sorti(e) dimanche ?"],"challenge":"Pose quatre questions et réponds brièvement.","stretch":"Change une question en phrase négative.","support":["Tu as étudié ? – Oui, j’ai étudié.","Hier, j’ai … / Je suis allé(e) …","Est-ce que tu as … ?"]},{"title":"Mon histoire en cinq phrases","subtitle":"Raconter","main":"Peux-tu raconter ta journée au passé composé ?","questions":["Qu’est-ce que tu as fait d’abord ?","Où es-tu allé(e) ensuite ?","Qu’as-tu mangé ?"],"challenge":"Raconte une journée imaginaire en cinq phrases.","stretch":"Ajoute « d’abord », « puis » et « enfin ».","support":["D’abord, je suis allé(e) au parc. Puis j’ai mangé.","Hier, j’ai … / Je suis allé(e) …","Est-ce que tu as … ?"]}],"vocab":[["j’ai mangé","jedl(a) jsem"],["tu as parlé","mluvil(a) jsi"],["il a fini","dokončil"],["elle est allée","šla / jela (žena)"],["le passé composé","francouzský složený minulý čas"],["un participe passé","minulé příčestí"],["j’ai fait","udělal(a) jsem"],["j’ai vu","viděl(a) jsem"],["j’ai lu","četl(a) jsem"],["je suis allé(e)","šel/šla / jel(a) jsem"],["je suis arrivé(e)","dorazil(a) jsem"],["je n’ai pas…","ne… (záporný minulý čas)"]],"toolkit":[["Avec avoir","J’ai mangé une pomme."],["Avec être","Je suis allé(e) au parc."],["Question","Tu as vu le film ?"],["Négation","Je n’ai pas joué."]]},"A2":{"warm":"Racontez un week-end imaginaire en quatre phrases avec avoir et être.","stations":[{"title":"Un week-end animé","subtitle":"Raconter un programme","main":"Qu’est-ce que tu as fait le week-end dernier ?","questions":["Tu as rendu visite à des amis ?","Tu es sorti(e) le soir ?","Tu as fait du sport ?"],"challenge":"Raconte un week-end en six phrases.","stretch":"Ajoute deux questions pour relancer le dialogue.","support":["Samedi, je suis sorti(e), puis j’ai rencontré des amis.","Je n’ai pas … / Je ne suis pas …","D’abord …, puis …, enfin …"]},{"title":"Une excursion","subtitle":"Aller et venir","main":"Où êtes-vous allé(e)s lors de votre dernière sortie ?","questions":["Comment êtes-vous arrivé(e)s ?","Qu’avez-vous visité ?","Quand êtes-vous rentré(e)s ?"],"challenge":"Inventez une excursion et présentez-la.","stretch":"Utilisez trois verbes avec « être » et deux avec « avoir ».","support":["Nous sommes allé(e)s à Lyon et nous avons visité un musée.","Je n’ai pas … / Je ne suis pas …","D’abord …, puis …, enfin …"]},{"title":"Je n’ai pas…","subtitle":"Ce qui n’a pas eu lieu","main":"Qu’est-ce que tu n’as pas fait hier ?","questions":["Tu n’as pas fini un devoir ?","Tu n’as pas regardé de film ?","Pourquoi n’es-tu pas sorti(e) ?"],"challenge":"Jouez un dialogue sur des projets annulés.","stretch":"Faites une question négative et répondez avec « si ».","support":["Je n’ai pas terminé mon travail.","Je n’ai pas … / Je ne suis pas …","D’abord …, puis …, enfin …"]},{"title":"Il s’est passé quoi ?","subtitle":"Une surprise","main":"Qu’est-ce qui s’est passé pendant la journée ?","questions":["Tu as perdu quelque chose ?","Tu as reçu une bonne nouvelle ?","Tu as trouvé une solution ?"],"challenge":"Inventez une courte histoire avec une surprise.","stretch":"Ajoutez une réaction appropriée.","support":["J’ai perdu mes clés, mais je les ai retrouvées.","Je n’ai pas … / Je ne suis pas …","D’abord …, puis …, enfin …"]},{"title":"Je me suis levé(e)","subtitle":"Les verbes pronominaux","main":"À quelle heure t’es-tu levé(e) ?","questions":["Tu t’es réveillé(e) tôt ?","Tu t’es habillé(e) vite ?","Tu t’es promené(e) ?"],"challenge":"Raconte ta matinée avec trois verbes pronominaux.","stretch":"Compare les formes « je me suis… » et « j’ai… ».","support":["Je me suis levé(e) à sept heures.","Je n’ai pas … / Je ne suis pas …","D’abord …, puis …, enfin …"]},{"title":"Une fête","subtitle":"Rencontrer des gens","main":"Qu’est-ce que vous avez fait à la fête ?","questions":["Qui a apporté le gâteau ?","Qu’est-ce que vous avez mangé ?","Qui est arrivé en premier ?"],"challenge":"Racontez une fête imaginaire à deux voix.","stretch":"Ajoutez une phrase avec « parce que ».","support":["Nous avons dansé et Léa est arrivée tard.","Je n’ai pas … / Je ne suis pas …","D’abord …, puis …, enfin …"]},{"title":"Un petit problème","subtitle":"Au téléphone","main":"Que s’est-il passé avec ton téléphone ?","questions":["Tu l’as perdu ?","Tu as demandé de l’aide ?","Quelqu’un a trouvé une solution ?"],"challenge":"Jouez un appel pour expliquer un problème.","stretch":"Exprimez la solution au passé composé.","support":["J’ai demandé de l’aide et mon frère a répondu.","Je n’ai pas … / Je ne suis pas …","D’abord …, puis …, enfin …"]},{"title":"Notre enquête","subtitle":"Interroger et résumer","main":"Qu’avez-vous fait cette semaine ?","questions":["Qui a lu un livre ?","Qui est allé(e) au cinéma ?","Qui a essayé une activité nouvelle ?"],"challenge":"Posez six questions et notez les réponses.","stretch":"Résumez les réponses avec « il/elle a » et « il/elle est ».","support":["Camille a lu un roman et Paul est allé au théâtre.","Je n’ai pas … / Je ne suis pas …","D’abord …, puis …, enfin …"]}],"vocab":[["je me suis levé(e)","vstal(a) jsem"],["je suis rentré(e)","vrátil(a) jsem se domů"],["je suis resté(e)","zůstal(a) jsem"],["je suis né(e)","narodil(a) jsem se"],["je n’ai pas compris","nerozuměl(a) jsem"],["j’ai perdu","ztratil(a) jsem"],["j’ai retrouvé","znovu jsem našel / našla"],["j’ai pris","vzal(a) jsem"],["un verbe pronominal","zvratné sloveso"],["d’abord","nejdřív"],["ensuite","potom"],["enfin","nakonec"]],"toolkit":[["Chronologie","D’abord, j’ai…"],["Déplacement","Je suis rentré(e) tard."],["Négation","Je n’ai pas fini."],["Pronominal","Je me suis levé(e)."]]},"B1":{"warm":"Construisez un récit : « Il pleuvait quand… » et terminez au passé composé.","stations":[{"title":"Un événement imprévu","subtitle":"Raconter une histoire","main":"Qu’est-ce qui t’est arrivé récemment ?","questions":["Que faisais-tu juste avant ?","Qu’est-ce qui s’est passé soudainement ?","Comment l’histoire s’est-elle terminée ?"],"challenge":"Racontez un incident fictif avec un début et une fin.","stretch":"Alternez correctement imparfait et passé composé.","support":["Je marchais quand j’ai entendu un bruit.","Il faisait … quand j’ai …","Nous avons … parce que …"]},{"title":"Imparfait ou passé composé ?","subtitle":"Décor et action","main":"Pourquoi dit-on « il pleuvait quand nous sommes sortis » ?","questions":["Quelle action était en cours ?","Quel événement l’a interrompue ?","Comment le récit change-t-il si on inverse les temps ?"],"challenge":"Imaginez une scène et racontez-la à deux.","stretch":"Justifiez le choix de chaque temps.","support":["Il pleuvait quand nous sommes arrivés.","Il faisait … quand j’ai …","Nous avons … parce que …"]},{"title":"Un voyage mémorable","subtitle":"Chronologie","main":"Quel voyage t’a laissé le meilleur souvenir ?","questions":["Comment es-tu parti(e) ?","Qu’avez-vous découvert sur place ?","Qu’est-ce qui t’a surpris(e) ?"],"challenge":"Faites un récit commun avec des connecteurs chronologiques.","stretch":"Ajoutez un détail de contexte à l’imparfait.","support":["Nous sommes partis tôt, puis nous avons découvert un village.","Il faisait … quand j’ai …","Nous avons … parce que …"]},{"title":"La routine bouleversée","subtitle":"Verbes pronominaux","main":"Qu’est-ce qui a changé dans une journée ordinaire ?","questions":["À quelle heure t’es-tu levé(e) ?","Pourquoi t’es-tu dépêché(e) ?","Quand t’es-tu rendu(e) au rendez-vous ?"],"challenge":"Racontez une matinée stressante imaginaire.","stretch":"Corrigez deux erreurs d’auxiliaire dans un dialogue.","support":["Je me suis dépêché(e), mais je suis arrivé(e) en retard.","Il faisait … quand j’ai …","Nous avons … parce que …"]},{"title":"Une erreur réparée","subtitle":"Négation et réaction","main":"Comment as-tu réagi quand un plan a échoué ?","questions":["Qu’est-ce que tu n’as pas compris ?","Qui t’a expliqué le problème ?","Comment avez-vous trouvé une solution ?"],"challenge":"Jouez une conversation où une erreur est corrigée.","stretch":"Utilisez « ne… jamais » et « ne… plus » à bon escient.","support":["Je n’ai pas compris, puis j’ai demandé des précisions.","Il faisait … quand j’ai …","Nous avons … parce que …"]},{"title":"Un objet retrouvé","subtitle":"Pronoms objets","main":"As-tu déjà perdu un objet important ?","questions":["Quand l’as-tu perdu ?","Qui l’a retrouvé ?","Où l’as-tu rangé ensuite ?"],"challenge":"Racontez une histoire avec « le », « la » ou « les ».","stretch":"Comparez « j’ai trouvé la clé » et « je l’ai trouvée ».","support":["Je l’ai retrouvée sous la table.","Il faisait … quand j’ai …","Nous avons … parce que …"]},{"title":"Une rencontre inattendue","subtitle":"Temps du récit","main":"Comment as-tu rencontré un nouvel ami ?","questions":["Où étais-tu ?","Que faisiez-vous à ce moment-là ?","Qui a parlé en premier ?"],"challenge":"Jouez une rencontre fictive et racontez-la ensuite.","stretch":"Utilisez deux phrases à l’imparfait et trois au passé composé.","support":["J’attendais le bus quand j’ai rencontré Inès.","Il faisait … quand j’ai …","Nous avons … parce que …"]},{"title":"Le journal de la classe","subtitle":"Un résumé d’événements","main":"Qu’avez-vous accompli pendant un projet scolaire ?","questions":["Qu’avez-vous préparé ?","Qui s’est occupé de quoi ?","Quels obstacles avez-vous surmontés ?"],"challenge":"Présentez un bref reportage sur un projet imaginaire.","stretch":"Distinguez actions ponctuelles et descriptions de contexte.","support":["Nous avons organisé une exposition et accueilli des visiteurs.","Il faisait … quand j’ai …","Nous avons … parce que …"]}],"vocab":[["l’imparfait","minulý čas pro popis a průběh"],["il pleuvait","pršelo (průběh / pozadí)"],["j’ai rencontré","potkal(a) jsem"],["j’attendais","čekal(a) jsem"],["un événement","událost"],["le contexte","kontext, okolnosti"],["soudain","najednou"],["tout à coup","náhle"],["pendant que","zatímco"],["je l’ai trouvée","našel / našla jsem ji"],["je n’ai jamais…","nikdy jsem ne…"],["je n’ai rien vu","nic jsem neviděl(a)"]],"toolkit":[["Décor","Il pleuvait."],["Événement","J’ai entendu un bruit."],["Cause","J’ai appelé parce que…"],["Suite","Puis, nous sommes partis."]]},"B2":{"warm":"Racontez en trois phrases ce que vous avez fait ce matin, avec au moins un verbe pronominal et un verbe conjugué avec être.","stations":[{"title":"Être ou avoir ?","subtitle":"Verbes à double auxiliaire","main":"Pourquoi dit-on « je suis sorti(e) » mais « j’ai sorti les poubelles » ?","questions":["Quels verbes changent d’auxiliaire avec un COD ?","Que signifie « J’ai passé une bonne soirée » à côté de « Je suis passé(e) chez toi » ?","Quelles erreurs entendez-vous souvent ?"],"challenge":"Racontez un déménagement fictif avec monter, descendre, sortir, rentrer et retourner.","stretch":"Expliquez la règle avec vos propres mots sans utiliser le mot « transitif ».","support":["J’ai monté …, puis je suis monté(e) …","Quand il y a un COD, …","Le sens change : …"],"explanations":[["Monter, descendre, sortir, rentrer, retourner et passer se conjuguent avec être quand ils expriment un déplacement du sujet, mais avec avoir quand ils ont un complément d’objet direct. La question demande de repérer ce mécanisme.","Complétez avec votre partenaire : « Je … descendu(e) au sous-sol » et « J’… descendu les cartons ». Qu’est-ce qui change dans la phrase ?"],["Avec un COD, le verbe peut aussi changer de sens : passer une soirée (vivre un moment), passer chez quelqu’un (faire une courte visite). La question demande de comparer ces significations.","Inventez deux phrases avec « retourner » : l’une avec être (revenir quelque part), l’autre avec avoir (retourner une crêpe). Lisez-les à votre partenaire."],["Les apprenants confondent souvent les auxiliaires, par exemple dans « j’ai sorti hier soir ». La question demande d’identifier les erreurs fréquentes et leur cause.","Écrivez trois phrases fausses avec ces verbes, échangez-les avec un autre binôme et corrigez-les."]]},{"title":"Elles sont parties","subtitle":"L’accord avec être","main":"Comment s’accorde le participe passé avec l’auxiliaire être ?","questions":["Pourquoi écrit-on « elles sont arrivées » ?","Comment accorder quand le groupe est mixte ?","Quelle différence y a-t-il entre « la porte est fermée » et « la porte a été fermée » ?"],"challenge":"Décrivez l’arrivée des invités à une fête en variant le genre et le nombre.","stretch":"Expliquez pourquoi « nous sommes allé(e)s » peut s’écrire de plusieurs façons.","support":["Elles sont …","Comme le groupe est mixte, …","La première phrase décrit un état, la seconde …"],"explanations":[["Avec être, le participe s’accorde avec le sujet, comme un adjectif. La question demande d’appliquer cette règle.","Mettez au féminin pluriel : « Il est venu », « Il est tombé », « Il est né en 2008 ». Lisez les phrases à voix haute : entend-on la différence ?"],["Selon la règle traditionnelle, un groupe mixte prend le masculin pluriel. Certaines personnes utilisent aujourd’hui d’autres graphies, comme l’écriture inclusive. La question demande de décrire la règle et le débat qui l’entoure.","Écrivez « Paul et Marie sont … (partir) ». Comparez avec la graphie « parti·es ». Où pensez-vous que chaque forme apparaît ?"],["« La porte est fermée » décrit souvent un état ; « la porte a été fermée » insiste sur une action passée (passif au passé composé). La question demande de comparer ces deux constructions.","Vous rentrez chez vous et la porte est fermée. Puis vous apprenez que quelqu’un l’a fermée pendant votre absence. Quelle phrase utilisez-vous dans chaque cas ?"]]},{"title":"Je les ai vues","subtitle":"L’accord avec avoir","main":"Pourquoi écrit-on « les photos que j’ai prises » mais « j’ai pris les photos » ?","questions":["Quand le COD est-il placé avant le participe ?","Qu’est-ce qui change à l’oral dans « prises », « faites », « écrites » ?","Pourquoi « j’ai mangé des pommes » n’a-t-il pas d’accord ?"],"challenge":"Racontez un voyage avec au moins quatre COD placés avant le verbe.","stretch":"Trouvez cinq participes dont l’accord s’entend à l’oral.","support":["Je les ai …","La lettre que j’ai …","Le COD est placé …"],"explanations":[["Avec avoir, le participe s’accorde avec le COD seulement si celui-ci est placé avant : pronom (les, la), relatif (que) ou mot interrogatif (quelles photos). La question demande de reconnaître ces positions.","Repérez le COD dans : « Les clés ? Je les ai perdues. » « Quelles chansons as-tu écoutées ? » « J’ai écouté ces chansons. » Où y a-t-il accord ?"],["Pour beaucoup de participes (mangé, vu), l’accord ne s’entend pas ; pour d’autres (pris → prise, fait → faite, écrit → écrite), il s’entend. La question demande d’observer ce phénomène.","Dites à voix haute : « la lettre que j’ai écrite », « la robe que j’ai mise », « la tarte que j’ai faite ». Votre partenaire entend-il le féminin ?"],["Si le COD vient après le verbe, le participe reste invariable. La question demande d’expliquer pourquoi la même phrase change selon l’ordre des mots.","Transformez : « J’ai acheté des fleurs » → « Les fleurs que … » → « Je … ». Notez chaque forme du participe."]]},{"title":"Elle s’est lavé les mains","subtitle":"Verbes pronominaux","main":"Pourquoi écrit-on « elle s’est habillée » mais « elle s’est lavé les mains » ?","questions":["Quel est le COD dans chaque phrase ?","Où est-il placé ?","Comment écrire « Les mains, elle se les est lavées » ?"],"challenge":"Décrivez la routine matinale d’une famille fictive avec six verbes pronominaux.","stretch":"Inventez un exercice de trois phrases pour tester un autre binôme.","support":["Elle s’est …","Le COD est …, il est placé …","Donc le participe …"],"explanations":[["Dans « elle s’est habillée », le pronom « s’ » est le COD (elle a habillé elle-même) et il est placé avant : accord. Dans « elle s’est lavé les mains », le COD est « les mains », placé après : pas d’accord. La question demande d’analyser ces deux structures.","Remplacez être par avoir pour tester : « elle a habillé qui ? » et « elle a lavé quoi ? ». Que trouvez-vous dans chaque cas ?"],["Le pronom réfléchi peut être COD ou COI selon la phrase. La question demande de vérifier sa fonction avant de décider de l’accord.","Analysez : « Ils se sont regardés », « Elle s’est coupé le doigt », « Nous nous sommes réveillés ». Où le pronom est-il COD ?"],["Si le COD est repris par un pronom placé avant le verbe, l’accord se fait avec lui. La question demande de construire cette phrase difficile.","Écrivez la phrase avec « les dents » : « Les dents, il se … est … (brosser) ». Vérifiez l’accord ensemble."]]},{"title":"Je n’ai rien vu","subtitle":"Négation et adverbes","main":"Où placer la négation et les adverbes au passé composé ?","questions":["Pourquoi dit-on « je n’ai rien vu » mais « je n’ai vu personne » ?","Où se placent « déjà », « bien » et « toujours » ?","Comment répondre à « Tu n’as pas fini ? » si tu as fini ?"],"challenge":"Jouez l’interrogatoire d’un témoin fictif qui répond surtout par des négations.","stretch":"Comparez « Je n’ai pas toujours compris » et « Je n’ai toujours pas compris ».","support":["Je n’ai rien …","Je n’ai vu personne …","Si, j’ai …"],"explanations":[["« Rien », « jamais », « plus » et « pas » se placent entre l’auxiliaire et le participe ; « personne » se place après le participe. La question demande de comparer ces positions.","Répondez négativement : « Tu as vu quelqu’un ? », « Tu as mangé quelque chose ? », « Tu es déjà allé(e) à Lyon ? » Vérifiez la place des mots."],["Les adverbes courts (déjà, bien, mal, toujours, souvent) se placent en général entre l’auxiliaire et le participe. La question demande d’appliquer cette règle.","Ajoutez l’adverbe : « J’ai dormi (bien) », « Il a fini (déjà) », « Nous avons travaillé (beaucoup) ». Lisez les phrases."],["Pour contredire une question négative, on répond « si » et non « oui ». La question demande de pratiquer cette réponse.","Posez trois questions négatives à votre partenaire, par exemple « Tu n’as pas mangé ? ». Il répond au moins une fois en vous contredisant avec « si »."]]},{"title":"J’ai su, je savais","subtitle":"Quand le temps change le sens","main":"Pourquoi « j’ai su » et « je savais » ne veulent-ils pas dire la même chose ?","questions":["Que signifie « J’ai su la vérité hier » ?","Quelle différence y a-t-il entre « j’ai pu venir » et « je pouvais venir » ?","Pourquoi « il a eu peur » décrit-il une réaction ?"],"challenge":"Racontez une histoire où un personnage découvre un secret, avec savoir, connaître, pouvoir et vouloir.","stretch":"Traduisez ces paires en tchèque et observez l’aspect verbal.","support":["J’ai su que … (= j’ai appris)","Je savais déjà que …","J’ai pu … (= j’ai réussi à)"],"explanations":[["Avec certains verbes d’état, le passé composé exprime le début ou le résultat d’un état : « j’ai su » = j’ai appris, « j’ai connu » = j’ai rencontré. La question demande d’interpréter ce changement.","Comparez : « Je savais qu’il mentait » et « J’ai su qu’il mentait ». Dans quelle phrase y a-t-il un moment de découverte ?"],["« J’ai pu venir » signifie que j’ai réussi à venir ; « je pouvais venir » indique seulement une possibilité, sans dire si je suis venu(e). La question demande de comparer ces nuances.","Continuez chaque phrase : « Je pouvais venir, mais … » et « J’ai pu venir, donc … ». Votre partenaire juge si c’est logique."],["« Il a eu peur » présente la peur comme une réaction ponctuelle ; « il avait peur » décrit un état durable. La question demande d’expliquer cette différence d’aspect.","Racontez une scène d’orage avec les deux formes. Où placez-vous chacune ?"]]},{"title":"Je viens de finir","subtitle":"Passé récent et résultat","main":"Quelle différence y a-t-il entre « je viens de finir » et « j’ai fini » ?","questions":["Quand utilise-t-on « venir de + infinitif » ?","Que signifie « Ça y est, j’ai fini ! » ?","Peut-on dire « je viens de finir hier » ?"],"challenge":"Jouez un appel téléphonique où chacun annonce ce qu’il vient de faire.","stretch":"Comparez « je viens de manger » avec l’anglais « I’ve just eaten » et le tchèque « právě jsem dojedl ».","support":["Je viens de …","Ça y est, j’ai …","Il y a deux minutes, j’ai …"],"explanations":[["« Venir de + infinitif » exprime un passé immédiat, très proche du moment présent. La question demande de décrire quand il est plus naturel que le passé composé.","Votre ami appelle au moment où vous posez votre stylo. Répondez avec « je viens de… », puis avec « j’ai… ». Quelle phrase vous semble la plus naturelle ?"],["« Ça y est » insiste sur l’accomplissement attendu : c’est fait, enfin. La question demande de comprendre cette valeur de résultat.","Inventez trois situations où l’on dit « Ça y est, j’ai… ! » avec soulagement ou avec fierté."],["« Venir de » ne se combine pas avec un moment éloigné ou clos comme « hier ». La question demande d’expliquer pourquoi.","Corrigez la phrase de deux façons. Laquelle garde l’idée d’immédiateté ?"]]},{"title":"Un fait divers","subtitle":"Raconter à l’oral","main":"Comment raconter un fait divers de façon vivante et claire ?","questions":["Quels événements mettez-vous au passé composé ?","Quels détails restent à l’imparfait ?","Comment rapportez-vous les paroles des témoins ?"],"challenge":"Présentez en 45 secondes un fait divers fictif : un vol de vélo, un chat coincé dans un arbre…","stretch":"Racontez-le une seconde fois comme un témoin ému, puis comme un journaliste neutre.","support":["Ce matin, un … a …","Il était … quand …","Selon un témoin, …"],"explanations":[["Le passé composé fait avancer l’histoire : il présente les actions principales. La question demande de choisir quels faits sont essentiels.","Listez cinq actions de votre fait divers et numérotez-les. Lesquelles mettez-vous au passé composé ?"],["L’imparfait décrit le décor : le temps qu’il faisait, l’heure, l’état des personnes. La question demande de séparer le décor des événements.","Ajoutez trois détails d’ambiance à votre récit. Votre partenaire vérifie s’ils sont bien à l’imparfait."],["Pour rapporter des paroles, on peut citer directement ou utiliser « il a déclaré que… ». La question demande de rapporter des paroles de façon claire.","Transformez : Le témoin : « J’ai vu un homme courir. » → Le témoin a déclaré que… Quel temps apparaît ?"]]}],"vocab":[["j’ai sorti les poubelles","vynesl(a) jsem odpadky"],["je suis sorti(e)","vyšel / vyšla jsem ven"],["je les ai vues","viděl(a) jsem je (ž. rod, mn. č.)"],["un COD","přímý předmět"],["un COI","nepřímý předmět"],["elle s’est habillée","oblékla se"],["elle s’est lavé les mains","umyla si ruce"],["je viens de finir","právě jsem dokončil(a)"],["j’ai su","dozvěděl(a) jsem se"],["je n’ai vu personne","nikoho jsem neviděl(a)"],["un fait divers","drobná zpráva z černé kroniky"],["l’accord du participe","shoda příčestí"]],"toolkit":[["Auxiliaire","J’ai monté les valises. / Je suis monté(e)."],["Accord","Je les ai vues."],["Pronominal","Elle s’est lavé les mains."],["Passé récent","Je viens de finir."]]},"C1":{"warm":"Comparez « Il a dit qu’il avait fini » et « Il a dit qu’il a fini ». Laquelle choisiriez-vous à l’écrit, et pourquoi ?","stations":[{"title":"Se parler, se plaire","subtitle":"Pronominaux sans COD","main":"Pourquoi écrit-on « elles se sont parlé » mais « elles se sont vues » ?","questions":["Le pronom est-il COD ou COI après « parler à », « téléphoner à », « plaire à » ?","Pourquoi « ils se sont succédé » est-il invariable ?","Comment vérifier rapidement la fonction du pronom ?"],"challenge":"Racontez une histoire d’amitié avec six verbes pronominaux réciproques.","stretch":"Créez une petite fiche de vérification pour d’autres apprenants.","support":["On parle à quelqu’un, donc …","Ils se sont … (COD) …","Pour vérifier, je remplace …"],"explanations":[["Avec les verbes qui se construisent avec « à » (parler à, téléphoner à, sourire à, plaire à), le pronom réfléchi est COI : pas d’accord. La question demande d’identifier ces verbes.","Classez : se voir, se parler, s’aimer, se téléphoner, se rencontrer, s’écrire. Pour chacun, posez la question « qui ? » ou « à qui ? »."],["« Succéder à quelqu’un » se construit aussi avec « à » : « ils se sont succédé » reste donc invariable. La question demande de l’expliquer à partir de la construction du verbe.","Écrivez une phrase sur des rois ou des présidents qui se sont succédé, puis une autre avec « se suivre ». Comparez l’accord."],["Un test pratique consiste à reformuler avec avoir : « elles ont parlé à elles-mêmes » (COI) et « elles ont vu elles-mêmes » (COD). La question demande d’utiliser cette astuce.","Testez avec votre partenaire : « Ils se sont écrit », « Ils se sont embrassés », « Ils se sont menti ». Êtes-vous d’accord sur l’accord ?"]]},{"title":"Entendu chanter","subtitle":"Participe suivi d’un infinitif","main":"Pourquoi écrit-on « les musiciens que j’ai entendus jouer » mais « la chanson que j’ai entendu chanter » ?","questions":["Qui fait l’action de l’infinitif dans chaque phrase ?","Pourquoi « elle s’est fait couper les cheveux » est-il invariable ?","Que recommandent les rectifications de 1990 pour « laissé » suivi d’un infinitif ?"],"challenge":"Créez trois phrases pièges et expliquez-les à un autre binôme.","stretch":"Discutez si ces règles devraient être simplifiées.","support":["C’est le COD qui fait l’action de …","Ici, « fait » reste …","Depuis 1990, on peut …"],"explanations":[["Avec un verbe de perception suivi d’un infinitif, le participe s’accorde si le COD placé avant fait l’action de l’infinitif. Les musiciens jouent : accord. La chanson ne chante pas, elle est chantée : pas d’accord. La question demande d’appliquer ce test.","Analysez : « Les enfants que j’ai vus courir » et « Les arbres que j’ai vu couper ». Qui court ? Qui coupe ?"],["Le participe « fait » suivi d’un infinitif est toujours invariable. La question demande de retenir cette exception.","Écrivez trois phrases : « Elle s’est fait … », « Je les ai fait … », « La maison qu’ils ont fait … ». Vérifiez l’absence d’accord."],["Les rectifications orthographiques de 1990 recommandent aussi l’invariabilité de « laissé » suivi d’un infinitif, comme pour « fait ». La question demande de connaître cette tolérance.","Comparez : « Elle s’est laissée tomber » et « Elle s’est laissé tomber ». Laquelle suit la recommandation de 1990 ?"]]},{"title":"Il entra et s’assit","subtitle":"Passé simple et passé composé","main":"Pourquoi le passé simple domine-t-il dans certains textes écrits et le passé composé à l’oral ?","questions":["Où rencontrez-vous encore le passé simple aujourd’hui ?","Que change un récit au passé composé, comme L’Étranger de Camus ?","Quel temps choisiriez-vous pour un conte, un article ou un message ?"],"challenge":"Réécrivez un court paragraphe de conte au passé composé et comparez l’effet.","stretch":"Discutez si le passé simple va disparaître.","support":["Dans un conte, on attend …","Au passé composé, le narrateur semble …","À l’oral, le passé simple paraît …"],"explanations":[["Le passé simple est surtout un temps de l’écrit littéraire et historique ; à l’oral, il a presque disparu au profit du passé composé. La question demande d’identifier les contextes où il survit.","Faites une liste : romans, contes, livres d’histoire, presse, messages, conversations. Où avez-vous vu un passé simple récemment ?"],["Camus a écrit L’Étranger (1942) au passé composé, ce qui crée une narration proche de l’oral, mais étrangement détachée. La question demande de réfléchir à cet effet.","Lisez : « Il entra, regarda la salle et s’assit. » puis « Il est entré, il a regardé la salle et il s’est assis. » Quelle version vous paraît plus proche, plus solennelle, plus froide ?"],["Le choix du temps dépend du genre, du public et de la distance souhaitée. La question demande d’argumenter un choix précis.","Choisissez un temps pour une légende destinée aux enfants, un message à un ami et un article de presse sur la veille. Justifiez chaque choix."]]},{"title":"Il a dit qu’il avait fini","subtitle":"Antériorité et concordance","main":"Comment exprime-t-on qu’une action passée en précède une autre ?","questions":["Pourquoi dit-on « Il a dit qu’il avait fini » ?","Quand le plus-que-parfait est-il indispensable pour être compris ?","Que signifie « quand il a eu fini », et où l’entend-on ?"],"challenge":"Racontez une enquête : ce que les suspects ont déclaré et ce qu’ils avaient fait avant.","stretch":"Comparez avec le tchèque, qui n’emploie presque plus de plus-que-parfait.","support":["Il a déclaré qu’il avait …","Quand je suis arrivé(e), ils avaient déjà …","Quand il a eu fini, …"],"explanations":[["Au discours indirect au passé, une action antérieure passe au plus-que-parfait : « J’ai fini » → il a dit qu’il avait fini. La question demande d’appliquer cette concordance.","Transformez : Léa : « J’ai perdu mon sac. » → Léa a dit que… Nina : « Nous sommes arrivées en retard. » → Nina a dit que…"],["Sans plus-que-parfait, l’ordre des actions peut devenir ambigu. La question demande de repérer quand il évite un malentendu.","Comparez : « Quand je suis arrivé, ils sont partis » et « Quand je suis arrivé, ils étaient partis ». Racontez à votre partenaire ce qui se passe dans chaque cas."],["Le passé surcomposé (« quand il a eu fini ») exprime une antériorité immédiate par rapport à un passé composé. Il est surtout courant dans le sud de la France et en Suisse romande, plus rare ailleurs. La question demande de le reconnaître.","Dites : « Quand il a eu fini de manger, il est sorti. » Cette phrase vous semble-t-elle naturelle, régionale ou étrange ? Discutez."]]},{"title":"J’ai fini dans cinq minutes","subtitle":"L’accompli tourné vers l’avenir","main":"Comment le passé composé peut-il parler d’un moment futur ?","questions":["Que signifie « J’ai fini dans cinq minutes » ?","Pourquoi dit-on « Si tu as fini avant midi, on sort » ?","Quelle différence y a-t-il avec le futur antérieur « j’aurai fini » ?"],"challenge":"Organisez une journée chargée avec des conditions et des délais.","stretch":"Discutez du registre de « j’ai fini dans cinq minutes » : familier, courant ou soutenu ?","support":["Si tu as … avant …, …","J’ai terminé dans …","Quand j’aurai …, je …"],"explanations":[["Le passé composé exprime fondamentalement l’accompli : une action terminée par rapport à un repère. À l’oral familier, ce repère peut se situer dans l’avenir. La question demande d’expliquer cet usage.","Votre colocataire demande quand la salle de bains sera libre. Répondez avec « j’ai fini dans… ». Cela vous semble-t-il naturel ?"],["Après « si », on utilise le passé composé pour une action qui doit être accomplie avant une autre action future. La question demande d’analyser cette structure.","Complétez : « Si tu as terminé tes devoirs à six heures, … » et « Si vous avez compris, … »."],["Le futur antérieur (j’aurai fini) exprime la même idée de façon plus standard et plus soutenue. La question demande de comparer les deux registres.","Réécrivez « J’ai fini dans cinq minutes » au futur antérieur dans un courriel professionnel. Qu’est-ce qui change ?"]]},{"title":"Des erreurs ont été commises","subtitle":"Passif et responsabilité","main":"Pourquoi les communiqués officiels aiment-ils la formule « des erreurs ont été commises » ?","questions":["Qui est responsable dans cette phrase ?","Que change « nous avons commis des erreurs » ?","Quand le pronom « on » rend-il la responsabilité floue ?"],"challenge":"Rédigez deux excuses d’une entreprise fictive : l’une assume, l’autre esquive.","stretch":"Posez des questions de journaliste qui obligent à nommer le responsable.","support":["La phrase ne dit pas qui …","Assumer la responsabilité, ce serait …","Qui exactement a … ?"],"explanations":[["Le passif au passé composé présente une action accomplie sans nommer son auteur. La question demande d’analyser ce qui manque.","Lisez la phrase comme un journaliste et notez trois questions que vous poseriez immédiatement."],["La forme active avec « nous » place le locuteur parmi les responsables. La question demande de comparer l’effet sur la confiance.","Vous êtes client. Quelle version vous inciterait davantage à accepter les excuses ? Pourquoi ?"],["« On » peut désigner un groupe précis, les gens en général ou personne en particulier. La question demande de repérer quand ce flou devient stratégique.","Analysez : « On a décidé de fermer la cantine. » Qui est « on » ? Proposez deux reformulations plus claires."]]},{"title":"L’accord en débat","subtitle":"Faut-il simplifier la règle ?","main":"Faut-il simplifier l’accord du participe passé avec avoir ?","questions":["D’où vient cette règle ?","Que proposaient les enseignants belges Arnaud Hoedt et Jérôme Piron en 2018 ?","Quels arguments défendent la règle actuelle ?"],"challenge":"Organisez un débat de cinq minutes : pour ou contre l’invariabilité avec avoir.","stretch":"Rédigez une recommandation nuancée pour une école.","support":["Cette règle remonte à …","Les partisans de la simplification …","On peut objecter que …"],"explanations":[["La règle de l’accord avec le COD placé avant est attribuée au poète Clément Marot (XVIe siècle), qui s’inspirait de l’italien ; les grammairiens l’ont ensuite fixée. La question demande de comprendre son origine.","Imaginez que vous expliquez à un ami que cette règle n’est pas « naturelle », mais historique. Quels arguments utiliseriez-vous ?"],["En 2018, Arnaud Hoedt et Jérôme Piron ont défendu dans la presse l’invariabilité du participe avec avoir (« les crêpes que j’ai mangé »), avec le soutien d’instances belges chargées de la langue française. La question demande de résumer leur position.","Écrivez « les crêpes que j’ai mangé(es) » des deux façons. Laquelle vous semble correcte ? Laquelle vous paraît plus logique ?"],["Les défenseurs de la règle invoquent la tradition, la précision et la cohérence avec les textes existants. La question demande de présenter ces arguments loyalement.","Trouvez deux arguments pour garder la règle et deux pour la simplifier. Lequel vous paraît le plus fort ?"]]},{"title":"Un souvenir réécrit","subtitle":"Point de vue et mémoire","main":"Comment le choix des temps change-t-il la façon dont on raconte un souvenir ?","questions":["Que met en relief le passé composé dans un témoignage personnel ?","Quand l’imparfait crée-t-il de la nostalgie ?","Comment montrer ce que l’on a compris bien plus tard ?"],"challenge":"Racontez un souvenir fictif deux fois : comme un événement, puis comme une atmosphère.","stretch":"Ajoutez une phrase qui montre comment votre regard a changé depuis.","support":["Ce jour-là, j’ai …","À l’époque, je …","Ce n’est que plus tard que j’ai compris que …"],"explanations":[["Le passé composé présente les événements comme accomplis et souvent liés au présent du narrateur. La question demande de décrire cet effet dans un témoignage.","Comparez : « Ce jour-là, j’ai compris quelque chose d’important » et « Ce jour-là, je comprenais quelque chose d’important ». Laquelle sonne comme un tournant ?"],["L’imparfait d’habitude ou de description peut évoquer une époque entière et créer une impression de nostalgie. La question demande de repérer cet effet.","Racontez trois habitudes de vacances d’enfance à l’imparfait. Votre partenaire ressent-il une ambiance ?"],["Des expressions comme « ce n’est que plus tard que… » ou « j’ai compris depuis que… » relient le passé à la compréhension actuelle. La question demande de les utiliser.","Ajoutez à votre souvenir une phrase qui commence par « Aujourd’hui, je sais que… ». Quel temps utilisez-vous ensuite ?"]]}],"vocab":[["le passé simple","jednoduchý minulý čas (literární)"],["le plus-que-parfait","předminulý čas"],["le passé surcomposé","dvojitě složený minulý čas"],["quand il a eu fini","když dokončil (bezprostředně předtím)"],["elles se sont parlé","mluvily spolu"],["ils se sont succédé","vystřídali se"],["elle s’est fait couper les cheveux","nechala se ostříhat"],["la chanson que j’ai entendu chanter","píseň, kterou jsem slyšel(a) zpívat"],["des erreurs ont été commises","byly učiněny chyby"],["j’ai fini dans cinq minutes","za pět minut mám hotovo"],["le futur antérieur","předbudoucí čas"],["la concordance des temps","časová souslednost"]],"toolkit":[["Antériorité","Il a dit qu’il avait fini."],["Littéraire","Il entra et s’assit."],["Accord délicat","La chanson que j’ai entendu chanter."],["Responsabilité","Des erreurs ont été commises."]]},"C2":{"warm":"« J’ai mangé » désigne-t-il toujours un événement passé ? Pensez à « Non merci, j’ai mangé, je n’ai plus faim ».","stations":[{"title":"Passé ou accompli ?","subtitle":"Deux valeurs du passé composé","main":"Le passé composé exprime-t-il un passé ou un résultat présent ?","questions":["Que signifie « J’ai mangé » dans « Non merci, j’ai mangé » ?","Que signifie la même forme dans « J’ai mangé à midi avec Paul » ?","Comment une seule forme peut-elle remplir deux fonctions ?"],"challenge":"Classez dix phrases selon leur valeur dominante : accompli du présent ou passé révolu.","stretch":"Comparez avec l’anglais (present perfect / past simple) et l’allemand (Perfekt).","support":["Ici, la forme exprime l’état résultant …","Ici, elle situe un événement …","La langue a confié au passé composé …"],"explanations":[["Le passé composé a une valeur d’accompli du présent (« j’ai mangé » = je suis rassasié maintenant) et une valeur de passé (un événement situé avant maintenant). La question demande de distinguer ces valeurs.","Ajoutez un contexte à « J’ai fini » pour qu’il signifie d’abord un état présent, puis un événement daté. Lisez les deux versions à votre partenaire."],["Avec une indication temporelle précise, la valeur de passé domine. La question demande d’observer le rôle du complément de temps.","Comparez : « J’ai vu ce film » et « J’ai vu ce film en 2010 ». Quelle phrase répond à « Tu le connais ? », laquelle raconte une soirée ?"],["Historiquement, le passé composé a remplacé le passé simple à l’oral, ce qui explique cette double fonction. La question demande d’envisager cette évolution.","Comment l’anglais distingue-t-il « I have eaten » et « I ate at noon » ? Que fait le français avec une seule forme ?"]]},{"title":"La chaleur qu’il a fait","subtitle":"Accords particuliers","main":"Pourquoi certains participes restent-ils invariables malgré un « que » placé avant ?","questions":["Pourquoi écrit-on « la chaleur qu’il a fait » ?","Que se passe-t-il avec « en » : « des pommes, j’en ai mangé » ?","Comment analyser « les vingt minutes que j’ai couru » et « les dangers que j’ai courus » ?"],"challenge":"Créez un quiz piège de six phrases et défendez vos réponses.","stretch":"Discutez si ces subtilités méritent d’être enseignées au lycée.","support":["Ici, « que » n’est pas COD parce que …","Avec « en », le participe …","Ici, « courir » signifie …"],"explanations":[["Dans une tournure impersonnelle (il a fait chaud, il a fallu), « que » n’est pas un véritable COD ; le participe reste invariable. La question demande de reconnaître ces cas.","Analysez : « les efforts qu’il a fallu », « les tempêtes qu’il y a eu ». Pourquoi n’y a-t-il pas d’accord ?"],["Avec le pronom « en » placé avant, la règle traditionnelle laisse le participe invariable, même si l’usage hésite. La question demande d’en discuter.","Écrivez : « Des fraises ? J’en ai mangé(es) plein. » Choisissez une forme et justifiez-la."],["Avec des verbes comme courir, coûter, valoir, peser ou vivre, le sens décide : complément de mesure (pas d’accord) ou vrai COD (accord). La question demande de distinguer ces deux sens.","Comparez : « les 100 euros que ce livre m’a coûté » et « les efforts que ce projet m’a coûtés ». Quel complément exprime une mesure ?"]]},{"title":"Une règle qu’on entend ?","subtitle":"L’accord à l’oral","main":"Que reste-t-il de l’accord du participe dans la langue parlée ?","questions":["Dit-on spontanément « la décision que j’ai prise » ou « que j’ai pris » ?","Pourquoi l’accord s’entend-il seulement avec certains participes ?","Ce flottement est-il une faute ou un indice de changement ?"],"challenge":"Faites une mini-enquête : demandez à cinq personnes de lire trois phrases et notez ce que vous entendez.","stretch":"Rédigez une conclusion prudente sur l’avenir de l’accord.","support":["À l’oral, on entend souvent …","Le féminin ne s’entend que si …","Ces observations suggèrent …"],"explanations":[["Beaucoup de locuteurs n’accordent pas spontanément à l’oral, même s’ils accordent à l’écrit. La question demande de comparer l’usage oral et la norme écrite.","Prononcez naturellement : « les fautes qu’il a faites », « la lettre que j’ai écrite ». Votre partenaire écoute : entend-il un accord ?"],["L’accord au féminin n’est audible que si le participe se termine au masculin par une consonne muette (pris/prise, fait/faite, mis/mise). La question demande d’en tirer les conséquences.","Classez dix participes : ceux dont l’accord s’entend et ceux dont il ne s’entend pas. Que remarquez-vous sur leur proportion ?"],["Les linguistes distinguent variation, faute et changement en cours ; un flottement durable peut annoncer une évolution. La question demande de nuancer le jugement.","Formulez deux phrases de conclusion : l’une normative (« il faut… »), l’autre descriptive (« on observe que… »). Laquelle vous paraît plus honnête ?"]]},{"title":"Les mots du pouvoir","subtitle":"Titres et communication publique","main":"Comment le passé composé sert-il à cadrer un événement dans les titres et les déclarations ?","questions":["Que met en avant « Le gouvernement a tenu ses promesses » ?","Pourquoi un titre préfère-t-il souvent le présent, comme dans « Le ministre démissionne » ?","Quand une phrase vraie devient-elle trompeuse ?"],"challenge":"Écrivez trois titres pour le même événement fictif et analysez leur effet.","stretch":"Réécrivez une déclaration évasive pour qu’elle soit transparente.","support":["Ce titre met en relief …","En omettant la date, …","Une version plus transparente serait …"],"explanations":[["Le passé composé présente une action comme accomplie et valable maintenant : un bilan. La question demande ce que ce bilan affirme et ce qu’il ne précise pas.","Quelles promesses ? Toutes ? Quand ? Écrivez trois questions qui rendraient l’affirmation vérifiable."],["Les titres de presse utilisent volontiers le présent pour rendre l’événement immédiat ; l’article passe ensuite au passé composé. La question demande de comparer ces conventions.","Transformez le titre « Le ministre démissionne » en première phrase d’article. Quel temps utilisez-vous ?"],["Une phrase peut être littéralement vraie et donner une impression fausse sur la date ou l’importance d’un fait. La question demande d’identifier ce procédé.","En 2026, une entreprise annonce : « Nous avons remporté un prix européen. » Le prix date de 2012. Est-ce honnête ? Proposez une version transparente."]]},{"title":"Entre le tchèque et le français","subtitle":"Aspect et temps","main":"Comment l’aspect verbal tchèque se retrouve-t-il dans les temps du passé français ?","questions":["Comment traduire « Napsal jsem dopis » et « Psal jsem dopis » ?","Le perfectif tchèque correspond-il toujours au passé composé ?","Quels indices du contexte orientent la traduction ?"],"challenge":"Traduisez six phrases tchèques et comparez vos solutions.","stretch":"Expliquez à un apprenant tchèque pourquoi l’imparfait n’est pas simplement « l’imperfectif ».","support":["La phrase tchèque met l’accent sur …","En français, ce qui compte, c’est …","Les deux traductions sont possibles si …"],"explanations":[["Le perfectif (napsat) présente l’action comme achevée ; l’imperfectif (psát), comme en cours ou répétée. La question demande de choisir entre passé composé et imparfait selon le contexte.","Traduisez « Psal jsem dopis, když zazvonil telefon » et « Napsal jsem dopis a odešel ». Quels temps apparaissent ?"],["Un imperfectif tchèque peut correspondre à un passé composé français : « Celý den jsem pracoval » → « J’ai travaillé toute la journée ». La question demande de vérifier ces correspondances.","Traduisez la phrase et discutez : pourquoi pas « je travaillais toute la journée » ? Dans quel contexte serait-ce possible ?"],["Les compléments de temps, la délimitation de l’action et son rôle dans le récit orientent le choix. La question demande de repérer ces indices.","Traduisez « Bydlel jsem v Paříži dva roky », puis « Bydlel jsem v Paříži, když …». Les deux phrases prennent-elles le même temps en français ?"]]},{"title":"Le récit à la première personne","subtitle":"Voix et distance","main":"Quels effets produit un récit littéraire au passé composé plutôt qu’au passé simple ?","questions":["Pourquoi la narration de L’Étranger semble-t-elle si détachée ?","Le passé composé rapproche-t-il ou isole-t-il les événements ?","Comment le lecteur perçoit-il le narrateur ?"],"challenge":"Écrivez un paragraphe de cinq phrases au passé composé dans le style d’un journal intime.","stretch":"Réécrivez-le au passé simple et analysez ce qui change.","support":["Au passé composé, chaque phrase semble …","Le narrateur paraît …","Au passé simple, la scène devient …"],"explanations":[["Au passé composé, les actions peuvent sembler juxtaposées, sans enchaînement narratif fort ; de nombreux critiques y voient une source de l’impression de détachement de Meursault. La question demande d’expliquer cet effet.","Lisez : « Je suis sorti. Il faisait chaud. J’ai marché vers la plage. » Comment percevez-vous le narrateur ?"],["Le passé composé est lié au moment où l’on parle : le narrateur semble s’exprimer depuis son présent. La question demande de réfléchir à cette proximité ambiguë.","Comparez avec : « Je sortis. Il faisait chaud. Je marchai vers la plage. » Quelle version semble écrite après coup, laquelle semble plus proche ?"],["Le choix du temps influence l’image que le lecteur se fait du narrateur : témoin, conteur ou personnage. La question demande de relier la forme à l’interprétation.","Décrivez en trois adjectifs le narrateur de chaque version. Vos choix correspondent-ils à ceux de votre partenaire ?"]]},{"title":"Le français ailleurs","subtitle":"Variation géographique","main":"Le passé composé s’emploie-t-il de la même façon partout dans la francophonie ?","questions":["Où entend-on encore le passé surcomposé ?","Le passé simple reste-t-il vivant dans certains genres oraux ?","Comment un enseignant doit-il réagir à ces variantes ?"],"challenge":"Préparez une courte présentation sur une variante régionale, avec des exemples.","stretch":"Discutez si un examen doit accepter ces variantes.","support":["Dans cette région, on entend …","Ce n’est pas une faute, mais …","À l’examen, il serait juste de …"],"explanations":[["Le passé surcomposé (« quand j’ai eu fini ») est courant dans le sud de la France, en Suisse romande et dans d’autres régions, alors qu’il paraît rare ailleurs. La question demande de situer cette variante.","Votre correspondant suisse écrit : « Quand on a eu mangé, on est partis. » Comment réagissez-vous ? Comment le diriez-vous en français standard ?"],["Le passé simple apparaît parfois à l’oral dans des genres très codés : contes racontés, commentaires historiques, effets ironiques. La question demande d’observer ces usages.","Dites à voix haute une phrase de conte au passé simple. Est-ce naturel, théâtral ou comique ?"],["Un enseignant doit distinguer l’erreur, la variation régionale et le registre. La question demande de proposer une attitude juste.","Rédigez une consigne pour un correcteur : comment traiter une forme régionale dans une copie ?"]]},{"title":"La révision experte","subtitle":"Cohérence et accords","main":"Comment réviser un texte fluide, mais mal construit sur le plan temporel ?","questions":["Quels changements de temps sont justifiés ?","Où un accord dépend-il d’un antécédent mal identifié ?","Quelles ambiguïtés subsistent même après correction ?"],"challenge":"Révisez un texte fictif de huit phrases et justifiez chaque modification.","stretch":"Défendez deux versions acceptables qui suivent des choix stylistiques différents.","support":["Ce changement est justifié parce que …","L’antécédent de « que » est …","Je propose …, car …"],"explanations":[["Un changement de temps peut être volontaire : passer de l’imparfait (décor) au passé composé (événement). La question demande de distinguer les changements fonctionnels des incohérences.","Lisez : « Nous marchions depuis une heure. Soudain, le ciel est devenu noir. » Est-ce cohérent ? Pourquoi ?"],["Dans les phrases longues, l’antécédent d’un relatif peut être difficile à identifier, ce qui rend l’accord incertain. La question demande d’analyser ces cas.","Corrigez : « C’est une des lettres que j’ai écrit hier. » Quel est l’antécédent de « que » ? Et dans « la moitié des pommes que j’ai mangé » ?"],["Certaines ambiguïtés de sens ne peuvent pas être levées par la grammaire seule ; il faut reformuler. La question demande d’identifier ces cas.","Que signifie « Il a dit à son frère qu’il était parti » : qui est parti ? Proposez deux reformulations claires."]]}],"vocab":[["l’accompli","ukončenost děje a jeho výsledek"],["une valeur aspectuelle","vidová hodnota"],["l’accord audible","slyšitelná shoda"],["la chaleur qu’il a fait","horko, které bylo"],["j’en ai mangé","jedl(a) jsem je (část z nich)"],["les dangers que j’ai courus","nebezpečí, která jsem podstoupil(a)"],["un participe invariable","neměnné příčestí"],["la norme","norma"],["une variante régionale","regionální varianta"],["le registre littéraire","literární styl"],["le perfectif","dokonavý vid"],["un titre de presse","novinový titulek"]],"toolkit":[["Aspect","C’est l’accompli qui compte ici."],["Accord","Le COD est …, donc …"],["Variation","Dans cette variété, …"],["Évaluation","Une analyse plus fine montrerait …"]]}},"uiSimple":{"eyebrow":"PARLE · DEMANDE · RÉPONDS · ÉCOUTE","hero":"Raconte ce que tu as fait hier, ce que tu as mangé et où tu es allé(e), avec des phrases courtes.","privacy":"Vous pouvez inventer les situations. Personne n’a besoin de raconter sa vie privée. Les erreurs font partie de l’apprentissage.","step4":"Tu veux continuer ? Ouvre l’activité suivante.","questions":"Autres questions","supportTitle":"Besoin d’aide ?","supportDesc":"Des mots pour commencer tes phrases.","supportShow":"Voir l’aide","supportHide":"Masquer l’aide","challengeTitle":"Encore une activité","challengeDesc":"Après la question principale.","challengeShow":"Voir l’activité","challengeHide":"Masquer l’activité","stretchTitle":"Une activité plus difficile","stretchDesc":"Si tu veux aller plus loin.","stretchShow":"Voir l’activité difficile","stretchHide":"Masquer l’activité difficile","progress":"Dis pourquoi. Donne un exemple. Pose une question.","vocabLabel":"MOTS UTILES","vocabDesc":"Utilise ces mots pour parler.","toolkitLabel":"PHRASES UTILES","toolkitDesc":"Parlez ensemble : posez des questions et répondez.","title":"Passé composé · Qu’as-tu fait ?","strap":"Qu’as-tu fait – et que s’est-il passé ?"},"uiB1":{"stretchTitle":"Va plus loin","stretchDesc":"Une activité plus difficile si vous parlez déjà avec aisance.","vocabDesc":"Formes du passé composé, repères temporels et traductions tchèques.","progress":"Donnez des raisons et des exemples, et réagissez à ce que dit l’autre."}}};
const ORDER = ['A1','A2','B1','B2','C1','C2'];
const STORAGE = 'conversation-lab-perfekt-multilingual-v1';
const $ = id => document.getElementById(id);
let lang='de', level='A2', theme='dark', current=0;
let duration=0,left=0,endAt=0,ticker=null,toastHandle=null;
let floatingTimerDragged=false, timerDrag=null;
const mobileTimerQuery=window.matchMedia('(max-width:650px), (max-height:550px) and (pointer:coarse)');
// A1–A2 and B1: student-facing interface texts matched to the level (all texts are student-facing)
const ui=()=>{const c=CONTENT[lang];if(ORDER.indexOf(level)<2&&c.uiSimple)return {...c.ui,...c.uiSimple};if(level==='B1'&&c.uiB1)return {...c.ui,...c.uiB1};return c.ui;};
const data=()=>CONTENT[lang].levels[level];
function setText(id,value){const n=$(id),s=String(value);if(n.textContent!==s)n.textContent=s;}
function setButtonText(id,value){setText(id,value);}
function savePrefs(){try{localStorage.setItem(STORAGE,JSON.stringify({lang,level,theme,current}));}catch(_){}}
function loadPrefs(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'{}');if(CONTENT[x.lang])lang=x.lang;if(ORDER.includes(x.level))level=x.level;if(['light','dark'].includes(x.theme))theme=x.theme;if(Number.isInteger(x.current)&&x.current>=0&&x.current<8)current=x.current;}catch(_){}}
function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function replaceChildren(id,items){$(id).replaceChildren(...items);}
function toggleDetails(name,open){const panel=$(name+'Reveal'),button=$(name+'Btn');panel.hidden=!open;button.setAttribute('aria-expanded',String(open));const u=ui();setText(name+'Btn',u[name+(open?'Hide':'Show')]);}
function refreshDetails(){for(const name of ['support','challenge','stretch'])toggleDetails(name,false);}
function renderStation(){
 const u=ui(),s=data().stations[current];
 setText('stationNum',current+1);setText('stationEyebrow',`${u.station} ${current+1} / 8`);
 setText('stationTitle',s.title);setText('stationSubtitle',s.subtitle);
 setText('mainLabel',u.main);setText('mainQuestion',s.main);setText('questionsLabel',u.questions);
 const advanced=ORDER.indexOf(level)>=3;
 $('questionsHelpTip').hidden=!advanced;
 if(advanced)setText('questionsHelpTip',u.questionHelpTip);
 replaceChildren('questions',s.questions.map((q,i)=>{
  const hint=advanced?s.explanations?.[i]:null;
  if(!hint||hint.length!==2){const e=make('div','question');e.append(make('span','qnum',i+1),make('span','question-text',q));return e;}
  const d=make('details','question question-expandable'),summary=make('summary','question-summary');
  const label=make('span','question-action');label.setAttribute('aria-hidden','true');
  const action=make('span','question-action-label',u.questionHelpOpen);
  label.append(make('span','question-action-icon','ⓘ'),action,make('span','question-arrow','⌄'));
  summary.append(make('span','qnum',i+1),make('span','question-text',q),label);
  const explanation=make('div','question-detail');
  explanation.append(make('span','question-detail-heading',u.questionHelpMeaning),make('p','question-meaning',hint[0]),make('span','question-detail-heading',u.questionHelpTry),make('p','question-angle',hint[1]));
  summary.addEventListener('click',e=>{if(e.detail>1)e.preventDefault();});
  summary.addEventListener('mousedown',e=>{if(e.detail>1)e.preventDefault();});
  d.append(summary,explanation);
  d.addEventListener('toggle',()=>{action.textContent=d.open?u.questionHelpClose:u.questionHelpOpen;hideLookup();});
  return d;
 }));
 for(const name of ['support','challenge','stretch']){setText(name+'Title',u[name+'Title']);setText(name+'Desc',u[name+'Desc']);}
 replaceChildren('supportList',s.support.map(t=>make('li','',t)));
 setText('challengeReveal',s.challenge);setText('stretchReveal',s.stretch);
 refreshDetails();
 setText('progressText',`${u.station} ${current+1} ${u.of} 8 · ${u.progress}`);
 setText('previousBtn',`← ${u.previous}`);setText('nextBtn',current===7?u.stay:`${u.next} →`);
 $('previousBtn').disabled=current===0;$('nextBtn').disabled=current===7;
 mountTimer();
}
function renderNav(){
 const u=ui();replaceChildren('sectionNav',data().stations.map((s,i)=>{
  const b=make('button',i===current?'active':'',`${i+1}. ${s.title}`);
  b.type='button';b.setAttribute('aria-current',i===current?'step':'false');b.addEventListener('click',()=>goTo(i));return b;
 }));
 requestAnimationFrame(updateNavHint);
}
function updateNavHint(){const n=$('sectionNav');const wrap=n.scrollWidth<=n.clientWidth+2;n.classList.toggle('more-right',!wrap&&n.scrollLeft+n.clientWidth<n.scrollWidth-4);n.classList.toggle('more-left',!wrap&&n.scrollLeft>4);}
function renderResources(){
 const u=ui();setText('vocabLabel',u.vocabLabel);setText('vocabHeading',u.vocabLabel);setText('vocabDesc',u.vocabDesc);
 replaceChildren('vocabGrid',data().vocab.map(([word,desc])=>{const el=make('div','vocab-item');const ds=make('span','',desc);ds.lang='cs';el.append(make('b','',word),ds);return el;}));
 setText('toolkitLabel',u.toolkitLabel);setText('toolkitHeading',u.toolkitLabel);setText('toolkitDesc',u.toolkitDesc);
 replaceChildren('toolkitGrid',data().toolkit.map(([name,desc])=>{const el=make('div','vocab-item');el.append(make('b','',name),make('span','',desc));return el;}));
 setText('lessonTipLabel',`${u.tipLabel}${lang==='fr'?'\u202f:':':'}`);setText('lessonTipText',u['tip'+level]);
 setText('footerCredit',`${u.format} · ${u.changeLevel} ${level} · 8 ${lang==='de'?u.stations:u.stations.toLocaleLowerCase(lang)} · ${u.offline}`);
}
function renderHeader(){
 const u=ui();document.documentElement.lang=lang;
 document.title=`${u.title} | ${u.brand} · ${level}`;$('sectionNav').setAttribute('aria-label',u.stationNavAria);document.querySelector('.topbar').setAttribute('aria-label',u.controlsAria);
 $('languageSelect').value=lang;setText('languageLabel',u.changeLanguage);$('languageSelect').setAttribute('aria-label',u.changeLanguage);
 setText('levelLabel',u.changeLevel);$('levelSwitch').setAttribute('aria-label',u.changeLevel);
 document.querySelectorAll('[data-level]').forEach(b=>{b.classList.toggle('active',b.dataset.level===level);b.setAttribute('aria-pressed',String(b.dataset.level===level));});
 setText('brandTitle',u.title.split(/[\s\u202f]*:/)[0]);setText('brandSubtitle',`${u.subbrand} · ${level}`);
 setText('kicker',u.eyebrow);setText('heroTitle',u.title);setText('heroStrap',u.strap);setText('heroIntro',u.hero);setText('privacyNotice',u.privacy);setText('startLessonBtn',u.startLesson);
 setText('metaLevel',`${u.changeLevel}${lang==='fr'?'\u202f:':':'} ${level}`);setText('metaFormat',u.format);setText('metaTime',u.estimated);
 setText('goalLabel',u.levelGoal);setText('goalText',u['goal'+level]);
 replaceChildren('quickstart',[u.step1,u.step2,u.step3,u.step4].map((t,i)=>{const el=make('div','quickstep');el.append(make('b','',`0${i+1}`),make('span','',t));return el;}));
 setText('warmTitle',u.warmTitle);setText('warmTime',u.warmTime);setText('warmHint',u.warmHint);setText('warmTask',data().warm);
 setText('navHeading',u.stations);setText('formatHint',u.formatHint);
 function updateIconButton(id,symbol,label){const b=$(id);b.replaceChildren(document.createTextNode(symbol+' '),make('span','small-hide',label));}
 updateIconButton('themeBtn',theme==='dark'?'☀':'☾',theme==='dark'?u.themeDay:u.themeNight);
 updateIconButton('resetBtn','↺',u.resetLesson);
 $('themeBtn').title=theme==='dark'?u.themeDay:u.themeNight;$('resetBtn').title=u.resetLesson;
 updateFullscreenButton();updateTimerTranslations();

let lessonFocusScrollY=0;
const FOCUS_LABEL={en:'Focus mode',es:'Modo concentración',de:'Fokusmodus',fr:'Mode concentration'};
const FOCUS_EXIT={en:'Exit focus mode',es:'Salir del modo concentración',de:'Fokusmodus beenden',fr:'Quitter le mode concentration'};
const IN_FRAME=(()=>{try{return window.self!==window.top}catch(_){return true}})();
const FOCUS_NOTICE={

const fsElement=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
function fsSupported(){
 const root=document.documentElement;
 if(!(typeof root.requestFullscreen==='function'||typeof root.webkitRequestFullscreen==='function'))return false;
 if(document.fullscreenEnabled===false&&document.webkitFullscreenEnabled!==true)return false;
 if(document.permissionsPolicy?.allowsFeature?.('fullscreen')===false)return false;
 if(document.featurePolicy?.allowsFeature?.('fullscreen')===false)return false;

}
function enterFocus(){
 if(document.documentElement.classList.contains('lesson-focus'))return;

function exitFocus(){
 if(!document.documentElement.classList.contains('lesson-focus'))return;

function updateFullscreenButton(){
 const inFocus=document.documentElement.classList.contains('lesson-focus');

 const button=$('fullBtn');
 // Inside AI Studio (iframe without fullscreen permission) the Studio viewer owns full screen: no second control.
 button.hidden=!yes&&!fsSupported()&&IN_FRAME;
 const text=inFocus?(FOCUS_EXIT[lang]||FOCUS_EXIT.en):yes?ui().exitFullscreen:(fsSupported()?ui().fullscreen:FOCUS_LABEL[lang]);

async function toggleFullscreen(){

}

const normLookup=s=>String(s).toLocaleLowerCase().replace(/[’‘]/g,"'").replace(/[‐‑‒–—]/g,'-');
const isLookupLetter=c=>/^[\p{L}\p{M}\p{N}]$/u.test(c||'');
function hideLookup(){$('lookupPopover').hidden=true;}
function readWordAt(text,offset){
 const words=[...text.matchAll(/[\p{L}\p{M}]+(?:[’'-][\p{L}\p{M}]+)*/gu)];
 let selected=words.find(m=>m.index<=offset&&offset<m.index+m[0].length);
 if(!selected)selected=words.find(m=>Math.abs(offset-(m.index+m[0].length))<=1);
 return selected?{word:selected[0],index:selected.index}:null;
}
function localPhraseFor(text,index,sourceLang){
 const flat=normLookup(text), phrases=CZ_GLOSSARY.phrases[sourceLang]||{};
 let best=null;
 for(const [phrase,translation] of Object.entries(phrases)){
  const needle=normLookup(phrase);
  let from=0;
  for(let at;(at=flat.indexOf(needle,from))!==-1;){
   const end=at+needle.length;from=at+1;
   if(index<at||index>=end)continue;
   if((at>0&&isLookupLetter(flat[at-1]))||(end<flat.length&&isLookupLetter(flat[end])))continue;
   if(!best||needle.length>best.expression.length)best={expression:text.slice(at,end),translation,kind:'phrase'};
  }
 }
 return best;
}
function sentenceForLookup(text,index){
 const breaks=[...text.matchAll(/[.!?]+(?=\s|$)/g)];
 let start=0,end=text.length;
 for(const br of breaks){const after=br.index+br[0].length;if(after<=index)start=after;else{end=after;break;}}
 return text.slice(start,end).trim().slice(0,500)||text.trim().slice(0,500);
}
function locateWord(evt,block){
 const x=evt.clientX,y=evt.clientY;
 let caret=null;
 if(typeof document.caretRangeFromPoint==='function')caret=document.caretRangeFromPoint(x,y);
 else if(typeof document.caretPositionFromPoint==='function'){
  const pos=document.caretPositionFromPoint(x,y);
  if(pos){caret=document.createRange();caret.setStart(pos.offsetNode,pos.offset);caret.collapse(true);}
 }
 if(!caret){const s=getSelection();if(s?.rangeCount)caret=s.getRangeAt(0).cloneRange();}
 if(!caret||!block.contains(caret.startContainer))return null;
 try{
  const upto=document.createRange();upto.selectNodeContents(block);
  upto.setEnd(caret.startContainer,caret.startOffset);
  return readWordAt(block.textContent,upto.toString().length);
 }catch(_){return null;}
}
function setLookupCard(result,sentence,x,y,source){
 const pop=$('lookupPopover');
 $('lookupExpression').textContent=result.expression;
 $('lookupTranslation').textContent=result.translation;
 $('lookupContext').textContent='Ve větě: '+sentence;
 $('lookupOrigin').textContent=source;
 pop.hidden=false;
 pop.style.left='12px';pop.style.top='12px';
 const rect=pop.getBoundingClientRect(),v=window.visualViewport;
 const w=v?v.width:innerWidth,h=v?v.height:innerHeight;
 const xBase=v?v.offsetLeft:0,yBase=v?v.offsetTop:0;
 const left=Math.max(xBase+8,Math.min(x+12,xBase+w-rect.width-8));
 const top=Math.max(yBase+8,Math.min(y+12,yBase+h-rect.height-8));
 pop.style.left=left+'px';pop.style.top=top+'px';
}
// Offline-only vocabulary support. No external API, no requests, no credentials.
function lookupWordMeaning(word,sourceLang){
 const dict=CZ_GLOSSARY.words[sourceLang]||{};
 const norm=normLookup(word);
 if(Object.prototype.hasOwnProperty.call(dict,norm))return {translation:dict[norm],base:null};
 const candidate=[];
 const add=stem=>{if(stem.length>=3&&!candidate.includes(stem))candidate.push(stem);};
 if(sourceLang==='en'){
  if(norm.endsWith("'s"))add(norm.slice(0,-2));
  if(norm.endsWith('ies'))add(norm.slice(0,-3)+'y');
  if(norm.endsWith('ied'))add(norm.slice(0,-3)+'y');
  if(norm.endsWith('ing')){
   const stem=norm.slice(0,-3);add(stem);add(stem+'e');
   if(stem.length>3&&stem.at(-1)===stem.at(-2))add(stem.slice(0,-1));
  }
  if(norm.endsWith('ed')){const stem=norm.slice(0,-2);add(stem);add(stem+'e');}
  if(norm.endsWith('es')){add(norm.slice(0,-2));add(norm.slice(0,-1));}
  if(norm.endsWith('s'))add(norm.slice(0,-1));
 }else if(sourceLang==='es'){
  if(norm.endsWith('ces'))add(norm.slice(0,-3)+'z');
  if(norm.endsWith('es'))add(norm.slice(0,-2));
  if(norm.endsWith('s'))add(norm.slice(0,-1));
 }else if(sourceLang==='fr'){
  let base=norm.replace(/^(?:qu|[dljnstmc])'(?=.)/,'');
  const addLoose=x=>{if(x&&!candidate.includes(x))candidate.push(x);};
  if(base!==norm)addLoose(base);
  for(let i=0;i<3;i++){const cut=base.replace(/-(?:t-)?(?:je|tu|il|elle|on|nous|vous|ils|elles|le|la|les|lui|leur|en|y|moi|toi|ce)$/,'');if(cut===base)break;base=cut;addLoose(base);}
  if(base.endsWith('s'))add(base.slice(0,-1));
  if(norm.endsWith('s'))add(norm.slice(0,-1));
 }else if(sourceLang==='de'){
  if(norm.endsWith('innen'))add(norm.slice(0,-5));
 }
 for(const stem of candidate){if(Object.prototype.hasOwnProperty.call(dict,stem))return {translation:dict[stem],base:stem};}
 return null;
}
function triggerLookup(evt){
 const element=evt.target instanceof Element?evt.target:null;
 if(element?.closest('.question-expandable > summary'))return;
 if(element?.closest('[lang="cs"]'))return;
 const block=evt.__block||element?.closest(LOOKUP_SELECTOR);if(!block||$('lookupPopover').contains(element))return;
 const text=block.textContent?.trim();if(!text)return;
 const hit=evt.__hit||locateWord(evt,block);if(!hit)return;
 const word=hit.word,sentence=sentenceForLookup(text,hit.index);
 const phrase=localPhraseFor(text,hit.index,lang);
 const meaning=lookupWordMeaning(word,lang);
 if(phrase){
  setLookupCard(phrase,sentence,evt.clientX,evt.clientY,'Překlad celé fráze · rozšířený offline slovník');
 }else if(meaning){
  setLookupCard({expression:word,translation:meaning.translation,kind:'word'},sentence,evt.clientX,evt.clientY,
   meaning.base?'Základní význam odvozený od „'+meaning.base+'“ · offline slovník':'Základní význam · offline slovník; přesný význam může záviset na větě');
 }else{
  setLookupCard({expression:word,translation:'Tento výraz zatím v rozšířeném offline slovníku není.',kind:'word'},sentence,evt.clientX,evt.clientY,
    'Bez připojení · zkus odvodit význam z kontextu nebo se zeptej vyučujícího');
 }
}
function initLookups(){
 const set=(ORDER.indexOf(level)<2?LOOKUP_HINTS_SIMPLE:LOOKUP_HINTS);
 const [label,text]=set[lang]||set.en;
 $('lookupHint').replaceChildren(make('strong','',label),document.createTextNode(' '+text));
}
// Desktop: preserve native double-click selection; iPads/iPhones: one tap avoids Safari double-tap zoom.
document.querySelector('.app').addEventListener('dblclick',e=>triggerLookup(e));
let tapStart=null;
document.querySelector('.app').addEventListener('pointerdown',e=>{
 tapStart=(e.pointerType==='touch'||e.pointerType==='pen')?{x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId}:null;
});
document.querySelector('.app').addEventListener('pointercancel',()=>{tapStart=null;});
document.querySelector('.app').addEventListener('pointerup',e=>{
 if(!(e.pointerType==='touch'||e.pointerType==='pen')||!tapStart||tapStart.id!==e.pointerId)return;
 const moved=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y),held=performance.now()-tapStart.t;tapStart=null;
 if(moved<=10&&held<=600)triggerLookup(e);
});
function lookupSelection(){
 const sel=getSelection();if(!sel||!sel.rangeCount||sel.isCollapsed)return false;
 const range=sel.getRangeAt(0),node=range.startContainer,el=node.nodeType===1?node:node.parentElement;
 const block=el?.closest(LOOKUP_SELECTOR);if(!block)return false;
 const upto=document.createRange();upto.selectNodeContents(block);upto.setEnd(range.startContainer,range.startOffset);
 const offset=upto.toString().length,text=block.textContent,box=range.getBoundingClientRect();
 const hit=readWordAt(text,offset+Math.max(0,text.slice(offset).search(/[\p{L}\p{M}]/u)));if(!hit)return false;
 triggerLookup({target:el,clientX:box.left,clientY:box.bottom,__hit:hit,__block:block});return true;
}
$('lookupClose').addEventListener('click',hideLookup);
document.addEventListener('pointerdown',e=>{
 if(!$('lookupPopover').hidden&&!$('lookupPopover').contains(e.target)&&!(e.target instanceof Element&&e.target.closest(LOOKUP_SELECTOR)))hideLookup();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('lookupPopover').hidden){hideLookup();e.preventDefault();return;}
 if(e.key==='Enter'&&!e.target.closest?.('input,select,textarea,button,a,#timerEditor')&&lookupSelection())e.preventDefault();
});

// --- Single shared countdown, including the movable mobile overlay ---
const timeText=seconds=>`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
function updateTimerTranslations(){
 const u=ui();setText('timerLabel',u.timerLabel);$('timerPanel').setAttribute('aria-label',u.timerLabel);
 setText('timerReset',`↺ ${u.timerReset}`);setText('timerEditorTitle',u.timerEdit);
 setText('timerMinutesLabel',u.timerMinutes);setText('timerSecondsLabel',u.timerSeconds);setText('timeHelp',u.timerHelp);
 setText('timerSet',u.timerSet);setText('cancelEdit',u.timerCancel);
 $('timerGrip').setAttribute('aria-label',u.timerDrag);$('timerGrip').title=u.timerDrag;
 updateFloatingControls();refreshTimer();
}
function mountTimer(){
 const p=$('timerPanel');
 if(mobileTimerQuery.matches){if(p.parentElement!==document.body)document.body.appendChild(p);}
 else {if(p.parentElement!==$('timerDock'))$('timerDock').appendChild(p);p.classList.remove('mobile-expanded');p.style.removeProperty('left');p.style.removeProperty('top');p.style.removeProperty('right');p.style.removeProperty('bottom');floatingTimerDragged=false;}
 p.hidden=false;updateFloatingControls();
}
function updateFloatingControls(){const expanded=$('timerPanel').classList.contains('mobile-expanded'),u=ui();
 const b=$('timerFloatToggle');b.textContent=expanded?'⌄':'⌃';b.setAttribute('aria-expanded',String(expanded));b.setAttribute('aria-label',expanded?u.timerCollapse:u.timerExpand);b.title=expanded?u.timerCollapse:u.timerExpand;
 $('clock').title=mobileTimerQuery.matches&&!expanded?u.timerExpand:u.timerEdit;
}
function keepFloatingInView(){if(!mobileTimerQuery.matches||!floatingTimerDragged)return;const p=$('timerPanel'),r=p.getBoundingClientRect();const v=window.visualViewport;
 const h=v?v.height:innerHeight,w=v?v.width:innerWidth;
 const x=Math.min(Math.max(8,r.left),Math.max(8,w-r.width-8));const y=Math.min(Math.max(8,r.top),Math.max(8,h-r.height-8));
 p.style.left=x+'px';p.style.top=y+'px';p.style.right='auto';p.style.bottom='auto';}
function setFloatingExpanded(expand){if(!mobileTimerQuery.matches)return;const p=$('timerPanel');if(!expand)closeEditor();p.classList.toggle('mobile-expanded',expand);updateFloatingControls();requestAnimationFrame(keepFloatingInView);}
function refreshTimer(){
 if(ticker!==null){left=Math.max(0,endAt-Date.now());if(left===0){clearInterval(ticker);ticker=null;dropWake();showToast(ui().timerFinishToast);}}
 const seconds=Math.ceil(left/1000),u=ui();
 setText('clock',timeText(seconds));$('clock').classList.toggle('almost',seconds>0&&seconds<=15);$('clock').classList.toggle('finished',seconds===0&&duration>0);
 setText('timerStart',ticker!==null?`Ⅱ ${u.timerPause}`:`▶ ${u.timerStart}`);$('timerStart').disabled=seconds===0;$('timerReset').disabled=duration===0||(ticker===null&&left===duration*1000);
 setText('timerHint',ticker!==null?u.timerRunning:duration===0?u.timerInit:seconds===0?u.timerDone:left<duration*1000?u.timerPaused:u.timerReady);
}
let wakeLock=null;
async function holdWake(){try{if('wakeLock' in navigator&&!wakeLock&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}catch(_){wakeLock=null;}}
function dropWake(){try{wakeLock?.release();}catch(_){}wakeLock=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ticker!==null)holdWake();});
function stopTimer(){if(ticker!==null){left=Math.max(0,endAt-Date.now());clearInterval(ticker);ticker=null;}dropWake();}
function toggleTimer(){if(!$('timerEditor').hidden)return;if(ticker!==null){stopTimer();refreshTimer();return;}if(left<=0)return;endAt=Date.now()+left;ticker=setInterval(refreshTimer,100);holdWake();refreshTimer();}
function openEditor(reset=false){stopTimer();if(reset){duration=0;left=0;}refreshTimer();const secs=Math.ceil(left/1000);$('timerEditor').hidden=false;setText('timeError','');$('timerMinutes').value=duration?String(Math.floor(secs/60)).padStart(2,'0'):'';$('timerSeconds').value=duration?String(secs%60).padStart(2,'0'):'';$('timerMinutes').focus();$('timerMinutes').select();requestAnimationFrame(keepFloatingInView);}
function closeEditor(){$('timerEditor').hidden=true;setText('timeError','');}
function parseTime(mm,ss){const m=mm.trim(),s=ss.trim();if(!/^\d{0,2}$/.test(m)||!/^\d{0,2}$/.test(s)||(!m&&!s))return null;const minutes=Number(m||0),seconds=Number(s||0);if(seconds>59)return null;const total=minutes*60+seconds;return total>=5&&total<=99*60+59?total:null;}
function submitTime(e){e.preventDefault();const seconds=parseTime($('timerMinutes').value,$('timerSeconds').value);if(seconds===null){setText('timeError',ui().timerError);(Number($('timerSeconds').value)>59?$('timerSeconds'):$('timerMinutes')).focus();return;}stopTimer();duration=seconds;left=seconds*1000;closeEditor();refreshTimer();$('clock').focus();showToast(ui().timerSetToast);}
function resetTimer(){closeEditor();stopTimer();left=duration*1000;refreshTimer();}
function showToast(txt){const el=$('toast');el.textContent=txt;el.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.remove('show'),2300);}
$('startLessonBtn').addEventListener('click',()=>goTo(current));
$('languageSelect').addEventListener('change',e=>switchVariant(e.target.value,level));
$('levelSwitch').addEventListener('click',e=>{const button=e.target.closest('button[data-level]');if(button)switchVariant(lang,button.dataset.level);});

document.addEventListener('fullscreenchange',updateFullscreenButton);document.addEventListener('webkitfullscreenchange',updateFullscreenButton);

for(const name of ['support','challenge','stretch'])$(name+'Btn').addEventListener('click',()=>toggleDetails(name,$(name+'Reveal').hidden));
$('clock').addEventListener('click',()=>{if(mobileTimerQuery.matches&&!$('timerPanel').classList.contains('mobile-expanded'))setFloatingExpanded(true);else openEditor();});
$('timerFloatToggle').addEventListener('click',()=>setFloatingExpanded(!$('timerPanel').classList.contains('mobile-expanded')));
$('timerGrip').addEventListener('pointerdown',e=>{if(!mobileTimerQuery.matches||e.button!==0)return;const r=$('timerPanel').getBoundingClientRect();timerDrag={pointerId:e.pointerId,x:e.clientX,y:e.clientY,left:r.left,top:r.top};$('timerGrip').setPointerCapture(e.pointerId);e.preventDefault();});
$('timerGrip').addEventListener('pointermove',e=>{if(!timerDrag||e.pointerId!==timerDrag.pointerId)return;const p=$('timerPanel');const x=Math.min(Math.max(8,timerDrag.left+e.clientX-timerDrag.x),Math.max(8,innerWidth-p.offsetWidth-8));const y=Math.min(Math.max(8,timerDrag.top+e.clientY-timerDrag.y),Math.max(8,innerHeight-p.offsetHeight-8));p.style.left=x+'px';p.style.top=y+'px';p.style.right='auto';p.style.bottom='auto';floatingTimerDragged=true;});
function endDrag(e){if(timerDrag&&e.pointerId===timerDrag.pointerId){timerDrag=null;keepFloatingInView();}}
$('timerGrip').addEventListener('pointerup',endDrag);$('timerGrip').addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>{if(mobileTimerQuery.matches)requestAnimationFrame(keepFloatingInView);});
window.visualViewport?.addEventListener('resize',()=>{if(mobileTimerQuery.matches)requestAnimationFrame(keepFloatingInView);});

$('timerStart').addEventListener('click',toggleTimer);$('timerReset').addEventListener('click',resetTimer);

for(const id of ['timerMinutes','timerSeconds'])$(id).addEventListener('input',()=>{$(id).value=$(id).value.replace(/\D/g,'').slice(0,2);setText('timeError','');});

$('timerMinutes').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){$('timerSeconds').focus();$('timerSeconds').select();e.preventDefault();}});
$('cancelEdit').addEventListener('click',()=>{closeEditor();refreshTimer();$('clock').focus();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('timerEditor').hidden){closeEditor();refreshTimer();$('clock').focus();e.preventDefault();}});
document.addEventListener('keydown',e=>{if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;const t=e.target;if(t&&t.closest&&t.closest('input,select,textarea,[contenteditable],#timerEditor,.question-expandable summary'))return;
 const dir={ArrowRight:1,PageDown:1,ArrowLeft:-1,PageUp:-1}[e.key];if(!dir)return;const n=current+dir;if(n<0||n>7)return;e.preventDefault();goTo(n);});
window.addEventListener('pagehide',stopTimer);
$('sectionNav').addEventListener('scroll',updateNavHint,{passive:true});window.addEventListener('resize',updateNavHint);
const topbar=document.querySelector('.topbar');const syncTopbar=()=>document.documentElement.style.setProperty('--topbar-h',topbar.offsetHeight+'px');
if('ResizeObserver' in window)new ResizeObserver(syncTopbar).observe(topbar);syncTopbar();
loadPrefs();applyTheme();renderAll();

<script>

/* Keep the movable mobile timer from covering Previous and Next. */
(() => {
 const panel=document.getElementById('timerPanel');
 const footer=document.querySelector('.station-foot');
 if(!panel||!footer||!('IntersectionObserver' in window))return;
 const small=window.matchMedia('(max-width:650px), (max-height:550px) and (pointer:coarse)');
 let inView=false;
 const sync=()=>panel.classList.toggle('avoid-station-nav',small.matches&&inView);
 const observer=new IntersectionObserver(entries=>{inView=entries[0].isIntersecting;sync();},{threshold:0});
 observer.observe(footer);
 if(small.addEventListener)small.addEventListener('change',sync);
 window.addEventListener('resize',sync,{passive:true});
 sync();
})();
</script>
